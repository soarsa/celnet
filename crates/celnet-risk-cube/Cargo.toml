[package]
name = "celnet-risk-cube"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet single-node hierarchical risk cube: an OLAP-style fact store + group-by/reduce roll-up over convention-free canonical risk leaves. Additive measures (net greeks, bucketed vega) roll up by summation; non-additive measures (VaR/ES, FRTB curvature, correlation-weighted vega) are re-derived per node by bump-and-revalue over the node's constituent positions."
publish = false

[lints]
workspace = true

[features]
# Exposes `celnet_risk_cube::test_support::DigitalTestPricer` — the hand-coded,
# code-disjoint closed-form `ExoticLegPricer` the cube's own tests inject — so
# downstream TEST crates that also cannot depend on `celnet-exotics`
# (celnet-risk-fleet, celnet-limits) reuse the single definition instead of
# duplicating the closed form. Enabled ONLY in those crates' [dev-dependencies];
# never in a production build (the cube's runtime surface is unchanged).
test-support = []

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
# The closed-form vanilla leaf backs the cube's analytic VaR/curvature oracle and
# the AAD adjoint sweep. It depends only on -types/-core/-conventions, so this is a
# one-way edge (no cycle).
celnet-vanilla.workspace = true
celnet-risk-normalize.workspace = true
# The linear-FI rate-scenario VaR/ES + FRTB GIRR engine (central-core Phase C2a/b). C2c
# folds it into the cube's non-additive path so a portfolio's FI rate scenarios ride
# ALONGSIDE the options spot/vol scenarios in one joint tail. celnet-rates-risk depends
# only on -rates/-bond/-core/-types (never on the cube), so this is a one-way, acyclic
# edge (gate: `cargo tree -p celnet-risk-cube` shows no back-edge). It stays lean — the
# cube still pulls NEITHER celnet-exotics NOR celnet-gpu.
celnet-rates-risk.workspace = true
# NOTE: the cube depends on NEITHER celnet-exotics NOR celnet-gpu. The concrete
# exotic closed forms are injected through the `celnet_core::ExoticLegPricer` seam
# (implemented by the server over celnet-exotics), and the batched-GPU scenario grid
# lives in the bench harness (its sole consumer). The dependency is inverted so the
# cube depends only on the abstraction layer, not the heavy pricers (arch-program
# item E; `docs/INTERFACES.md` one-way edges; gate: `cargo tree -p celnet-risk-cube`
# lists no celnet-exotics / celnet-gpu).

[dev-dependencies]
# The cross-asset leaf crates are used ONLY by the longhand oracle test, which
# re-derives a mixed FX/metal/equity firm aggregate + its FRTB charge by calling the
# leaf crates' public `price`/`greeks` DIRECTLY (code-disjoint from the production
# seam path), the independent non-circular oracle the cube is gated against.
celnet-equity-vanilla.workspace = true
celnet-commodity-vanilla.workspace = true
# The FI curve/OIS leaf — used ONLY by the C2c `fi` module tests to construct the
# linear-FI fixtures (`OisSchedule`/`FixedPeriod`) the joint-tail path folds in. A
# dev-dependency only; the cube's runtime surface stays FI-fixture-free (the production
# path takes already-built `celnet_rates_risk::FiPosition`s).
celnet-rates.workspace = true
# Proptest + libm for the scenario-algebra fuzz mirror.
proptest.workspace = true
libm.workspace = true
