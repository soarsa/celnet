[package]
name = "celnet-risk-cube"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet single-node hierarchical risk cube: an OLAP-style fact store + group-by/reduce roll-up over convention-free canonical risk leaves. Additive measures (net greeks, bucketed vega) roll up by summation; non-additive measures (VaR/ES, FRTB curvature, correlation-weighted vega) are re-derived per node by bump-and-revalue over the node's constituent positions."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
celnet-vanilla.workspace = true
# Closed-form exotic pricers (single barrier / European digital) backing the
# exotic-leg risk measure: an exotic position contributes its REAL exotic Greeks
# (additive) and re-prices under shocks (non-additive), so a booked exotic is no
# longer silently excluded from firm/desk/book roll-ups. celnet-exotics depends
# only on -types/-core/-vanilla, so this is a one-way edge (no cycle).
celnet-exotics.workspace = true
celnet-risk-normalize.workspace = true
# Batched scenario revaluation: the spot×vol grid for a node is priced in ONE
# GPU dispatch (Metal/Vulkan) with the f64 CPU oracle as the headless/CI fallback
# — internal acceleration of the non-additive bump-and-revalue path, reconciled to
# the analytic closed form. celnet-gpu depends only on -types/-core, so this is a
# one-way edge (no cycle).
celnet-gpu.workspace = true

[dev-dependencies]
# The cross-asset leaf crates are used ONLY by the longhand oracle test, which
# re-derives a mixed FX/metal/equity firm aggregate + its FRTB charge by calling the
# leaf crates' public `price`/`greeks` DIRECTLY (code-disjoint from the production
# seam path), the independent non-circular oracle the cube is gated against.
celnet-equity-vanilla.workspace = true
celnet-commodity-vanilla.workspace = true
# Proptest + libm for the scenario-algebra fuzz mirror.
proptest.workspace = true
libm.workspace = true
