[package]
name = "celnet-limits"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet limits / entitlements layer: a hierarchical limit tree (trader/book/desk/ccy-pair/entity) of greek, bucketed-vega, VaR, concentration, tenor-bucket and stop-loss limits, with first-class utilization, RAG escalation status, and pre/post-trade breach checks against a celnet-risk-cube node aggregate. Deterministic and pure: no IO, no market data."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-risk-cube.workspace = true
# The linear-FI per-currency risk roll-up (`RatesNodeAggregate`: net DV01 / PV01 +
# key-rate ladder) the FI limit metrics (`Dv01`/`Pvbp`/`RateTenorBucket`) are read
# off by `check::exposure_of_rates` — the FI counterpart to reading the options
# `NodeAggregate` off `celnet-risk-cube`. One-way edge: limits -> risk-fleet (fleet
# does not depend on limits), so the fixed-income limit check mirrors the options one.
celnet-risk-fleet.workspace = true
celnet-risk-normalize.workspace = true
# The agnostic CarryPricer carry seam the non-additive VaR/ES re-derivation
# threads through (the cube reducers are generic over it). One-way edge:
# limits -> core.
celnet-core.workspace = true

[dev-dependencies]
# Enable the cube's test-only `test_support::DigitalTestPricer` for the limits
# non-additive VaR test (the injected `ExoticLegPricer`), reusing the single
# code-disjoint closed form instead of duplicating it. Test-only; the production
# build of celnet-risk-cube above has the feature off.
celnet-risk-cube = { workspace = true, features = ["test-support"] }
