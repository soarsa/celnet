[package]
name = "celnet-fix"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet FIX engine — zero-copy framing, FIXT/4.4 session, FX-options dialect, acceptor + initiator."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-conventions.workspace = true
# The async edge needs the AsyncRead/AsyncWrite extension traits (`io-util`) on
# top of the workspace tokio feature set; declared here (not relied upon via
# cross-crate feature unification) so this crate builds standalone.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
celnet-vanilla.workspace = true
# golden reference tables (leaf test-data crate; not in the central dep table)
celnet-golden.workspace = true
proptest.workspace = true
