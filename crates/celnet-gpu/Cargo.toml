[package]
name = "celnet-gpu"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet cross-platform GPU compute backend (f32 GPU + f64 CPU reconciliation) with a CPU fallback."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
libm.workspace = true
bytemuck.workspace = true
# Enable the platform GPU backends here (cargo unions these with the workspace
# `wgsl` feature). Metal drives this M4 host; vulkan/gles cover Linux CI
# (incl. Lavapipe software Vulkan for headless runners) and dx12 covers Windows.
# When none is available at runtime the backend falls back to the CPU oracle.
wgpu = { workspace = true, features = ["metal", "vulkan", "gles", "dx12"] }
pollster.workspace = true
# Scrambled Joe-Kuo Sobol' + Brownian-bridge QMC engine. Referenced BY PATH (a
# leaf crate not in the central workspace.dependencies table, like celnet-golden
# / celnet-heston elsewhere). The multi-step path kernel (path.rs/path.wgsl) and
# the pathwise/LR Greeks kernel (pathwise.rs/greeks.wgsl) consume its Sobol'
# direction numbers, Brownian-bridge weight matrix and inverse-normal CDF
# verbatim, so the CPU oracle and the GPU kernels draw the IDENTICAL sequence.
celnet-qmc = { path = "../celnet-qmc" }

[dev-dependencies]
# f64 closed-form oracle the Monte-Carlo backends reconcile against.
celnet-vanilla.workspace = true
