[package]
name = "celnet-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet service edge — the tokio async gRPC front (RFQ / RFS / surface / scenario) over the unversioned celnet-proto wire contract."
publish = false

[lints]
workspace = true

[[bin]]
name = "celnet-server"
path = "src/main.rs"

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
celnet-conventions.workspace = true
celnet-vanilla.workspace = true
celnet-surface.workspace = true
celnet-exotics.workspace = true
celnet-linear.workspace = true
celnet-rates.workspace = true
# Fixed-income cash-bond analytics leaf — wrapped (never reimplemented) by the
# central-core Phase-B contract seam (`rates_pricing::contract::BondEngine`) so a
# bond speaks the same `Priceable`/`MarketResolver`/`RiskMeasure` contract as the
# options families. One-way edge (server → bond); bond's leaf graph is
# {rates, types, calendar}, all already in the server tree, so no cycle.
celnet-bond.workspace = true
# The curated government-bond static reference universe seeded into the instrument
# registry on boot (config/reference_data.rs::government_bond_defs), so the FI
# Aggregated Book tiles resolve real names + ISIN/CUSIP and the security-list
# download can filter by region + sub-asset-type.
celnet-refdata.workspace = true
# Instrument reference-data convention labels (config/reference_data.rs) reuse the
# shared calendar vocabularies (RollRule business-day convention, CentreId
# settlement centres) so the registry can never drift from what the engine resolves.
celnet-calendar.workspace = true
celnet-equity-vanilla.workspace = true
celnet-commodity-vanilla.workspace = true
celnet-crypto-vanilla.workspace = true
# Valuation-adjustment (XVA) analytics — the CVA/DVA/FVA aggregation over a
# synthetic netting set's expected-exposure profile and hazard-rate survival
# curves, served by the `PricingService::PriceXva` edge (dormant-crate
# activation). One-way edge (server → xva); xva's leaf graph is
# {vanilla, types, qmc}, all already in the server tree, so no cycle.
celnet-xva.workspace = true
celnet-rfq.workspace = true
celnet-aggregation.workspace = true
celnet-engine.workspace = true
# User-extensible analytics: the tiered plugin host whose ModelRegistry the
# pricer's ProductEngine (options) + FiProductEngine (fixed income, ADR-0021)
# dispatch resolve a registered house model through (architecture item D —
# dormant-crate activation).
celnet-plugin-host.workspace = true
# The frozen plugin SDK contract itself: the FI dispatch (rates_pricing/engines.rs)
# builds the neutral `RatesTerms` / `RatesCurvePillar` a registered rates house
# model prices, and maps its `RatesMeasures` back onto the wire result. Used on the
# non-test dispatch path (and by the reference models in tests), so a normal dep.
celnet-plugin-api.workspace = true
celnet-proto.workspace = true
celnet-risk-normalize.workspace = true
celnet-risk-cube.workspace = true
# Linear-FI scenario risk (the C2a rate-shock engine): supplies the `FiPosition` /
# `RatePillars` / `RateShock` the `RiskService.CombinedTailRisk` edge builds the
# `celnet_risk_cube::combined_tail_risk` joint-tail cube from. One-way edge
# (server → rates-risk); its leaf graph is {rates, bond, types, risk-cube-free}, all
# already in the server tree, so no cycle.
celnet-rates-risk.workspace = true
celnet-limits.workspace = true
celnet-entitlements.workspace = true
celnet-risk-fleet.workspace = true
celnet-router.workspace = true
celnet-fanout.workspace = true
# ADR-0015: the dormant Raft consensus, activated as the engine of the `Strong`
# consistency tier (wired everywhere, forced nowhere). One-way edge
# (server → replog); replog depends only on celnet-journal, so no cycle.
celnet-replog.workspace = true
celnet-observability.workspace = true
celnet-client.workspace = true
celnet-fix.workspace = true
celnet-integration.workspace = true
rtrb.workspace = true
tokio = { workspace = true, features = ["signal"] }
tonic.workspace = true
prost.workspace = true
futures-util.workspace = true
blake3.workspace = true
getrandom.workspace = true
# User-admin identity store (config/identity.rs): argon2id password hashing +
# getrandom-seeded salts/session tokens (control plane, never the pricing core).
argon2.workspace = true
# Persisted FIX-connection definitions (config/fix_connections.rs) derive serde;
# serde_json already serializes the contract elsewhere.
serde = { workspace = true }
serde_json.workspace = true
tokio-tungstenite.workspace = true
time.workspace = true
# The entitlements trust boundary (services/access.rs) emits one structured
# security-class audit event per allow/deny decision on the async edge.
tracing.workspace = true

[dev-dependencies]
celnet-testkit.workspace = true
# The frozen golden-vector corpus: the cross-asset WS conformance suite
# (tests/cross_asset_ws.rs) reconciles the WS mirror against the vectors'
# independent oracles.
celnet-golden.workspace = true
# Per-test isolated config dir so parallel test edges never race the one shared
# identity.json / fix-connections.json path (each `start_*_edge` roots its own).
tempfile.workspace = true
