[package]
name = "celnet-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet service edge — the tokio async gRPC front (RFQ / RFS / surface / scenario) over the unversioned celnet-proto wire contract."
publish = false

[lints]
workspace = true

[[bin]]
name = "celnet-server"
path = "src/main.rs"

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
celnet-conventions.workspace = true
celnet-vanilla.workspace = true
celnet-surface.workspace = true
celnet-exotics.workspace = true
celnet-engine.workspace = true
celnet-proto.workspace = true
rtrb.workspace = true
tokio = { workspace = true, features = ["signal"] }
tonic.workspace = true
prost.workspace = true
futures-util.workspace = true
blake3.workspace = true
getrandom.workspace = true

[dev-dependencies]
celnet-testkit.workspace = true
