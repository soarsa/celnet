[package]
name = "celnet-integration"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet market-data integration — vendor feed normalization and multi-source surface aggregation."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
celnet-conventions.workspace = true
celnet-surface.workspace = true
serde = { workspace = true }
serde_json.workspace = true
time = { workspace = true }
# Async edge runtime (workspace-pinned). `io-util` adds the AsyncRead/Write
# extension traits the resilient subscriber + socket egress sink use; features
# are additive over the workspace set.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
celnet-testkit.workspace = true
tokio = { workspace = true, features = ["io-util"] }
