[package]
name = "celnet-refdata"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet government-bond static reference-data universe — the single source of truth for the curated on-the-run government curves (US Treasuries from the bundled securities-master snapshot, plus curated UK gilts and EUR govvies: German Bunds, French OATs, Italian BTPs). Emits vendor-neutral, fully-specified GovBondSpec records (issuer, coupon, real conventions, ISO-6166 check-valid ISINs) that the server maps to reference-data InstrumentDefs and the LP simulator prices off the celnet-bond leaf. Pure data + ISIN integrity; no IO, no wire."
publish = false

[lints]
workspace = true

[dependencies]
# The embedded US-Treasury securities-master snapshot (data/treasury-universe.json)
# is parsed into typed GovBondSpec records. serde derives the raw record shape;
# serde_json parses the embedded document.
serde.workspace = true
serde_json.workspace = true
# Civil-date validation: every spec's coupon/maturity triple is checked against the
# real Gregorian calendar so a malformed date never reaches the registry.
time.workspace = true
# The analytics leaf that DERIVES a Treasury futures contract's DV01 from its
# published notional-deliverable terms (celnet_bond::dv01 over a real cashflow
# schedule). The DV01 is the denominator of every futures hedge ratio, so it is
# computed off the real leaf rather than carried as a hand-typed constant.
# Points strictly downward — celnet-bond has no reference-data dependency.
celnet-bond.workspace = true
# The settlement-centre business-day calendar behind the futures delivery-month
# dates (first delivery day, last trading day, last delivery day) and the
# end-of-month-aware month arithmetic the notional deliverable's maturity uses.
celnet-calendar.workspace = true
# The frozen `Rate` newtype the analytics leaf takes its yield argument as.
celnet-types.workspace = true
