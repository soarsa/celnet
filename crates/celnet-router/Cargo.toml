[package]
name = "celnet-router"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet fleet router — shard-by-pair/tenant partition map, stateless pricing-replica routing, hot-standby failover."
publish = false

[lints]
workspace = true

[dependencies]
# Domain vocabulary (CcyPair, currencies) the partition key is built from. The
# router is pure routing logic — it does no pricing, so it needs no numeric
# crate (celnet-core); its hashing is a self-contained, frozen integer mixer
# (see `src/hash.rs`) chosen for cross-fleet bit-stable rendezvous weights.
celnet-types.workspace = true

[dev-dependencies]
proptest.workspace = true
