[package]
name = "celnet-parity"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet executable competitive-parity matrix — each capability claim vs incumbents backed by a gated test."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true

[dev-dependencies]
celnet-vanilla.workspace = true
celnet-conventions.workspace = true
celnet-calendar.workspace = true
celnet-surface.workspace = true
celnet-exotics.workspace = true
celnet-risk-cube.workspace = true
celnet-testkit.workspace = true
proptest.workspace = true
# The QuantLib-sourced golden reference tables are the independent oracle for the
# exotics parity rows (rows 12–14). Not in the workspace dependency table (it is
# itself a leaf test-data crate), so referenced by path here in the parity lane.
celnet-golden = { path = "../celnet-golden" }
# Standalone Heston pricer (Wave 4b). Referenced by path — like celnet-golden it
# is not in the central workspace.dependencies table; nothing depends on it via
# `.workspace`. Backs the cross-method (Carr-Madan vs COS) + Black-Scholes-limit
# parity row in tests/heston.rs.
celnet-heston = { path = "../celnet-heston" }
# Scrambled Sobol + Brownian-bridge QMC engine (Wave 4c). Referenced by path —
# like celnet-golden/celnet-heston it is a leaf crate not in the central
# workspace.dependencies table. Backs the Sobol KAT / (t,m,s)-net equidistribution
# / measured-variance-reduction / bridge-covariance parity row in tests/qmc.rs.
celnet-qmc = { path = "../celnet-qmc" }
# Full Raft consensus module (replicated log). Referenced by path — like the other
# leaf crates above it is not in the central workspace.dependencies table. Backs
# the leader-election / election-safety / log-matching+conflicting-tail-truncation /
# convergence-oracle parity row in tests/raft_election.rs (real loopback cluster).
celnet-replog = { path = "../celnet-replog" }
# XVA engine (CVA/DVA/FVA on synthetic netting sets, W10). Referenced by path —
# like the other leaf crates above it is not in the central workspace.dependencies
# table. Backs the closed-form-CVA-limit / monotonicity / zero-default-probability
# / DVA-symmetry parity row in tests/xva.rs (oracle coded independently in-test).
celnet-xva = { path = "../celnet-xva" }
