[package]
name = "celnet-lp-sim"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet fixed-income liquidity-provider (LP) feed simulator — a fleet of deterministic-seeded synthetic bond LPs that implement celnet-aggregation::VenueFeed, so they flow through the REAL consolidation engine. Ground-truth ladder mode gives analytic best-bid/offer for tests; stochastic mean-reverting-yield mode (priced via celnet-bond) gives soak/demo realism. Injectable staleness and outlier faults exercise the consolidator's staleness decay and MAD divergence gating."
publish = false

[lints]
workspace = true

[dependencies]
# The integration seam under test: the LP feeds implement VenueFeed and are
# consolidated by THIS crate's real engine (path dep, never modified from here).
celnet-aggregation.workspace = true
# The reference yield->clean-price relation for the stochastic mode. Depending on
# the real analytics leaf (rather than re-deriving a bond price here) means the
# simulator's prices ARE the oracle, satisfying the "validate against a reference"
# guardrail by construction. Points strictly downward — no dependency cycle.
celnet-bond.workspace = true
# The frozen instrument/rate vocabulary (Rate, Underlying, Tenor, CcyPair).
celnet-types.workspace = true
# Correctly-rounded, cross-platform-identical transcendentals (exp), matching the
# project determinism convention used by celnet-aggregation::sim.
libm.workspace = true
# The bundled US-Treasury reference universe (data/treasury-universe.json) is
# parsed into typed `TreasuryBond` records by the `universe` loader. serde derives
# the record shape; serde_json parses the embedded document.
serde.workspace = true
serde_json.workspace = true
# Civil-date arithmetic: the loader maps a bond's coupon/maturity schedule onto a
# real `celnet_bond::Bond` (`universe::TreasuryBond::to_reference_bond`) so the
# stochastic feed prices off the REAL analytics leaf, not a fabricated handle.
time.workspace = true
# The `lp-sim` runnable feed binary's CLI surface (--lp-name/--book/--interval/…),
# mirroring the fix-sim client's flag style.
clap.workspace = true
# The wire contract + gRPC client for the network feed mode (`--addr`): the
# `LiquidityFeedServiceClient` the LP-SIM feed pushes `LpQuote`s to, so the
# consolidated composite surfaces to server subscribers rather than printing
# locally. The SAME single contract the server ingests (guardrail 9).
celnet-proto.workspace = true
tonic.workspace = true
# The async runtime + stream combinators for the client-streaming push (the local
# in-process mode stays synchronous; the runtime is only built in `--addr` mode).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures-util.workspace = true
# Structured logging for the network feed's connect / reconnect lifecycle.
tracing.workspace = true

# The runnable LP-SIM liquidity feed: loads the bundled Treasury universe, stands
# up the named `LP-SIM` member panel, and streams the consolidated composite
# (best bid/offer + per-LP contributions) for each bond on an interval — the
# deployable feed the `lpsimctl`/`start-lp-sim.sh` wrapper supervises.
[[bin]]
name = "lp-sim"
path = "src/bin/lp-sim.rs"
