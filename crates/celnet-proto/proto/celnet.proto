// ===========================================================================
// FI aggregated book — operator-defined multi-LP price consolidation
// (ADR-0022). A named set of inbound liquidity members whose per-instrument
// top-of-book is consolidated into one composite price, managed from the
// Administration surface. Global (not desk-owned): any authenticated user may
// read a book's composite, only an admin may define or edit one. The messages
// mirror the entity/book admin CRUD conventions on this same service (a required
// `session_token`, an optional echoed `correlation_id`).

// The instrument-coverage mode of an aggregated book (mirrors the store
// `config::identity::Scope` discriminant).
enum AggregationScopeMode {
  // Aggregate EVERY instrument any member quotes — the composite tracks the
  // union of the members' live streams with no pre-declared instrument list
  // (proto3 zero default). `instrument_ids` is ignored in this mode.
  AGGREGATION_SCOPE_MODE_ALL_MEMBERS_QUOTE = 0;
  // Aggregate only the explicitly listed `instrument_ids`, each resolving to a
  // canonical reference-data `InstrumentDefDesc.instrument_id`.
  AGGREGATION_SCOPE_MODE_EXPLICIT = 1;
}

// The consolidation-engine tuning of an aggregated book (mirrors the store
// `config::identity::AggregationParams`): the knobs the `celnet-aggregation`
// engine consumes once a book is wired.
message AggregationParamsDesc {
  // Staleness half-life tau in milliseconds: a member quote's contribution decays
  // as 2^{-dt/tau} with age dt. Must be > 0.
  uint64 staleness_tau_ms = 1;
  // Hard maximum quote age in milliseconds: a member quote older than this is
  // fully excluded from the composite.
  uint64 max_quote_age_ms = 2;
  // Whether MAD-based divergence gating drops outlier members before consolidation.
  bool divergence_gating = 3;
  // Minimum surviving member contributors required to publish a composite. Must be >= 1.
  uint32 min_contributors = 4;
  // How many stacked depth levels the composite exposes (1 = top-of-book only).
  uint32 depth_levels = 5;
}

// The unit an outbound-tiering spread magnitude is expressed in (mirrors the
// engine `celnet_tiering::SpreadUnit`). A bond "25 bps" is ambiguous — price bps
// vs duration-consistent yield bps — so the unit is carried explicitly and the
// engine converts each magnitude to a price offset per quote.
enum TieringSpreadUnit {
  // Price basis points: 1 bp = 0.01 price points per 100 face (proto3 zero
  // default; the flat-markup baseline unit that matches the worked example).
  TIERING_SPREAD_UNIT_PRICE_BPS = 0;
  // Yield basis points: converted to a price offset via the bond's DV01
  // (duration-consistent across the curve; requires bond DV01/ModDur).
  TIERING_SPREAD_UNIT_YIELD_BPS = 1;
  // Price points per 100 face — the magnitude IS the price offset.
  TIERING_SPREAD_UNIT_PRICE_POINTS = 2;
  // Percent of the mid — a magnitude of 1.0 is an offset of mid/100.
  TIERING_SPREAD_UNIT_PERCENT = 3;
}

// What the engine does when the upstream composite is stale / the LP quorum is
// lost (mirrors `celnet_tiering::StalePolicy`).
enum TieringStalePolicy {
  // Publish no quote for the line — the safe default (proto3 zero).
  TIERING_STALE_POLICY_SUPPRESS = 0;
  // Keep a market but widen to the guardrail `h_max` with zero skew.
  TIERING_STALE_POLICY_WIDEN_TO_MAX = 1;
}

// Which pluggable tiering strategy a `TieringStrategyDesc` carries (mirrors the
// `celnet_tiering::StrategySpec` variants). Phase 2a ships the two streaming-
// relevant strategies; the remaining four (vol scale, size ladder, toxicity,
// per-client tier) slot in additively as new enum values behind the same seam.
enum TieringStrategyKind {
  // Flat markup: a constant symmetric half-spread `half_spread`, no skew
  // (proto3 zero default). `kappa` / `s_max` are ignored.
  TIERING_STRATEGY_KIND_FLAT_MARKUP = 0;
  // Inventory skew: base `half_spread` plus `clamp(kappa*q, +-s_max)` skew.
  TIERING_STRATEGY_KIND_INVENTORY_SKEW = 1;
  // Scaled Smoothed Spread: a spread SOURCE that damps spread volatility. From the
  // fading-memory smoothed observed spread `S` it sets one absolute output spread
  // `O = min(max_output_spread, core_spread*(1 + f*D/e))` centred on mid (no skew),
  // where `D = |S - expected_spread|` is zeroed inside the `max_divergence`
  // dead-band and `f = spread_scale_factor`. Uses the `smoothing_weight` (..10),
  // `expected_spread`/`max_divergence`/`core_spread`/`max_output_spread` and
  // `spread_scale_factor` fields; `half_spread`/`kappa`/`s_max` are ignored. Use
  // instead of FLAT_MARKUP (it sets the half-spread absolutely).
  TIERING_STRATEGY_KIND_SCALED_SMOOTHED_SPREAD = 2;
}

// One enabled tiering strategy and its parameters (mirrors a
// `celnet_tiering::StrategySpec` variant). Magnitudes are in the parent
// `TieringConfigDesc.unit`. Fields not used by `kind` are ignored (e.g. a
// FLAT_MARKUP strategy ignores `kappa` / `s_max`).
message TieringStrategyDesc {
  // Which strategy this entry configures.
  TieringStrategyKind kind = 1;
  // The (base) half-spread magnitude `H` (FLAT_MARKUP / INVENTORY_SKEW).
  double half_spread = 2;
  // Inventory-skew gain `kappa` (magnitude per unit inventory); INVENTORY_SKEW only.
  double kappa = 3;
  // Inventory-skew strategy-local cap `s_max` (magnitude); INVENTORY_SKEW only.
  double s_max = 4;
  // Scaled-Smoothed-Spread Smoothing Weight `w` in (0, 1] (1 => smoothing off);
  // SCALED_SMOOTHED_SPREAD only. Drives the stateful EWMA on the observed spread.
  double smoothing_weight = 5;
  // Scaled-Smoothed-Spread Expected Spread `e` (> 0), the divergence reference (an
  // absolute price spread); SCALED_SMOOTHED_SPREAD only.
  double expected_spread = 6;
  // Scaled-Smoothed-Spread Max Divergence `d` (>= 0), the dead-band half-width;
  // SCALED_SMOOTHED_SPREAD only.
  double max_divergence = 7;
  // Scaled-Smoothed-Spread Core spread `c` (>= 0), the base output spread at zero
  // widen; SCALED_SMOOTHED_SPREAD only.
  double core_spread = 8;
  // Scaled-Smoothed-Spread Max Output Spread `m` (>= c), the output cap and the
  // indicative fallback width; SCALED_SMOOTHED_SPREAD only.
  double max_output_spread = 9;
  // Scaled-Smoothed-Spread Spread Scale Factor `f` (>= 0), the widening gain on
  // `D/e`; SCALED_SMOOTHED_SPREAD only.
  double spread_scale_factor = 10;
}

// The price-space guardrail bounds (mirrors `celnet_tiering::Guardrails`); all
// four are absolute price offsets (points), independent of the spread unit.
message TieringGuardrailsDesc {
  // Minimum half-spread `h_min >= 0`.
  double h_min = 1;
  // Maximum half-spread `h_max >= h_min` (also the widen-to-max width).
  double h_max = 2;
  // Maximum absolute skew `s_max >= 0`.
  double s_max = 3;
  // Minimum tradeable spread `spread_floor > 0` (`offer - bid >= spread_floor`).
  double spread_floor = 4;
}

// A book's complete outbound-tiering configuration (mirrors
// `celnet_tiering::TieringConfig`). Absent on `AggregatedBookSpec` /
// `AggregatedBookDesc` ⇒ tiering disabled: the book publishes the raw composite
// unchanged (zero behaviour change for a book with no tiering config).
message TieringConfigDesc {
  // The unit every strategy magnitude below is expressed in.
  TieringSpreadUnit unit = 1;
  // The enabled strategies, composed additively in order.
  repeated TieringStrategyDesc strategies = 2;
  // The price-space guardrail bounds clamping the composed result.
  TieringGuardrailsDesc guardrails = 3;
  // What to do on stale/absent upstream inputs.
  TieringStalePolicy stale_policy = 4;
}

// The editable fields of an aggregated book (the create/update payload). The
// server-minted `id` on `AggregatedBookDesc` is not part of the spec except as a
// client-suggested slug on create (mirrors `FixConnectionSpec.id`).
message AggregatedBookSpec {
  // On create: a client-suggested id (a slug of `name` is used when empty). On
  // update: ignored in favour of the request's `id`.
  string id = 1;
  // Human-friendly book label (unique across the store, case-insensitive).
  string name = 2;
  // The inbound liquidity members whose quotes feed the composite, by connection
  // id (transport-agnostic; unique within this book).
  repeated string member_connection_ids = 3;
  // Which instruments the composite is produced for.
  AggregationScopeMode scope_mode = 4;
  // The explicit instrument ids when `scope_mode == EXPLICIT` (each must resolve to
  // an instrument in the reference-data registry); ignored for `ALL_MEMBERS_QUOTE`.
  repeated string instrument_ids = 5;
  // The consolidation-engine tuning applied when the book is wired to the engine.
  AggregationParamsDesc params = 6;
  // Whether the book is active (a disabled book is persisted and editable but stands
  // up no engine and publishes no composite).
  bool enabled = 7;
}

// A persisted aggregated book (mirrors the store `config::identity::AggregatedBookDef`
// field-for-field).
message AggregatedBookDesc {
  // Stable identifier (the store/API key), minted from `name` on create.
  string id = 1;
  // Human-friendly book label (unique, case-insensitive).
  string name = 2;
  // The inbound liquidity members whose quotes feed the composite, by connection id.
  repeated string member_connection_ids = 3;
  // Which instruments the composite is produced for.
  AggregationScopeMode scope_mode = 4;
  // The explicit instrument ids when `scope_mode == EXPLICIT`; empty otherwise.
  repeated string instrument_ids = 5;
  // The consolidation-engine tuning.
  AggregationParamsDesc params = 6;
  // Whether the book is active.
  bool enabled = 7;
}

// List the aggregated books (any authenticated caller — a book is global and its
// composite is readable by any user, so this is NOT admin-only).
message ListAggregatedBooksRequest {
  // The caller's bearer token (must resolve to a valid session; not admin-gated).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full aggregated-book roster.
message ListAggregatedBooksResponse {
  // Every aggregated book, in creation order.
  repeated AggregatedBookDesc books = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Define a new aggregated book (admin only).
message CreateAggregatedBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The editable fields of the book to define.
  AggregatedBookSpec spec = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created aggregated book.
message CreateAggregatedBookResponse {
  // The created book with its server-minted id.
  AggregatedBookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing aggregated book's definition (admin only). The `id` is
// immutable identity; the spec's own `id` field is ignored.
message UpdateAggregatedBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the book to replace (immutable identity).
  string id = 2;
  // The new definition.
  AggregatedBookSpec spec = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The updated aggregated book.
message UpdateAggregatedBookResponse {
  // The book after the update.
  AggregatedBookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Set the firm-wide pricing kill-switch (server-only control plane). Two independent
// controls, both default true. `outbound_enabled=false` suppresses ALL outbound
// pricing to FIX-connected clients (RFQ auto-quotes + RFS/ESP streams) while inbound
// LP aggregation keeps running ("Stop all pricing"); `inbound_enabled=false` stops LP
// ingestion into the aggregated books. Both false = "Stop all"; both true = "Resume".
// Gated on the fixed-income liquidity-management capability.
message SetPricingControlRequest {
  // The caller's bearer token (must hold ManageLiquidity·FixedIncome).
  string session_token = 1;
  // Whether the server sends outbound pricing to FIX-connected clients.
  bool outbound_enabled = 2;
  // Whether LP-feed ingestion into the aggregated books runs.
  bool inbound_enabled = 3;
  // Echoed request correlation id.
  optional string correlation_id = 4;
}
// The applied firm-wide pricing kill-switch state, echoed back with its monotonic
// version (also fanned out to every connected client as a `pricing_control` frame).
message SetPricingControlResponse {
  // The applied outbound-pricing control.
  bool outbound_enabled = 1;
  // The applied inbound-ingest control.
  bool inbound_enabled = 2;
  // The monotonic version of the applied control state (starts at 1; +1 per change).
  uint64 version = 3;
  // Echoed request correlation id.
  optional string correlation_id = 4;
}

// Delete an aggregated book (admin only).
message DeleteAggregatedBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the book to delete.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteAggregatedBookResponse {
  // Whether a book was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// Pricing groups — trader-defined client-tiering (`docs/FI-PRICING-GROUPS-DESIGN.md`).
// A pricing group binds a set of connected clients (inbound FIX sessions, GUI/API
// principals, or a desk as a default tier) to their own outbound FEATURE PIPELINES,
// so different clients receive different outbound prices off the SAME raw composite.
// Each group carries a separate pipeline per outbound mode (ESP streaming / RFS-RFQ).
// The messages below mirror the store `config::identity::PricingGroupDef` field for
// field, reusing `TieringConfigDesc` (a TIERING feature's margin), `TieringSpreadUnit`
// (every feature magnitude's unit) and `TieringGuardrailsDesc` (a pipeline's closing
// guardrails). The feature spec is a FLAT kind-discriminated message (mirroring
// `TieringStrategyDesc`), NOT a proto oneof, so it maps onto the existing
// `WireBuilder`/`WireAdapter` codec machinery; fields a `kind` does not use are left
// at proto3 zero and ignored on decode.
// ===========================================================================

// Which pricing feature a `FeatureSpecDesc` carries (mirrors the
// `celnet_tiering::PricingFeature` variants). The order IS the pricing: a trader
// composes an ordered list of features (RAW → these → outbound). New feature modules
// slot in additively as new enum values behind the same seam.
enum FeatureKind {
  // Recentre the running two-way (spread-invariant): bias the mid by `shift` off
  // `reference` (proto3 zero default). Uses `shift` / `unit` / `reference`.
  FEATURE_KIND_MID_SHIFT = 0;
  // Apply margin/markup by rebuilding the two-way with an embedded `tiering`
  // config (Flat / Scaled-Smoothed-Spread / Inventory-skew). Uses `tiering`.
  FEATURE_KIND_TIERING = 1;
  // Skew the two-way toward the desk's axe (spread-invariant). Uses `axe_side` /
  // `magnitude` / `unit`.
  FEATURE_KIND_AXE = 2;
  // Inventory skew off the context's signed position `q`: `clamp(kappa*q, +-s_max)`
  // shift down (spread-invariant). Uses `kappa` / `s_max` / `unit`.
  FEATURE_KIND_POSITION = 3;
  // An emergency overlay skew applied only when `triggered` (spread-invariant).
  // Uses `skew` / `unit` / `triggered`.
  FEATURE_KIND_PANIC_SKEW = 4;
}

// Which side a desk is axed on for a `FEATURE_KIND_AXE` feature (mirrors
// `celnet_tiering::AxeSide`).
enum AxeSide {
  // The desk wants to BUY — lean the two-way up (a keener bid; proto3 zero default).
  AXE_SIDE_BUY = 0;
  // The desk wants to SELL — lean the two-way down (a keener offer).
  AXE_SIDE_SELL = 1;
}

// Which outbound pricing mode a `UpdatePricingGroupPipelineRequest` retunes: the ESP
// (streaming) pipeline or the RFS/RFQ pipeline.
enum EspOrRfq {
  // The ESP / streaming pipeline (proto3 zero default).
  ESP_OR_RFQ_ESP = 0;
  // The RFS / RFQ (request-for-quote) pipeline.
  ESP_OR_RFQ_RFQ = 1;
}

// How a rates/bond FIX auto-quote for a member of this pricing group SOURCES its price
// (mirrors the store `config::identity::PricingSourceMode`). Orthogonal to the feature
// pipelines, which shape a price AFTER it is sourced. The proto3 zero value is the
// platform default (composite-first-curve-fallback), so an unset field on an existing
// spec decodes to the least-surprising behaviour.
enum PricingSourceMode {
  // Composite where an enabled aggregated book covers the instrument, else the curve
  // (proto3 zero default — see the enum doc).
  PRICING_SOURCE_MODE_COMPOSITE_FIRST_CURVE_FALLBACK = 0;
  // Always the internal curve (the safe back-out; never consults the composite).
  PRICING_SOURCE_MODE_CURVE_ONLY = 1;
  // Bond -> composite (book-covered), OIS/swap -> curve.
  PRICING_SOURCE_MODE_PRODUCT_SPLIT = 2;
  // Curve backbone, mid skewed toward the composite where a book exists (blend weight
  // `book_skew_weight`).
  PRICING_SOURCE_MODE_CURVE_ANCHORED_BOOK_SKEW = 3;
  // Composite ONLY: price off the aggregated-book composite, and decline when no
  // enabled book covers the instrument (never falls back to the internal curve).
  PRICING_SOURCE_MODE_COMPOSITE_ONLY = 4;
}

// How this pricing group treats the FAVORABLE side of a market-data (ESP) last-look:
// when the price moved in the DEALER's favor between the streamed snapshot the client
// lifted and the current published price at order arrival (mirrors the store
// `config::identity::LastLookMode`). Governs only the favorable side — the adverse side
// is a plain reject-beyond-tolerance / honor-within-tolerance regardless. The proto3 zero
// value is SYNC (the dealer keeps the whole favorable move — the least-surprising
// "client gets exactly what they asked" fill).
enum LastLookMode {
  // Fill the client at EXACTLY their requested (lifted) price; the dealer captures 100%
  // of the favorable slippage (proto3 zero default).
  LAST_LOOK_MODE_SYNC = 0;
  // Fill at an IMPROVED price: the requested price adjusted toward the current price by
  // `async_giveback_pct`% of the favorable move (that % passed back to the client, the
  // dealer keeps the rest).
  LAST_LOOK_MODE_ASYNC = 1;
}

// One pluggable pricing-feature transform + its params (mirrors a
// `celnet_tiering::PricingFeature` variant). Magnitudes a `kind` does not carry are
// ignored (e.g. a `FEATURE_KIND_AXE` feature ignores `kappa` / `skew`). The single
// `unit` applies to whichever magnitude the `kind` uses (`shift` / `magnitude` /
// `kappa`+`s_max` / `skew`); a `FEATURE_KIND_TIERING` feature carries its own unit
// inside `tiering` and ignores this `unit`.
message FeatureSpecDesc {
  // Which feature this entry configures.
  FeatureKind kind = 1;
  // The unit the magnitude this feature uses is expressed in (reuses the tiering
  // spread unit; ignored by `FEATURE_KIND_TIERING`).
  TieringSpreadUnit unit = 2;
  // `FEATURE_KIND_MID_SHIFT`: signed mid-bias magnitude, in `unit` (may be 0).
  double shift = 3;
  // `FEATURE_KIND_MID_SHIFT`: explicit reference-price override for the centre
  // (absent ⇒ fall back to the context reference, then the running centre).
  optional double reference = 4;
  // `FEATURE_KIND_TIERING`: the margin configuration applied as this feature (the
  // same message a book's tiering block carries).
  TieringConfigDesc tiering = 5;
  // `FEATURE_KIND_AXE`: which way the desk is axed.
  AxeSide axe_side = 6;
  // `FEATURE_KIND_AXE`: the lean magnitude (non-negative), in `unit`.
  double magnitude = 7;
  // `FEATURE_KIND_POSITION`: inventory-skew gain `kappa` (magnitude per unit
  // inventory), in `unit`.
  double kappa = 8;
  // `FEATURE_KIND_POSITION`: inventory-skew cap `s_max` (magnitude >= 0), in `unit`.
  double s_max = 9;
  // `FEATURE_KIND_PANIC_SKEW`: signed skew magnitude, in `unit` (positive ⇒ down).
  double skew = 10;
  // `FEATURE_KIND_PANIC_SKEW`: whether the overlay is armed; false ⇒ no-op.
  bool triggered = 11;
}

// An ordered outbound pricing pipeline (mirrors `celnet_tiering::FeaturePipeline`):
// the features a trader composed plus the price-space guardrails applied last. RAW is
// the implicit start (the consolidated LP composite), not a feature.
message FeaturePipelineDesc {
  // The ordered features (RAW → these → outbound), applied in list order.
  repeated FeatureSpecDesc features = 1;
  // The price-space guardrails applied last (anti-cross / min-spread floor). An absent
  // guardrails message decodes to all-zero bounds, which validation then rejects (a
  // bad pipeline fails loudly at the admin write, never silently at runtime).
  TieringGuardrailsDesc guardrails = 2;
}

// Execution pricing provenance (design §7): the per-feature price waterfall a
// grouped quote/execution/deal was constructed through, so downstream analytics can
// attribute the outbound price to each stage (realized markout = executed price vs
// `raw_mid`, decomposable per feature / group / mode). It is computed ONCE from the
// already-run feature pipeline (never re-derived) and copied verbatim from the
// `Quote` onto the booked `Execution`/`Deal` (booking replays the quoted price). A
// quote priced without a pricing group carries no provenance (the field is absent).
message PricingProvenance {
  // The pricing group that priced the line ("" when none — the book-default tier).
  string pricing_group_id = 1;
  // Which pipeline (ESP streaming vs RFS/RFQ) constructed the price.
  EspOrRfq mode = 2;
  // RAW stage — the consolidated LP composite two-way before any feature.
  double raw_bid = 3;
  // RAW stage mid (`0.5 * (raw_bid + raw_offer)`) — the markout reference price.
  double raw_mid = 4;
  // RAW stage offer.
  double raw_offer = 5;
  // After the MID SHIFT (desk construction) stage; equals RAW when the pipeline has
  // no MID SHIFT stage (the prior stage), so the waterfall is always well-formed.
  double constructed_bid = 6;
  // Constructed offer (after MID SHIFT; equals RAW when there is no MID SHIFT stage).
  double constructed_offer = 7;
  // After the TIERING (margin) stage; equals the constructed two-way when the
  // pipeline has no TIERING stage (the prior stage).
  double tiered_bid = 8;
  // Tiered offer (after TIERING; equals constructed when there is no TIERING stage).
  double tiered_offer = 9;
  // After the closing guardrail — what was sent to the client / FIX.
  double outbound_bid = 10;
  // Outbound offer (after the closing guardrail — what was sent to the client / FIX).
  double outbound_offer = 11;
  // The margin the TIERING stage(s) added: the summed change in half-spread
  // (price units).
  double applied_margin = 12;
  // The net skew the AXE / POSITION / PANIC-SKEW stages added: the summed signed
  // change in centre (price units).
  double applied_skew = 13;
  // The ordered feature kinds that ran (RAW → these → OUTBOUND).
  repeated FeatureKind features = 14;
}

// A persisted pricing group (mirrors the store `config::identity::PricingGroupDef`
// field for field).
message PricingGroupDesc {
  // Stable identifier (the store/API key), minted from `name` on create.
  string id = 1;
  // The trader's code name (unique across the store, case-insensitive).
  string name = 2;
  // Free-text operator description of what the group is for.
  string description = 3;
  // Inbound FIX sessions in this group, by connection id.
  repeated string member_connection_ids = 4;
  // GUI/API principals in this group, by user id.
  repeated string member_user_ids = 5;
  // Desk-level default membership, by desk id (the fallback tier).
  repeated string member_desks = 6;
  // The outbound ESP / streaming feature pipeline.
  FeaturePipelineDesc esp_pipeline = 7;
  // The outbound RFS/RFQ feature pipeline (ignored when `share_pipeline` is set).
  FeaturePipelineDesc rfq_pipeline = 8;
  // When true, the RFS/RFQ mode reuses `esp_pipeline` (one pipeline for both modes).
  bool share_pipeline = 9;
  // Whether the group is active (a disabled group never participates in resolution).
  bool enabled = 10;
  // How this group's outbound rates/bond FIX auto-quotes source their price.
  PricingSourceMode pricing_source_mode = 11;
  // The curve->composite blend weight `w in [0,1]` for
  // `PRICING_SOURCE_MODE_CURVE_ANCHORED_BOOK_SKEW` (ignored by other modes).
  optional double book_skew_weight = 12;
  // How this group treats the FAVORABLE side of a market-data (ESP) last-look.
  LastLookMode last_look_mode = 13;
  // The market-data last-look ADVERSE-move tolerance, in bps OF PRICE (relative, so it
  // scales across bond price points and OIS rates): a lift whose price has moved against
  // the dealer by more than this is rejected (superseded). Unset ⇒ the server default.
  optional double last_look_tolerance_bps = 14;
  // Only for `LAST_LOOK_MODE_ASYNC`: the % of the favorable slippage passed back to the
  // client (0..100). Unset ⇒ the server default.
  optional double async_giveback_pct = 15;
}

// The editable fields of a pricing group (the create/update payload). The
// server-minted `id` on `PricingGroupDesc` is not part of the spec except as a
// client-suggested slug on create (mirrors `AggregatedBookSpec.id`).
message PricingGroupSpec {
  // On create: a client-suggested id (a slug of `name` is used when empty). On
  // update: ignored in favour of the request's `id`.
  string id = 1;
  // The trader's code name (unique across the store, case-insensitive).
  string name = 2;
  // Free-text operator description.
  string description = 3;
  // Inbound FIX sessions in this group, by connection id (unique within the group).
  repeated string member_connection_ids = 4;
  // GUI/API principals in this group, by user id (each must resolve to a user).
  repeated string member_user_ids = 5;
  // Desk-level default membership, by desk id (each must resolve to a desk).
  repeated string member_desks = 6;
  // The outbound ESP / streaming feature pipeline.
  FeaturePipelineDesc esp_pipeline = 7;
  // The outbound RFS/RFQ feature pipeline (ignored when `share_pipeline` is set).
  FeaturePipelineDesc rfq_pipeline = 8;
  // When true, the RFS/RFQ mode reuses `esp_pipeline`.
  bool share_pipeline = 9;
  // Whether the group is active.
  bool enabled = 10;
  // How this group's outbound rates/bond FIX auto-quotes source their price (unset ⇒
  // the proto3 zero, composite-first-curve-fallback).
  PricingSourceMode pricing_source_mode = 11;
  // The curve->composite blend weight `w in [0,1]` for
  // `PRICING_SOURCE_MODE_CURVE_ANCHORED_BOOK_SKEW` (ignored by other modes).
  optional double book_skew_weight = 12;
  // How this group treats the FAVORABLE side of a market-data (ESP) last-look.
  LastLookMode last_look_mode = 13;
  // The market-data last-look ADVERSE-move tolerance, in bps OF PRICE (unset ⇒ default).
  optional double last_look_tolerance_bps = 14;
  // Only for `LAST_LOOK_MODE_ASYNC`: % of favorable slippage returned to the client,
  // 0..100 (unset ⇒ default).
  optional double async_giveback_pct = 15;
}

// List the pricing groups (any authenticated caller — a client's assigned pricing is
// admin-owned but the roster is readable for the GUI, so this is NOT admin-only).
message ListPricingGroupsRequest {
  // The caller's bearer token (must resolve to a valid session; not admin-gated).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full pricing-group roster.
message ListPricingGroupsResponse {
  // Every pricing group, in creation order.
  repeated PricingGroupDesc groups = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Define a new pricing group (admin only — manages the group STRUCTURE).
message CreatePricingGroupRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The editable fields of the group to define.
  PricingGroupSpec spec = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created pricing group.
message CreatePricingGroupResponse {
  // The created group with its server-minted id.
  PricingGroupDesc group = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing pricing group's definition (admin only). The `id` is immutable
// identity; the spec's own `id` field is ignored.
message UpdatePricingGroupRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the group to replace (immutable identity).
  string id = 2;
  // The new definition.
  PricingGroupSpec spec = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The updated pricing group.
message UpdatePricingGroupResponse {
  // The group after the update.
  PricingGroupDesc group = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a pricing group (admin only).
message DeletePricingGroupRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the group to delete.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeletePricingGroupResponse {
  // Whether a group was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Retune ONLY a pricing group's outbound pipeline for one mode (the ESP or the RFS/RFQ
// feature pipeline) + the `share_pipeline` flag, leaving the group's STRUCTURE —
// id, name, members, enabled flag, and the OTHER mode's pipeline — untouched. Unlike
// the whole-group create/update/delete (admin only), this is callable by any
// authenticated caller holding the fixed-income quote-respond capability: the trader
// owns the outbound pricing; the admin still owns what the group IS and who is in it.
message UpdatePricingGroupPipelineRequest {
  // The caller's bearer token (must resolve to a valid session holding the
  // fixed-income quote-respond capability; NOT admin-gated).
  string session_token = 1;
  // The id of the group whose pipeline to retune (immutable identity — the group's
  // structure and membership are not touched).
  string group_id = 2;
  // Which mode's pipeline the `pipeline` payload replaces (ESP or RFS/RFQ).
  EspOrRfq mode = 3;
  // The new feature pipeline for the selected `mode`.
  FeaturePipelineDesc pipeline = 4;
  // The group's `share_pipeline` flag after the retune (true ⇒ RFS/RFQ reuses ESP).
  bool share_pipeline = 5;
  // Echoed request correlation id.
  optional uint64 correlation_id = 6;
}
// The group after its pipeline was retuned (structure and membership unchanged).
message UpdatePricingGroupPipelineResponse {
  // The updated group (only the selected mode's pipeline + share flag changed).
  PricingGroupDesc group = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// Risk routing & risk books (`docs/FI-RISK-ROUTING-REQUIREMENTS.md` §7, §8.4).
// When an order/RFQ is accepted and filled, the resulting RISK is routed into a
// trader-defined **risk book** (portfolio) so limits/greeks/PnL are managed per
// book. A single firm-wide **decision graph** routes each fill to a book by id.
// This block mirrors the pricing-group CRUD shape: a hierarchical `RiskBookDesc`
// registry (admin STRUCTURE) plus a `RiskRoutingGraphDesc` decision graph (an
// admin risk-management function). Every message mirrors the store types
// (`config::identity::{RiskBookDef, RiskLimits}` and `celnet_risk_routing::{
// RiskRoutingGraph, RoutingNode, RouteField, RouteOp, RouteValue}`) field-for-field.
// A graph node is a proto `oneof` (a condition test OR a terminal book leaf); a
// condition's right-hand value is itself a `oneof` (num / text / string list /
// numeric range) — the two nested oneofs are the only structural novelty over the
// flat pricing-group messages.
// ===========================================================================

// Which trade field a routing condition matches (mirrors
// `celnet_risk_routing::RouteField`, same ordinal order). Names are prefixed
// (proto enum values share the file scope) — the pricing-group `FeatureKind`
// convention.
enum RouteFieldEnum {
  // Instrument identifier / symbol (a String field).
  ROUTE_FIELD_INSTRUMENT_ID = 0;
  // Currency or pair (an Enum field).
  ROUTE_FIELD_CCY = 1;
  // Product family — vanilla / swap / bond / … (an Enum field).
  ROUTE_FIELD_PRODUCT = 2;
  // Trade side — Buy / Sell (an Enum field).
  ROUTE_FIELD_SIDE = 3;
  // Absolute base notional of the fill (a Numeric field).
  ROUTE_FIELD_NOTIONAL = 4;
  // Tenor / expiry in years (a Numeric field).
  ROUTE_FIELD_TENOR = 5;
  // Strike / resolved level (a Numeric field).
  ROUTE_FIELD_STRIKE = 6;
  // Counterparty / originating FIX session (an Enum field).
  ROUTE_FIELD_COUNTERPARTY = 7;
  // Booking user (an Enum field).
  ROUTE_FIELD_USER = 8;
  // Owning desk (an Enum field).
  ROUTE_FIELD_DESK = 9;
  // Fill price / premium (a Numeric field).
  ROUTE_FIELD_PRICE = 10;
}

// A comparison operator in a routing condition (mirrors
// `celnet_risk_routing::RouteOp`, same ordinal order). Which ops are valid for a
// field is pinned by the field's kind (server-validated), so a malformed rule
// (`side > 5`) is rejected on write.
enum RouteOpEnum {
  // Equal (proto3 zero default).
  ROUTE_OP_EQ = 0;
  // Not equal.
  ROUTE_OP_NE = 1;
  // Strictly greater than (numeric only).
  ROUTE_OP_GT = 2;
  // Greater than or equal (numeric only).
  ROUTE_OP_GE = 3;
  // Strictly less than (numeric only).
  ROUTE_OP_LT = 4;
  // Less than or equal (numeric only).
  ROUTE_OP_LE = 5;
  // Substring containment (string only).
  ROUTE_OP_CONTAINS = 6;
  // Membership in a `StringList` value.
  ROUTE_OP_IN = 7;
  // Inclusive range `lo <= x <= hi` (numeric only), against a `RouteRange` value.
  ROUTE_OP_BETWEEN = 8;
}

// A set of string literals, for a `ROUTE_OP_IN` condition value.
message StringList {
  // The membership set (order-preserving; matched by equality).
  repeated string values = 1;
}

// An inclusive numeric range `[lo, hi]`, for a `ROUTE_OP_BETWEEN` condition value.
message RouteRange {
  // Lower bound (inclusive).
  double lo = 1;
  // Upper bound (inclusive).
  double hi = 2;
}

// A literal on the right-hand side of a routing condition (mirrors
// `celnet_risk_routing::RouteValue`). Exactly one arm is live; which arm is legal
// is constrained by the operator (server-validated on write).
message RouteValueDesc {
  // The literal value: exactly one arm is set (which arm is legal is operator-constrained).
  oneof v {
    // A numeric literal (equality / ordering ops).
    double num = 1;
    // A text / enum literal (equality, `CONTAINS`).
    string text = 2;
    // A membership set (`ROUTE_OP_IN`).
    StringList list = 3;
    // An inclusive numeric range (`ROUTE_OP_BETWEEN`).
    RouteRange range = 4;
  }
}

// A decision node: evaluate `field op value` on the fill; on `true` follow
// `on_true`, else `on_false` (mirrors `RoutingNode::Condition`).
message RouteConditionDesc {
  // The field to test.
  RouteFieldEnum field = 1;
  // The comparison operator.
  RouteOpEnum op = 2;
  // The literal compared against.
  RouteValueDesc value = 3;
  // Successor node id when the condition holds.
  uint32 on_true = 4;
  // Successor node id when the condition does not hold.
  uint32 on_false = 5;
}

// One node in a `RiskRoutingGraphDesc`, keyed by its `id` (mirrors
// `RoutingNode`). The `node` oneof is either an internal condition test or a
// terminal `Book` leaf carrying just its target risk-book id.
message RoutingNodeDesc {
  // The node id, unique within the graph (the store keys the node map by it).
  uint32 id = 1;
  // The node body: exactly one arm is set — an internal condition or a terminal book leaf.
  oneof node {
    // An internal decision node.
    RouteConditionDesc condition = 2;
    // A terminal leaf: the fill's risk routes to this risk book (the `Book` arm's
    // `risk_book_id`).
    string book_risk_book_id = 3;
  }
}

// The firm-wide routing decision graph (mirrors `celnet_risk_routing::RiskRoutingGraph`:
// a `BTreeMap<NodeId, RoutingNode>` flattened to a `RoutingNodeDesc` list carrying
// each node's id, entered at `entry`). Well-formedness (acyclic, every path
// terminates at a known enabled book, type-consistent conditions) is validated
// server-side on write.
message RiskRoutingGraphDesc {
  // The node at which every fill's walk begins.
  uint32 entry = 1;
  // All nodes (id-carrying); the store rebuilds the id→node map from them.
  repeated RoutingNodeDesc nodes = 2;
}

// Per-book pre-trade limits (mirrors `config::identity::RiskLimits`). Every present
// cap is finite and non-negative (validated); an absent cap is uncapped.
message RiskLimitsDesc {
  // Cap on the book's net (signed-then-absolute) base-currency notional.
  optional double max_net_notional = 1;
  // Cap on the book's gross (sum-of-absolute) base-currency notional.
  optional double max_gross_notional = 2;
  // Cap on the book's net DV01 magnitude (PV change per +1bp parallel bump).
  optional double max_dv01 = 3;
}

// A persisted risk book (mirrors `config::identity::RiskBookDef` field-for-field).
// Books form a tree via `parent_id`; a top-level book tags an owning `desk_id`.
message RiskBookDesc {
  // Stable identifier (the store/API key), minted from `name` on create.
  string id = 1;
  // Human-friendly book label (unique across the store, case-insensitive).
  string name = 2;
  // The parent book by id, or absent for a top-level book (a tree edge).
  optional string parent_id = 3;
  // The owning desk by id, or absent (unowned). Must resolve to a desk when present.
  optional string desk_id = 4;
  // Free-text operator description of what the book is for.
  string description = 5;
  // Optional per-book pre-trade limits (absent ⇒ the book carries no caps yet).
  optional RiskLimitsDesc limits = 6;
  // Whether the book is active. Only enabled books are valid routing targets.
  bool enabled = 7;
  // The asset class whose risk this portfolio holds ("fx_options" / "fixed_income").
  // A portfolio buckets ONE franchise: vega and DV01 are not commensurable, so a tree
  // holds a single class and a sub-book must match its parent. This is what lets the
  // risk surface be firm-wide while still splitting the tree per franchise.
  string asset_class = 8;
}

// The editable fields of a risk book (the create/update payload). The server-minted
// `id` on `RiskBookDesc` is not part of the spec except as a client-suggested slug
// on create (mirrors `AggregatedBookSpec.id` / `PricingGroupSpec.id`).
message RiskBookSpec {
  // On create: a client-suggested id (a slug of `name` is used when empty). On
  // update: ignored in favour of the request's `id`.
  string id = 1;
  // Human-friendly book label (unique across the store, case-insensitive).
  string name = 2;
  // The parent book by id, or absent for a top-level book.
  optional string parent_id = 3;
  // The owning desk by id, or absent.
  optional string desk_id = 4;
  // Free-text operator description.
  string description = 5;
  // Optional per-book pre-trade limits.
  optional RiskLimitsDesc limits = 6;
  // Whether the book is active.
  bool enabled = 7;
  // The asset class whose risk this portfolio holds ("fx_options" / "fixed_income").
  // Rejected by the store when it is not a known class, so an omitted value fails
  // loud rather than silently landing the book in a default franchise.
  string asset_class = 8;
}

// List the risk books (admin only — risk-routing config is an admin risk-management
// function; a finer `risk_manage·fixed_income` capability is a later refinement).
message ListRiskBooksRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full risk-book roster.
message ListRiskBooksResponse {
  // Every risk book, in creation order.
  repeated RiskBookDesc books = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Define a new risk book (admin only).
message CreateRiskBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The editable fields of the book to define.
  RiskBookSpec spec = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created risk book.
message CreateRiskBookResponse {
  // The created book with its server-minted id.
  RiskBookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing risk book's definition (admin only). The `id` is immutable
// identity; the spec's own `id` field is ignored.
message UpdateRiskBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the book to replace (immutable identity).
  string id = 2;
  // The new definition.
  RiskBookSpec spec = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The updated risk book.
message UpdateRiskBookResponse {
  // The book after the update.
  RiskBookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a risk book (admin only). Refused when the routing graph still targets it.
message DeleteRiskBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the book to delete.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteRiskBookResponse {
  // Whether a book was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Read the firm-wide routing graph (admin only). The graph is absent until an
// operator first defines one.
message GetRiskRoutingGraphRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The current routing graph, or absent when none is defined yet.
message GetRiskRoutingGraphResponse {
  // The firm-wide routing graph (absent ⇒ no graph defined).
  optional RiskRoutingGraphDesc graph = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace the firm-wide routing graph (admin only). The graph is validated against
// the current risk-book registry before it is committed.
message UpdateRiskRoutingGraphRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The new routing graph.
  RiskRoutingGraphDesc graph = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The routing graph after the update.
message UpdateRiskRoutingGraphResponse {
  // The committed routing graph.
  RiskRoutingGraphDesc graph = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// auto-hedging / risk-internalisation (Phase B — the wire mirror of the
// `celnet-hedge-routing` pure crate + the server auto-hedge engine).
// `docs/AUTO-HEDGING-AND-INTERNALISATION-REQUIREMENTS.md`. A hedge policy is a
// decision graph of the SAME shape as `RiskRoutingGraphDesc`, but its leaves are
// EXIT ACTIONS (`ExitActionDesc`) instead of book targets; conditions reuse
// `RouteOpEnum` + `RouteValueDesc` verbatim (asset-agnostic). The warehouse
// threshold (`WarehouseThresholdDesc`) is the soft, banded "100". `HedgeProvenance`
// mirrors `RiskTransferProvenance` (the immutable "why it fired" record);
// `HedgeIntent` is the advisory shadow-run projection. Every message mirrors the
// domain types field-for-field (same ordinal order for enums).
// ===========================================================================

// Which risk-state field a hedge condition matches (mirrors
// `celnet_hedge_routing::HedgeField`, same ordinal order). Prefixed per the
// file-scope enum convention.
enum HedgeFieldEnum {
  // Instrument identifier / symbol (a String field).
  HEDGE_FIELD_INSTRUMENT_ID = 0;
  // Currency or pair (an Enum field).
  HEDGE_FIELD_CCY = 1;
  // Product family — vanilla / swap / bond / … (an Enum field).
  HEDGE_FIELD_PRODUCT = 2;
  // Owning risk book / portfolio (an Enum field).
  HEDGE_FIELD_BOOK = 3;
  // Owning desk (an Enum field).
  HEDGE_FIELD_DESK = 4;
  // Signed net DV01 of the book (Numeric, FI budget metric).
  HEDGE_FIELD_NET_DV01 = 5;
  // Signed net notional / base-currency delta (Numeric, FX budget metric).
  HEDGE_FIELD_NET_NOTIONAL = 6;
  // Signed net vega (Numeric).
  HEDGE_FIELD_NET_VEGA = 7;
  // Signed net gamma (Numeric).
  HEDGE_FIELD_NET_GAMMA = 8;
  // Inventory sign +1/−1 (Numeric).
  HEDGE_FIELD_INVENTORY_SIGN = 9;
  // The resolved warehouse threshold — the "100" for this scope (Numeric).
  HEDGE_FIELD_THRESHOLD = 10;
  // `|net_risk| / threshold` — the RAG utilisation ratio (Numeric).
  HEDGE_FIELD_UTILIZATION = 11;
  // `max(0, |net_risk| − target)` — overflow beyond the band edge (Numeric).
  HEDGE_FIELD_OVERFLOW = 12;
  // Whether the risk is at/over the red band (an Enum field: "true"/"false").
  HEDGE_FIELD_BREACHED = 13;
  // Markout / residual toxicity of the flow that built this inventory (Numeric).
  HEDGE_FIELD_COUNTERPARTY_TOXICITY = 14;
  // How long this risk has sat, in seconds (Numeric).
  HEDGE_FIELD_INVENTORY_AGE_SECS = 15;
  // Opposing internal flow the aggregator could cross now (Numeric).
  HEDGE_FIELD_INTERNAL_OFFSET_AVAILABLE = 16;
  // Current external hedge-cost estimate — spread + impact, in bp (Numeric).
  HEDGE_FIELD_HEDGE_COST_BP = 17;
  // Originating counterparty of the fill being hedged — party id / name (String;
  // eq/ne/in/contains). A property of the incoming flow, not a net position.
  HEDGE_FIELD_COUNTERPARTY = 18;
}

// The execution schedule of an external hedge (mirrors
// `celnet_hedge_routing::ExecStyle`). `IMMEDIATE` = one clip / back-to-back;
// `WORKED` = an Almgren–Chriss-scheduled slice series.
enum ExecStyleEnum {
  // One clip, now (back-to-back).
  EXEC_STYLE_IMMEDIATE = 0;
  // An Almgren–Chriss-scheduled series of slices.
  EXEC_STYLE_WORKED = 1;
}

// The budget metric a warehouse threshold caps (maps to `celnet_limits::LimitMetric`).
enum HedgeMetricEnum {
  // Net DV01 (FI first-order rate risk).
  HEDGE_METRIC_DV01 = 0;
  // Net base-currency notional.
  HEDGE_METRIC_NET_NOTIONAL = 1;
  // Net base-currency delta.
  HEDGE_METRIC_NET_DELTA = 2;
  // Net vega.
  HEDGE_METRIC_NET_VEGA = 3;
  // GROSS base-currency notional — the sum of |notional| over the scope, which
  // never nets down. A turnover brake rather than a risk budget: unlike the net
  // metrics it only grows with activity, so a gross cap stays breached until the
  // positions themselves roll off.
  HEDGE_METRIC_GROSS_NOTIONAL = 4;
}

// The scope a warehouse threshold binds to (most-specific-wins resolution,
// instrument > book > desk).
enum HedgeScopeKindEnum {
  // A whole desk's aggregate risk.
  HEDGE_SCOPE_DESK = 0;
  // A single risk book / portfolio.
  HEDGE_SCOPE_BOOK = 1;
  // A single instrument.
  HEDGE_SCOPE_INSTRUMENT = 2;
}

// How much of a position an exit action targets (mirrors
// `celnet_hedge_routing::HedgeSize`).
enum HedgeSizeKind {
  // Hedge the overflow beyond the band edge (default).
  HEDGE_SIZE_OVERFLOW = 0;
  // Flatten the whole net position.
  HEDGE_SIZE_FULL = 1;
  // An explicit magnitude (carried in `fixed`).
  HEDGE_SIZE_FIXED = 2;
}

// A sizing choice: a `kind` plus, for `HEDGE_SIZE_FIXED`, the explicit magnitude.
message HedgeSizeDesc {
  // The sizing rule.
  HedgeSizeKind kind = 1;
  // The explicit magnitude (only read when `kind == HEDGE_SIZE_FIXED`).
  double fixed = 2;
}

// The exit-action vocabulary (mirrors `celnet_hedge_routing::ExitAction`), carried
// FLAT as a `kind` discriminant + the union of every arm's fields (only the fields
// relevant to `kind` are read by the domain converter). A flat form — not a
// oneof-of-messages — keeps the wire codec small while remaining lossless.
message ExitActionDesc {
  // Which exit action this leaf fires.
  ExitActionKind kind = 1;
  // CROSS_INTERNAL: the aggregation instrument to cross against (must exist).
  string instrument = 2;
  // CROSS_INTERNAL / SUBMIT_MARKET_ORDER / RFQ_OUT: how much to shed.
  HedgeSizeDesc size = 3;
  // SKEW: an explicit skew in bp, or absent to lean to the band edge (`to_edge`).
  optional double skew_bp = 4;
  // SKEW: whether to size the lean off the band-edge overflow rather than `skew_bp`.
  bool to_edge = 5;
  // SUBMIT_MARKET_ORDER / SPLIT: the execution schedule for the externalised leg.
  ExecStyleEnum style = 6;
  // RFQ_OUT: the LPs to fan the request to (each must be a known, enabled LP).
  repeated string lps = 7;
  // SPLIT: net internally first (vs. externalise first).
  bool internal_first = 8;
  // ESCALATE: the rationale surfaced on the notification.
  string reason = 9;
  // WITH WHAT this leaf hedges (mirrors `celnet_hedge_routing::HedgeVehicle`, which
  // lives on the graph NODE rather than inside the action enum so it applies uniformly
  // to every size-bearing action, `ClearRisk` included). `SELF` (the proto default) is
  // the same security sold back — DV01 ratio identically 1, the historical behaviour.
  HedgeVehicleKindEnum vehicle_kind = 10;
  // The hedge instrument this leaf names, for `INSTRUMENT` / `FUTURE`. Empty for
  // `SELF` (the position's own security) and `BENCHMARK` (resolved from the firm's
  // vehicle registry by instrument + maturity bucket at fire time).
  string vehicle_instrument = 11;
}

// WITH WHAT a size-bearing exit action hedges (mirrors
// `celnet_hedge_routing::HedgeVehicle`). A corporate bond is not hedged with itself —
// it is hedged with a benchmark at matching maturity, in practice a government-bond
// future. `SELF` is the proto-default so a policy authored before vehicles existed is
// unchanged.
enum HedgeVehicleKindEnum {
  // The same security sold back. DV01 ratio identically 1; needs no registry entry.
  HEDGE_VEHICLE_SELF = 0;
  // Whatever the firm's hedge-vehicle registry maps this risk to, resolved by
  // instrument + maturity bucket (a 9y corp → the 10Y future).
  HEDGE_VEHICLE_BENCHMARK = 1;
  // An explicitly named instrument (must be registered so its DV01/unit is known).
  HEDGE_VEHICLE_INSTRUMENT = 2;
  // An explicitly named futures contract; sizing rounds to whole lots.
  HEDGE_VEHICLE_FUTURE = 3;
}

// Whether a resolved exit fires by itself or waits for a trader (mirrors
// `celnet_hedge_routing::HedgeExitMode`). Deliberately NOT a confirmation dialog:
// `SUGGEST` publishes a STANDING suggestion onto the risk surface that survives being
// ignored, where a modal would interrupt and then vanish.
enum HedgeExitModeEnum {
  // Fire on breach with no interaction — the historical behaviour, and the default.
  HEDGE_EXIT_MODE_AUTO = 0;
  // Compute everything, trade nothing; publish a standing suggestion a trader fires.
  HEDGE_EXIT_MODE_SUGGEST = 1;
}

// HOW a scope manages risk — the trader-facing posture (mirrors
// `celnet_hedge_routing::HedgingModel`). This is a CONTROL that RESOLVES TO the
// existing exit-policy primitives, not a second engine: back-to-back is a catch-all
// `SUBMIT_MARKET_ORDER { size: FULL }` leaf and internalisation is the two-node
// warehouse-vs-overflow graph, both built from the same node/action vocabulary a
// trader would otherwise hand-author. `CUSTOM` is the default and the escape hatch.
enum HedgingModelEnum {
  // The scope's own authored exit-policy graph governs — the default, and exactly
  // the historical behaviour. An unbound scope, and an unknown ordinal, mean this.
  HEDGING_MODEL_CUSTOM = 0;
  // Back-to-back: hedge every fill straight out; warehouse nothing.
  HEDGING_MODEL_BACK_TO_BACK = 1;
  // Warehouse client flow against a DV01 budget; shed only the band-edge overflow.
  HEDGING_MODEL_INTERNALISE_TO_DV01 = 2;
}

// One row of the firm's hedge-vehicle registry: "risk matching this shape hedges into
// THAT instrument, whose DV01 per unit is THIS" (mirrors
// `celnet_hedge_routing::HedgeVehicleRule`). Resolution is most-specific-wins
// (instrument > product > ccy), tie-broken by the narrowest maturity bucket.
message HedgeVehicleDesc {
  // Stable row id (the CRUD key and the final tie-break).
  string id = 1;
  // Match on the risk cell's executable security id, exactly. Empty ⇒ matches any.
  string instrument_id = 2;
  // Match on the product family ("BOND"/"OIS"/…). Empty ⇒ matches any.
  string product = 3;
  // Match on the currency. Empty ⇒ matches any.
  string ccy = 4;
  // The maturity bucket's inclusive lower bound, in years.
  double min_maturity_years = 5;
  // The maturity bucket's exclusive upper bound, in years. `min=7,max=12` is the
  // "10Y bucket" that catches a 9-year corporate bond.
  double max_maturity_years = 6;
  // The instrument this risk hedges into — the id the LP panel is asked for.
  string hedge_instrument_id = 7;
  // Whether that instrument is a futures contract (⇒ whole-lot rounding).
  bool is_future = 8;
  // The DV01 of ONE unit of the hedge instrument (one futures contract / one quoted
  // unit of a benchmark). Strictly positive — a hedge is never sized against a guess.
  double dv01_per_unit = 9;
  // The unit's human label ("contract", "1mm face").
  string unit_label = 10;
}

// One scoped exit-mode binding: whether exits in this scope fire automatically or
// publish a standing suggestion. Resolved most-specific-wins (instrument > book > desk),
// exactly like the hedging LP panels; an unbound scope is AUTO.
message HedgeExitModeBinding {
  // What the scope_id names (desk / book / instrument).
  HedgeScopeKindEnum scope_kind = 1;
  // The scope identifier.
  string scope_id = 2;
  // The mode for that scope.
  HedgeExitModeEnum mode = 3;
}

// One scoped HEDGING-MODEL binding: how this desk / book / instrument manages risk.
// Resolved most-specific-wins (instrument > book > desk), exactly like the hedging LP
// panels and the exit modes; an unbound scope is CUSTOM (the authored graph governs).
message HedgingModelBinding {
  // What the scope_id names (desk / book / instrument).
  HedgeScopeKindEnum scope_kind = 1;
  // The scope identifier.
  string scope_id = 2;
  // The posture for that scope.
  HedgingModelEnum model = 3;
  // The DV01 warehouse budget — the "100" this scope warehouses up to. Read ONLY
  // under INTERNALISE_TO_DV01 (back-to-back warehouses nothing; CUSTOM takes its
  // budget from the configured warehouse threshold). A non-positive value means
  // INHERIT the scope's configured threshold, so a model never invents a cap. When
  // positive it overrides only the cap + metric; amber / red / target / clips / ramp
  // still come from the resolved threshold.
  double dv01_budget = 4;
}

// The kind of exit action (mirrors `celnet_hedge_routing::ExitAction`'s variants).
enum ExitActionKind {
  // Hold — do nothing, keep the risk (the green-band leaf).
  EXIT_ACTION_WAREHOUSE = 0;
  // Offset against opposing internal flow in the Agg Book (internal cross @ mid).
  EXIT_ACTION_CROSS_INTERNAL = 1;
  // Lean the two-way to attract the offsetting side (passive internalisation).
  EXIT_ACTION_SKEW = 2;
  // Back-to-back: place an offsetting external order onto the RFQ/FIX panel.
  EXIT_ACTION_SUBMIT_MARKET_ORDER = 3;
  // Request a two-way from named external LPs and lift the best.
  EXIT_ACTION_RFQ_OUT = 4;
  // Net internally then externalise the residual.
  EXIT_ACTION_SPLIT = 5;
  // Fire an alert / route to a human desk instead of auto-acting.
  EXIT_ACTION_ESCALATE = 6;
  // Flatten the book's net to zero — a full-size external market order for the
  // whole residual (the most aggressive external exit; is_external() true).
  EXIT_ACTION_CLEAR_RISK = 7;
}

// How a live hedge decision is executed once the policy resolves an EXTERNAL exit
// action — the "Both — config per policy" control (mirrors
// `crate::config::hedge_policy::HedgeExecutionMode`, same ordinal order). Replaces
// the former boolean `advisory_only`. Consulted only for external actions.
enum HedgeExecutionModeEnum {
  // Shadow-run: compute + stamp the intent/provenance but never trade.
  HEDGE_EXEC_ADVISORY = 0;
  // Externalise onto the LP-sim RFQ/FIX panel; an unfilled clip is an honest miss.
  HEDGE_EXEC_LP_PANEL = 1;
  // Externalise against the Agg Book COMPOSITE mid (spread applied); always fills.
  HEDGE_EXEC_COMPOSITE = 2;
  // Try the LP panel first; on no fill, fall back to the composite venue (the live default).
  HEDGE_EXEC_LP_PANEL_THEN_COMPOSITE = 3;
}

// WHEN a live external hedge runs relative to the fill that triggered it.
//
// Distinct from `HedgeExecutionModeEnum`, which says WHERE it executes. This says
// whether the client's booking commit waits for it.
enum HedgeDispatchEnum {
  // Run the external hedge INSIDE the booking commit, and wait for the venue's answer
  // before the fill is acknowledged. The offsetting leg and the provenance record are
  // both in place the instant the fill returns, at the cost of putting a venue round
  // trip on the client's critical path.
  HEDGE_DISPATCH_SYNC = 0;
  // Book the fill first and run the external hedge immediately after, off the booking
  // path. The client is acknowledged without waiting for our own risk management to
  // round-trip a venue; the offsetting leg and provenance land a moment later.
  HEDGE_DISPATCH_ASYNC = 1;
}

// What a hedge POLICY GRAPH binds to — the scope of an exit-policy decision graph
// (mirrors `crate::config::hedge_policy::HedgePolicyScope`). A fill in book B is
// governed by the most-specific applicable policy: B's own BOOK policy, else the
// nearest ancestor BUCKET policy (a subtree ROOT id), else the FIRM default.
enum HedgePolicyScopeKindEnum {
  // The firm-wide default policy (the singleton fallback; `scope_id` empty).
  HEDGE_POLICY_SCOPE_FIRM = 0;
  // A single risk book / portfolio (matches exactly that book; `scope_id` = book id).
  HEDGE_POLICY_SCOPE_BOOK = 1;
  // A risk-book subtree ROOT id (matches that book + every descendant; `scope_id` = root id).
  HEDGE_POLICY_SCOPE_BUCKET = 2;
}

// A decision node: evaluate `field op value` on the risk state (mirrors
// `HedgeNode::Condition`; reuses `RouteOpEnum` + `RouteValueDesc` verbatim).
message HedgeConditionDesc {
  // The risk-state field to test.
  HedgeFieldEnum field = 1;
  // The comparison operator.
  RouteOpEnum op = 2;
  // The literal compared against.
  RouteValueDesc value = 3;
  // Successor node id when the condition holds.
  uint32 on_true = 4;
  // Successor node id when the condition does not hold.
  uint32 on_false = 5;
}

// One node in a `HedgeGraphDesc`, keyed by its `id` (mirrors `HedgeNode`). The
// `node` oneof is either an internal condition test or a terminal exit-action leaf.
message HedgeNodeDesc {
  // The node id, unique within the graph.
  uint32 id = 1;
  // The node body: exactly one arm is set — a condition or a terminal exit action.
  oneof node {
    // An internal decision node.
    HedgeConditionDesc condition = 2;
    // A terminal leaf: the risk state resolves to this exit action.
    ExitActionDesc action = 3;
  }
}

// The firm-wide hedge-policy decision graph (mirrors `celnet_hedge_routing::HedgeGraph`:
// a `BTreeMap<NodeId, HedgeNode>` flattened to an id-carrying node list, entered at
// `entry`). Validated server-side on write against the aggregation instruments + LP ids.
message HedgeGraphDesc {
  // The node at which every evaluation's walk begins.
  uint32 entry = 1;
  // All nodes (id-carrying); the store rebuilds the id→node map from them.
  repeated HedgeNodeDesc nodes = 2;
}

// A soft, banded warehouse threshold for one scope (mirrors
// `celnet_hedge_routing::WarehouseThreshold` + its scope binding). The "100".
message WarehouseThresholdDesc {
  // What the scope_id names (desk / book / instrument).
  HedgeScopeKindEnum scope_kind = 1;
  // The scope identifier (a desk id / book id / instrument id).
  string scope_id = 2;
  // The budget metric.
  HedgeMetricEnum metric = 3;
  // The budget magnitude — the "100", in the metric's native units.
  double cap = 4;
  // Amber utilisation fraction (start skewing) in [0, red].
  double amber = 5;
  // Red utilisation fraction (start hedging the overflow) in [amber, 1].
  double red = 6;
  // Band-edge target as a fraction of cap (default = amber): hedge the overflow to here.
  double target_fraction = 7;
  // Minimum hedge clip (fixed-cost / minimum-ticket floor).
  double min_clip = 8;
  // Maximum single hedge clip; a larger overflow is worked.
  double max_clip = 9;
  // Whether to ramp the hedged fraction with utilisation (soft externalisation).
  bool ramped = 10;
  // The ramp gain k in `hedge_fraction = clamp(k·(utilization − 1), 0, 1)`.
  double ramp_k = 11;
}

// The immutable audit record stamped on every fired hedge (mirrors
// `RiskTransferProvenance` discipline). Structured, additive; surfaced on the blotter
// and risk dashboard: "why did the system hedge EURUSD at 14:32, at what price, on
// whose policy?"
message HedgeProvenance {
  // Stable hedge id (audit key).
  string hedge_id = 1;
  // The book whose risk fired the hedge.
  string book = 2;
  // The instrument hedged.
  string instrument = 3;
  // When it fired (epoch nanos, UTC).
  int64 fired_at = 4;
  // The budget metric that tripped.
  HedgeMetricEnum metric = 5;
  // The resolved threshold ("100").
  double threshold = 6;
  // The signed net risk at fire.
  double net_risk = 7;
  // `|net_risk| / threshold`.
  double utilization = 8;
  // The RAG band label at fire ("green"/"amber"/"red"/"breach").
  string band = 9;
  // The exact graph path walked (the "why this action").
  repeated uint32 policy_path = 10;
  // The exit action fired.
  ExitActionDesc action = 11;
  // Crossed against opposing internal flow (the Agg Book).
  double internal_crossed = 12;
  // Externalised onto the RFQ/FIX panel.
  double external_hedged = 13;
  // The unshed residual (warehoused / escalated).
  double residual = 14;
  // The realised hedge price (0 for a no-trade action).
  double hedge_price = 15;
  // The consolidated mid at fire.
  double mid_at_fire = 16;
  // Realised slippage in bp versus the mid.
  double slippage_bp = 17;
  // The winning external LP (absent for internal / no-trade).
  optional string lp_won = 18;
  // Whether this was an ADVISORY (dry-run) fire — computed but not traded.
  bool advisory = 19;
  // The effective LP set the hedge TARGETED — the resolved include/exclude panel (or,
  // when no scope panel is set, the per-rule RFQ include list / the full known panel).
  // Empty for internal / no-trade actions. Answers "which LPs did we hedge on?".
  repeated string lps = 20;
  // The parent booked position id this hedge offsets — the reconciliation key to the
  // originating `Deal` (which carries the same `position_id`). Present on a per-fill
  // execution record emitted when a fill was classified B2B / shed externally; absent on
  // the book-level advisory-intent records the policy engine stamps on a threshold breach
  // (those are keyed by book, not a single fill). Presence-tracked.
  optional uint64 parent_position_id = 21;
  // The VEHICLE hedge this fire was sized as, when the policy leaf chose to hedge with
  // something other than the position's own security (a benchmark / a future). Carries
  // the DV01 ratio, the whole-contract rounding and the honest residual. Absent for a
  // self-hedge, whose ratio is identically 1 and needs no plan.
  optional HedgeVehiclePlanDesc vehicle_plan = 22;
}

// How a VEHICLE hedge was sized: the DV01 ratio, what it rounds to, and what is
// honestly left over (mirrors `celnet_hedge_routing::HedgeRatioPlan`).
//
// `units = position_DV01 / hedge_instrument_DV01_per_unit`, rounded to whole contracts
// for a future — you cannot trade 318.47 lots — with the rounding residual REPORTED
// rather than hidden. (Kept inline rather than indented: an indented block in a proto
// comment becomes a rustdoc CODE BLOCK on the generated struct, which rustdoc then tries
// to compile as a doctest.)
message HedgeVehiclePlanDesc {
  // The instrument actually traded.
  string hedge_instrument_id = 1;
  // The unit's human label ("contract", "1mm face").
  string unit_label = 2;
  // Whether the vehicle trades in whole lots (a future).
  bool whole_units = 3;
  // Which measure `target_dv01` was computed on: "analytic" (a genuine closed-form
  // yield derivative), "annuity-pv01" (an undiscounted swap annuity), or
  // "exposure-proxy" (the firm's duration-BLIND pre-trade proxy).
  string dv01_basis = 4;
  // Whether a ratio on that basis is duration-correct. FALSE for "exposure-proxy",
  // whose bond arm treats every bond as duration 1 — such a size must be surfaced as
  // approximate, never presented as exact.
  bool duration_correct = 5;
  // The DV01 the desk wants to remove (non-negative; the direction is the position's).
  double target_dv01 = 6;
  // The DV01 of one unit of the vehicle.
  double dv01_per_unit = 7;
  // The unrounded ratio `target_dv01 / dv01_per_unit`.
  double exact_units = 8;
  // The tradeable quantity — `exact_units` rounded to the nearest whole lot when
  // `whole_units`. Zero when the target is below half a contract (an honest "too small
  // to hedge with this vehicle", never a fabricated part lot).
  double units = 9;
  // The DV01 actually removed: `units × dv01_per_unit`.
  double hedged_dv01 = 10;
  // `target_dv01 − hedged_dv01`. POSITIVE ⇒ under-hedged (rounded down, risk remains);
  // NEGATIVE ⇒ over-hedged (rounded up). Never suppressed.
  double residual_dv01 = 11;
  // A one-line trader-facing rendering of the above.
  string summary = 12;
}

// The advisory shadow-run projection of one hedge decision — what the engine WOULD
// do (or did) for a (book × instrument) risk state on a `risk_version` bump. The
// live-streamable summary that precedes/accompanies the immutable `HedgeProvenance`.
message HedgeIntent {
  // The book whose risk moved.
  string book = 1;
  // The instrument.
  string instrument = 2;
  // The resolved exit action.
  ExitActionDesc action = 3;
  // The RAG band label ("green"/"amber"/"red"/"breach").
  string band = 4;
  // The signed net risk.
  double net_risk = 5;
  // The resolved threshold.
  double threshold = 6;
  // `|net_risk| / threshold`.
  double utilization = 7;
  // The overflow beyond the band edge.
  double overflow = 8;
  // The sized hedge magnitude.
  double size = 9;
  // The internal-cross portion of the sized hedge.
  double internal_crossed = 10;
  // The external portion of the sized hedge.
  double external_hedged = 11;
  // Whether the policy is armed advisory-only (no live trading).
  bool advisory = 12;
  // When resolved (epoch nanos, UTC).
  int64 fired_at = 13;
  // The exact graph path walked.
  repeated uint32 policy_path = 14;
  // A short human rationale (band / action summary).
  string reason = 15;
  // The effective LP set the hedge would TARGET — the resolved include/exclude panel
  // (or the per-rule RFQ include list / full known panel when no scope panel is set).
  // Empty for internal / no-trade actions. Lets a desk see which LPs an advisory hedge
  // would fan to before it arms live.
  repeated string lps = 16;
  // The VEHICLE hedge this intent would place, when the policy leaf hedges with
  // something other than the position's own security. Absent for a self-hedge.
  optional HedgeVehiclePlanDesc vehicle_plan = 17;
  // Whether this scope fires automatically or only publishes a standing suggestion.
  HedgeExitModeEnum exit_mode = 18;
}

// A STANDING hedge suggestion — the manual half of suggest-then-exit. The engine has
// measured the risk, resolved the policy and sized the vehicle, and has deliberately
// traded NOTHING because the scope's exit mode is `SUGGEST`. The suggestion sits on the
// risk surface next to the risk it refers to until a trader fires or dismisses it.
//
// This is NOT a confirmation dialog: no modal is raised, nothing is blocked, and
// ignoring it leaves it exactly where it was.
message HedgeSuggestion {
  // Stable id (the fire / dismiss key).
  string suggestion_id = 1;
  // The book carrying the risk.
  string book = 2;
  // The instrument (family label) the risk is measured on.
  string instrument = 3;
  // The owning desk.
  string desk = 4;
  // When the suggestion was raised (epoch nanos, UTC).
  int64 raised_at = 5;
  // The RAG band at the time ("green"/"amber"/"red"/"breach").
  string band = 6;
  // The signed net risk in the budget metric.
  double net_risk = 7;
  // The resolved warehouse threshold.
  double threshold = 8;
  // `|net_risk| / threshold`.
  double utilization = 9;
  // The exit action the policy resolved (including its vehicle choice).
  ExitActionDesc action = 10;
  // The exact graph path walked — the machine-checkable "why this suggestion".
  repeated uint32 policy_path = 11;
  // The external shed the policy sized, in the budget metric's native units.
  double external_size = 12;
  // How that shed sizes as a VEHICLE trade. Absent for a self-hedge (ratio 1).
  optional HedgeVehiclePlanDesc vehicle_plan = 13;
  // The trader-facing instruction — "Sell 318 contracts of TY-DEC26".
  string headline = 14;
  // Why it was raised (band / action / policy summary), and any honesty caveat (e.g.
  // that the DV01 basis is the duration-blind proxy).
  string rationale = 15;
  // The booked position whose fill raised this suggestion (the reconciliation key).
  optional uint64 parent_position_id = 16;
  // The effective LP set the hedge would fan to.
  repeated string lps = 17;
  // The reference mid captured when the suggestion was raised — what the hedge would
  // price off if fired now. Zero when none was available.
  double mid_at_raise = 18;
}

// List the standing hedge suggestions (gated `hedge` × asset), newest first.
message ListHedgeSuggestionsRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Optional book filter.
  string book = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The standing suggestions.
message ListHedgeSuggestionsResponse {
  // The suggestions, newest first.
  repeated HedgeSuggestion suggestions = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Resolve one standing suggestion: FIRE it (execute the sized hedge on the configured
// venue and book the offsetting leg) or DISMISS it (clear it, trade nothing).
message ExecuteHedgeSuggestionRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The suggestion to resolve.
  string suggestion_id = 2;
  // When true, clear the suggestion WITHOUT trading. The risk stays on the book and the
  // next fill re-raises the suggestion — dismissing hides nothing.
  bool dismiss = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The outcome of resolving a suggestion.
message ExecuteHedgeSuggestionResponse {
  // The provenance of the hedge that fired; absent on a dismiss, or when the venue
  // returned an honest miss (nothing filled ⇒ nothing is claimed to have traded).
  optional HedgeProvenance provenance = 1;
  // The suggestions that remain standing after this call.
  repeated HedgeSuggestion suggestions = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}

// One per-desk enable toggle in the engine config.
message HedgeDeskToggle {
  // The desk id.
  string desk = 1;
  // Whether auto-hedging is enabled for the desk (absent from the list ⇒ default on).
  bool enabled = 2;
}

// A standing hedging LP panel bound to a scope (mirrors
// `crate::config::hedge_policy::ScopedLpPanel` + the pure `celnet_hedge_routing::HedgeLpPanel`).
// The include/exclude liquidity-provider selection every external exit action inherits
// for that desk / book / instrument; resolves most-specific-wins (instrument > book >
// desk). An empty include starts from ALL known LPs; excludes are then subtracted. An
// unrestricted (empty include AND exclude) panel is the "no restriction" default and is
// not persisted. (`docs/AUTO-HEDGING-AND-INTERNALISATION-REQUIREMENTS.md` §4/§6.2.)
message HedgeLpPanelDesc {
  // What the scope_id names (desk / book / instrument).
  HedgeScopeKindEnum scope_kind = 1;
  // The desk / book / instrument id this panel binds to.
  string scope_id = 2;
  // LPs to start from (empty ⇒ all known LPs). A non-empty include is the base set,
  // in this order (the RFQ fan priority). Each must be a known, enabled LP.
  repeated string include = 3;
  // LPs to subtract from the base set (the exclude semantics). Each must be known.
  repeated string exclude = 4;
}

// The auto-hedge engine's global controls (mirrors the server `HedgeConfig`).
message HedgeConfigDesc {
  // Global kill-switch: when true, ALL auto-hedging halts (positions warehouse).
  bool kill_switch = 1;
  // How external hedge actions are executed (replaces the former boolean
  // `advisory_only`): advisory shadow-run, or a live LP-panel / composite /
  // LP-panel-then-composite venue path. Defaults to the live LP-then-composite mode.
  HedgeExecutionModeEnum execution = 2;
  // Per-desk enable overrides.
  repeated HedgeDeskToggle desk_enabled = 3;
  // A hard ceiling on any single hedge clip (native metric units).
  double max_clip = 4;
  // Max hedges fired per rate-limit interval (0 ⇒ unbounded).
  uint32 max_hedges_per_interval = 5;
  // A daily externalised-notional cap (0 ⇒ unbounded).
  double daily_external_notional_cap = 6;
  // The standing hedging LP panels — per-scope include/exclude LP selection every
  // external exit action inherits (most-specific-wins). Empty ⇒ no restriction.
  repeated HedgeLpPanelDesc lp_panels = 7;
  // The spread (bp) applied to the Agg Book COMPOSITE mid when a hedge fills on the
  // composite venue (the `COMPOSITE` mode / the `LP_PANEL_THEN_COMPOSITE` fallback).
  double composite_spread_bp = 8;
  // The firm's HEDGE-VEHICLE REGISTRY: which vehicle hedges which risk, by instrument
  // and maturity bucket. Empty ⇒ a `BENCHMARK` leaf resolves nothing and falls back to
  // the self-hedge (never a fabricated vehicle). Additive; an unset list is empty.
  repeated HedgeVehicleDesc vehicles = 9;
  // The scoped SUGGEST-vs-AUTO exit-mode bindings. Empty ⇒ AUTO everywhere, i.e. the
  // historical fire-on-breach behaviour.
  repeated HedgeExitModeBinding exit_modes = 10;
  // The scoped HEDGING-MODEL bindings — how each scope manages risk (back-to-back vs
  // warehouse-to-a-DV01-budget). Empty ⇒ CUSTOM everywhere, i.e. every scope resolves
  // its authored exit-policy graph exactly as it always did.
  repeated HedgingModelBinding hedging_models = 11;
  // WHEN a live external hedge runs relative to the fill (sync = inside the booking
  // commit; async = immediately after it, off the client's critical path). Defaults to
  // SYNC, which is the historical behaviour.
  HedgeDispatchEnum dispatch = 12;
}

// Read a scoped hedge policy graph (gated `hedge` × asset). Absent until defined.
// The scope selects WHICH policy: FIRM (the default singleton, empty `scope_id`), a
// BOOK graph, or a BUCKET (subtree-root) graph. A FIRM-scope request reads the
// firm-wide graph exactly as before (back-compatible default).
message GetHedgePolicyGraphRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
  // The policy scope to read (FIRM=0 default → the firm-wide graph).
  HedgePolicyScopeKindEnum scope_kind = 3;
  // The book id (BOOK) / subtree-root id (BUCKET) to read; empty for FIRM.
  string scope_id = 4;
}
// The current hedge policy graph for the requested scope, or absent when none defined.
message GetHedgePolicyGraphResponse {
  // The hedge policy graph for the requested scope (absent ⇒ none defined).
  optional HedgeGraphDesc graph = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
  // The scope this graph governs (echoed).
  HedgePolicyScopeKindEnum scope_kind = 3;
  // The echoed scope id.
  string scope_id = 4;
}

// Replace a scoped hedge policy graph (gated `hedge` × asset). Validated against the
// aggregation instruments + FIX LP registry before commit. The scope selects which
// policy is written: FIRM (the singleton), a BOOK graph, or a BUCKET (subtree-root)
// graph. A BOOK/BUCKET graph with an empty node set REMOVES that scope's policy.
message UpdateHedgePolicyGraphRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The new hedge policy graph.
  HedgeGraphDesc graph = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
  // The policy scope to write (FIRM=0 default → the firm-wide graph).
  HedgePolicyScopeKindEnum scope_kind = 4;
  // The book id (BOOK) / subtree-root id (BUCKET) to write; empty for FIRM.
  string scope_id = 5;
}
// The committed hedge policy graph.
message UpdateHedgePolicyGraphResponse {
  // The committed graph.
  HedgeGraphDesc graph = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
  // The scope this graph governs (echoed).
  HedgePolicyScopeKindEnum scope_kind = 3;
  // The echoed scope id.
  string scope_id = 4;
}

// ===========================================================================
// incoming-quote acceptance (the third trader-configurable rule engine — the
// wire mirror of the `celnet-acceptance` pure crate). An acceptance policy is a
// decision graph of the SAME shape as `RiskRoutingGraphDesc` / `HedgeGraphDesc`,
// but its leaves are ACCEPTANCE ACTIONS (`AcceptanceActionDesc`: accept / reject /
// hold-for-review) instead of book targets or exit actions; conditions reuse
// `RouteOpEnum` + `RouteValueDesc` verbatim (asset-agnostic). Every message mirrors
// the domain types field-for-field (same ordinal order for enums).
// ===========================================================================

// Which lift field an acceptance condition matches (mirrors
// `celnet_acceptance::AcceptanceField`, same ordinal order). Prefixed per the
// file-scope enum convention.
enum AcceptanceFieldEnum {
  // Counterparty / originating party id (an Enum field).
  ACCEPTANCE_FIELD_COUNTERPARTY = 0;
  // Absolute USD notional of the lift (Numeric).
  ACCEPTANCE_FIELD_NOTIONAL_USD = 1;
  // Tenor / years to maturity of the lifted instrument (Numeric).
  ACCEPTANCE_FIELD_TENOR_YEARS = 2;
  // Instrument identifier / curve / security symbol (a String field).
  ACCEPTANCE_FIELD_INSTRUMENT_SYMBOL = 3;
  // Lift side — pay/receive/buy/sell (an Enum field).
  ACCEPTANCE_FIELD_SIDE = 4;
  // Dealer edge of the lift versus the engine mid, in bp (Numeric, signed).
  ACCEPTANCE_FIELD_EDGE_BPS = 5;
  // Age of the quote at lift time, in milliseconds (Numeric).
  ACCEPTANCE_FIELD_QUOTE_AGE_MS = 6;
  // Owning asset class — "fx_options" / "fixed_income" (an Enum field).
  ACCEPTANCE_FIELD_ASSET_CLASS = 7;
  // Owning / target desk (an Enum field).
  ACCEPTANCE_FIELD_DESK = 8;
}

// The kind of acceptance action a leaf takes (mirrors
// `celnet_acceptance::AcceptanceAction`'s variants, same ordinal order).
enum AcceptanceActionKind {
  // Accept the lift — proceed to book exactly as today.
  ACCEPTANCE_ACTION_ACCEPT = 0;
  // Reject the lift — do not book; surface `reason` to the counterparty.
  ACCEPTANCE_ACTION_REJECT = 1;
  // Hold the lift for manual review — do not auto-book; leave the desk request
  // pending so a human accepts it via the existing desk-accept path.
  ACCEPTANCE_ACTION_HOLD_FOR_REVIEW = 2;
}

// The acceptance-action vocabulary (mirrors `celnet_acceptance::AcceptanceAction`),
// carried FLAT as a `kind` discriminant + the reason (only read for REJECT /
// HOLD_FOR_REVIEW). A flat form — not a oneof-of-messages — keeps the wire codec small
// while remaining lossless.
message AcceptanceActionDesc {
  // Which acceptance action this leaf takes.
  AcceptanceActionKind kind = 1;
  // REJECT / HOLD_FOR_REVIEW: the rationale surfaced on the FIX `Text(58)` (empty for
  // ACCEPT).
  string reason = 2;
}

// A decision node: evaluate `field op value` on the lift (mirrors
// `AcceptanceNode::Condition`; reuses `RouteOpEnum` + `RouteValueDesc` verbatim).
message AcceptanceConditionDesc {
  // The lift field to test.
  AcceptanceFieldEnum field = 1;
  // The comparison operator.
  RouteOpEnum op = 2;
  // The literal compared against.
  RouteValueDesc value = 3;
  // Successor node id when the condition holds.
  uint32 on_true = 4;
  // Successor node id when the condition does not hold.
  uint32 on_false = 5;
}

// One node in an `AcceptanceGraphDesc`, keyed by its `id` (mirrors `AcceptanceNode`).
// The `node` oneof is either an internal condition test or a terminal decision leaf.
message AcceptanceNodeDesc {
  // The node id, unique within the graph.
  uint32 id = 1;
  // The node body: exactly one arm is set — a condition or a terminal decision.
  oneof node {
    // An internal decision node.
    AcceptanceConditionDesc condition = 2;
    // A terminal leaf: the lift resolves to this acceptance action.
    AcceptanceActionDesc decision = 3;
  }
}

// The firm-wide acceptance decision graph (mirrors `celnet_acceptance::AcceptanceGraph`:
// a `BTreeMap<NodeId, AcceptanceNode>` flattened to an id-carrying node list, entered at
// `entry`). Validated server-side on write (acyclic, type-consistent conditions).
message AcceptanceGraphDesc {
  // The node at which every evaluation's walk begins.
  uint32 entry = 1;
  // All nodes (id-carrying); the store rebuilds the id→node map from them.
  repeated AcceptanceNodeDesc nodes = 2;
}

// Read the firm-wide acceptance graph (gated `manage_acceptance` × asset). Absent until
// defined.
message GetAcceptanceGraphRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The current acceptance graph, or absent when none is defined yet.
message GetAcceptanceGraphResponse {
  // The firm-wide acceptance graph (absent ⇒ none defined).
  optional AcceptanceGraphDesc graph = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace the firm-wide acceptance graph (gated `manage_acceptance` × asset). Validated
// (acyclic, type-consistent conditions) before commit.
message UpdateAcceptanceGraphRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The new acceptance graph.
  AcceptanceGraphDesc graph = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The committed acceptance graph.
message UpdateAcceptanceGraphResponse {
  // The committed graph.
  AcceptanceGraphDesc graph = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// List the configured warehouse thresholds (gated `hedge` × asset).
message ListHedgeThresholdsRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full threshold roster.
message ListHedgeThresholdsResponse {
  // Every configured threshold.
  repeated WarehouseThresholdDesc thresholds = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Upsert one warehouse threshold by scope (gated `hedge` × asset). A cap of 0 with
// scope match deletes the threshold; otherwise it is inserted/replaced.
message UpdateHedgeThresholdRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The threshold to upsert (keyed by scope_kind + scope_id).
  WarehouseThresholdDesc threshold = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The threshold roster after the upsert.
message UpdateHedgeThresholdResponse {
  // Every configured threshold after the change.
  repeated WarehouseThresholdDesc thresholds = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// List fired-hedge provenance records for the audit trail (gated `hedge` × asset),
// optionally filtered by book / instrument.
message ListHedgeProvenanceRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Restrict to this book (absent ⇒ all).
  optional string book = 2;
  // Restrict to this instrument (absent ⇒ all).
  optional string instrument = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The matching provenance records, newest first.
message ListHedgeProvenanceResponse {
  // The matching records (descending `fired_at`).
  repeated HedgeProvenance records = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Which trader-configurable decision engine produced a journal record.
enum DecisionEngineEnum {
  // Zero value — never emitted; guards an unset field reading as a real engine.
  DECISION_ENGINE_UNSPECIFIED = 0;
  // The incoming-quote acceptance graph (`celnet-acceptance`) — accept / reject / hold.
  DECISION_ENGINE_ACCEPTANCE = 1;
  // The fill risk-routing graph (`celnet-risk-routing`) — which risk book a fill lands in.
  DECISION_ENGINE_RISK_ROUTING = 2;
  // The hedge exit-policy graph (`celnet-hedge-routing`) — the warehouse-vs-shed decision.
  DECISION_ENGINE_HEDGE = 3;
}

// Whether an evaluation actually DID something. The whole point of the journal is that
// `NO_ACTION` is recorded just as faithfully as `FIRED` — a rule that did not trigger
// leaves a record with its reason, so "why did nothing happen" is answerable.
enum DecisionOutcomeEnum {
  // Zero value — never emitted.
  DECISION_OUTCOME_UNSPECIFIED = 0;
  // The engine took an effective action: a lift was accepted, a fill was routed to a
  // book, a hedge action other than WAREHOUSE resolved.
  DECISION_OUTCOME_FIRED = 1;
  // The engine ran and deliberately did nothing: a reject/hold verdict, an unrouted
  // fill, a WAREHOUSE leaf, a guard/kill-switch suppression, or a graph that never ran.
  // `reason` states which.
  DECISION_OUTCOME_NO_ACTION = 2;
}

// ONE evaluation of ONE decision engine — the audit-log row.
//
// Every field is what the server actually saw or decided at that instant; nothing here
// is reconstructed after the fact. `policy_path` is the exact node walk (empty when the
// graph was never walked — `reason` then says why), which is what lets a client render
// the trader's own decision graph with the taken path highlighted.
message DecisionRecord {
  // Process-monotonic sequence number — the stable ordering + evidence-citation key.
  uint64 seq = 1;
  // When the evaluation happened (epoch nanos, UTC).
  int64 decided_at = 2;
  // Which engine ran.
  DecisionEngineEnum engine = 3;
  // Whether it did anything.
  DecisionOutcomeEnum outcome = 4;
  // The terminal verdict in the engine's own vocabulary ("accept", "reject", "hold",
  // "WAREHOUSE", "SUBMIT_MARKET_ORDER", "routed", "unrouted").
  string outcome_label = 5;
  // The STATED reason — mandatory on a NO_ACTION record. A silent fallback is a bug.
  string reason = 6;
  // The exact graph node ids walked, in order, ending at the leaf that decided. Empty
  // when no graph was walked (no policy configured / structurally broken / suppressed
  // before the walk).
  repeated uint32 policy_path = 7;
  // Which scoped policy was resolved ("firm", "book:rates-usd", "bucket:emea", or
  // empty when none was configured).
  string scope = 8;
  // The risk book in scope (empty when the decision is not book-scoped).
  string book = 9;
  // The instrument / family label in scope.
  string instrument = 10;
  // The counterparty whose flow triggered the evaluation.
  optional string counterparty = 11;
  // The traded symbol.
  optional string symbol = 12;
  // The owning desk.
  string desk = 13;
  // The desk request / RFQ id, for an acceptance decision.
  optional string request_id = 14;
  // The booked position this decision concerns.
  optional uint64 position_id = 15;
  // The end-to-end lift trace this decision belongs to (joins `TraceEvent`).
  optional uint64 trace_id = 16;
  // The `HedgeProvenance.hedge_id` minted by this decision, when one fired.
  optional string hedge_id = 17;
  // The budget metric measured (hedge records).
  HedgeMetricEnum metric = 18;
  // The signed net risk in the metric's units at decision time.
  double net_risk = 19;
  // The resolved warehouse cap.
  double threshold = 20;
  // `|net_risk| / threshold` — the band utilisation at decision time.
  double utilization = 21;
  // The RAG band label at decision time ("green"/"amber"/"red"/"breach"), empty when
  // the engine has no band concept.
  string band = 22;
  // The notional in scope (acceptance records).
  double notional = 23;
  // Whether the resolved action was a shadow (advisory) run rather than a live fire.
  bool advisory = 24;
}

// Query the decision journal (gated `hedge` × asset — the same gate the provenance
// audit trail uses). Absent filters mean "no restriction"; every filter ANDs.
message ListDecisionJournalRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Restrict to one engine (absent ⇒ all three).
  optional DecisionEngineEnum engine = 2;
  // Restrict to fired-only / no-action-only (absent ⇒ both).
  optional DecisionOutcomeEnum outcome = 3;
  // Restrict to this risk book.
  optional string book = 4;
  // Restrict to this instrument / family.
  optional string instrument = 5;
  // Restrict to this counterparty.
  optional string counterparty = 6;
  // Only records decided at or after this epoch-nanos instant.
  optional int64 since_nanos = 7;
  // Row cap (server-clamped; absent/0 ⇒ the server default).
  optional uint32 limit = 8;
  // Echoed request correlation id.
  optional uint64 correlation_id = 9;
}
// The matching journal records, newest first.
message ListDecisionJournalResponse {
  // The matching records (descending `seq`).
  repeated DecisionRecord records = 1;
  // Records the journal has accepted over the process lifetime — so a client can tell
  // a genuinely empty journal from one whose window has rolled past the query.
  uint64 total_recorded = 2;
  // Records evicted at ring capacity over the process lifetime. Non-zero means the
  // audit window is LOSSY and the client must say so rather than imply completeness.
  uint64 evicted = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// One derived rule suggestion. Every field is computed from journal rows the server
// actually recorded; `evidence_seqs` names those rows so a trader can inspect the
// evidence before acting. A suggestion that cannot be grounded in recorded rows is
// not emitted at all.
message RuleAdvice {
  // Stable id within one response (`kind` + scope), so a client can key rows.
  string advice_id = 1;
  // The derivation that produced it ("hedge_policy_missing", "hedge_vehicle_unresolved",
  // "hedge_guard_suppressing", "hedge_policy_broken", "desk_halted",
  // "acceptance_hold_recurring", "acceptance_reject_recurring", "routing_unrouted").
  string kind = 2;
  // Which engine the suggested rule would live in.
  DecisionEngineEnum engine = 3;
  // One-line headline.
  string title = 4;
  // What the evidence shows, in the trader's terms, with the real counts.
  string rationale = 5;
  // The concrete change to make.
  string recommended_action = 6;
  // The book the advice is scoped to (empty ⇒ not book-scoped).
  string scope_book = 7;
  // The instrument the advice is scoped to (empty ⇒ not instrument-scoped).
  string scope_instrument = 8;
  // The counterparty the advice is scoped to.
  optional string scope_counterparty = 9;
  // How many journal rows support it.
  uint32 occurrences = 10;
  // The first supporting row's `decided_at`.
  int64 first_seen = 11;
  // The last supporting row's `decided_at`.
  int64 last_seen = 12;
  // The supporting rows' `seq` values — the citation. Capped at the evidence sample
  // size; `occurrences` is the true count.
  repeated uint64 evidence_seqs = 13;
  // Which rule editor the trader should open ("hedging", "acceptance", "riskrouting",
  // "hedge_vehicles", "hedge_config").
  string editor = 14;
}

// Ask the server to derive rule suggestions from the recorded decision journal
// (gated `hedge` × asset).
message ListRuleAdviceRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Restrict the derivation to one book (absent ⇒ every book in the journal).
  optional string book = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The derived suggestions, strongest evidence first.
message ListRuleAdviceResponse {
  // The suggestions (descending `occurrences`).
  repeated RuleAdvice advice = 1;
  // How many journal rows the derivation actually read — the honest denominator.
  uint32 rows_considered = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}

// Read the auto-hedge engine config (gated `hedge` × asset).
message GetHedgeConfigRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The current engine config.
message GetHedgeConfigResponse {
  // The engine config.
  HedgeConfigDesc config = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace the auto-hedge engine config (gated `hedge` × asset) — the kill-switch,
// advisory-only flag, per-desk toggles and rate guards.
message SetHedgeConfigRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The new engine config.
  HedgeConfigDesc config = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The committed engine config.
message SetHedgeConfigResponse {
  // The committed config.
  HedgeConfigDesc config = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ---------------------------------------------------------------------------
// Per-risk-book risk aggregation (FI risk routing, phase 5 — §5, §8.5). One
// read-only RPC rolls each enabled risk book's routed positions UP the book
// tree (a parent aggregates its own routed positions plus every descendant's)
// into a set of real, computable-now metrics: net/gross base-currency notional,
// the additive canonical Greeks (delta/gamma/vega/theta), and per-cap limit
// utilization with a green/amber/red band. Two metric families are NOT
// evaluable at this seam and are carried as ABSENT (not a fabricated zero):
// rates DV01/curve buckets (FX-vanilla positions have no DV01 — the rates-book
// seam) and live mark-to-market PnL (needs a mark pass not present here).
// ---------------------------------------------------------------------------

// The traffic-light band for a limit utilization: GREEN when used/limit < 0.8,
// AMBER in [0.8, 1.0), RED at or above 1.0 (a breach). The default (0) is GREEN.
enum RagBand {
  // used/limit < 0.8 (proto3 zero default) — comfortable headroom.
  RAG_BAND_GREEN = 0;
  // used/limit in [0.8, 1.0) — approaching the cap.
  RAG_BAND_AMBER = 1;
  // used/limit >= 1.0 — at or over the cap (a breach).
  RAG_BAND_RED = 2;
}

// One book's utilization of a single limit cap: the used magnitude against the
// configured cap, the ratio, and its RAG band. Only caps that are BOTH present
// on the book's `RiskLimits` AND computable at this seam are emitted (net/gross
// notional today; `max_dv01` is skipped while DV01 is a later rates seam).
message LimitUtilizationDesc {
  // The metric this cap governs (`net_notional` / `gross_notional`).
  string metric = 1;
  // The book's used magnitude for this metric (net uses |signed sum|).
  double used = 2;
  // The configured cap from the book's `RiskLimits`.
  double limit = 3;
  // used / limit as a fraction (0 when the cap is 0 and nothing is used;
  // +inf when the cap is 0 and something is used — a breach).
  double fraction = 4;
  // The traffic-light band derived from `fraction`.
  RagBand band = 5;
}

// One risk book's aggregated risk, rolled up its subtree (§5). The additive
// metrics sum the book's own routed positions plus all descendants'.
message RiskBookRiskDesc {
  // The risk book this row is for (`RiskBookDef.id`).
  string book_id = 1;
  // The book's human-friendly name (`RiskBookDef.name`).
  string name = 2;
  // Net (signed sum) base-currency notional across the subtree's positions.
  double net_notional = 3;
  // Gross (sum of absolute) base-currency notional across the subtree.
  double gross_notional = 4;
  // The number of positions rolled into this book (own + descendants').
  uint32 position_count = 5;
  // Canonical, premium-excluded delta (base-leg hedge amount) × notional, summed.
  double delta = 6;
  // Canonical gamma (∂²V/∂S²) × notional, summed.
  double gamma = 7;
  // Canonical vega (∂V/∂σ per 1.0 vol, premium-ccy) × notional, summed.
  double vega = 8;
  // Canonical theta (∂V/∂t per year) × notional, summed.
  double theta = 9;
  // Net DV01 (PV per +1bp) — ABSENT: FX-vanilla positions carry no rates DV01;
  // this becomes a real value only when the rates-book seam is wired (§5.3).
  optional double dv01 = 10;
  // Live mark-to-market PnL — ABSENT: no mark pass exists at this seam (§5.4).
  optional double pnl = 11;
  // Per-cap limit utilization for the caps present on the book AND computable now.
  repeated LimitUtilizationDesc limits = 12;
}

// Aggregate risk for every enabled risk book (admin only — risk-routing risk is
// an admin risk-management view; a finer `risk_manage·fixed_income` capability is
// a later refinement, matching the phase-4 CRUD RPCs).
message ListRiskBookRiskRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The per-book aggregated risk roster.
message ListRiskBookRiskResponse {
  // One row per enabled risk book, in registry order.
  repeated RiskBookRiskDesc books = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ── Client-flow analytics (docs/ANALYTICS-REQUIREMENTS.md §11.1a/§11.3) ──────
//
// The cross-product per-client flow / P&L-attribution rollup: a read-only fold
// over what the desk priced and traded, grouped by one dimension. Mirrors the
// pure `celnet-analytics` `ClientFlowMetrics` struct 1:1 (Rust `Option<f64>` ⇒
// proto3 `optional double`).

// Which dimension the client-flow rollup groups by. CLIENT is the default (0).
enum FlowGroupBy {
  // Per requesting client / caller identity (the primary lens).
  FLOW_GROUP_BY_CLIENT = 0;
  // Per counterparty / covering LP / desk faced.
  FLOW_GROUP_BY_COUNTERPARTY = 1;
  // Per instrument (symbol / ISIN).
  FLOW_GROUP_BY_INSTRUMENT = 2;
  // Per product / asset class (FI vs FXO) — the cross-product slice.
  FLOW_GROUP_BY_ASSET = 3;
}

// One rollup row — margin-efficiency ($/mm), spread economics, and quote-fishing
// for one group key. Ratio fields are `optional`: absent (JSON null) when their
// denominator is zero (divide-by-zero guard), never NaN/inf.
message ClientFlowMetricsDesc {
  // The group key this row belongs to (client id / counterparty / instrument /
  // asset, per the request's `group_by`).
  string label = 1;
  // Number of quote/RFQ responses issued to this key.
  uint64 quote_count = 2;
  // Number of fills done with this key.
  uint64 traded_count = 3;
  // Sum of traded notional magnitude.
  double traded_notional = 4;
  // Gross margin captured on fills (Σ margin over traded records).
  double gross_pnl = 5;
  // Total adverse-selection cost (Σ markout, positive = cost to us).
  double total_markout = 6;
  // Total hedging/warehousing cost (Σ hedge_cost, positive = cost).
  double total_hedge_cost = 7;
  // Net P&L = gross_pnl − total_markout − total_hedge_cost.
  double net_pnl = 8;
  // Gross margin per USD 1mm traded. ABSENT when no notional traded.
  optional double dpm_gross = 9;
  // Net P&L per USD 1mm traded. ABSENT when no notional traded.
  optional double dpm_net = 10;
  // Realised margin ÷ quoted spread over fills. ABSENT when we quoted no spread.
  optional double captured_vs_offered = 11;
  // Mean cover distance (we vs second-best panel quote). ABSENT when no cover.
  optional double mean_cover_distance = 12;
  // Offered spread ($/mm) at which net $/mm hits zero. ABSENT when undefined.
  optional double breakeven_spread = 13;
  // Quotes ÷ trades. ABSENT when no trades (the zero-trade fisher case is caught
  // by `fishing_score`, which does not divide).
  optional double quote_to_trade_ratio = 14;
  // Trades ÷ quotes (the RFQ hit-rate). ABSENT when no quotes.
  optional double hit_rate = 15;
  // Bounded [0, 1] quote-fishing score (high quote-to-trade × low net $/mm).
  double fishing_score = 16;
}

// Query the client-flow rollup. Gated on `view_analytics` × the caller's assets
// (a cross-product read — a manager holding it on ANY asset may query).
message ListClientFlowMetricsRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The dimension to group by (client / counterparty / instrument / asset).
  FlowGroupBy group_by = 2;
  // Inclusive lower time bound (epoch nanos) on the source records. ABSENT ⇒ open.
  optional int64 from_nanos = 3;
  // Exclusive upper time bound (epoch nanos) on the source records. ABSENT ⇒ open.
  optional int64 to_nanos = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The rolled-up client-flow metrics, one row per group key (key-ordered).
message ListClientFlowMetricsResponse {
  // One row per group key, ordered by key.
  repeated ClientFlowMetricsDesc metrics = 1;
  // Echoed grouping dimension (so the client renders the right axis).
  FlowGroupBy group_by = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}

// ── Street-side / LP liquidity analytics (docs/ANALYTICS-REQUIREMENTS.md §2.4) ─
//
// The LP-keyed analogue of client-flow: a read-only fold over what each liquidity
// provider ticked, won, missed, and reneged on (last-look), keyed per LP. Mirrors
// the pure `celnet-analytics` `LpFlowMetrics` struct 1:1 (Rust `Option<f64>` ⇒
// proto3 `optional double`). Gated on the SAME `view_analytics` capability as
// client-flow.

// One LP's street-side liquidity row — activity, competition outcome, and derived
// ratios for one liquidity provider. Ratio fields are `optional`: absent (JSON
// null) when their denominator is zero (divide-by-zero guard), never NaN/inf.
message LpFlowMetricsDesc {
  // The liquidity-provider id this row belongs to (the panel `lp_id` / venue name).
  string lp_id = 1;
  // Quote-update ticks observed from this LP (its update frequency over the window).
  uint64 tick_count = 2;
  // Panel responses from this LP (Σ was_quoted) — the response-presence count and
  // the win-rate denominator.
  uint64 quote_count = 3;
  // Deals this LP won (booked_lp_id == lp_id).
  uint64 deals_won = 4;
  // Summed notional magnitude of the deals this LP won.
  double won_notional = 5;
  // Panel appearances where the LP was quoted but a deal went elsewhere.
  uint64 missed = 6;
  // Times this LP's quote was rejected at ranking on last-look.
  uint64 last_look_rejects = 7;
  // Win-rate = deals_won ÷ quote_count. ABSENT when the LP made no quotes.
  optional double win_rate = 8;
  // Mean cover distance (this LP's price vs the winner when it was the runner-up).
  // ABSENT when the LP was never the cover.
  optional double mean_cover = 9;
}

// Query the street-side LP liquidity rollup. Gated on `view_analytics` × the
// caller's assets (a cross-product read — a manager holding it on ANY asset may
// query).
message ListLpFlowMetricsRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Inclusive lower time bound (epoch nanos) on the source records. ABSENT ⇒ open.
  optional int64 from_nanos = 2;
  // Exclusive upper time bound (epoch nanos) on the source records. ABSENT ⇒ open.
  optional int64 to_nanos = 3;
  // Optional per-LP filter: when set + non-empty, only this LP's row is returned.
  optional string lp_id = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The rolled-up LP liquidity metrics, one row per LP (lp_id-ordered).
message ListLpFlowMetricsResponse {
  // One row per LP, ordered by lp_id.
  repeated LpFlowMetricsDesc metrics = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// Street-side EXECUTION analytics (Analytics §2.4, the order-level companion to
// the LP league table above). `LpFlowMetricsDesc` grades an LP's BEHAVIOUR; these
// messages record what we actually SENT to the street and what came back — one
// row per outbound order, plus aggregated breakdowns on any grouping axis.
//
// Absence discipline (guardrail 2): every `optional` field below is absent when
// the datum was genuinely not observed — never a plausible zero. In particular
// `order_type` / `time_in_force` / `response_latency_nanos` are absent whenever
// the routing seam lifted a standing firm price in-process (no typed order was
// issued and there was no venue round trip to time).
// ===========================================================================

// One LP that showed a firm executable price on the side we needed when an order
// was worked — the competition it was ranked against.
message StreetCompetitorDesc {
  // The competing LP's id.
  string lp_id = 1;
  // Its firm price on the side we needed, in the instrument's quote convention.
  double price = 2;
}

// One outbound street order and its result.
message StreetOrderDesc {
  // Stable id for this order within the recording process.
  string order_id = 1;
  // When the order was worked (epoch nanos, UTC).
  int64 ts_nanos = 2;
  // The LP the order executed against. ABSENT for a composite backstop or an
  // order that reached no venue — never a placeholder name.
  optional string lp_id = 3;
  // Where it executed: "named_lp" | "composite_backstop" | "none".
  string venue = 4;
  // The instrument actually dealt (a tradeable security id, or the product family
  // label when the cell resolved no security-master id).
  string instrument = 5;
  // Product family token ("ois", "irs", "fra", "bond", "bond_future",
  // "stir_future"). EMPTY when genuinely unclassified.
  string family = 6;
  // Risk tenor of the hedged exposure, in years. ABSENT when the cell carries no
  // parseable tenor or maturity (never defaulted to zero).
  optional double tenor_years = 7;
  // The DESK's own side: "buy" | "sell".
  string side = 8;
  // Quantity requested, in the order's native metric units.
  double requested_qty = 9;
  // Quantity actually filled (0 when nothing did).
  double filled_qty = 10;
  // The reference price the order was worked against (the composite mid at fire).
  double requested_price = 11;
  // The realised fill price. ABSENT when nothing filled.
  optional double filled_price = 12;
  // Signed slippage of the fill vs the reference, in bp of the instrument's quote
  // convention. ABSENT when nothing filled.
  optional double slippage_bp = 13;
  // Terminal outcome: "filled" | "partially_filled" | "rejected" | "cancelled" |
  // "expired" | "last_look_pulled" | "no_liquidity".
  //
  // "rejected" is a venue REFUSAL (FIX OrdStatus=8); "cancelled" is a venue that
  // accepted the order but could not satisfy it (OrdStatus=4). They are kept
  // distinct: "would not" and "could not" are different facts about an LP.
  string outcome = 14;
  // Machine-stable QUALIFIER on the outcome — on a routed order this is the
  // venue's OWN Text(58) reason code ("FOK_UNFILLABLE", "IOC_DEPTH_EXHAUSTED",
  // "NOT_A_WHOLE_LOT", "NOT_MARKETABLE", …). On an order that never reached a
  // venue it states why ("no_order_endpoint", "no_firm_lp_price",
  // "street_declined", "venue_no_response"). ABSENT on a clean complete fill,
  // which needs no qualification.
  optional string reason = 15;
  // Every LP that showed a firm price on the required side, best-first.
  repeated StreetCompetitorDesc competitors = 16;
  // The hedge decision this order belongs to — the `hedge_id` on the hedge
  // provenance record, so a trader can walk breach → street orders. ABSENT when
  // the order has no hedge parent.
  optional string parent_hedge_id = 17;
  // The client fill / position this order was shed from. ABSENT when unlinked.
  optional uint64 parent_position_id = 18;
  // The order type actually sent, as the FIX OrdType(40) value ("1" market, "2"
  // limit, …) — the estate's only order contract is FIX NewOrderSingle(D) →
  // ExecutionReport(8), so this carries that tag verbatim. ABSENT on a row that
  // sent no order (a composite backstop, an advisory run).
  optional string order_type = 19;
  // The time-in-force actually sent, as the FIX TimeInForce(59) value ("3" IOC,
  // "4" FOK, …). ABSENT on a row that sent no order.
  optional string time_in_force = 20;
  // Measured venue round-trip latency, nanoseconds — send to ExecutionReport(8).
  // ABSENT only where there was no round trip to measure: a member with no order
  // endpoint, or a composite backstop.
  optional uint64 response_latency_nanos = 21;
}

// One aggregated street-side row. Every ratio is ABSENT when its denominator is
// zero — the divide-by-zero guard the clients render as an explicit "—".
message StreetBreakdownRowDesc {
  // The axis this row was grouped on: "lp" | "family" | "instrument" |
  // "tenor_bucket" | "hour".
  string dimension = 1;
  // The group key. "COMPOSITE" is the explicit composite-backstop bucket; an
  // EMPTY key is the explicit "unattributed" bucket (the dimension was genuinely
  // absent on those orders) and is never merged into a real group.
  string key = 2;
  // Orders in this group.
  uint64 orders = 3;
  // Orders that fully filled.
  uint64 filled = 4;
  // Orders that partially filled.
  uint64 partially_filled = 5;
  // Orders the venue REFUSED (FIX OrdStatus=8).
  uint64 rejected = 6;
  // Orders the venue accepted but COULD NOT satisfy (FIX OrdStatus=4).
  uint64 cancelled = 20;
  // Orders that expired unfilled.
  uint64 expired = 7;
  // Orders pulled at last look.
  uint64 last_look_pulled = 8;
  // Orders that found no firm street price at all.
  uint64 no_liquidity = 9;
  // Orders that backstopped to the composite instead of reaching a named LP.
  uint64 composite_backstop = 10;
  // Total quantity requested across the group.
  double requested_qty = 11;
  // Total quantity filled across the group.
  double filled_qty = 12;
  // filled ÷ requested quantity. ABSENT when nothing was requested.
  optional double fill_ratio = 13;
  // Orders that traded ÷ orders. ABSENT when the group is empty.
  optional double win_rate = 14;
  // Mean signed slippage (bp) over the orders that actually filled. ABSENT when
  // none did — never a slippage of zero for a group that never traded.
  optional double mean_slippage_bp = 15;
  // Mean measured venue round-trip latency (ns) over the orders that carried one.
  // ABSENT when no order in the group had a measured latency.
  optional uint64 mean_response_latency_nanos = 16;
  // Last-look pulls ÷ orders. ABSENT when the group is empty.
  optional double last_look_rate = 17;
  // Mean cover distance over the orders that had a cover. ABSENT when none did.
  optional double mean_cover = 18;
  // Mean number of LPs showing a firm price when these orders were worked.
  // ABSENT when the group is empty.
  optional double mean_competitors = 19;
}

// Query the street-side execution blotter + its aggregated breakdown. Gated on
// `view_analytics` × the caller's assets, exactly as the LP league table is.
message ListStreetOrdersRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Inclusive lower time bound (epoch nanos). ABSENT ⇒ open.
  optional int64 from_nanos = 2;
  // Exclusive upper time bound (epoch nanos). ABSENT ⇒ open.
  optional int64 to_nanos = 3;
  // Optional LP filter (empty ⇒ unconstrained).
  optional string lp_id = 4;
  // Optional product-family filter (empty ⇒ unconstrained).
  optional string family = 5;
  // Optional instrument filter (empty ⇒ unconstrained).
  optional string instrument = 6;
  // Optional outcome filter (empty ⇒ unconstrained).
  optional string outcome = 7;
  // Optional parent-hedge filter — the breach → street-orders walk.
  optional string parent_hedge_id = 8;
  // The breakdown axis to aggregate on. ABSENT ⇒ "lp". An UNKNOWN token is
  // REJECTED rather than silently grouped on a default axis.
  optional string dimension = 9;
  // Max blotter rows to return (server-capped). ABSENT ⇒ the server default.
  optional uint32 limit = 10;
  // Echoed request correlation id.
  optional uint64 correlation_id = 11;
}

// The street-side execution blotter (newest first) + the aggregated breakdown
// over the WHOLE matching window (not just the returned page).
message ListStreetOrdersResponse {
  // The matching orders, newest first, capped at the server page limit.
  repeated StreetOrderDesc orders = 1;
  // The aggregated rows on the requested dimension, in group-key order.
  repeated StreetBreakdownRowDesc breakdown = 2;
  // Total orders matching the window + filters, before the page cap — so a client
  // can say "showing 200 of 5,312" instead of implying it has them all.
  uint64 total_matching = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// ===========================================================================
// Latency / Ops analytics (Analytics pillar B —
// `docs/LATENCY-AND-HEDGING-ANALYTICS-REQUIREMENTS.md` Part 1). Per-stage
// tick-to-quote and tick-to-trade latency, folded off the pinned hot core from
// the `celnet-observability` HdrHistogram telemetry (guardrail 11). A read-only
// snapshot gated on the same `view_analytics` capability as client-flow.
// ===========================================================================

// A single instrumented pipeline stage's latency distribution (one HdrHistogram
// recorder), in nanoseconds. Percentiles are coordinated-omission-aware p50/p99/
// p99.9/p99.99 + max/min/mean (`REPORTED_PERCENTILES`).
message LatencyStageDesc {
  // Stable, vendor-neutral op label (`OpKind::label` — e.g. "vanilla_price",
  // "tiering_run", "rfq_respond").
  string op = 1;
  // Human-facing stage label for the workspace (`OpKind::stage_label`).
  string stage_label = 2;
  // Number of samples recorded into this stage's histogram.
  uint64 count = 3;
  // Median (p50) latency, ns.
  uint64 p50_ns = 4;
  // 99th percentile latency, ns.
  uint64 p99_ns = 5;
  // 99.9th percentile latency, ns.
  uint64 p999_ns = 6;
  // 99.99th percentile latency, ns.
  uint64 p9999_ns = 7;
  // Minimum latency, ns.
  uint64 min_ns = 8;
  // Maximum latency, ns.
  uint64 max_ns = 9;
  // Arithmetic mean latency, ns.
  double mean_ns = 10;
}

// Telemetry ring / drain health — surfaced so an operator can see lossy-telemetry
// drops (a full pinned-core → drain ring) at a glance.
message LatencyTelemetryHealth {
  // POD samples drained from the SPSC ring over the process lifetime.
  uint64 drained_total = 1;
  // Samples the pinned-core producer dropped on a full ring (lossy by design).
  uint64 dropped_total = 2;
  // Sequence-gaps the drain observed (holes from producer drops).
  uint64 observed_gaps = 3;
  // The calibrated cycle-counter frequency (ticks/sec) used for tick→ns.
  uint64 tick_hz = 4;
}

// Request the current per-stage latency snapshot. No filter/paging: the store is
// a fixed set of per-`OpKind` HdrHistograms (bounded memory, guardrail 6).
message ListLatencyMetricsRequest {
  // The caller's session token (validated + capability-checked server-side).
  string session_token = 1;
  // Optional echoed correlation id.
  optional uint64 correlation_id = 2;
}

// The per-stage latency snapshot + telemetry health.
message ListLatencyMetricsResponse {
  // One row per instrumented stage that has recorded a sample, in `OpKind`
  // discriminant order.
  repeated LatencyStageDesc stages = 1;
  // Ring / drain health.
  LatencyTelemetryHealth health = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}

// ===========================================================================
// End-to-end event tracing — the per-lift event log that COMPLEMENTS the
// aggregate latency histograms (`ListLatencyMetrics`). Where the histograms
// answer "how fast is stage X across all flow", a trace answers "what happened,
// stage by stage, to THIS one lift" — price → quote → order → last-look →
// acceptance → risk-routing → deal → hedge, each a timestamped event carrying
// that stage's specifics, all sharing one `trace_id`. Capture is OFF the pinned
// pricing hot core (guardrail 11): stage sites enqueue onto a bounded off-core
// offload that a drain worker folds into a capped ring store.
// (`docs/LATENCY-AND-HEDGING-ANALYTICS-REQUIREMENTS.md` Part 2.)
// ===========================================================================

// One stage in a lift's lifecycle. Carried on the wire as its canonical enum
// NUMBER (the WS codec's enum-as-int convention); the client maps number→label.
enum TraceStage {
  // Zero value — never emitted; guards against an unset field reading as a real
  // stage (proto3 default-presence rule).
  TRACE_STAGE_UNSPECIFIED = 0;
  // A price was computed for a quotable line (the pricer returned a level).
  TRACE_STAGE_PRICE_COMPUTED = 1;
  // A quote (`35=W` / MD snapshot / RFQ reply) was published to a counterparty.
  TRACE_STAGE_QUOTE_PUBLISHED = 2;
  // An order (`35=D`) that lifts a published quote was received.
  TRACE_STAGE_ORDER_RECEIVED = 3;
  // The last-look window was evaluated (fill vs superseded/expired/replayed).
  TRACE_STAGE_LAST_LOOK = 4;
  // The acceptance decision engine ruled on the lift (accept / reject / hold).
  TRACE_STAGE_ACCEPTANCE_DECIDED = 5;
  // The accepted fill was routed to a risk book by the firm-wide decision graph.
  TRACE_STAGE_RISK_ROUTED = 6;
  // The deal / position was booked (position_id minted, stamped to its book).
  TRACE_STAGE_DEAL_BOOKED = 7;
  // The auto-hedge / internalise policy decided the warehouse-vs-shed split.
  TRACE_STAGE_HEDGE_DECIDED = 8;
  // A hedge was fired (external shed) — the terminal stage of a hedged lift.
  TRACE_STAGE_HEDGE_FIRED = 9;
}

// One timestamped stage event in a lift's trace. Only the fields relevant to the
// stage are populated; the rest are absent (`optional`, rendered `null`). The
// non-optional `symbol`/`side` are echoed on every event so a client can render
// a row without joining back to the first event.
message TraceEvent {
  // The trace this event belongs to (shared across every stage of one lift).
  uint64 trace_id = 1;
  // The event's ordinal within its trace, assigned by the store in timestamp
  // order (0-based, gap-free) so the client renders the timeline deterministically.
  uint32 seq = 2;
  // Which stage this event marks.
  TraceStage stage = 3;
  // Monotonic capture time (nanoseconds from a fixed process epoch). Strictly
  // increasing across a process, so inter-stage latency = later.ts − earlier.ts.
  uint64 timestamp_ns = 4;
  // The instrument symbol (FIX `Symbol(55)` / internal symbol), echoed on every
  // event of the trace.
  string symbol = 5;
  // The dealt/quoted side from the counterparty's perspective ("buy"/"sell"), or
  // empty when the stage is side-agnostic.
  string side = 6;
  // The price at this stage: the computed level, quoted level, presented order
  // level, dealt level, or hedge fill price — as the stage dictates.
  optional double price = 7;
  // The notional / size in scope at this stage.
  optional double notional = 8;
  // The FIX `QuoteID(117)` that ties the quote↔order stages, when known.
  optional string quote_id = 9;
  // The booked deal id (`Deal.deal_id`, the display id), set when known at the
  // capture instant. The durable booked-position key is `position_id` below —
  // clients join the blotter `Deal` (which carries both) to a trace on that.
  optional string deal_id = 10;
  // The risk book the fill routed to (`Deal.risk_book_id`), set at RISK_ROUTED.
  optional string book_id = 11;
  // The originating counterparty (FIX session / PartyID), when known.
  optional string counterparty = 12;
  // The stage's decision text — last-look ("accepted"/"expired"/"replayed") or
  // acceptance ("accept"/"reject: <reason>"/"hold: <reason>").
  optional string decision = 13;
  // The fired hedge id (`HedgeProvenance.hedge_id`), set at HEDGE_DECIDED/FIRED.
  optional string hedge_id = 14;
  // Free-form stage detail (e.g. the hedge RAG band, the reject reason, the LP
  // that won) — a human-readable annotation, never parsed.
  optional string detail = 15;
  // The booked `Deal.position_id` — the durable internal key the fill was stamped
  // under (minted at the DEAL_BOOKED commit, before the display `deal_id`). The
  // hedge stage (keyed by `HedgeProvenance.parent_position_id`) shares it. Clients
  // join a blotter `Deal` to its trace on this.
  optional uint64 position_id = 16;
}

// A one-row summary of a whole trace, for the recent-traces list (newest first).
message TraceSummary {
  // The trace id.
  uint64 trace_id = 1;
  // The first stage observed (by timestamp) — the trace's entry point.
  TraceStage first_stage = 2;
  // The last stage observed (by timestamp) — how far the lift progressed.
  TraceStage last_stage = 3;
  // The first event's timestamp (ns from the process epoch).
  uint64 first_timestamp_ns = 4;
  // The last event's timestamp (ns from the process epoch).
  uint64 last_timestamp_ns = 5;
  // End-to-end latency of the trace: `last_timestamp_ns − first_timestamp_ns`.
  uint64 total_latency_ns = 6;
  // The number of stage events captured for this trace.
  uint32 event_count = 7;
  // The instrument symbol of the trace.
  string symbol = 8;
  // The originating counterparty, when known.
  optional string counterparty = 9;
  // The terminal outcome, derived from the last stage: "booked" | "hedged" |
  // "rejected" | "in_flight".
  string outcome = 10;
}

// Fetch the full ordered event list of one trace by id.
message GetTraceRequest {
  // The caller's session token (validated + capability-checked server-side).
  string session_token = 1;
  // The trace to fetch.
  uint64 trace_id = 2;
  // Optional echoed correlation id.
  optional uint64 correlation_id = 3;
}

// The ordered events of one trace (empty when the id is unknown / evicted).
message GetTraceResponse {
  // The trace's events, ordered by `seq` (timestamp order), earliest first.
  repeated TraceEvent events = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// List recent traces (summary rows), newest first, bounded.
message ListTracesRequest {
  // The caller's session token (validated + capability-checked server-side).
  string session_token = 1;
  // Max rows to return (newest first). Server-clamped to a sane cap; absent ⇒
  // the server default.
  optional uint32 limit = 2;
  // Optional exact-match symbol filter.
  optional string symbol = 3;
  // Optional exact-match counterparty filter.
  optional string counterparty = 4;
  // Optional echoed correlation id.
  optional uint64 correlation_id = 5;
}

// Recent trace summaries, newest first.
message ListTracesResponse {
  // The summary rows, newest first, bounded by the request/server cap.
  repeated TraceSummary traces = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// LP liquidity ingest — the machine-to-machine feed by which an inbound
// liquidity connection (the `lp-sim` binary today, any FIX/API LP adapter
// tomorrow) pushes its per-instrument two-way top-of-book INTO the server, where
// the enabled `AggregatedBook`s consolidate it (`celnet-aggregation`). This is a
// backend feed, not a client-facing surface: an LP speaks gRPC directly, so this
// path has NO WS mirror / codec. A member is identified by its `lp_name` (the
// consolidation `VenueId`) and matched to the books that list it as a member.
// ===========================================================================

// One inbound LP's two-way top-of-book for a single instrument, at an instant.
// Prices are in the instrument's natural cash units (a clean price per 100 face
// for a Treasury, a rate/yield for a money-market line — the consolidation math is
// unit-agnostic). Sizes are the firm quantity available on each side. A member
// streams a sequence of these (one per instrument it makes a market in, re-sent as
// its quote moves); the server keeps only the latest per `(book, lp_name,
// instrument_id)` and decays it by age against the book's staleness tuning.
message LpQuote {
  // The LP connection name — the consolidation `VenueId` a subscriber attributes
  // the contribution to, and the key matched against a book's member list.
  string lp_name = 1;
  // The canonical server `instrument_id` this quote is for (ADR-0022 decision D —
  // the one identity shared across reference data, the wire and the composite; the
  // Treasury CUSIP for the bundled universe).
  string instrument_id = 2;
  // Bid price (the LP buys the asset here).
  double bid = 3;
  // Offer price (the LP sells the asset here).
  double offer = 4;
  // Firm size available at the bid.
  double bid_size = 5;
  // Firm size available at the offer.
  double offer_size = 6;
  // Observation instant, epoch nanoseconds (UTC) — the valuation clock decays the
  // quote by its age, and drops it past the book's hard max age.
  int64 ts_nanos = 7;
}

// The server's acknowledgement of a completed `LpFeed` stream: how many pushed
// `LpQuote`s were accepted into at least one enabled aggregated book (a quote for
// an instrument no enabled book scopes, or from an unknown member, is received but
// not accepted). Returned once, when the client half-closes the stream.
message LpFeedAck {
  // The number of `LpQuote`s routed into at least one enabled book.
  uint64 accepted = 1;
}

// The backend liquidity-feed ingest. An inbound LP opens a client-streaming
// `LpFeed`, pushes its live two-ways, and half-closes to receive an `LpFeedAck`.
// Machine-to-machine only (no WS mirror): the composite it feeds is what GUI
// subscribers read over `StreamService.StreamSession`.
service LiquidityFeedService {
  // Push a stream of `LpQuote`s into the server's aggregated-book engines.
  rpc LpFeed(stream LpQuote) returns (LpFeedAck);
}

// ===========================================================================
// aggregated-book composite publish — the consolidated price a GUI subscriber
// reads for an aggregated book over the multiplexed `StreamService.StreamSession`
// (the SAME bidi stream the FX/rates lines use). A client opens the line with an
// `AggregatedBookSubscribe` and receives a baseline `AggregatedBookStreamSnapshot`
// then `AggregatedBookStreamUpdate`s as the members' quotes evolve. Additive
// (rule 9): new oneof arms + new messages; no existing field is touched.
// ===========================================================================

// One inbound member's contribution to an instrument's composite: the member's
// own two-way, and whether it was excluded from the consolidated best price
// (aged out past the book's max quote age, or gated as a divergent outlier).
message LpContribution {
  // The contributing LP connection name (the consolidation `VenueId`).
  string lp_name = 1;
  // The member's own bid for this instrument.
  double bid = 2;
  // The member's own offer for this instrument.
  double offer = 3;
  // Whether the member was excluded from the consolidated best bid/offer (stale
  // past the book's max age, or gated as a divergent outlier) — a subscriber greys
  // a contributor that is not currently setting the composite.
  bool stale = 4;
}

// The consolidated composite for one instrument in an aggregated book: the best
// bid/offer + firm size across the fresh members, a confidence measure, and the
// per-member contribution report. Identity fields (`display_name`/`isin`/`cusip`)
// are resolved from the server's instrument reference-data registry, best-effort
// (empty when the `instrument_id` is not in the registry).
message AggregatedInstrument {
  // The canonical server `instrument_id` (the composite line's identity key).
  string instrument_id = 1;
  // Human-friendly label from reference data (empty if unresolved).
  string display_name = 2;
  // ISO 6166 ISIN from reference data (empty if unresolved).
  string isin = 3;
  // CUSIP from reference data (empty if unresolved).
  string cusip = 4;
  // Consolidated best bid — the max fresh member bid.
  double best_bid = 5;
  // Consolidated best offer — the min fresh member offer.
  double best_offer = 6;
  // Firm size stacked at the consolidated best bid.
  double bid_size = 7;
  // Firm size stacked at the consolidated best offer.
  double offer_size = 8;
  // Confidence in the composite, `∈ [0, 1]` (coverage · freshness · agreement).
  double confidence = 9;
  // The per-member contribution / exclusion report, one entry per member that has
  // quoted this instrument (member id order).
  repeated LpContribution contributions = 10;
}

// The full composite state of an aggregated book at a sequence point: the priced
// composite for every in-scope instrument that currently meets the book's quorum.
message AggregatedBookSnapshot {
  // The aggregated-book id this composite is for.
  string book_id = 1;
  // The composite for each in-scope instrument, in `instrument_id` order.
  repeated AggregatedInstrument instruments = 2;
}

// Open an aggregated-book composite line within the multiplexed session, keyed by
// a client-assigned `SubscriptionId` (the SAME id space as the FX price / market
// series / rates lines). The server emits a baseline `AggregatedBookStreamSnapshot`
// then `AggregatedBookStreamUpdate`s as the book's members re-quote.
message AggregatedBookSubscribe {
  // The client-assigned subscription id this composite line is keyed on.
  SubscriptionId subscription = 1;
  // The aggregated-book id to stream the composite of.
  string book_id = 2;
  // A client throttle hint: minimum nanoseconds between updates (the server
  // conflates to honour it). 0 = no throttling.
  uint64 throttle_nanos = 3;
  // Optional caller correlation id, echoed on the baseline snapshot.
  optional uint64 correlation_id = 4;
}

// Close an aggregated-book composite line (the rest of the session is unaffected).
message AggregatedBookUnsubscribe {
  // The composite subscription to tear down.
  SubscriptionId subscription = 1;
}

// The baseline composite state of a subscribed aggregated book at a sequence point
// — the full `AggregatedBookSnapshot` a consumer applies whole before consuming
// deltas.
message AggregatedBookStreamSnapshot {
  // The subscription this snapshot answers.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number of this snapshot (1).
  uint64 sequence = 2;
  // The full composite state at this snapshot.
  AggregatedBookSnapshot book = 3;
  // Echo of the opening `AggregatedBookSubscribe.correlation_id`, if one was
  // supplied (presence-tracked). Absent ⇒ none.
  optional uint64 correlation_id = 4;
  // Snapshot time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 5;
}

// A sequenced delta on a subscribed aggregated book: the full re-consolidated
// composite at the next sequence. A gap in `sequence` signals loss and prompts a
// `Resync`.
message AggregatedBookStreamUpdate {
  // The subscription this update advances.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number (snapshot seq + n).
  uint64 sequence = 2;
  // The re-consolidated composite at this sequence.
  AggregatedBookSnapshot book = 3;
  // Update time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 4;
}

// ===========================================================================
// per-book risk stream — a live push of the firm's per-book risk roster,
// multiplexed onto the same `StreamSession`. The push analogue of the polled
// `ListRiskBookRisk` RPC: a client opens a `RiskBookRiskSubscribe` and receives a
// baseline `RiskBookRiskSnapshot` (every enabled risk book, rolled up its subtree),
// then a fresh `RiskBookRiskSnapshot`/`RiskBookRiskUpdate` whenever a routed fill
// changes the live risk (the server-side position store's monotonic risk version
// advances). The roster payload rows are the SAME `RiskBookRiskDesc` the RPC returns,
// so a dashboard renders the polled and streamed forms identically. Additive to the
// one current contract (ADR-0007): no `schema_version`.

// Open the per-book risk stream within the multiplexed session, keyed by a
// client-assigned `SubscriptionId` (the SAME id space as the FX price / market-series
// / rates / aggregated-book lines). There is exactly ONE firm risk roster (every
// enabled book), so — unlike an aggregated-book line — no book id is carried; the
// subscription id keys the pushed snapshots. Torn down by the generic `Unsubscribe`.
message RiskBookRiskSubscribe {
  // The client-assigned subscription id this risk line is keyed on.
  SubscriptionId subscription = 1;
  // Optional caller correlation id, echoed on the baseline snapshot.
  optional uint64 correlation_id = 2;
}

// The baseline per-book risk roster at a sequence point — the full set of enabled
// books' aggregated risk a consumer applies whole before consuming deltas.
message RiskBookRiskSnapshot {
  // The subscription this snapshot answers.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number of this snapshot (1).
  uint64 sequence = 2;
  // One row per enabled risk book, in registry order (the SAME `RiskBookRiskDesc`
  // rows `ListRiskBookRisk` returns).
  repeated RiskBookRiskDesc books = 3;
  // The server-side position store's risk version this roster reflects (monotonic;
  // advances on every routed fill and every admin risk-book edit). A client dedupes
  // / orders on it.
  uint64 version = 4;
  // Echo of the opening `RiskBookRiskSubscribe.correlation_id`, if one was supplied
  // (presence-tracked). Absent ⇒ none.
  optional uint64 correlation_id = 5;
  // Snapshot time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
}

// A sequenced delta re-publishing the full per-book risk roster at the next sequence
// (the roster is a whole-state snapshot, so the newest supersedes any it skipped). A
// gap in `sequence` signals loss and prompts a `Resync`.
message RiskBookRiskUpdate {
  // The subscription this update advances.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number (snapshot seq + n).
  uint64 sequence = 2;
  // The re-aggregated roster at this sequence.
  repeated RiskBookRiskDesc books = 3;
  // The risk version this roster reflects (see `RiskBookRiskSnapshot.version`).
  uint64 version = 4;
  // Update time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 5;
}

// ===========================================================================
// risk transfer — the MANUAL move of EXISTING risk between books / desks /
// traders (the complement to risk routing, which auto-assigns NEW fills).
// `docs/RISK-TRANSFER-REQUIREMENTS.md`. Every message mirrors the pure
// `celnet_risk_transfer` domain field-for-field; the two sum-type domain enums
// (`TransferQuantity` = Full | Partial(f64), `TransferPrice` = Mid |
// MarkToMarket | Agreed(f64)) are carried FLAT — a discriminant enum plus an
// optional payload scalar — so the WS codec stays oneof-free (a deliberate
// simplification over the routing graph's nested oneofs). Additive to the one
// current contract (guardrail 9): no schema_version.
// ===========================================================================

// The kind of move, fixing the economics + the approval model (mirrors
// `celnet_risk_transfer::TransferKind`). Prefixed (proto enum values share the
// file scope) — the pricing-group / routing convention.
enum TransferKind {
  // Default/unset — never a valid transfer kind on the wire.
  TRANSFER_KIND_UNSPECIFIED = 0;
  // Portfolio → portfolio within the SAME desk. Economics unchanged; a re-stamp
  // of the routing dimension. Single-control (same owner both ends).
  TRANSFER_KIND_RE_ATTRIBUTE = 1;
  // Portfolio/desk → ANOTHER desk's portfolio. An economic internal cross;
  // requires target-desk acceptance (four-eyes).
  TRANSFER_KIND_DESK_TO_DESK = 2;
  // Trader → trader hand-off (same or different book). Requires recipient
  // acceptance.
  TRANSFER_KIND_TRADER_TO_TRADER = 3;
}

// The transfer lifecycle state (mirrors `celnet_risk_transfer::TransferState`).
enum TransferState {
  // Default/unset — never a valid state on the wire.
  TRANSFER_STATE_UNSPECIFIED = 0;
  // Being composed; not yet submitted.
  TRANSFER_STATE_DRAFT = 1;
  // Submitted, awaiting counterparty acceptance (desk-to-desk / trader-to-trader).
  TRANSFER_STATE_PENDING = 2;
  // Accepted by the counterparty; ready to book.
  TRANSFER_STATE_ACCEPTED = 3;
  // Declined (rejected or expired).
  TRANSFER_STATE_REJECTED = 4;
  // Booked — the legs applied, provenance stamped.
  TRANSFER_STATE_BOOKED = 5;
  // Withdrawn by the initiator before acceptance.
  TRANSFER_STATE_CANCELLED = 6;
}

// Which basis a requested transfer price resolves to (mirrors the request-side
// `celnet_risk_transfer::TransferPrice` discriminant). The `AGREED` arm's numeric
// override rides alongside as an optional scalar on the request/record.
enum TransferPriceBasis {
  // Default/unset — never a valid basis on the wire.
  TRANSFER_PRICE_BASIS_UNSPECIFIED = 0;
  // The live composite mid.
  TRANSFER_PRICE_BASIS_MID = 1;
  // The current independent mark.
  TRANSFER_PRICE_BASIS_MARK_TO_MARKET = 2;
  // An operator-agreed override (requires a reason; flagged for control).
  TRANSFER_PRICE_BASIS_AGREED = 3;
}

// The basis recorded on a booked transfer's immutable provenance (mirrors
// `celnet_risk_transfer::PriceBasis`; the same value set as `TransferPriceBasis`,
// carried on the audit record rather than the request — named distinctly to
// mirror the domain, where the record's `Agreed` carries no value).
enum PriceBasis {
  // Default/unset — never valid on a booked record.
  PRICE_BASIS_UNSPECIFIED = 0;
  // The live composite mid.
  PRICE_BASIS_MID = 1;
  // The current independent mark.
  PRICE_BASIS_MARK_TO_MARKET = 2;
  // An operator-agreed override.
  PRICE_BASIS_AGREED = 3;
}

// One end of a transfer (mirrors `celnet_risk_transfer::TransferLeg`).
message TransferLeg {
  // The risk portfolio (internally a risk-book id).
  string risk_book_id = 1;
  // The desk that owns the book.
  string desk_id = 2;
  // The trader on this end (may be empty on a desk-level target).
  string trader = 3;
  // The positions selected (populated on the source; empty on the target).
  repeated uint64 position_ids = 4;
}

// A pass-through risk vector carried / moved by a transfer (mirrors
// `celnet_risk_transfer::RiskVector`). FX-vanilla desks populate the greeks;
// linear-rates / bond desks populate `dv01`. Irrelevant fields are 0.
message RiskVectorDesc {
  // Sensitivity to a 1bp parallel rate move (linear-rates / bond risk).
  double dv01 = 1;
  // Sensitivity to spot (FX-vanilla delta).
  double delta = 2;
  // Sensitivity of delta to spot (FX-vanilla gamma).
  double gamma = 3;
  // Sensitivity to volatility (FX-vanilla vega).
  double vega = 4;
  // Sensitivity to the passage of time (FX-vanilla theta).
  double theta = 5;
}

// The aggregate risk a transfer moves (mirrors `celnet_risk_transfer::MovedRisk`).
message MovedRiskDesc {
  // Signed base-currency notional moved (+ long risk to target, − short).
  double notional_base = 1;
  // The summed, fraction-scaled pass-through risk vector of the moved slices.
  RiskVectorDesc risk = 2;
}

// The immutable audit record stamped on a Booked transfer (mirrors
// `celnet_risk_transfer::RiskTransferProvenance`, the `PricingProvenance`
// waterfall discipline). Structured, additive, carried on the record.
message RiskTransferProvenance {
  // The transfer's stable slug.
  string transfer_id = 1;
  // The kind of move.
  TransferKind kind = 2;
  // The authenticated initiator.
  string initiated_by = 3;
  // Trusted-source initiation timestamp (epoch nanos, UTC).
  int64 initiated_at = 4;
  // The accepting/approving user (four-eyes); absent for single-control re-attribution.
  optional string approver = 5;
  // When the decision was made (epoch nanos, UTC). Absent until decided.
  optional int64 decided_at = 6;
  // The source book the risk left.
  string source_book_id = 7;
  // The target book the risk arrived in.
  string target_book_id = 8;
  // The positions moved.
  repeated uint64 position_ids = 9;
  // Whether the whole selection moved (Full); else a Partial notional moved.
  bool quantity_full = 10;
  // The Partial notional magnitude moved (absent ⇒ Full).
  optional double partial_notional = 11;
  // The numeric transfer price the legs booked at.
  double transfer_price = 12;
  // Which basis that price came from.
  PriceBasis price_basis = 13;
  // The rationale (required for an agreed price).
  string reason = 14;
  // P&L crystallised in the source at the transfer price versus each slice's mark.
  double realized_pnl_source = 15;
  // The aggregate risk moved from source to target.
  MovedRiskDesc risk_moved = 16;
}

// A risk-transfer request/record (mirrors `celnet_risk_transfer::RiskTransfer`).
// `TransferQuantity`/`TransferPrice` are carried FLAT (a `quantity_full` flag +
// optional `partial_notional`; a `price_basis` enum + optional `agreed_price`).
message RiskTransfer {
  // Stable slug (audit key).
  string id = 1;
  // The kind of move (fixes economics + approval).
  TransferKind kind = 2;
  // The source end — the book/desk/trader the risk leaves, with the positions.
  TransferLeg source = 3;
  // The target end — the book/desk/trader the risk arrives in.
  TransferLeg target = 4;
  // Whether the whole selection moves (Full); else `partial_notional` is moved.
  bool quantity_full = 5;
  // The Partial notional magnitude to move (absent ⇒ Full).
  optional double partial_notional = 6;
  // The requested transfer-price basis.
  TransferPriceBasis price_basis = 7;
  // The agreed override level (present ONLY when `price_basis` is AGREED).
  optional double agreed_price = 8;
  // Free-text rationale (required when `price_basis` is AGREED).
  string reason = 9;
  // The authenticated user who initiated the transfer.
  string initiated_by = 10;
  // Trusted-source initiation timestamp (epoch nanos, UTC).
  int64 initiated_at = 11;
  // The current lifecycle state.
  TransferState state = 12;
  // The accepting/approving user (four-eyes); absent until decided.
  optional string approver = 13;
  // When the accept/reject decision was made (epoch nanos); absent until decided.
  optional int64 decided_at = 14;
  // The resolved numeric transfer price (present once known, on Booked).
  optional double transfer_price = 15;
  // The immutable audit record, stamped on Booked (absent until then).
  optional RiskTransferProvenance provenance = 16;
}

// Initiate a transfer (the ticket). Gated on `risk_transfer` × the position's
// asset class. Re-attribution books immediately (Booked); desk/trader transfers
// return Pending for the counterparty's inbox.
message InitiateRiskTransferRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The kind of move (fixes economics + approval).
  TransferKind kind = 2;
  // The source end (its `position_ids` carry the selection).
  TransferLeg source = 3;
  // The target end.
  TransferLeg target = 4;
  // Whether to move the whole selection (Full); else set `partial_notional`.
  bool quantity_full = 5;
  // The Partial notional magnitude to move (ignored when `quantity_full`).
  optional double partial_notional = 6;
  // The requested transfer-price basis.
  TransferPriceBasis price_basis = 7;
  // The agreed override level (required when `price_basis` is AGREED).
  optional double agreed_price = 8;
  // Free-text rationale (required when `price_basis` is AGREED).
  string reason = 9;
  // Echoed request correlation id.
  optional uint64 correlation_id = 10;
}
// The initiated transfer in its Pending / Booked state.
message InitiateRiskTransferResponse {
  // The transfer record.
  RiskTransfer transfer = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Accept a Pending transfer (target side; four-eyes: approver ≠ initiator,
// server-enforced). Books the legs and stamps provenance.
message AcceptRiskTransferRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The transfer to accept.
  string transfer_id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The transfer in its Booked state.
message AcceptRiskTransferResponse {
  // The booked transfer record (provenance stamped).
  RiskTransfer transfer = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Reject a Pending transfer (target side, with a reason).
message RejectRiskTransferRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The transfer to reject.
  string transfer_id = 2;
  // A short human reason shown to the initiator.
  string reason = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The transfer in its Rejected state.
message RejectRiskTransferResponse {
  // The rejected transfer record.
  RiskTransfer transfer = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Cancel a Pending transfer (initiator only, pre-acceptance).
message CancelRiskTransferRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The transfer to cancel.
  string transfer_id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The transfer in its Cancelled state.
message CancelRiskTransferResponse {
  // The cancelled transfer record.
  RiskTransfer transfer = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// List transfers for the blotter / audit trail, filtered by book / desk / trader
// / state (any absent filter is unrestricted). Entitlement-pruned to what the
// caller may see.
message ListRiskTransfersRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Restrict to this desk (absent ⇒ all entitled desks).
  optional string desk = 2;
  // Restrict to this trader (absent ⇒ all).
  optional string trader = 3;
  // Restrict to transfers touching this risk book as source or target (absent ⇒ all).
  optional string risk_book_id = 4;
  // Restrict to these states (empty ⇒ all states).
  repeated TransferState states = 5;
  // Echoed request correlation id.
  optional uint64 correlation_id = 6;
}
// The matching transfers, newest first.
message ListRiskTransfersResponse {
  // The matching transfer records, newest first (descending `initiated_at`).
  repeated RiskTransfer transfers = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// The per-desk / per-trader transfer inbox pushed to a subscribed client — the
// Pending transfers awaiting the subscriber's accept/reject (the four-eyes
// counterparty side). Fanned out entitlement-filtered by the transfer broker on
// every transfer state change (beside the desk notification push).
message RiskTransferInbox {
  // The transfers currently Pending the subscriber's action, newest first.
  repeated RiskTransfer pending = 1;
  // Snapshot time (epoch nanos, UTC).
  int64 at_nanos = 2;
}
// Open one long-lived transfer-inbox subscription for the caller's desks/identity.
message StreamRiskTransferInboxRequest {
  // The bearer session token from `AuthService.Login`.
  optional string session_token = 1;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 2;
  // Optional caller correlation id, echoed by the server. Presence-tracked.
  optional uint64 correlation_id = 3;
}

// ===========================================================================
// instrument reference data — the persisted, admin-managed registry of
// instrument DEFINITIONS (static / reference data) that curve-building and
// pricing later resolve against
// (`docs/CURVES-AND-INSTRUMENT-REFERENCE-DATA-REVIEW.md` §C). Each definition is
// keyed by a stable internal `instrument_id` slug, carries external-identifier
// cross-refs, and exactly one family-specific convention block. This phase is
// the REGISTRY + CRUD only — no curve/pricing rewiring (that is the next,
// separate task). Convention labels reuse the engine vocabularies so the
// registry can never drift from what the engine can resolve: `day_count` is a
// `celnet_rates::AccrualBasis` label (`act_360` / `act_365_fixed` /
// `thirty_360_bond_basis`, plus `act_act` for bonds), `business_day_convention`
// a `celnet_calendar::RollRule` label (`unadjusted` / `following` / `preceding`
// / `modified_following`), each `calendars` entry a `celnet_calendar::CentreId`
// label (e.g. `united_states`, `target2`), and a leg `*_frequency` a
// `celnet_rates::PaymentFrequency` label (`annual` / `semi_annual` /
// `quarterly`). Market quotes are NOT static and are never stored here.
// ===========================================================================

// One external-identifier cross-reference for an instrument: a `(scheme, value)`
// pair, e.g. `(isin, "US912828YL83")`. `scheme` is one of the canonical
// snake_case tokens `isin`, `cusip`, `sedol`, `figi`, `ticker`, `internal`; an
// unknown token is rejected at the boundary, never silently dropped. The
// `(scheme, value)` pair is unique across the whole registry.
message ExternalId {
  // The identifier scheme token (`isin`/`cusip`/`sedol`/`figi`/`ticker`/`internal`).
  string scheme = 1;
  // The identifier value under that scheme (verbatim).
  string value = 2;
}

// Rates — a cash money-market DEPOSIT definition (the conventional front pillar
// of a curve build). The market deposit rate is a quote, not static, so it is
// not carried here.
message DepositDef {
  // The reference overnight/term index token (e.g. `sofr`); required.
  string index = 1;
  // The deposit tenor token (e.g. `ON`, `TN`, `1W`, `1M`, `3M`), or an explicit
  // broken-date maturity expressed as a token; required.
  string tenor = 2;
  // Accrual day-count label (`act_360` typical for USD money market); required.
  string day_count = 3;
  // Business-day convention label (`modified_following` typical); required.
  string business_day_convention = 4;
  // Settlement calendar centre labels (at least one; e.g. `united_states`).
  repeated string calendars = 5;
  // Spot/settlement lag in business days (T+2 typical; T+0 for SOFR-style).
  uint32 spot_lag_days = 6;
}

// Rates — a forward rate agreement (FRA) definition: a single-period `[T1,T2]`
// forward window on a projected float index. The contractual/market FRA rate is
// a quote and is not stored here.
message FraDef {
  // The projected float index token (e.g. `sofr`, `term_sofr_3m`); required.
  string float_index = 1;
  // The window start / fixing tenor token (e.g. `3M`) or broken-date token; required.
  string start_tenor = 2;
  // The window end / maturity tenor token (e.g. `6M`) or broken-date token; required.
  string end_tenor = 3;
  // Accrual day-count label for the `tau` basis (`act_360` typical); required.
  string accrual_day_count = 4;
  // Business-day convention label; required.
  string business_day_convention = 5;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 6;
  // Spot/settlement lag in business days.
  uint32 spot_lag_days = 7;
}

// Rates — a short-term-interest-rate (STIR) futures contract definition. The
// price/futures-rate is a quote and is not stored here; the convexity vol is a
// debias parameter (0 ⇒ no adjustment).
message StirFutureDef {
  // The listed contract code (e.g. `SR3H6`); required.
  string contract_code = 1;
  // The fixing-window start tenor/date token; required.
  string reference_start = 2;
  // The fixing-window end tenor/date token; required.
  string reference_end = 3;
  // Accrual day-count label (`act_360` typical); required.
  string day_count = 4;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 5;
  // The convexity-adjustment volatility (σ) used to debias the futures rate; 0 ⇒
  // no adjustment. Carried with the definition for the future hedge/curve phase.
  double convexity_vol = 6;
  // The contract notional/size in the currency (0 ⇒ unspecified); for the future
  // DV01→hedge-count math. Optional.
  double contract_size = 7;
}

// Rates — a vanilla fixed-vs-float interest-rate swap (IRS) definition with its
// full per-leg convention block. The par/fixed rate is a quote, not stored here.
message VanillaIrsDef {
  // The swap tenor token (e.g. `5Y`) or broken-date maturity token; required.
  string tenor = 1;
  // Fixed-leg payment frequency label (`annual`/`semi_annual`/`quarterly`); required.
  string fixed_frequency = 2;
  // Fixed-leg accrual day-count label (`thirty_360_bond_basis` for USD); required.
  string fixed_day_count = 3;
  // The float-leg projected index token (e.g. `sofr`, `term_sofr_3m`); required.
  string float_index = 4;
  // Float-leg payment frequency label; required.
  string float_frequency = 5;
  // Float-leg accrual day-count label (`act_360` typical); required.
  string float_day_count = 6;
  // Business-day convention label; required.
  string business_day_convention = 7;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 8;
  // Period-generation roll convention token (`eom`/`imm`/`none`); optional, blank ⇒ `none`.
  string roll_convention = 9;
  // Spot/settlement lag in business days.
  uint32 spot_lag_days = 10;
}

// Rates — an overnight-indexed swap (OIS) definition: fixed vs compounded
// overnight float on a single self-discounting curve. The par fixed rate is a
// quote, not stored here.
message OisDef {
  // The swap tenor token (e.g. `2Y`) or broken-date maturity token; required.
  string tenor = 1;
  // The overnight index token (e.g. `sofr`); required.
  string index = 2;
  // Fixed-leg payment frequency label (`annual` typical for USD-SOFR); required.
  string fixed_frequency = 3;
  // Fixed-leg accrual day-count label (`act_360` for USD-SOFR); required.
  string fixed_day_count = 4;
  // Float (compounded-ON) leg accrual day-count label (`act_360`); required.
  string float_day_count = 5;
  // Business-day convention label; required.
  string business_day_convention = 6;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 7;
  // Spot/settlement lag in business days.
  uint32 spot_lag_days = 8;
}

// A cash-bond DEFINITION (no bond pricer yet — this feeds the future bond
// pricing path and the FI deal blotter, `docs/FI-BOND-DEAL-CAPTURE-GAP-ANALYSIS.md`).
// ISIN/CUSIP live in the instrument's `external_ids`; the redemption/face and
// dates live here. `coupon_frequency` is blank for a zero-coupon bond.
message BondDef {
  // The issuer name (or LEI), e.g. `US Treasury`; required.
  string issuer = 1;
  // The annual coupon rate as a decimal (0.05 = 5%); 0 for zeros/FRNs.
  double coupon_rate = 2;
  // The coupon type token (`fixed`/`frn`/`zero`); required.
  string coupon_type = 3;
  // Coupon payment frequency label (`annual`/`semi_annual`/`quarterly`); blank for `zero`.
  string coupon_frequency = 4;
  // Accrual day-count label (`act_act`/`thirty_360_bond_basis`/`act_365_fixed`); required.
  string day_count = 5;
  // The issue date; optional.
  optional BrokenDate issue_date = 6;
  // The dated (interest-accrual-start) date; optional.
  optional BrokenDate dated_date = 7;
  // The first-coupon date (drives a short/long stub); optional.
  optional BrokenDate first_coupon_date = 8;
  // The maturity (final-redemption) date; required.
  BrokenDate maturity_date = 9;
  // The par redemption / face value (e.g. 100); required, strictly positive.
  double redemption = 10;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 11;
}

// One instrument definition in the reference-data registry: the common header
// (`instrument_id` key, human `name`/`description`, `currency`, external-id
// cross-refs) plus exactly one family-specific convention block.
message InstrumentDefDesc {
  // The stable internal id (a slug); the registry key. Unique across the registry.
  string instrument_id = 1;
  // Human-friendly label for blotters/GUI.
  string name = 2;
  // Optional longer human description.
  string description = 3;
  // ISO 4217 pricing/settlement currency.
  string currency = 4;
  // External-identifier cross-refs (ISIN/CUSIP/SEDOL/FIGI/ticker/internal); each
  // `(scheme, value)` pair is unique across the whole registry.
  repeated ExternalId external_ids = 5;
  // The sub-asset-type taxonomy label — what KIND of risk this instrument is,
  // within its family: `government` / `corporate` for a cash bond,
  // `government_future` for a listed Treasury future, `rate_future` for a STIR
  // contract. Carried explicitly rather than inferred from the issuer name,
  // because inferring it means a corporate can be silently advertised as
  // government risk. Empty when the definition carries no classification.
  string sub_asset_type = 13;
  // The region taxonomy label (`us` / `uk` / `de` / `fr` / `it`; the EUR issuers
  // roll up to `eu`). Empty when unclassified.
  string region = 14;
  // The family-specific convention block: exactly one variant is set.
  oneof definition {
    // A cash money-market deposit.
    DepositDef deposit = 6;
    // A forward rate agreement.
    FraDef fra = 7;
    // A STIR futures contract.
    StirFutureDef stir_future = 8;
    // A vanilla fixed-vs-float IRS.
    VanillaIrsDef vanilla_irs = 9;
    // An overnight-indexed swap.
    OisDef ois = 10;
    // A cash bond.
    BondDef bond = 11;
    // A listed bond (Treasury) futures contract.
    BondFutureDef bond_future = 12;
  }
}

// Rates — a listed **bond (Treasury) futures** contract: the benchmark hedge vehicle
// an interest-rate exposure is transferred into. Every field is a published contract
// term (CBOT rulebook chapters 18/19/20/21/26/40) except `dv01_per_contract_at_notional_yield`,
// which is derived — see its comment.
message BondFutureDef {
  // The listed contract code (product symbol + delivery-month letter + two-digit
  // year, e.g. `ZNZ26`); required.
  string contract_code = 1;
  // The product symbol without the delivery month (`ZT`/`ZF`/`ZN`/`TN`/`ZB`/`UB`).
  string contract_symbol = 2;
  // The issuer of the deliverable securities, e.g. `US Treasury`.
  string underlying_issuer = 3;
  // Face value at maturity of the deliverable, per contract (e.g. 100000).
  double contract_face_value = 4;
  // The minimum price increment for an OUTRIGHT trade, in points of 100 face.
  double tick_size_points = 5;
  // The cash value of one minimum price increment, per contract.
  double tick_value = 6;
  // The notional coupon the contract's conversion factor is defined against
  // (0.06 = 6% for every CBOT Treasury futures contract).
  double notional_coupon_rate = 7;
  // Shortest remaining term to maturity, in months, a deliverable security may have.
  uint32 deliverable_min_months = 8;
  // Longest remaining term to maturity, in months, a deliverable security may have.
  uint32 deliverable_max_months = 9;
  // The first calendar day of the delivery month — the date the rulebook measures a
  // deliverable's remaining term from.
  BrokenDate delivery_month_start = 10;
  // The first delivery day (first business day of the delivery month).
  BrokenDate first_delivery_date = 11;
  // The last day the contract trades.
  BrokenDate last_trading_date = 12;
  // The last delivery day.
  BrokenDate last_delivery_date = 13;
  // The contract's STANDARDIZED DV01 per contract, in the contract currency per basis
  // point, evaluated at the contract's own 6% notional yield. DERIVED, not published:
  // a futures contract has no constant basis-point value — the live figure is the
  // cheapest-to-deliver security's DV01 divided by its conversion factor and moves
  // daily. This field is the stable, displayable figure; a hedge must be sized off the
  // live curve yield instead (it understates the live value whenever yields are
  // below 6%).
  double dv01_per_contract_at_notional_yield = 14;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 15;
}

// List the instrument definitions in the registry (any authenticated caller —
// curve-building and pricing read this, so it is NOT admin-only).
message ListInstrumentsRequest {
  // The caller's bearer token (must resolve to an authenticated user).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The instrument definitions, in creation order.
message ListInstrumentsResponse {
  // Every registered instrument definition.
  repeated InstrumentDefDesc instruments = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Resolve a single instrument definition by its internal id (any authenticated
// caller).
message GetInstrumentRequest {
  // The caller's bearer token (must resolve to an authenticated user).
  string session_token = 1;
  // The internal `instrument_id` to resolve.
  string instrument_id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The resolved instrument definition.
message GetInstrumentResponse {
  // The resolved definition (absent ⇒ no instrument with that id).
  InstrumentDefDesc instrument = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Create an instrument definition (admin only). A blank `instrument_id` is minted
// from the `name`; a provided id must be unique.
message CreateInstrumentRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The definition to create (its `instrument_id` may be blank to auto-mint).
  InstrumentDefDesc instrument = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created definition (with its minted/validated id).
message CreateInstrumentResponse {
  // The stored definition.
  InstrumentDefDesc instrument = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing instrument definition by its id (admin only).
message UpdateInstrumentRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The definition to store; its `instrument_id` selects the existing record.
  InstrumentDefDesc instrument = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The updated definition.
message UpdateInstrumentResponse {
  // The stored definition.
  InstrumentDefDesc instrument = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete an instrument definition by its id (admin only).
message DeleteInstrumentRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The internal `instrument_id` to delete.
  string instrument_id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteInstrumentResponse {
  // Whether an instrument was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// One capability on the wire: an action label crossed with an asset-class label.
// The labels are the entitlement kernel's canonical snake_case tokens (e.g.
// `execute` × `fixed_income`); they round-trip exactly and an unknown token is
// rejected, never silently dropped. This is the admin-overlay encoding — not the
// authorization decision, which the server still makes from the resolved set.
message CapabilityDesc {
  // The action label: one of `view`, `price`, `quote_respond`, `rfq_respond`,
  // `ioi_respond`, `stream`, `execute`, `book`, `risk_transfer`, `simulate`,
  // `administer`.
  string action = 1;
  // The asset-class label: `fx_options` or `fixed_income`.
  string asset = 2;
}

// Read a user's capability overlay and resolved effective set (admin only).
message GetUserCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user whose capabilities are read.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// A user's per-user overlay plus the fully-resolved decision surface.
message GetUserCapabilitiesResponse {
  // The per-user grants that widen authority beyond the role bundle.
  repeated CapabilityDesc grants = 1;
  // The per-user denies that narrow it (deny wins over any grant).
  repeated CapabilityDesc denies = 2;
  // The set the access boundary actually admits — role bundle ∪ grants ∖ denies,
  // enumerated over every action × asset. This is what a GUI gates affordances on.
  repeated CapabilityDesc effective = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// Replace a user's capability overlay (admin only). `grants`/`denies` are the full
// new overlay (not a delta); the change persists and revokes the target's live
// sessions so it takes effect on their next request.
message SetUserCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user whose overlay is replaced.
  string id = 2;
  // The new grants (widen beyond the role bundle).
  repeated CapabilityDesc grants = 3;
  // The new denies (narrow it; deny wins).
  repeated CapabilityDesc denies = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The overlay after the update, plus the resolved effective set (an admin
// read-back: it shows exactly what the change now admits).
message SetUserCapabilitiesResponse {
  // The grants now in effect.
  repeated CapabilityDesc grants = 1;
  // The denies now in effect.
  repeated CapabilityDesc denies = 2;
  // The fully-resolved effective set after the change.
  repeated CapabilityDesc effective = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// Read a role's capability bundle — the base authority the role confers before
// any per-user overlay (admin only).
message GetRoleCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The role whose bundle is read.
  UserRole role = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// A role's resolved capability bundle.
message GetRoleCapabilitiesResponse {
  // The capabilities the role confers as its base. For ADMIN this is the full
  // action × asset surface (grant-all, immutable); for a non-admin role it is the
  // admin-editable bundle, defaulting to every action but `administer` on both
  // asset classes when none has been stored.
  repeated CapabilityDesc capabilities = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace a role's capability bundle (admin only). `capabilities` is the full new
// bundle (not a delta); the change persists and revokes the live sessions of every
// user holding the role so it takes effect on their next login. The ADMIN role is
// grant-all and immutable — setting it is rejected with `failed_precondition`.
message SetRoleCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The non-admin role whose bundle is replaced.
  UserRole role = 2;
  // The new base capability bundle for the role.
  repeated CapabilityDesc capabilities = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The role's bundle after the update (an admin read-back).
message SetRoleCapabilitiesResponse {
  // The capabilities now in effect as the role's base.
  repeated CapabilityDesc capabilities = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// One calibrating quote for a `BuildCurve` request: a reference-data instrument id
// paired with its observed market quote. The id resolves against the instrument
// registry (the same roster `ListInstruments` serves); the quote is the
// instrument's calibration observable in decimal terms — a deposit/FRA/par-swap
// fixed rate, or a STIR future's `(100 - price) / 100` futures rate per its def.
message InstrumentQuote {
  // The registry instrument id to resolve (e.g. `usd-irs-10y`).
  string instrument_id = 1;
  // The observed calibrating quote as a decimal (0.0405 = 4.05%).
  double quote = 2;
}

// A standalone date-anchored calibration pillar: a synthetic money-market cash
// deposit running from the curve's reference (spot) date to an explicit maturity
// date, quoted as its simple ACT/360 rate. Lets a trader pin the curve to an
// arbitrary date (a turn, an IMM, a central-bank meeting) without a registry
// instrument that happens to mature there. The server resolves it to the same
// closed-form deposit pillar (DF = 1/(1 + r*tau)) the bootstrap already consumes.
message DatePillar {
  // The pillar maturity date the synthetic deposit runs to (after the reference date).
  BrokenDate maturity_date = 1;
  // The observed simple ACT/360 rate to that date as a decimal (0.0415 = 4.15%).
  double quote = 2;
}

// A request to bootstrap a single-currency discount curve from registry-referenced
// instruments. The server resolves each pillar id against the reference-data
// registry, rebuilds its schedule from the reference date, and runs the sequential
// (acyclic) bootstrap. Pillars may arrive in any order — the server orders them by
// resolved maturity. At least one pillar is required.
message BuildCurveRequest {
  // Caller-supplied correlation token, echoed back on the result.
  string request_id = 1;
  // ISO 4217 currency of the curve (the set must be single-currency).
  string currency = 2;
  // The curve reference (spot-anchor / value) date the pillar schedules roll from.
  BrokenDate reference_date = 3;
  // The calibrating instrument quotes; maturity order not required. At least one
  // calibrating pillar (instrument-referenced or date-anchored) must be supplied.
  repeated InstrumentQuote pillars = 4;
  // Session token of the authenticated caller (any authenticated caller may build).
  string session_token = 5;
  // Standalone date-anchored pillars, calibrated alongside the instrument pillars.
  repeated DatePillar date_pillars = 6;
}

// One bootstrapped pillar of a `CalibratedCurve`: the resolved curve coordinate and
// discount factor at one calibrating instrument's maturity.
message CalibratedCurvePoint {
  // The input instrument id this pillar calibrates; empty for a date-anchored pillar.
  string instrument_id = 1;
  // The pillar maturity on the ACT/365F curve year-fraction axis.
  double time_years = 2;
  // The bootstrapped discount factor at `time_years`.
  double discount_factor = 3;
  // The continuously-compounded zero rate at `time_years` (decimal).
  double zero_rate = 4;
  // A display label for the pillar: the date-anchored pillar's `Date YYYY-MM-DD`,
  // or empty for an instrument pillar (the client resolves its name by id).
  string label = 5;
}

// A bootstrapped discount curve: the calibrated pillar points (one per input
// instrument, ordered short to long by maturity) plus the echoed request header.
message CalibratedCurve {
  // Echoed `BuildCurveRequest.request_id`.
  string request_id = 1;
  // ISO 4217 currency of the curve.
  string currency = 2;
  // The curve reference (spot-anchor) date, echoed from the request.
  BrokenDate reference_date = 3;
  // The bootstrapped pillars, ordered short to long by maturity.
  repeated CalibratedCurvePoint points = 4;
}

// Server-enforced authentication + user/desk administration. Login mints a bearer
// token the server validates on every subsequent RPC; administrative RPCs require
// the resolved identity to be an admin. Accounts persist to disk and a default
// admin is seeded on first run.
service AuthService {
  // Exchange email + password for a session token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Invalidate the caller's session token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // List all users (admin only).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Create a user (admin only).
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Update a user's profile/role/desk/disabled flag (admin only).
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Delete a user (admin only).
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Set a user's password (admin only).
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Read a user's capability overlay + resolved effective set (admin only).
  rpc GetUserCapabilities(GetUserCapabilitiesRequest) returns (GetUserCapabilitiesResponse);
  // Replace a user's capability overlay (admin only).
  rpc SetUserCapabilities(SetUserCapabilitiesRequest) returns (SetUserCapabilitiesResponse);
  // Read a role's capability bundle — its base authority (admin only).
  rpc GetRoleCapabilities(GetRoleCapabilitiesRequest) returns (GetRoleCapabilitiesResponse);
  // Replace a non-admin role's capability bundle (admin only).
  rpc SetRoleCapabilities(SetRoleCapabilitiesRequest) returns (SetRoleCapabilitiesResponse);
  // List all desks (admin only).
  rpc ListDesks(ListDesksRequest) returns (ListDesksResponse);
  // Create a desk (admin only).
  rpc CreateDesk(CreateDeskRequest) returns (CreateDeskResponse);
  // Rename a desk's display name (admin only); routing keys on the immutable id.
  rpc UpdateDesk(UpdateDeskRequest) returns (UpdateDeskResponse);
  // Delete a desk (admin only).
  rpc DeleteDesk(DeleteDeskRequest) returns (DeleteDeskResponse);
  // List the named legal entities / accounts (any authenticated caller — the rates
  // booking form reads this to offer named entity choices, so it is NOT admin-only).
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  // Create a named legal entity / account (admin only).
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);
  // Update a named legal entity / account (admin only).
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  // Delete a named legal entity / account (admin only). Rejected while any book
  // still references it.
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);
  // List the named netting books (any authenticated caller — the rates booking form
  // reads this to offer named book choices, so it is NOT admin-only).
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  // Create a named netting book under an entity (admin only).
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
  // Update a named netting book (admin only).
  rpc UpdateBook(UpdateBookRequest) returns (UpdateBookResponse);
  // Delete a named netting book (admin only).
  rpc DeleteBook(DeleteBookRequest) returns (DeleteBookResponse);
  // List the aggregated books (any authenticated caller — a book's composite is
  // global and readable by any user, so this is NOT admin-only).
  rpc ListAggregatedBooks(ListAggregatedBooksRequest) returns (ListAggregatedBooksResponse);
  // Define a new aggregated book (admin only).
  rpc CreateAggregatedBook(CreateAggregatedBookRequest) returns (CreateAggregatedBookResponse);
  // Replace an existing aggregated book's definition (admin only).
  rpc UpdateAggregatedBook(UpdateAggregatedBookRequest) returns (UpdateAggregatedBookResponse);
  // Delete an aggregated book (admin only).
  rpc DeleteAggregatedBook(DeleteAggregatedBookRequest) returns (DeleteAggregatedBookResponse);
  // Set the firm-wide pricing kill-switch (server-only control plane). Gated on the
  // fixed-income liquidity-management capability (same bar as UpdateAggregatedBook).
  rpc SetPricingControl(SetPricingControlRequest) returns (SetPricingControlResponse);
  // List the pricing groups (any authenticated caller — the roster is readable for
  // the GUI, so this is NOT admin-only).
  rpc ListPricingGroups(ListPricingGroupsRequest) returns (ListPricingGroupsResponse);
  // Define a new pricing group (admin only — the group STRUCTURE + members).
  rpc CreatePricingGroup(CreatePricingGroupRequest) returns (CreatePricingGroupResponse);
  // Replace an existing pricing group's definition (admin only).
  rpc UpdatePricingGroup(UpdatePricingGroupRequest) returns (UpdatePricingGroupResponse);
  // Delete a pricing group (admin only).
  rpc DeletePricingGroup(DeletePricingGroupRequest) returns (DeletePricingGroupResponse);
  // Retune ONLY a pricing group's outbound pipeline for one mode + the share flag.
  // Callable by any authenticated caller holding the fixed-income quote-respond
  // capability (NOT admin-gated); the group's structure/membership stay admin-owned.
  rpc UpdatePricingGroupPipeline(UpdatePricingGroupPipelineRequest) returns (UpdatePricingGroupPipelineResponse);
  // Risk routing & risk books (admin only — a risk-management function). List /
  // create / update / delete the hierarchical risk-book registry, and read / replace
  // the firm-wide routing graph. Every write pushes the live graph into the position
  // store's router (`docs/FI-RISK-ROUTING-REQUIREMENTS.md` §7).
  rpc ListRiskBooks(ListRiskBooksRequest) returns (ListRiskBooksResponse);
  rpc CreateRiskBook(CreateRiskBookRequest) returns (CreateRiskBookResponse);
  rpc UpdateRiskBook(UpdateRiskBookRequest) returns (UpdateRiskBookResponse);
  rpc DeleteRiskBook(DeleteRiskBookRequest) returns (DeleteRiskBookResponse);
  rpc GetRiskRoutingGraph(GetRiskRoutingGraphRequest) returns (GetRiskRoutingGraphResponse);
  rpc UpdateRiskRoutingGraph(UpdateRiskRoutingGraphRequest) returns (UpdateRiskRoutingGraphResponse);
  // Auto-hedging / risk-internalisation (Phase B — `docs/AUTO-HEDGING-AND-
  // INTERNALISATION-REQUIREMENTS.md`). The hedge-policy exit graph (get/update), the
  // warehouse thresholds (list/upsert), the engine config (kill-switch / advisory /
  // rate guards) and the fired-hedge provenance audit trail. Authoring/arming gates on
  // the narrow `hedge` capability × asset (distinct from `book`, which gates the
  // booking-class legs the engine itself fires). Advisory intents stream over the
  // existing notification channel (a hedge-advisory notification kind).
  rpc GetHedgePolicyGraph(GetHedgePolicyGraphRequest) returns (GetHedgePolicyGraphResponse);
  rpc UpdateHedgePolicyGraph(UpdateHedgePolicyGraphRequest) returns (UpdateHedgePolicyGraphResponse);
  rpc ListHedgeThresholds(ListHedgeThresholdsRequest) returns (ListHedgeThresholdsResponse);
  rpc UpdateHedgeThreshold(UpdateHedgeThresholdRequest) returns (UpdateHedgeThresholdResponse);
  rpc ListHedgeProvenance(ListHedgeProvenanceRequest) returns (ListHedgeProvenanceResponse);
  // The DECISION JOURNAL — every evaluation of the acceptance / risk-routing / hedge
  // graphs, including the ones that deliberately did NOTHING (a WAREHOUSE leaf, a
  // kill-switched desk, a rate guard, a graph that never ran), each with its walked
  // path and its stated reason. This is the audit log a trader reads to answer "why
  // did acceptance turn that away" and "why did the hedge rule not fire". `ListRuleAdvice`
  // derives rule suggestions from the SAME recorded rows and cites them.
  rpc ListDecisionJournal(ListDecisionJournalRequest) returns (ListDecisionJournalResponse);
  rpc ListRuleAdvice(ListRuleAdviceRequest) returns (ListRuleAdviceResponse);
  rpc GetHedgeConfig(GetHedgeConfigRequest) returns (GetHedgeConfigResponse);
  rpc SetHedgeConfig(SetHedgeConfigRequest) returns (SetHedgeConfigResponse);
  rpc ListHedgeSuggestions(ListHedgeSuggestionsRequest) returns (ListHedgeSuggestionsResponse);
  rpc ExecuteHedgeSuggestion(ExecuteHedgeSuggestionRequest) returns (ExecuteHedgeSuggestionResponse);
  // Incoming-quote acceptance (the third trader-configurable rule engine —
  // `celnet-acceptance`). Read / replace the firm-wide acceptance decision graph that
  // gates whether an inbound counterparty lift is ACCEPTED, REJECTED, or HELD for
  // manual review at the acceptance point (the future home for credit checks + quote
  // validations). Authoring gates on the narrow `manage_acceptance` capability × asset.
  // Every write pushes the live graph into the rates store's acceptance snapshot the
  // FIX acceptance point evaluates.
  rpc GetAcceptanceGraph(GetAcceptanceGraphRequest) returns (GetAcceptanceGraphResponse);
  rpc UpdateAcceptanceGraph(UpdateAcceptanceGraphRequest) returns (UpdateAcceptanceGraphResponse);
  // Aggregate risk per risk book, rolled up the book tree (phase 5 — §5, §8.5).
  rpc ListRiskBookRisk(ListRiskBookRiskRequest) returns (ListRiskBookRiskResponse);
  // Risk transfer — the MANUAL move of EXISTING risk between books / desks /
  // traders (`docs/RISK-TRANSFER-REQUIREMENTS.md`; the complement to routing).
  // Initiate/accept/reject/cancel a transfer + query the audit blotter. Gated on
  // the narrow `risk_transfer` capability × the position's asset class (NOT admin);
  // a desk-to-desk / trader-to-trader accept enforces approver ≠ initiator
  // (four-eyes). Beside the risk-book / routing RPCs (mirror precedent).
  rpc InitiateRiskTransfer(InitiateRiskTransferRequest) returns (InitiateRiskTransferResponse);
  rpc AcceptRiskTransfer(AcceptRiskTransferRequest) returns (AcceptRiskTransferResponse);
  rpc RejectRiskTransfer(RejectRiskTransferRequest) returns (RejectRiskTransferResponse);
  rpc CancelRiskTransfer(CancelRiskTransferRequest) returns (CancelRiskTransferResponse);
  rpc ListRiskTransfers(ListRiskTransfersRequest) returns (ListRiskTransfersResponse);
  // Cross-product client-flow analytics — the per-client / per-counterparty /
  // per-instrument / per-asset flow + P&L-attribution rollup ($/mm, spread
  // economics, quote-fishing) over what the desk priced and traded
  // (`docs/ANALYTICS-REQUIREMENTS.md` §11). A management-sensitive read gated on
  // the dedicated `view_analytics` capability × the caller's assets (spans FI+FXO,
  // NOT admin-only). Read-only; a pure fold over already-captured quote/deal data.
  rpc ListClientFlowMetrics(ListClientFlowMetricsRequest) returns (ListClientFlowMetricsResponse);
  // Street-side / LP liquidity analytics — the per-LP tick-rate, deals-won (+ won
  // notional), missed-deals, last-look-rejects, win-rate and mean cover-distance
  // rollup over what each liquidity provider ticked and competed for
  // (`docs/ANALYTICS-REQUIREMENTS.md` §2.4). Read-only; a pure fold over the
  // aggregation-hub ingest tally + the RFQ panel history. Gated on the same
  // `view_analytics` capability × the caller's assets (spans FI+FXO, NOT admin-only).
  rpc ListLpFlowMetrics(ListLpFlowMetricsRequest) returns (ListLpFlowMetricsResponse);
  // Street-side EXECUTION analytics — the order-level companion to the LP league
  // table: one row per OUTBOUND street order (what went out, to which LP, on what
  // product, requested vs filled, price + slippage, outcome + reason, the panel it
  // was ranked against, and its parent hedge) plus the aggregated breakdown on any
  // grouping axis. Read-only; a pure fold over the bounded street-order log. Same
  // `view_analytics` × asset gate as the league table.
  rpc ListStreetOrders(ListStreetOrdersRequest) returns (ListStreetOrdersResponse);
  // Latency / Ops analytics — the per-stage tick-to-quote / tick-to-trade latency
  // snapshot (p50/p99/p99.9/max per pipeline stage) + telemetry ring health,
  // folded off the pinned hot core from the observability HdrHistograms
  // (`docs/LATENCY-AND-HEDGING-ANALYTICS-REQUIREMENTS.md` Part 1). Gated on the
  // same `view_analytics` capability × the caller's assets (spans FI+FXO).
  rpc ListLatencyMetrics(ListLatencyMetricsRequest) returns (ListLatencyMetricsResponse);
  // Fetch the full ordered stage-event list of one lift trace by id — the
  // per-trace COMPLEMENT to the aggregate `ListLatencyMetrics` histograms. Gated
  // on the same cross-asset `view_analytics` capability.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  // List recent lift traces (summary rows, newest first, bounded + filterable).
  // Same `view_analytics` gate as `GetTrace`.
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse);
  // List the instrument reference-data definitions (any authenticated caller —
  // curve-building and pricing resolve against this, so it is NOT admin-only).
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
  // Resolve one instrument definition by its internal id (any authenticated caller).
  rpc GetInstrument(GetInstrumentRequest) returns (GetInstrumentResponse);
  // Create an instrument definition (admin only).
  rpc CreateInstrument(CreateInstrumentRequest) returns (CreateInstrumentResponse);
  // Replace an instrument definition (admin only).
  rpc UpdateInstrument(UpdateInstrumentRequest) returns (UpdateInstrumentResponse);
  // Delete an instrument definition (admin only).
  rpc DeleteInstrument(DeleteInstrumentRequest) returns (DeleteInstrumentResponse);
  // Bootstrap a single-currency discount curve from registry-referenced instruments.
  rpc BuildCurve(BuildCurveRequest) returns (CalibratedCurve);
}

// ===========================================================================
// rates — linear interest-rate term structure & instruments (fixed income)
// ===========================================================================
//
// The fixed-income linear-rates arm (`docs/fixed-income/FI-ARCHITECTURE.md`),
// backed by the `celnet-rates` engine. A `CurveSet` is the calibrated rates
// market a `RatesInstrument` prices against: for the USD-SOFR P0 it is the single
// self-discounting SOFR OIS curve, defined by its dated par-OIS pillars so the
// server bootstraps it deterministically (sequential, acyclic) and any client
// reproduces byte-identical discount factors. The contract is additive (rule 9):
// new instrument arms and curve kinds extend the oneofs at the next free field
// number, never renumbering, and no arm appears on the wire before it can be
// priced end-to-end (no placeholder arms).

// The maturity point of a curve pillar, measured from the `CurveSet` reference
// (spot-anchor) date. Exactly one arm is set:
//
// * `years`: a regular whole-year tenor (e.g. 1, 2, 5, 10) on the canonical liquid grid; must be >= 1.
// * `months`: a month tenor (e.g. 3, 18, 30) for sub-year or broken (non-integer-year) pillars; must be >= 1.
// * `maturity_date`: an explicit odd-dated ("broken date") maturity — the civil YYYY-MM-DD the final period rolls to (e.g. an IMM or turn date that no whole tenor names).
//
// The server resolves the arm to a roll-adjusted maturity date and rebuilds the
// pillar's USD-SOFR fixed-leg schedule from it, so only the economic locator
// travels on the wire. A whole-year `years = n` and the equivalent dated arm
// resolve to byte-identical schedules.
message PillarTenor {
  // The maturity locator: exactly one arm is set.
  oneof point {
    // A regular whole-year tenor from spot (e.g. 1, 2, 5, 10); must be >= 1.
    uint32 years = 1;
    // A month tenor from spot (e.g. 3, 18, 30) for sub-/broken-year pillars; >= 1.
    uint32 months = 2;
    // An explicit odd-dated ("broken date") maturity the final period rolls to.
    BrokenDate maturity_date = 3;
  }
}

// One calibrating pillar of a self-discounting OIS curve: the observed par (fair
// fixed) rate of the spot-starting USD-SOFR OIS maturing at the given pillar
// point. The pillar's schedule (modified-following US calendar, ACT/360 accrual,
// ACT/365F discount time) is reconstructed server-side from the `CurveSet`
// reference date and this tenor, so only the economic quote travels on the wire.
message OisPillar {
  // Where this pillar matures — a whole-year tenor, a month tenor, or an
  // explicit broken-date maturity. See `PillarTenor`.
  PillarTenor tenor = 1;
  // The observed par (fair fixed) rate as a decimal (0.0405 = 4.05%).
  double par_rate = 2;
}

// A calibrated set of interest-rate curves — the rates market an instrument is
// priced against. For USD-SOFR (the P0 arm) this is exactly one self-discounting
// SOFR curve, carried as its dated par-OIS pillars plus the reference
// (spot-anchor) date; the server bootstraps the discount/forward term structure
// from them. Additive: a multi-curve (basis) generalisation adds further pillar
// sets at the next free field numbers without reshaping this message.
message CurveSet {
  // ISO 4217 currency of the curve (USD for the P0 arm). Carried for forward
  // generalisation; a non-USD curve is rejected until the multi-currency arm
  // ships (never silently mispriced).
  string currency = 1;
  // The curve reference (spot-anchor) civil date the pillar schedules roll from.
  BrokenDate reference_date = 2;
  // The self-discounting OIS pillars, in strictly increasing tenor order. At
  // least one pillar is required; duplicate or out-of-order tenors are rejected.
  repeated OisPillar ois_pillars = 3;
}

// An overnight-indexed swap (OIS) — fixed vs compounded overnight floating, on a
// single self-discounting curve. The schedule is the spot-starting USD-SOFR
// schedule of `tenor_years`, reconstructed server-side from the `CurveSet`
// reference date. `side` is taken from the client's perspective: SIDE_BUY pays
// fixed (payer swap, long the floating leg); SIDE_SELL receives fixed.
message OisInstrument {
  // The swap tenor in whole years from spot (e.g. 2, 5, 10). Must be >= 1.
  uint32 tenor_years = 1;
  // The fixed-leg rate as a decimal (0.041 = 4.10%).
  double fixed_rate = 2;
  // The notional in the curve currency (always positive; direction is `side`).
  double notional = 3;
  // SIDE_BUY = pay fixed (payer); SIDE_SELL = receive fixed. SIDE_TWO_WAY is
  // rejected for an outright price request (use the quote/stream surface for a
  // two-way market).
  Side side = 4;
}

// Coupon / leg payment frequency for a linear-rates product (an IRS leg schedule
// or a bond coupon schedule): the number of coupon periods per year the schedule
// rolls at. proto3 zero default is annual.
enum PaymentFrequency {
  // One coupon per year.
  PAYMENT_FREQUENCY_ANNUAL = 0;
  // Two coupons per year (every 6 months).
  PAYMENT_FREQUENCY_SEMI_ANNUAL = 1;
  // Four coupons per year (every 3 months).
  PAYMENT_FREQUENCY_QUARTERLY = 2;
}

// Accrual day-count basis a linear-rates leg turns an accrual period into a year
// fraction on — the instrument-level superset of `DayCount` that additionally
// carries 30/360 Bond Basis (the standard USD fixed-bond / fixed-swap basis). Kept
// distinct from `DayCount` (the curve/vol time axis, which is never measured
// 30/360). proto3 zero default is ACT/360, the money-market default.
enum AccrualBasis {
  // Actual/360 — USD/EUR money-market accrual (the linear-book default).
  ACCRUAL_BASIS_ACT_360 = 0;
  // Actual/365 fixed.
  ACCRUAL_BASIS_ACT_365_FIXED = 1;
  // 30/360 Bond Basis (ISDA 2006 4.16(f)) — the standard USD fixed-bond/swap basis.
  ACCRUAL_BASIS_THIRTY_360_BOND_BASIS = 2;
}

// A vanilla fixed-vs-float interest-rate swap (IRS) to price: a fixed leg vs a
// projected floating leg on the single self-discounting curve. Both legs are the
// spot-starting schedules of `tenor_years`, reconstructed server-side from the
// `CurveSet` reference date, each at its own payment frequency and accrual basis
// (so the standard "semi-annual fixed vs quarterly float" shape is expressible).
// The PV is `N * (K * A_fixed - F_float)` (receive-fixed); `side` is from the
// client's perspective: SIDE_SELL receives fixed, SIDE_BUY pays fixed.
// SIDE_TWO_WAY is rejected for an outright price.
message VanillaIrsInstrument {
  // The swap tenor in whole years from spot (e.g. 2, 5, 10). Must be >= 1.
  uint32 tenor_years = 1;
  // The fixed-leg rate as a decimal (0.041 = 4.10%).
  double fixed_rate = 2;
  // The notional in the curve currency (always positive; direction is `side`).
  double notional = 3;
  // SIDE_BUY = pay fixed (payer); SIDE_SELL = receive fixed. SIDE_TWO_WAY rejected.
  Side side = 4;
  // Fixed-leg payment frequency (USD market: semi-annual).
  PaymentFrequency fixed_frequency = 5;
  // Fixed-leg accrual day-count (ACT/365F or ACT/360; the market 30/360 fixed leg
  // awaits the shared curve-time day-count extension and is not offered here yet).
  DayCount fixed_day_count = 6;
  // Float-leg payment frequency (USD market: quarterly).
  PaymentFrequency float_frequency = 7;
  // Float-leg accrual day-count (ACT/360 typical for USD).
  DayCount float_day_count = 8;
}

// A forward rate agreement (FRA) to price: a single accrual window on the
// projected float index, from `start_months` to `end_months` after spot (a 3x6
// FRA is start_months = 3, end_months = 6). Both are reconstructed server-side to
// roll-adjusted dates from the `CurveSet` reference date; the contractual accrual
// fraction tau uses `accrual_basis`. The PV is the single-period swaplet
// `N * (K * tau * DF(end) - (DF(start) - DF(end)))` (receive-fixed); `side`:
// SIDE_SELL receives fixed, SIDE_BUY pays fixed. SIDE_TWO_WAY is rejected.
message FraInstrument {
  // The window start (fixing) tenor in months from spot (e.g. 3). Must be < end.
  uint32 start_months = 1;
  // The window end (maturity) tenor in months from spot (e.g. 6). Must be > start.
  uint32 end_months = 2;
  // The contractual fixed rate K as a decimal (0.033 = 3.30%).
  double fixed_rate = 3;
  // The notional in the curve currency (always positive; direction is `side`).
  double notional = 4;
  // SIDE_BUY = pay fixed; SIDE_SELL = receive fixed. SIDE_TWO_WAY rejected.
  Side side = 5;
  // The accrual day-count basis for tau (ACT/360 typical; 30/360 supported).
  AccrualBasis accrual_basis = 6;
}

// A fixed-coupon cash bond to price off the calibrated curve: PV each cashflow at
// the bootstrapped discount curve (dirty price) and report the implied yield-risk
// set. Settlement is the `CurveSet` reference (spot-anchor) date; the coupon
// schedule is the regular month-step dates rolled back from `maturity_date` at
// `coupon_frequency`. `side` is the position direction: SIDE_BUY = long (a bought
// bond, positive PV), SIDE_SELL = short (negative PV). SIDE_TWO_WAY is rejected.
message BondInstrument {
  // The annual coupon rate as a decimal (0.06 = 6%); 0 for a zero-coupon bond.
  double coupon_rate = 1;
  // The coupon payment frequency (also the yield compounding basis).
  PaymentFrequency coupon_frequency = 2;
  // The accrual day-count basis for accrued interest (ACT/365F / ACT/360 / 30/360).
  AccrualBasis day_count = 3;
  // The maturity (final-redemption) date; must be strictly after settlement.
  BrokenDate maturity_date = 4;
  // The par redemption / face value (e.g. 100); required, strictly positive.
  double redemption = 5;
  // SIDE_BUY = long (+PV); SIDE_SELL = short (-PV). SIDE_TWO_WAY rejected.
  Side side = 6;
  // The canonical internal instrument id — the identity shared across the reference
  // registry, the wire and the LP feed (US Treasuries: the 9-char CUSIP; curated non-US
  // govvies: a stable slug). Resolved server-side at booking from the venue's `Symbol(55)`
  // against `celnet-refdata` — the SAME curated universe that names an `AggregatedInstrument`.
  // Empty when unresolved; never fabricated. Additive output field (a price request need not
  // set it — the server resolves and stamps it onto the booked `Deal`).
  string instrument_id = 7;
  // The ISO-6166 ISIN, resolved from the same refdata entry. Empty when unresolved.
  string isin = 8;
  // The CUSIP (US Treasuries carry one), resolved from the same refdata entry. Empty for a
  // security with no CUSIP, or when unresolved.
  string cusip = 9;
  // A compact, human-friendly blotter/security descriptor (e.g. "US 10Y GOV 4.125% May-36")
  // — the SAME name the FI Aggregated Book tile shows, resolved from the refdata entry.
  // Empty when unresolved; never fabricated.
  string display_name = 10;
}

// A linear interest-rate instrument to price: exactly one arm is set. The oneof
// grows additively (FRA, vanilla IRS, tenor/cross-ccy basis, STIR/bond futures)
// as each is backed end-to-end by the rates engine; no arm ships on the wire
// before it can be priced (rule 2 — narrow, never fake).
message RatesInstrument {
  // The instrument arm: exactly one variant is set.
  oneof instrument {
    // An overnight-indexed swap (the USD-SOFR P0 arm).
    OisInstrument ois = 1;
    // A vanilla fixed-vs-float interest-rate swap.
    VanillaIrsInstrument irs = 2;
    // A forward rate agreement.
    FraInstrument fra = 3;
    // A fixed-coupon cash bond priced off the curve.
    BondInstrument bond = 4;
  }
}

// The priced result for a linear-rates instrument: present value plus first-order
// risk. All measures are in the curve currency and already carry the instrument
// `side` sign (a payer and a receiver of the same swap report equal-and-opposite
// PV / PV01 / DV01 / ladder).
message RatesPricingResult {
  // Present value in the curve currency (sign per `side`).
  double pv = 1;
  // The par (fair fixed) rate of the instrument's schedule on the calibrated
  // curve, as a decimal — the breakeven fixed rate, independent of `side`.
  double par_rate = 2;
  // Analytic PV01: the PV change per 1bp move in the instrument's own fixed rate
  // (the fixed-leg annuity in bp), signed per `side`.
  double pv01 = 3;
  // DV01: the PV change for a +1bp parallel bump of every calibrating curve
  // pillar (the curve delta), signed per `side`.
  double dv01 = 4;
  // The key-rate (bucketed) DV01 ladder: one entry per `CurveSet` pillar, in
  // pillar order, each the PV change for a +1bp bump of that pillar alone. Sums
  // to `dv01` to first order (the residual is curve cross-gamma).
  repeated double key_rate_ladder = 5;
  // The executable two-way struck around the indicative fair level (`par_rate`
  // for a swap/FRA, the clean price for a cash bond). Populated ONLY on the
  // streaming path (`RatesStreamSnapshot`/`RatesStreamUpdate`), where the row is
  // a firm dealer market a taker can lift; left at proto3 zero on the one-shot
  // `PriceRates` result, which stays purely indicative. `bid <= fair <= offer`
  // and `bid < offer` whenever a two-way is present. In the same units as the
  // fair level: a decimal rate for OIS/IRS/FRA, a clean price per 100 face for a
  // bond. Half-spread model: see `rates_pricing::stream_spread`.
  double bid = 6;
  // The offer side of the streamed two-way (see `bid`).
  double offer = 7;
  // The available notional (in the instrument's own currency face) firm on the
  // BID side of the streamed market — the size a taker can hit. Positive when a
  // two-way is present, proto3 zero on the indicative one-shot path.
  double bid_size = 8;
  // The available notional firm on the OFFER side of the streamed market — the
  // size a taker can lift (see `bid_size`).
  double offer_size = 9;
}

// Request: price one `RatesInstrument` against one `CurveSet`. The linear-rates
// analogue of `PriceRequest`.
message RatesPriceRequest {
  // Opaque client correlation id, echoed in `RatesPriceResponse.request_id`.
  uint64 request_id = 1;
  // The calibrated curve set to price against.
  CurveSet curve_set = 2;
  // The instrument to price.
  RatesInstrument instrument = 3;
  // Optional caller correlation id, echoed verbatim on the response so a client
  // joins an asynchronous reply to its originating request. Absent => none.
  optional uint64 correlation_id = 4;
}

// Response: the priced rates result.
message RatesPriceResponse {
  // Correlates with `RatesPriceRequest.request_id`.
  uint64 request_id = 1;
  // The PV + PV01 / DV01 / key-rate-ladder result.
  RatesPricingResult result = 2;
  // Echo of the originating `RatesPriceRequest.correlation_id`, if supplied.
  optional uint64 correlation_id = 3;
}

// Request a tradeable two-way RFQ on a linear-rates (fixed-income) instrument —
// the fixed-income analogue of `QuoteRequest` (`QuoteService.RequestRatesQuote`).
// The taker supplies the calibrated `curve_set` and the `instrument` to quote; the
// maker prices the side-independent fair level (the par rate for an OIS/IRS/FRA,
// the clean price for a cash bond — the LANDED `price_rates` / `quote_bond` result)
// and returns a `RatesQuote` two-way struck around it. `notional` is the RFQ size
// the two-way is good for; `side` is the taker's directional intent, and selects
// the sign of the returned risk (a two-way request reports the receive-fixed /
// long magnitude). Additive (rule 9): the taker RFQ envelope over the existing FI
// pricing arm, no reshaping of `RatesInstrument` / `CurveSet`.
message RatesQuoteRequest {
  // Client-supplied idempotency/correlation token, echoed on the `RatesQuote`.
  string idempotency_key = 1;
  // The calibrated curve set the instrument prices against.
  CurveSet curve_set = 2;
  // The instrument to quote (OIS / vanilla IRS / FRA / cash bond).
  RatesInstrument instrument = 3;
  // The RFQ size the two-way is good for (curve currency, strictly positive).
  double notional = 4;
  // The taker's directional intent: SIDE_BUY (pay fixed / long bond), SIDE_SELL
  // (receive fixed / short bond), or SIDE_TWO_WAY to request a two-way market with
  // no firm direction. The returned two-way is always struck around the
  // side-independent fair level; `side` selects the sign of the returned risk (a
  // SIDE_TWO_WAY request reports the receive-fixed / long magnitude).
  Side side = 5;
  // Optional caller correlation id, echoed verbatim on the `RatesQuote`. A *data*
  // field selecting a correlation, never an API version (rule 9). Absent ⇒ none.
  optional uint64 correlation_id = 6;
}

// A tradeable two-way quote for a linear-rates instrument — the fixed-income
// analogue of `Quote`, returned for a `RatesQuoteRequest`. `price` is the two-way
// struck around the fair level: a RATE market (bid/offer around the par rate) for
// an OIS/IRS/FRA, a clean-PRICE market (bid/offer around the clean price per 100
// face) for a cash bond, so `(bid+offer)/2` is the fair level the FI pricing path
// computed (`result.par_rate` for an OIS/IRS/FRA; the clean price for a bond).
message RatesQuote {
  // Server-assigned stable, unguessable quote identifier (minted exactly like
  // `Quote.quote_id`).
  uint64 quote_id = 1;
  // Echo of the originating request's idempotency key.
  string idempotency_key = 2;
  // The two-way bid/offer: a rate market for an OIS/IRS/FRA, a clean-price market
  // for a cash bond. `(bid+offer)/2` is the side-independent fair level.
  TwoWayPrice price = 3;
  // The full linear-rates risk (PV, par rate, PV01, DV01, key-rate ladder) of the
  // quoted position at the requested `side`.
  RatesPricingResult result = 4;
  // The RFQ size the two-way is good for (curve currency), echoed from the request.
  double notional = 5;
  // Publication time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
  // Quote validity deadline (last-look window), nanoseconds since the Unix epoch
  // (UTC). An accept after this instant is treated as expired.
  int64 valid_until_nanos = 7;
  // Echo of the originating `RatesQuoteRequest.correlation_id`, if one was supplied
  // (presence-tracked), so a client joins this reply to its request.
  optional uint64 correlation_id = 8;
}

// ===========================================================================
// XVA — valuation adjustments (CVA / DVA / FVA) over a synthetic netting set
// ===========================================================================
//
// Serves the `celnet-xva` engine (standard Basel III / ISDA SA-CVA
// discretization; Gregory, *The xVA Challenge* 2015; Brigo-Morini-Pallavicini
// 2013). Given a netting set of vanilla FX options, an exposure-simulation
// configuration, and the counterparty/own hazard-rate survival curves, the
// server evolves spot under risk-neutral GBM on a uniform exposure grid with
// scrambled-Sobol QMC, reprices and nets the set at each grid date to the
// expected positive/negative exposure profile (EPE/ENE), then aggregates the
// discrete unilateral CVA, symmetric DVA, and funding FVA. Synthetic netting
// sets only — the engine does not model live CSAs / collateral / margin or
// wrong-way risk (its honest boundary), so no collateral terms ride the wire.
// Additive (rule 9): a new `PricingService` RPC; no existing message is touched.

// One vanilla FX option in an XVA netting set (mirrors `celnet_xva::NettedTrade`):
// its option type, strike, expiry, flat pricing vol, and signed notional.
message XvaTrade {
  // Call or put.
  OptionType option_type = 1;
  // Strike (quote per 1 unit of base), > 0.
  double strike = 2;
  // Option expiry in years from valuation (t = 0), > 0.
  double expiry_years = 3;
  // Flat lognormal vol used for this trade's mark, > 0.
  double vol = 4;
  // Signed notional in base units (+ long / - short).
  double notional = 5;
}

// A hazard-rate survival curve (mirrors `celnet_xva::SurvivalCurve`). A flat
// curve `S(t) = exp(-λt)` is carried as an empty `pillar_times` with a single
// `hazard_rates` entry (the flat hazard λ). A piecewise-constant curve carries
// strictly-increasing positive `pillar_times` with an equal-length
// `hazard_rates`, each rate applying on `(pillar[i-1], pillar[i]]` and the last
// rate held flat past the final pillar (the standard market convention).
message XvaSurvivalCurve {
  // Strictly-increasing positive pillar times (years). Empty ⇒ a flat curve.
  repeated double pillar_times = 1;
  // Per-segment hazard rates (decimal, ≥ 0). Equal length to `pillar_times`, or
  // exactly one entry when `pillar_times` is empty (the flat hazard).
  repeated double hazard_rates = 2;
}

// Request: compute the CVA / DVA / FVA of a synthetic netting set. The server
// simulates the expected-exposure profile out to the set's horizon (`paths`
// low-discrepancy paths over `exposure_steps` uniform grid intervals, `seed`
// for bit-reproducible Owen scrambling) then aggregates it against the two
// survival curves, the loss-given-default fractions, and the funding spread.
message PriceXvaRequest {
  // Opaque client correlation id, echoed in `PriceXvaResponse.request_id`.
  uint64 request_id = 1;
  // The netting set: the vanilla FX option trades that net under one master
  // agreement. At least one trade is required.
  repeated XvaTrade trades = 2;
  // Domestic (quote) continuously-compounded rate used to mark the set and
  // discount exposures to present value.
  double r_dom = 3;
  // Foreign (base) continuously-compounded rate used to mark the set.
  double r_for = 4;
  // Initial spot at valuation (t = 0), > 0.
  double spot0 = 5;
  // Exposure-model diffusion volatility for the spot evolution (may differ from
  // each trade's own pricing vol), ≥ 0.
  double sigma = 6;
  // Number of low-discrepancy exposure paths, ≥ 1.
  uint32 paths = 7;
  // Owen-scramble replication seed (bit-reproducible exposure simulation).
  uint64 seed = 8;
  // Number of uniform exposure-grid steps out to the netting-set horizon, ≥ 1.
  uint32 exposure_steps = 9;
  // The counterparty survival curve (drives CVA and the joint-survival funding
  // weight).
  XvaSurvivalCurve counterparty = 10;
  // The own survival curve (drives DVA and the joint-survival funding weight).
  XvaSurvivalCurve own = 11;
  // Counterparty loss-given-default `LGD = 1 - R_cpty`, in [0, 1].
  double lgd_counterparty = 12;
  // Own loss-given-default `LGD = 1 - R_own`, in [0, 1].
  double lgd_own = 13;
  // Funding spread (annualized decimal) charged on the net expected exposure.
  double funding_spread = 14;
  // Optional caller correlation id, echoed verbatim on the response.
  optional uint64 correlation_id = 15;
}

// The computed valuation adjustments (mirrors `celnet_xva::XvaResult`): the three
// adjustments plus the all-in total `CVA - DVA + FVA` a dealer charges over the
// risk-free value.
message XvaResult {
  // Credit valuation adjustment (≥ 0): expected loss from counterparty default.
  double cva = 1;
  // Debit valuation adjustment (≥ 0): expected benefit from own default.
  double dva = 2;
  // Funding valuation adjustment (signed): funding cost (+) or benefit (-) of the
  // uncollateralized net expected exposure.
  double fva = 3;
  // The all-in adjustment `CVA - DVA + FVA` subtracted from the risk-free value.
  double total_adjustment = 4;
}

// Response: the XVA figures for the requested netting set.
message PriceXvaResponse {
  // Correlates with `PriceXvaRequest.request_id`.
  uint64 request_id = 1;
  // The CVA / DVA / FVA result.
  XvaResult result = 2;
  // Echo of the originating `PriceXvaRequest.correlation_id`, if supplied.
  optional uint64 correlation_id = 3;
}

// ===========================================================================
// rates portfolio risk — server-side federated rollup (fixed income)
// ===========================================================================
//
// The linear-rates analogue of the options `RiskService.AggregateRisk` roll-up
// (`docs/fixed-income/FI-ARCHITECTURE.md`; `docs/SCALE-OUT.md` §2/§11). A client
// submits a book of rates positions and reads the netted firm rollup; the server
// prices each position against the supplied `CurveSet`, builds one additive risk
// fact per position keyed on its `(entity, ccy, book)` cell, shards the facts
// across the firm HRW partition map and fans them in. Rates risk is *purely
// additive* (PV/PV01/DV01/key-rate ladder sum over a netting set; the OIS par rate
// is curve-derived and never aggregated), so the fan-in equals the single-node
// rollup bit-for-bit (`celnet-risk-fleet`). Currency is the curve currency, never
// carried per position. Additive (rule 9): new instrument arms ride `RatesInstrument`.

// One rates position to price and net into the firm rates rollup: the linear-rates
// analogue of `RiskPosition`. Carries the position identity, the `(legal-entity,
// book)` cell it nets into, and the instrument economics; the settlement currency
// is taken from the `CurveSet`, not the wire.
message RatesPosition {
  // The position identity (one current fact per id in the rollup).
  uint64 position_id = 1;
  // The legal entity (regulatory-capital unit) the position books into — the
  // primary netting/partition sub-key (`celnet_risk_fleet::RatesFactKey::entity`).
  uint32 entity = 2;
  // The netting book the position sits in (carried for netting/attribution; not a
  // partition key, so a currency's whole cross-book risk stays co-resident).
  uint32 book = 3;
  // The linear-rates instrument to price (the USD-SOFR OIS P0 arm; the oneof grows
  // additively exactly as in `RatesPriceRequest`).
  RatesInstrument instrument = 4;
}

// A scope filter narrowing a rates risk aggregate to one `(entity, book, ccy)`
// subtree before the rollup — the rates-native analogue of `RiskScope`, in the
// `RatesFactKey` `(entity, ccy, book)` key space rather than the options org
// dimensions. Each filter is presence-tracked: an absent field does not constrain.
// A position is included iff every present filter matches it.
message RatesRiskScope {
  // Pin to one legal entity (absent ⇒ all entities).
  optional uint32 entity = 1;
  // Pin to one netting book (absent ⇒ all books).
  optional uint32 book = 2;
  // Pin to one settlement currency, ISO 4217 (absent ⇒ all currencies). Matched
  // against the `CurveSet` currency the positions price under.
  optional string ccy = 3;
}

// Request: price `positions` against `curve_set`, shard, and roll up the firm
// rates risk. The linear-rates analogue of `AggregateRiskRequest`. Positions
// travel inline (the caller submits its own book; there is no firm rates position
// store yet — `docs/fixed-income/FI-ARCHITECTURE.md`).
message AggregateRatesRiskRequest {
  // The calibrated curve set every position is priced against (the rates market).
  CurveSet curve_set = 1;
  // The rates positions to price and net into the firm rollup.
  repeated RatesPosition positions = 2;
  // Optional scope narrowing the rollup to one `(entity, book, ccy)` subtree
  // (absent ⇒ the whole submitted book).
  optional RatesRiskScope scope = 3;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default,
  // mode-gated exactly as `AggregateRisk`).
  optional EntitlementPrincipal principal = 4;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 5;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the legacy client-asserted-principal
  // path (mode-gated). A secret — never logged.
  optional string session_token = 6;
}

// One bucket of a netted key-rate (instrument-Jacobian) DV01 ladder: the DV01
// attributable to a single calibrating-instrument tenor, in settlement-currency PV
// (`celnet_risk_fleet::KeyRateBucket`).
message KeyRateDv01 {
  // The calibrating-instrument tenor in whole years (the ladder's bucket key).
  uint32 tenor_years = 1;
  // The netted DV01 of a +1bp bump of that tenor's quote, in settlement-currency PV.
  double dv01 = 2;
}

// One per-currency node of the firm rates rollup: the netted PV / PV01 / DV01 and
// the tenor-bucketed key-rate ladder for one settlement currency
// (`celnet_risk_fleet::RatesNodeAggregate`). All measures are in `ccy`; currencies
// never cross-net (summing PV across currencies is meaningless).
message RatesRiskNode {
  // The settlement currency this node nets, ISO 4217.
  string ccy = 1;
  // Net present value over the netting set, in `ccy`.
  double net_pv = 2;
  // Net analytic PV01, in `ccy` PV.
  double net_pv01 = 3;
  // Net parallel DV01, in `ccy` PV.
  double net_dv01 = 4;
  // The merged key-rate DV01 ladder, bucketed by tenor and ascending by tenor.
  repeated KeyRateDv01 key_rate_ladder = 5;
}

// Response: the firm rates rollup as one node per settlement currency, ascending by
// currency code (deterministic).
message AggregateRatesRiskResponse {
  // The per-currency rollup nodes, ascending by currency code.
  repeated RatesRiskNode nodes = 1;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// combined tail risk — the C2c unified options+FI joint tail
// (RiskService.CombinedTailRisk)
// ===========================================================================
//
// The wire surface of `celnet_risk_cube::fi::combined_tail_risk` — the R-a "true
// single VaR engine": ONE non-additive cube over a portfolio's vanilla FX option
// legs AND its linear-FI (OIS-swap) legs, by full joint bump-and-revalue over
// aligned (options-shock, rate-shock) scenarios, plus the FI key-rate DV01 axis and
// signed parallel DV01. The whole portfolio + scenario config travels INLINE on the
// request (a pure calculation, like `AggregateRatesRisk` — no store read, no market
// read), so every replica computes the identical result.

// One vanilla FX option leg of the tail-risk portfolio: the raw Garman-Kohlhagen
// inputs plus its quoted conventions — exactly the arguments of
// `celnet_risk_normalize::PositionRisk::fx`. The canonical convention-free risk is
// re-derived server-side from these inputs (never a convention-baked Greek). Carried
// as flat `r_dom`/`r_for` (the FX two-rate carry) rather than the generalized
// `VanillaInputs.carry` oneof, matching the FX joint-tail leaf byte-for-byte.
message TailRiskOptionLeg {
  // The currency pair (BASE/QUOTE).
  CcyPair pair = 1;
  // Option type (call/put on the base currency).
  OptionType option_type = 2;
  // Signed base-currency notional (positive = long the option); per-unit risk is
  // scaled by this.
  double notional_base = 3;
  // Spot FX rate (quote per 1 unit of base).
  double spot = 4;
  // Strike (quote per 1 unit of base).
  double strike = 5;
  // Annualized volatility (absolute, e.g. 0.10 = 10 vol).
  double vol = 6;
  // Time to expiry in years (vol-time).
  double t = 7;
  // The continuously-compounded domestic (numeraire / quote) rate `r_dom`.
  double r_dom = 8;
  // The continuously-compounded foreign (base) rate `r_for`.
  double r_for = 9;
  // The delta convention the leg was quoted under (provenance; the canonical
  // spot-unadjusted delta is unaffected).
  DeltaConvention quoted_delta = 10;
  // The premium style the leg was quoted under (provenance).
  PremiumStyle premium_style = 11;
}

// One accrual period of an OIS fixed leg, in curve year-fraction coordinates
// (mirrors `celnet_rates::FixedPeriod`).
message OisFixedPeriod {
  // Payment time (period end) in curve year-fraction coordinates; strictly
  // increasing across the schedule.
  double pay = 1;
  // Year-fraction accrual for the period (e.g. ACT/360); strictly positive.
  double accrual = 2;
}

// A fixed-vs-OIS swap leg priced off the (shocked) discount curve — mirrors
// `celnet_rates_risk::FiPosition::OisSwap`. Valued by the self-discounting OIS
// identity `N·(K·A − (DF(start) − DF(maturity)))` (the receive-fixed sign, negated
// for pay-fixed).
message OisSwapLeg {
  // The swap effective (start) time in curve year-fraction coordinates.
  double start = 1;
  // The ordered fixed-leg accrual periods (the final period's `pay` is maturity).
  repeated OisFixedPeriod periods = 2;
  // The fixed rate `K` paid/received (decimal, e.g. 0.033).
  double fixed_rate = 3;
  // The swap notional `N` in curve-currency units (positive).
  double notional = 4;
  // True to receive fixed (the raw OIS-PV sign), false to pay fixed (negated).
  bool receive_fixed = 5;
}

// One linear-FI position of the tail-risk portfolio. A oneof mirroring
// `celnet_rates_risk::FiPosition`; the swap arm is wired now (the cash-bond arm
// grows additively — one contract, no versioning).
message TailRiskFiPosition {
  // Exactly one arm is set.
  oneof position {
    // A fixed-vs-OIS swap.
    OisSwapLeg ois_swap = 1;
  }
}

// One dated pillar of the base discount curve the FI legs reprice off — a
// `(time, continuously-compounded zero rate)` knot (mirrors one entry of
// `celnet_rates_risk::RatePillars`). The curve origin `(0, DF=1)` is implicit.
message TailRiskCurvePillar {
  // The pillar time in curve year-fraction coordinates; strictly increasing, > 0.
  double t = 1;
  // The continuously-compounded zero rate at `t`.
  double zero_rate = 2;
}

// One joint cross-risk-class scenario: an options spot/vol/carry shock applied to
// the option legs AND a per-pillar rate shock applied to the FI legs, as ONE market
// state (aligned by scenario index) — mirrors `celnet_risk_cube::JointScenario`.
message JointTailScenario {
  // Relative spot shock (0.01 = +1%): `spot *= 1 + spot_rel`.
  double spot_rel = 1;
  // Absolute vol shock in vol units (0.01 = +1 vol point): `vol += vol_abs`.
  double vol_abs = 2;
  // Absolute discount-rate shock `Δr` (the numeraire rate; `r_dom` for FX).
  double discount_abs = 3;
  // Absolute net-carry shock `Δb` (`r_dom − r_for` for FX).
  double carry_abs = 4;
  // Per-pillar absolute additive zero-rate shifts, aligned with `base_curve` (the
  // `RateShock`). Its length must equal the base-curve pillar count when FI legs are
  // present; ignored (and may be empty) when there are no FI legs.
  repeated double rate_shifts = 5;
}

// A value-at-risk / expected-shortfall pair (mirrors `celnet_risk_cube::VarEs`): the
// alpha-quantile loss and the mean tail loss beyond it.
message VarEs {
  // Value-at-Risk: the `alpha`-quantile loss.
  double var = 1;
  // Expected Shortfall: the mean loss in the tail beyond VaR.
  double es = 2;
}

// One point of the FI signed key-rate DV01 ladder: the signed ΔPV per +1bp up-bump
// of one curve pillar's zero rate (mirrors `celnet_rates_risk::KeyRatePoint`). The
// tenor is a real pillar time (fractional tenors allowed), so it is a `double` —
// unlike the whole-year-bucketed `KeyRateDv01` of the additive rates rollup.
message TailRiskKeyRate {
  // The pillar tenor in years.
  double tenor_years = 1;
  // The signed DV01 at this tenor (a rate rise is a loss ⇒ negative for a long bond
  // / receive-fixed swap).
  double dv01 = 2;
}

// Request: one-cube joint options+FI tail risk over an inline portfolio + scenario
// config. Options-only ⇒ empty `fi_positions` (reduces to the options VaR); FI-only
// ⇒ empty `option_legs` (reduces to the rate VaR); a mixed book shows the joint
// cross-risk-class diversification.
message CombinedTailRiskRequest {
  // The vanilla FX option legs (may be empty for an FI-only request).
  repeated TailRiskOptionLeg option_legs = 1;
  // The linear-FI legs (may be empty for an options-only request).
  repeated TailRiskFiPosition fi_positions = 2;
  // The base discount-curve zero-rate pillars the rate shocks perturb and the FI
  // key-rate ladder is measured off (required, ≥ 1 pillar, strictly increasing in
  // time). Present even for an options-only request (the FI ladder is then all-zero).
  repeated TailRiskCurvePillar base_curve = 3;
  // The aligned joint scenarios (one market state each) reduced to the tail.
  repeated JointTailScenario scenarios = 4;
  // The VaR/ES confidence level (e.g. 0.99). Defaults to 0.99 when 0.
  double alpha = 5;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 6;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the grant-all default (mode-gated,
  // exactly as `AggregateRatesRisk`). A secret — never logged.
  optional string session_token = 7;
}

// Response: the joint tail plus the FI key-rate axis and signed parallel DV01
// (mirrors `celnet_risk_cube::CombinedTailRisk`).
message CombinedTailRiskResponse {
  // The joint options-spot/vol + FI-rate tail — one non-additive VaR/ES over the union.
  VarEs joint_var_es = 1;
  // The FI per-tenor signed key-rate DV01 ladder, ascending by pillar tenor (empty
  // when there are no FI legs; one point per base-curve pillar otherwise).
  repeated TailRiskKeyRate key_rate = 2;
  // The FI signed parallel DV01 (a rate rise is a loss ⇒ negative for a long bond /
  // receive-fixed swap; 0 when there are no FI legs).
  double fi_parallel_dv01 = 3;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 4;
}

// ===========================================================================
// rates position store — the booked rates Book (fixed income)
// ===========================================================================
//
// The firm rates position store now exists server-side (the inline-only caveat on
// `AggregateRatesRiskRequest` is lifted for booked flow): an accepted desk quote
// (or a direct booking) writes a `RatesPosition`; the Book workspace lists it.
// Mirrors the options `PositionStore` — in-memory, authoritative for the session.

// Request: book one rates position into the firm rates store.
message BookRatesPositionRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The cell + instrument to book. `position_id == 0` ⇒ the server assigns a fresh
  // id (a new booking); a non-zero id upserts (replaces) that position.
  RatesPosition position = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// Response: the booked position with its server-assigned (or echoed) id.
message BookRatesPositionResponse {
  // The booked position; `position_id` is the server-assigned (or echoed) id.
  RatesPosition position = 1;
}

// Request: list the firm rates positions, scoped + entitlement-pruned.
message ListRatesPositionsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Narrow to one `(entity, book, ccy)` subtree (absent ⇒ all booked positions).
  optional RatesRiskScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// Response: the booked rates positions matching the scope + entitlements,
// ascending by `position_id` (deterministic).
message ListRatesPositionsResponse {
  // The booked rates positions matching the scope, ascending by `position_id`.
  repeated RatesPosition positions = 1;
}

// ===========================================================================
// dealer-side quoting — RFQ/IOI desk inbox, deal blotter, notifications (FI)
// ===========================================================================
//
// The MAKER side of the franchise: inbound RFQs and IOIs from counterparties land
// in a desk inbox, the responsible trader is notified, prices, and responds; an
// accepted quote books a deal into the received-deals blotter AND a rates position.
// The taker side (`QuoteService.RequestQuote` → synthetic-LP auto-price) stays as
// is; this is the human-quoted complement. Live counterparty venue connectivity is
// a deploy concern (out of in-repo scope); inbound requests arrive over the one
// current contract via `SubmitDeskRequest` (the client SDK / counterparty
// simulator) — 100% real and test-driven (rule 2). FI-scoped: the instrument is a
// `RatesInstrument` priced against a `CurveSet`; the oneof grows additively.

// What kind of inbound request this is.
enum DeskRequestKind {
  // Default/unset — never a valid request kind on the wire.
  DESK_REQUEST_KIND_UNSPECIFIED = 0;
  // Request-for-quote: a counterparty wants a firm price.
  DESK_REQUEST_KIND_RFQ = 1;
  // Indication-of-interest: a non-firm axe for the desk to work.
  DESK_REQUEST_KIND_IOI = 2;
  // Request-for-stream: the counterparty opened a continuous market-data STREAM on the
  // FixedIncomeStream venue for a named instrument AND ITS OWN CLIP SIZE, then lifted a
  // streamed top-of-book rather than requesting a one-off quote. It is RFS and not ESP
  // precisely because the client supplies the notional and the stream is priced for that
  // clip — an executable streaming price is dealer-published and clip-independent, so
  // nothing this venue serves can be one. Stamped on the booked `Deal` so the blotter
  // shows an RFS fill distinctly from an RFQ.
  DESK_REQUEST_KIND_RFS = 3;
  // Executable streaming price: the counterparty lifted a top-of-book the venue was
  // publishing at ITS OWN clip, having named no size of its own. Distinct from
  // `RFS` precisely on that axis — an RFS fill is priced for the size the client
  // asked for, an ESP fill is taken off a price the dealer was already showing.
  DESK_REQUEST_KIND_ESP = 4;
}

// The lifecycle state of an inbound desk request (one current fact per id).
enum DeskRequestState {
  // Default/unset — never a valid state on the wire.
  DESK_REQUEST_STATE_UNSPECIFIED = 0;
  // Awaiting a desk response.
  DESK_REQUEST_STATE_PENDING = 1;
  // The desk has responded with a price.
  DESK_REQUEST_STATE_QUOTED = 2;
  // The counterparty lifted the quote → a deal booked.
  DESK_REQUEST_STATE_ACCEPTED = 3;
  // The desk declined to quote.
  DESK_REQUEST_STATE_REJECTED = 4;
  // The response deadline elapsed unquoted.
  DESK_REQUEST_STATE_EXPIRED = 5;
  // The counterparty pulled the request.
  DESK_REQUEST_STATE_WITHDRAWN = 6;
}

// The desk's firm response to an RFQ (or a firm level on an IOI): the quoted price
// and how long it stands.
message DeskQuote {
  // The quoted price. For the OIS arm this is the all-in fixed rate as a decimal
  // (0.041 = 4.10%) the desk shows the counterparty.
  double price = 1;
  // The notional the quote is good for (curve currency, positive).
  double notional = 2;
  // How long the quote stands from issue, milliseconds (0 ⇒ indicative only).
  uint32 valid_for_ms = 3;
  // The quoting trader (attribution).
  string trader = 4;
}

// One inbound dealer-side request (RFQ or IOI) as the desk sees it.
message DeskRequest {
  // Server-assigned, stable across the lifecycle.
  string request_id = 1;
  // Whether this is an RFQ (firm price wanted) or an IOI (axe to work).
  DeskRequestKind kind = 2;
  // The counterparty label (the taker). A display/attribution field, not auth.
  string counterparty = 3;
  // The target desk this request routes to (the entitlement + notification scope).
  string desk = 4;
  // The instrument the counterparty wants priced.
  RatesInstrument instrument = 5;
  // The curve set the instrument prices against.
  CurveSet curve_set = 6;
  // The counterparty's side from THEIR perspective: SIDE_BUY ⇒ they pay fixed.
  Side side = 7;
  // The notional requested (curve currency, always positive).
  double notional = 8;
  // Server receipt time (epoch nanos, UTC).
  int64 received_at_nanos = 9;
  // Response deadline (epoch nanos, UTC); past this the request EXPIRES unquoted.
  int64 expires_at_nanos = 10;
  // The current lifecycle state (one current fact per `request_id`).
  DeskRequestState state = 11;
  // The desk's response once quoted (absent while PENDING). Presence-tracked.
  optional DeskQuote quote = 12;
  // Opaque caller correlation id, echoed through the lifecycle. Presence-tracked.
  optional string correlation_id = 13;
}

// A counterparty (taker SDK / simulator) submits an RFQ or IOI to a desk.
message SubmitDeskRequestRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Whether this is an RFQ (firm price wanted) or an IOI (axe to work).
  DeskRequestKind kind = 2;
  // The submitting counterparty label (display/attribution, not auth).
  string counterparty = 3;
  // The desk this request routes to (the entitlement + notification scope).
  string desk = 4;
  // The instrument the counterparty wants priced.
  RatesInstrument instrument = 5;
  // The curve set to price the instrument against.
  CurveSet curve_set = 6;
  // The counterparty's side from THEIR perspective: SIDE_BUY ⇒ they pay fixed.
  Side side = 7;
  // The notional requested (curve currency, always positive).
  double notional = 8;
  // Time-to-live for the desk to respond, milliseconds (0 ⇒ a server default).
  uint32 ttl_ms = 9;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 10;
  // Optional caller correlation id, echoed through the lifecycle. Presence-tracked.
  optional string correlation_id = 11;
}
// Response: the captured request in its PENDING state, with its server id.
message SubmitDeskRequestResponse {
  // The newly captured request (PENDING, with a server-assigned `request_id`).
  DeskRequest request = 1;
}

// The desk declines to quote a request.
message DeskReject {
  // A short human reason shown to the counterparty (e.g. "no axe", "off-the-run").
  string reason = 1;
}

// The desk quotes or rejects a pending request.
message RespondDeskRequestRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The request being responded to.
  string request_id = 2;
  // The response: exactly one of a firm quote or a decline.
  oneof response {
    // Quote the request at a firm level.
    DeskQuote quote = 3;
    // Decline to quote the request.
    DeskReject reject = 4;
  }
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 5;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 6;
}
// Response: the request advanced to QUOTED (or REJECTED).
message RespondDeskRequestResponse {
  // The request in its new state, carrying the desk's quote when QUOTED.
  DeskRequest request = 1;
}

// The counterparty lifts a quoted price → books a `Deal` and a `RatesPosition`.
message AcceptDeskQuoteRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The quoted request being lifted.
  string request_id = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// Response: the booked deal plus the request in its terminal ACCEPTED state.
message AcceptDeskQuoteResponse {
  // The deal booked from the lifted quote.
  Deal deal = 1;
  // The request in its terminal ACCEPTED state.
  DeskRequest request = 2;
}

// A scope filter for the desk inbox.
message DeskRequestScope {
  // Restrict to these states (empty ⇒ all states).
  repeated DeskRequestState states = 1;
  // Restrict to one desk (absent ⇒ all desks the caller is entitled to).
  optional string desk = 2;
}
// Request: read the desk inbox (the pending/terminal RFQ & IOI requests).
message ListDeskRequestsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Optional state/desk filter (absent ⇒ all states across entitled desks).
  optional DeskRequestScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// The desk inbox, newest first (descending `received_at_nanos`), entitlement-pruned.
message ListDeskRequestsResponse {
  // The matching desk requests, newest first.
  repeated DeskRequest requests = 1;
}

// One booked received deal (an accepted desk quote), as the blotter shows it.
message Deal {
  // The server-assigned deal identity.
  string deal_id = 1;
  // The originating `DeskRequest.request_id`.
  string request_id = 2;
  // Whether the originating request was an RFQ or an IOI.
  DeskRequestKind kind = 3;
  // The counterparty label (display/attribution).
  string counterparty = 4;
  // The desk the deal booked under.
  string desk = 5;
  // The dealt instrument.
  RatesInstrument instrument = 6;
  // The curve set the deal priced against.
  CurveSet curve_set = 7;
  // The DESK's side (opposite the counterparty's submitted side).
  Side side = 8;
  // The dealt notional (curve currency, positive).
  double notional = 9;
  // The dealt level — the accepted `DeskQuote.price`.
  double price = 10;
  // Execution time (epoch nanos, UTC).
  int64 executed_at_nanos = 11;
  // The booking trader (attribution).
  string trader = 12;
  // The rates position id this deal booked into the rates store. Presence-tracked.
  optional uint64 position_id = 13;
  // Opaque caller correlation id carried from the request. Presence-tracked.
  optional string correlation_id = 14;
  // The per-feature pricing provenance for the booked level (design §7), set only
  // when the deal was priced through a pricing group's feature pipeline. The rates
  // dealer-quoting desk path is not group-priced today, so this is absent there;
  // it exists so a group-priced booking carries its waterfall. Presence-tracked.
  optional PricingProvenance pricing_provenance = 15;
  // The Risk Portfolio (risk book) id the fill's risk routed into when a firm-wide
  // risk-routing graph is installed, resolved from the booked rates position's stamp
  // (`RatesPositionStore::risk_book_of`). Absent when the fill routed to no portfolio
  // (no graph configured, or a routing fall-back) — never fabricated. Presence-tracked.
  optional string risk_book_id = 16;
  // The auto-hedge / internalisation decision the booking engine reached for this fill
  // (`docs/AUTO-HEDGING-AND-INTERNALISATION-REQUIREMENTS.md` §6/§8.4). Present only when a
  // warehouse threshold AND a hedge-policy graph are configured for the routed book AND the
  // booking path supplied the priced reference mid + dealt price (the RFQ desk accept / FIX
  // lift paths); absent on the manual `BookRatesPosition` path and when no policy is
  // configured — surfaced, never fabricated. Presence-tracked.
  optional InternaliseProvenance internalise = 17;
}
// The auto-hedge / internalisation decision provenance stamped on a booked `Deal`
// (`docs/AUTO-HEDGING-AND-INTERNALISATION-REQUIREMENTS.md` §6). A pure DECISION + audit
// record: the internal portion is warehoused and the external portion is an *advisory*
// back-to-back (nothing is submitted to a live venue at this seam, matching the mandatory
// shadow-run posture, §8.4). Every field is computed from the fill's real economics —
// never fabricated.
message InternaliseProvenance {
  // Whether the fill was fully internalised (warehoused): true when the dealer captured
  // sufficient edge (`within_tolerance`) AND booking it left the routed book within its
  // warehouse cap, so no external hedge was required (`external_dv01 == 0`).
  bool internalised = 1;
  // The DV01 (linear PV01 proxy, native units) warehoused internally for this fill.
  double internal_dv01 = 2;
  // The DV01 shed to an advisory external back-to-back — the over-cap overflow, or the
  // whole fill when the captured edge was below tolerance (a losing fill is not warehoused).
  double external_dv01 = 3;
  // The dealer's captured edge on THIS fill in basis points: the signed, dealer-favourable
  // distance of the dealt price from the engine reference mid (positive = the desk dealt
  // *better* than mid). See `crate::services::internalise` for the pay/receive-fixed sign
  // derivation.
  double edge_bps = 4;
  // Whether `edge_bps` cleared the configured minimum-edge floor (`min_edge_bps`) — the
  // "are we making money" gate that decides internalise vs external back-to-back.
  bool within_tolerance = 5;
  // The warehouse RAG band the routed book's net risk fell in after this fill
  // (`green` / `amber` / `red` / `breach`) — the engine's own band label.
  string hedge_band = 6;
}
// A scope filter for the received-deals blotter.
message DealScope {
  // Restrict to one desk (absent ⇒ all desks the caller is entitled to).
  optional string desk = 1;
}
// Request: read the received-deals blotter.
message ListDealsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Optional desk filter (absent ⇒ all entitled desks).
  optional DealScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// The received-deals blotter, newest first (descending `executed_at_nanos`).
message ListDealsResponse {
  // The matching booked deals, newest first.
  repeated Deal deals = 1;
}

// ---- Notifications: a dedicated server→client push stream ----
// The desk learns "an RFQ/IOI requires pricing" the instant it lands, without
// polling. A connected client opens ONE notification subscription scoped to the
// desks it watches; the server fans out entitlement-filtered events to every
// matching subscriber. Independent of the price (RFS) stream by operator choice:
// a quiet, low-rate control channel that never shares back-pressure with pricing.
enum NotificationKind {
  // Default/unset — never a valid notification kind on the wire.
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  // A new RFQ landed and needs pricing.
  NOTIFICATION_KIND_RFQ_RECEIVED = 1;
  // A new IOI landed for the desk to work.
  NOTIFICATION_KIND_IOI_RECEIVED = 2;
  // A pending request was withdrawn by the counterparty.
  NOTIFICATION_KIND_REQUEST_WITHDRAWN = 3;
  // A pending request expired before the desk responded.
  NOTIFICATION_KIND_REQUEST_EXPIRED = 4;
  // A desk quote was lifted by the counterparty → a deal booked.
  NOTIFICATION_KIND_QUOTE_ACCEPTED = 5;
  // A desk quote was rejected by the counterparty.
  NOTIFICATION_KIND_QUOTE_REJECTED = 6;
  // An inbound RFQ/RFS could NOT be auto-priced and needs a human — the ONLY
  // alert-worthy kind (the GUI pops a toast). Carries a machine-readable `reason`
  // (see ManualInterventionReason). Distinct from RFQ_RECEIVED, which is a routine
  // routed RFQ the desk prices in the normal flow (quiet, no popup).
  NOTIFICATION_KIND_MANUAL_INTERVENTION_REQUIRED = 7;
  // A firm order landed on the desk (a taker's NewOrderSingle against a live
  // auto-quote on the FIX venue) — the inbound-order signal, quiet by default.
  // Distinct from RFQ_RECEIVED (a request for a quote): this is a firm order.
  NOTIFICATION_KIND_ORDER_RECEIVED = 8;
  // An own execution booked — a fill. Emitted when a firm order fills and the
  // deal + position book (the FIX-venue lift path). Quiet/informational; distinct
  // from QUOTE_ACCEPTED (an explicit desk-quote lift over the platform RPC).
  NOTIFICATION_KIND_FILL = 9;
}
// Why an inbound RFQ/RFS cannot be auto-priced and must be handled by a trader. The
// machine-readable signal the GUI renders on a manual-intervention alert. Extensible:
// new reasons append with the next number (one unversioned contract — no negotiation).
enum ManualInterventionReason {
  // Default/unset — carried by every non-manual-intervention notification.
  MANUAL_INTERVENTION_REASON_UNSPECIFIED = 0;
  // The requested tenor is not configured for auto-quoting (off the venue's
  // on-the-run set) — the desk must price it by hand.
  MANUAL_INTERVENTION_REASON_UNCONFIGURED_TENOR = 1;
  // A pre-trade credit check against the counterparty failed — a human must clear it.
  MANUAL_INTERVENTION_REASON_CREDIT_RISK_BREAK = 2;
  // The named security/curve symbol is not one the venue prices — unknown instrument.
  MANUAL_INTERVENTION_REASON_UNKNOWN_SECURITY = 3;
  // The pricing engine failed to produce a price for an otherwise-admitted request.
  MANUAL_INTERVENTION_REASON_PRICING_FAILURE = 4;
}
// One pushed notification event the desk surfaces as a toast/inbox item.
message Notification {
  // The server-assigned notification identity (de-dup key on the client).
  string notification_id = 1;
  // What happened (RFQ/IOI received, withdrawn, expired, accepted, rejected).
  NotificationKind kind = 2;
  // When the event occurred (epoch nanos, UTC).
  int64 at_nanos = 3;
  // The request/deal this concerns, for click-through. Presence-tracked.
  optional string request_id = 4;
  // The desk the event is scoped to.
  string desk = 5;
  // The counterparty involved (display/attribution).
  string counterparty = 6;
  // Whether the underlying request was an RFQ or an IOI.
  DeskRequestKind request_kind = 7;
  // A one-line human headline (rendered in the toast/inbox).
  string headline = 8;
  // Optional longer detail line. Presence-tracked.
  optional string detail = 9;
  // Whether this event is alert-worthy: the GUI pops a toast ONLY when true.
  // Manual-intervention events set it true; received/auto-quoted/booked/rejected
  // events are quiet (false) — they still land in the blotter/inbox silently.
  bool alert_worthy = 10;
  // The machine-readable manual-intervention reason. Present ONLY on a
  // MANUAL_INTERVENTION_REQUIRED event (absent otherwise). Presence-tracked.
  optional ManualInterventionReason reason = 11;
}
// The desks a notification subscription covers.
message NotificationScope {
  // The desks to receive notifications for (empty ⇒ all the caller is entitled to).
  repeated string desks = 1;
}
// Open one long-lived notification subscription scoped to `scope`'s desks.
message StreamNotificationsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The desks to subscribe to (absent ⇒ all the caller is entitled to).
  optional NotificationScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed by the server. Presence-tracked.
  optional string correlation_id = 4;
}

// The dealer-side quoting desk: inbound RFQ/IOI capture, response, acceptance, and
// the inbox + received-deals reads. Entitlement-pruned exactly like the risk reads.
service RfqDeskService {
  rpc SubmitDeskRequest(SubmitDeskRequestRequest) returns (SubmitDeskRequestResponse);
  rpc RespondDeskRequest(RespondDeskRequestRequest) returns (RespondDeskRequestResponse);
  rpc AcceptDeskQuote(AcceptDeskQuoteRequest) returns (AcceptDeskQuoteResponse);
  rpc ListDeskRequests(ListDeskRequestsRequest) returns (ListDeskRequestsResponse);
  rpc ListDeals(ListDealsRequest) returns (ListDealsResponse);
}

// The dedicated server→client notification push channel (one long-lived stream per
// connected client; entitlement-filtered desk fan-out).
service NotificationService {
  rpc StreamNotifications(StreamNotificationsRequest) returns (stream Notification);
  // The per-desk / per-trader risk-transfer inbox push: the Pending transfers
  // awaiting the subscriber's accept/reject, re-published on every transfer state
  // change (entitlement-filtered desk/trader fan-out, mirroring the notification
  // broker). `docs/RISK-TRANSFER-REQUIREMENTS.md` §9.2/§10.
  rpc StreamRiskTransferInbox(StreamRiskTransferInboxRequest) returns (stream RiskTransferInbox);
}

// ===========================================================================
// Bond corporate actions — the CAEV/CAMV event surface + the effective
// (post-CA) instrument schedule (ADR: BOND-DATA-AND-CORPORATE-ACTIONS-SOURCING).
// The wire mirror of `celnet-corpactions` (the CaEvent/BondSchedule model) +
// `celnet-refstore` (the effective-dated golden store + announce→confirm→apply
// lifecycle). A confirmed+applied CA re-derives the stored schedule so bond
// pricing + DV01 re-derive off the post-event schedule, and books the position
// effect through the SAME rates-book path a trade uses. Civil dates travel as
// ISO `YYYY-MM-DD` strings so the surface is human-readable in the GUI CA inbox.
// Additive, vendor-neutral (guardrail 8); off the pinned hot core (guardrail 11).

// CAEV — the corporate-action event type (ISO 15022 / ISO 20022 code set). The
// govvie-deterministic set (REDM/INTR/MCAL/PCAL/PRED/DRAW/BPUT) is derivable
// in-house; the corporate set (TEND/EXOF/CONV) is modelled but sourced only via a
// customer-wired vendor adapter.
enum CorpEventType {
  // proto3 zero default — never a real event.
  CORP_EVENT_TYPE_UNSPECIFIED = 0;
  // Final redemption at maturity (mandatory): position realised, schedule ends.
  CORP_EVENT_TYPE_REDM = 1;
  // Interest / coupon payment (mandatory): cash income; future schedule intact.
  CORP_EVENT_TYPE_INTR = 2;
  // Full call — mandatory early redemption of the whole issue at the call price.
  CORP_EVENT_TYPE_MCAL = 3;
  // Partial call — pro-rata / lottery call of part of the issue at the call price.
  CORP_EVENT_TYPE_PCAL = 4;
  // Partial redemption — pro-rata reduction of outstanding nominal (no lottery).
  CORP_EVENT_TYPE_PRED = 5;
  // Sinking-fund drawing / lottery redemption of a scheduled sinking amount.
  CORP_EVENT_TYPE_DRAW = 6;
  // Put — holder exercises a put, redeeming (all or part) at the put price.
  CORP_EVENT_TYPE_BPUT = 7;
  // Tender offer (voluntary) — holder optionally sells back at the tender price.
  CORP_EVENT_TYPE_TEND = 8;
  // Exchange offer — the security is exchanged into a target instrument.
  CORP_EVENT_TYPE_EXOF = 9;
  // Conversion — the security converts into a target instrument at a ratio.
  CORP_EVENT_TYPE_CONV = 10;
}

// CAMV — the mandatory / voluntary indicator that drives the election lifecycle.
enum CorpMandatory {
  // proto3 zero default — never a real value.
  CORP_MANDATORY_UNSPECIFIED = 0;
  // Mandatory — applies automatically, no holder election.
  CORP_MANDATORY_MAND = 1;
  // Voluntary — holder-optional; opens an election.
  CORP_MANDATORY_VOLU = 2;
  // Mandatory with options / choice — must respond, choosing among outcomes.
  CORP_MANDATORY_CHOS = 3;
}

// The lifecycle status of a corporate-action event.
enum CorpActionStatus {
  // proto3 zero default — never a real status.
  CORP_ACTION_STATUS_UNSPECIFIED = 0;
  // Announced (MT 564 / seev.031); not yet applied.
  CORP_ACTION_STATUS_ANNOUNCED = 1;
  // Desk election resolved for a VOLU/CHOS event (MT 565 / seev.033).
  CORP_ACTION_STATUS_ELECTED = 2;
  // Movement confirmed (MT 566 / seev.036); ready to apply.
  CORP_ACTION_STATUS_CONFIRMED = 3;
  // Position effect applied to the book / inventory.
  CORP_ACTION_STATUS_APPLIED = 4;
  // A confirmed movement reversed (seev.037) — the effect is un-applied.
  CORP_ACTION_STATUS_REVERSED = 5;
  // An announced event cancelled before application (seev.039).
  CORP_ACTION_STATUS_CANCELLED = 6;
}

// One dated cashflow of the effective (post-any-applied-CA) bond schedule, in
// per-100-original-face cash. The wire mirror of `celnet_corpactions::ScheduleFlow`.
message InstrumentScheduleFlow {
  // The payment date, ISO `YYYY-MM-DD`.
  string date = 1;
  // Coupon / interest cash on this date, per 100 face.
  double coupon = 2;
  // Principal / redemption cash on this date, per 100 face (0 except a redemption).
  double principal = 3;
}

// A normalized corporate-action event as stored in the golden source — the wire
// mirror of `celnet_refstore::StoredCorpAction` (its `ca_id` + `CaEvent` +
// mastering provenance), flattened for the GUI CA inbox.
message CorporateActionDesc {
  // The stable id of the corporate action (shared across its lifecycle versions).
  string ca_id = 1;
  // The ISO 6166 ISIN of the affected instrument (the join key to the schedule).
  string isin = 2;
  // The event type.
  CorpEventType caev = 3;
  // The mandatory / voluntary indicator.
  CorpMandatory camv = 4;
  // The current lifecycle status.
  CorpActionStatus status = 5;
  // Announcement date (ISO `YYYY-MM-DD`).
  string announcement_date = 6;
  // Record date — the balance snapshot that fixes entitlement.
  string record_date = 7;
  // Ex date — from which the security trades without the entitlement.
  string ex_date = 8;
  // Response / market deadline for a VOLU/CHOS election (absent for MAND).
  optional string response_deadline = 9;
  // Payment / effective date — when the movement settles and the effect applies.
  string payment_date = 10;
  // Cash price per 100 face of a redemption / call / put / tender (or coupon cash).
  double cash_per_100 = 11;
  // Fraction of outstanding nominal redeemed by a partial event, in [0, 1].
  double redeemed_fraction = 12;
  // Exchange / conversion target instrument id (EXOF / CONV); empty otherwise.
  string target_instrument = 13;
  // Units of the target created per 100 face of the source; 0 otherwise.
  double target_units_per_100 = 14;
  // Originating source-message reference (MT 564 / seev.031 id) for audit lineage.
  string source_ref = 15;
  // The source-priority the mastering provenance stamped (survivorship ordering).
  uint32 source_priority = 16;
  // The source label that produced this version (lineage).
  string source = 17;
}

// List the effective (post-any-applied-CA) cashflow schedule of one instrument.
message ListInstrumentScheduleRequest {
  // The caller's bearer token.
  string session_token = 1;
  // The reference-data instrument id whose schedule to resolve.
  string instrument_id = 2;
  // Optional caller correlation id, echoed by the server.
  optional uint64 correlation_id = 3;
}
// The effective schedule of the requested instrument.
message ListInstrumentScheduleResponse {
  // The instrument the schedule belongs to.
  string instrument_id = 1;
  // The remaining cashflows in ascending date order (post-any-applied-CA).
  repeated InstrumentScheduleFlow flows = 2;
  // Current outstanding nominal as a fraction of original (1.0 = full).
  double pool_factor = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// List corporate actions, optionally filtered to one ISIN.
message ListCorporateActionsRequest {
  // The caller's bearer token.
  string session_token = 1;
  // Restrict to actions targeting this ISIN (absent ⇒ all known actions).
  optional string isin = 2;
  // Optional caller correlation id, echoed by the server.
  optional uint64 correlation_id = 3;
}
// The current version of every matching corporate action.
message ListCorporateActionsResponse {
  // The matching corporate actions (current lifecycle version each).
  repeated CorporateActionDesc actions = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Confirm a corporate action's movement (announced|elected → confirmed), readying
// it to apply. Reference-data admin authority (`refdata` capability).
message ConfirmCorporateActionRequest {
  // The caller's bearer token (must resolve to the `refdata` capability).
  string session_token = 1;
  // The corporate action to confirm.
  string ca_id = 2;
  // Optional caller correlation id, echoed by the server.
  optional uint64 correlation_id = 3;
}
// The confirmed corporate action.
message ConfirmCorporateActionResponse {
  // The corporate action after the transition.
  CorporateActionDesc action = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Apply a confirmed corporate action: re-derive the stored schedule and book the
// position effect on the desk's held face through the rates-book path. Reference-
// data admin authority (`refdata` capability).
message ApplyCorporateActionRequest {
  // The caller's bearer token (must resolve to the `refdata` capability).
  string session_token = 1;
  // The confirmed corporate action to apply.
  string ca_id = 2;
  // The desk's held face (nominal) in the instrument the effect acts on.
  double held_face = 3;
  // Optional caller correlation id, echoed by the server.
  optional uint64 correlation_id = 4;
}
// The result of applying a corporate action.
message ApplyCorporateActionResponse {
  // The instrument the effect touched.
  string instrument_id = 1;
  // The change in held face (nominal); negative = a reduction, -held_face = realised.
  double face_delta = 2;
  // The cash thrown off by the event on the holding (coupon or principal returned).
  double cash = 3;
  // Cashflows remaining in the instrument's post-event schedule.
  uint32 remaining_flows = 4;
  // The corporate action after the apply (status APPLIED).
  CorporateActionDesc action = 5;
  // Echoed request correlation id.
  optional uint64 correlation_id = 6;
}

// The bond corporate-actions surface: the effective post-CA instrument schedule
// read, the CA inbox read, and the confirm/apply lifecycle drivers. The reads are
// authenticated; confirm/apply require the dedicated `refdata` capability.
service CorporateActionsService {
  rpc ListInstrumentSchedule(ListInstrumentScheduleRequest) returns (ListInstrumentScheduleResponse);
  rpc ListCorporateActions(ListCorporateActionsRequest) returns (ListCorporateActionsResponse);
  rpc ConfirmCorporateAction(ConfirmCorporateActionRequest) returns (ConfirmCorporateActionResponse);
  rpc ApplyCorporateAction(ApplyCorporateActionRequest) returns (ApplyCorporateActionResponse);
}
