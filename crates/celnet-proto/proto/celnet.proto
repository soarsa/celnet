}

// Create a named legal entity / account (admin only).
message CreateEntityRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The new entity's display name (must be unique, case-insensitive).
  string name = 2;
  // The new entity's short display code (must be unique, case-insensitive).
  string code = 3;
  // The `uint32` wire key to map. `0` ⇒ the server assigns the lowest free key; a
  // non-zero value pins that key (must be unused).
