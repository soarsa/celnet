// Celnet wire contract — the single, current, trader-shaped message schema for
// the pricing / quote / RFQ / RFS / surface / risk surface.
//
// There is exactly ONE clean, current contract (ADR-0007): no `schema_version`
// field, no version-negotiation handshake, no N/N-1 back-compat shims. Upgrades
// deploy a single uniform version via blue-green cutover, so a message on the
// wire is always interpreted against this schema. Evolving the contract means
// editing this file and every dependent in the same change.
//
// proto3, no `optional` presence wrappers: every scalar field carries a
// meaningful value (a price of 0.0 or a rate of 0.0 is a legitimate quantity,
// not "absent"). Nested messages and `oneof`s carry their own presence.
//
// Identifiers here are purpose-named and vendor/research-neutral, mirroring the
// `celnet-types` vocabulary (CcyPair, OptionType, the convention enums, the
// 13-Greek set) one-to-one so the wire form and the in-process DTOs stay
// aligned. Mathematical-method provenance lives only in doc comments, never in
// names (inputs are `VanillaInputs`, never `GkInputs`).
//
// The contract is organized as five logical families inside one package:
//   * vocabulary  — enums + small value messages mirroring `celnet-types`
//   * instrument  — the unified `Instrument` oneof every workflow speaks
//   * quote       — the RFQ lifecycle (RequestQuote/AcceptQuote/RejectQuote)
//   * stream      — the RFS bidirectional subscription (snapshot+delta+resync)
//   * surface     — smile read / broker mark / arbitrage report / scenario risk

syntax = "proto3";

package celnet.wire;

// ===========================================================================
// vocabulary — enums + value messages mirroring `celnet-types`
// ===========================================================================

// Call or put — mirrors `celnet_types::OptionType`.
enum OptionType {
  // proto3 requires a zero default; CALL is the canonical first member.
  OPTION_TYPE_CALL = 0;
  // Right to sell the base currency.
  OPTION_TYPE_PUT = 1;
}

// The side a counterparty takes in an instrument or leg — buy or sell.
//
// Omit a top-level side on an RFQ to request a two-way (bid/offer) market, as
// FIX `QuoteRequest` does when side/quantity are absent.
enum Side {
  // proto3 zero default. The client (or leg) buys the instrument.
  SIDE_BUY = 0;
  // The client (or leg) sells the instrument.
  SIDE_SELL = 1;
  // No directional side: request a two-way bid/offer market.
  SIDE_TWO_WAY = 2;
}

// Quoted delta convention — mirrors `celnet_types::DeltaConvention`.
enum DeltaConvention {
  // Spot delta, premium-unadjusted: e^{-r_f T} N(d1).
  DELTA_CONVENTION_SPOT_UNADJUSTED = 0;
  // Forward (driftless) delta, premium-unadjusted: N(d1).
  DELTA_CONVENTION_FORWARD_UNADJUSTED = 1;
  // Spot delta, premium-adjusted: e^{-r_f T} (K/F) N(d2).
  DELTA_CONVENTION_SPOT_PREMIUM_ADJUSTED = 2;
  // Forward delta, premium-adjusted: (K/F) N(d2).
  DELTA_CONVENTION_FORWARD_PREMIUM_ADJUSTED = 3;
}

// At-the-money strike convention — mirrors `celnet_types::AtmConvention`.
enum AtmConvention {
  // ATM-forward: K = F.
  ATM_CONVENTION_ATM_FORWARD = 0;
  // Delta-neutral straddle: strike where call delta + put delta = 0.
  ATM_CONVENTION_DELTA_NEUTRAL_STRADDLE = 1;
}

// Premium quotation style — mirrors `celnet_types::PremiumStyle`.
enum PremiumStyle {
  // Domestic pips (quote-ccy per 1 unit of base notional).
  PREMIUM_STYLE_DOMESTIC_PIPS = 0;
  // Percentage of foreign (base) notional.
  PREMIUM_STYLE_PERCENT_FOREIGN = 1;
  // Percentage of domestic (quote) notional.
  PREMIUM_STYLE_PERCENT_DOMESTIC = 2;
  // Foreign pips.
  PREMIUM_STYLE_FOREIGN_PIPS = 3;
}

// Expiry cut (fixing time) convention — mirrors `celnet_types::Cut`.
enum Cut {
  // New York 10:00 — the standard interbank OTC cut for most pairs.
  CUT_NEW_YORK_1000 = 0;
  // Tokyo 15:00 — standard for JPY-region / Asian business.
  CUT_TOKYO_1500 = 1;
}

// Day-count basis — mirrors `celnet_types::DayCount`.
enum DayCount {
  // Actual/365 fixed — typical for option vol-time.
  DAY_COUNT_ACT_365_FIXED = 0;
  // Actual/360 — typical money-market accrual (USD/EUR).
  DAY_COUNT_ACT_360 = 1;
}

// Settlement style — mirrors `celnet_types::Settlement`.
enum Settlement {
  // Physically deliverable: both currencies exchanged on delivery.
  SETTLEMENT_DELIVERABLE = 0;
  // Non-deliverable option: cash-settled at a published fixing.
  SETTLEMENT_NON_DELIVERABLE = 1;
}

// Contract settlement mechanics — how a contract's PnL is denominated and
// margined. Mirrors `celnet_types::SettlementStyle`. The meaningful-zero
// convention (matching the other enums): the LINEAR style is the canonical
// default (value 0), so an absent/zero `Instrument.settlement_style` is the
// ordinary quote-currency-margined linear contract — byte-identical to the
// contract before this field existed. INVERSE_COIN is the coin-margined
// (digital-asset) convention where PnL accrues in the base coin against a 1/S_T
// payoff.
enum SettlementStyle {
  // Linear (quote-currency-margined): the ordinary contract whose payoff and
  // margin are in the quote/numeraire currency. The default for every asset
  // class shipped before the digital-asset arm.
  SETTLEMENT_STYLE_LINEAR = 0;
  // Inverse, coin-margined: the digital-asset convention whose payoff is the
  // `1/S_T` (base-coin-denominated) form and whose margin accrues in the base
  // coin. Meaningful only for a `digital_asset` underlying.
  SETTLEMENT_STYLE_INVERSE_COIN = 1;
}

// How a listed-future option's premium settles against the exchange — the
// margining convention that decides whether the premium is paid upfront (and
// the option price therefore carries the discount factor) or is margined daily
// like the future itself (undiscounted). The meaningful-zero convention
// (matching `SettlementStyle`): EQUITY_STYLE is the canonical default
// (value 0), so an absent/zero `ListedFutureOption.margining` is the ordinary
// upfront-premium contract.
enum Margining {
  // Equity-style (premium-upfront): the full premium is paid at trade date, so
  // the price is the discounted expectation.
  MARGINING_EQUITY_STYLE = 0;
  // Futures-style (daily-margined): the premium is margined daily like the
  // future itself, so the price is the undiscounted expectation.
  MARGINING_FUTURES_STYLE = 1;
}

// A precious metal traded as the asset (base) leg of a metal pair — mirrors
// `celnet_types::Metal`. The four LBMA/LPPM precious metals; each projects to an
// ISO-4217 "X"-prefixed asset code (XAU/XAG/XPT/XPD) so a `MetalPair` overlaps
// the FX `CcyPair` encoding byte-for-byte on the metal leg.
enum Metal {
  // proto3 zero default. Gold (XAU).
  METAL_GOLD = 0;
  // Silver (XAG).
  METAL_SILVER = 1;
  // Platinum (XPT).
  METAL_PLATINUM = 2;
  // Palladium (XPD).
  METAL_PALLADIUM = 3;
}

// The published settlement-rate option an NDF (or non-deliverable structure)
// references — mirrors `celnet_types::FixingSource`. This names *which* published
// rate the contract settles against (each EMTA / 2005-2018 ISDA per-currency
// template names one); it is convention identity, NOT a market-data input — the
// live fixing VALUES remain an estate-gated feed and are never sourced in-repo.
enum FixingSource {
  // proto3 zero default. Korea — KFTC18 (EMTA "KRW KFTC18").
  FIXING_SOURCE_KRW_KFTC18 = 0;
  // Taiwan — Taipei Forex / TFEMA USD/TWD (EMTA "TWD Taipei").
  FIXING_SOURCE_TWD_TAIPEI = 1;
  // India — RBI USD/INR reference rate (EMTA "INR RBIB").
  FIXING_SOURCE_INR_RBI_REF = 2;
  // Brazil — BCB PTAX USD/BRL (EMTA "BRL PTAX", BRL09).
  FIXING_SOURCE_BRL_PTAX = 3;
  // Chile — Banco Central "Dólar Observado" USD/CLP (EMTA "CLP DOLAR OBS").
  FIXING_SOURCE_CLP_DOLAR_OBS = 4;
  // Colombia — TRM USD/COP (EMTA "COP TRM", COP04).
  FIXING_SOURCE_COP_TRM = 5;
}

// Barrier crossing semantics for a single barrier level.
enum BarrierKind {
  // Knock-in: the option activates if the barrier is touched.
  BARRIER_KIND_KNOCK_IN = 0;
  // Knock-out: the option extinguishes if the barrier is touched.
  BARRIER_KIND_KNOCK_OUT = 1;
}

// Where a barrier sits relative to spot at inception.
enum BarrierSide {
  // Barrier above spot at inception (up-and-*).
  BARRIER_SIDE_UP = 0;
  // Barrier below spot at inception (down-and-*).
  BARRIER_SIDE_DOWN = 1;
}

// How a barrier / touch is monitored along the path.
enum MonitoringStyle {
  // Continuous monitoring (any touch at any instant triggers).
  MONITORING_STYLE_CONTINUOUS = 0;
  // Discrete monitoring at scheduled fixing instants only.
  MONITORING_STYLE_DISCRETE = 1;
}

// Touch family for one-touch / no-touch / double-no-touch structures.
enum TouchKind {
  // One-touch: pays the rebate if the barrier IS touched before expiry.
  TOUCH_KIND_ONE_TOUCH = 0;
  // No-touch: pays the rebate if the barrier is NOT touched before expiry.
  TOUCH_KIND_NO_TOUCH = 1;
  // Double-no-touch: pays if NEITHER of two barriers is touched.
  TOUCH_KIND_DOUBLE_NO_TOUCH = 2;
  // Double-one-touch: pays if EITHER of two barriers is touched.
  TOUCH_KIND_DOUBLE_ONE_TOUCH = 3;
}

// Digital (binary) settlement style.
enum DigitalStyle {
  // Cash-or-nothing: pays a fixed cash amount if in-the-money at expiry.
  DIGITAL_STYLE_CASH_OR_NOTHING = 0;
  // Asset-or-nothing: pays one unit of the asset if in-the-money at expiry.
  DIGITAL_STYLE_ASSET_OR_NOTHING = 1;
}

// How the averaging observations of an arithmetic-average-rate Asian are laid
// out across the averaging window.
enum AveragingStyle {
  // Equally-spaced discrete observations (a real fixing schedule); pair with
  // `AsianOption.observations`.
  AVERAGING_STYLE_DISCRETE = 0;
  // Continuous arithmetic averaging over the window (the n → ∞ limit).
  AVERAGING_STYLE_CONTINUOUS = 1;
}

// Analytic estimator used to price an arithmetic-average-rate Asian (the
// arithmetic average is not lognormal, so there is no exact closed form). The
// geometric-conditioning estimator is the more accurate default.
enum AsianMethod {
  // Geometric-conditioning ("Curran") closed-form approximation — the more
  // accurate default for low-to-moderate vol and longer windows.
  ASIAN_METHOD_CURRAN = 0;
  // Lognormal two-moment matching ("Turnbull-Wakeman") approximation.
  ASIAN_METHOD_TURNBULL_WAKEMAN = 1;
}

// The underlying single payoff a quanto wraps: a plain vanilla, or a
// cash-or-nothing digital that pays a fixed unit of the settlement currency.
enum QuantoPayoff {
  // A quanto vanilla: the ordinary call/put payoff cash-settled at unit
  // conversion in the fixed settlement currency.
  QUANTO_PAYOFF_VANILLA = 0;
  // A quanto cash-or-nothing digital: pays one unit of settlement currency
  // when in the money (call if `S_T > strike`, put if `S_T < strike`).
  QUANTO_PAYOFF_DIGITAL = 1;
}

// The booking / pricing model an instrument is priced under. This selects the
// numerical engine that produces the price and Greeks; it is a *pricing
// directive*, not an API version (CLAUDE.md rule 9) — the same instrument prices
// identically under the same model on every transport. It travels on the
// `Instrument` so it reaches the price, quote (RFQ), stream (RFS) and scenario
// flows uniformly, exactly like the `Solve` directive.
//
// Method provenance (doc comments only): the local-stochastic-volatility engine
// builds a particle-calibrated leverage surface over a mean-reverting
// square-root variance backbone and prices on a 2-D ADI PDE (and a counter-based
// Monte-Carlo engine where a standard error is reported). See
// `celnet-exotics::lsv`.
enum PricingModel {
  // The default analytic / closed-form engine for the product (Garman-Kohlhagen
  // and the product's native closed form). This is the behaviour when the field
  // is unset, so an absent or `DEFAULT` model is byte-identical to the contract
  // before this field existed — there is no behaviour change for existing flows.
  PRICING_MODEL_DEFAULT = 0;
  // The local-stochastic-volatility booking model: a particle-calibrated
  // leverage surface over a stochastic-variance backbone, priced on a 2-D ADI
  // PDE (and Monte-Carlo where a standard error applies). Supported only for the
  // products the engine prices — vanilla, single-barrier (continuously-monitored
  // knock-out), and window-barrier. Selecting it for any other product is a hard
  // `INVALID_ARGUMENT` error, never a silent fallback to the default engine.
  PRICING_MODEL_LOCAL_STOCH_VOL = 1;
}

// How the redeeming (target-breaching) fixing of a TARF settles — the gap-risk
// convention. The spread between the two is the explicit gap-risk premium.
enum TarfRedemption {
  // The breaching fixing pays its **full** intrinsic gain (the accumulated
  // client gain may overshoot the target). This carries the genuine gap
  // exposure.
  TARF_REDEMPTION_FULL_GAIN = 0;
  // The breaching fixing pays only the **remaining** target (exact redemption,
  // no overshoot).
  TARF_REDEMPTION_CAPPED_GAIN = 1;
}

// The knock-out monitoring convention for an accumulator's up-and-out barrier.
enum AccumulatorMonitoring {
  // The barrier is tested only at the discrete fixing dates.
  ACCUMULATOR_MONITORING_DISCRETE = 0;
  // The barrier is monitored continuously between fixings via the
  // Brownian-bridge crossing probability (knocks out more often).
  ACCUMULATOR_MONITORING_CONTINUOUS = 1;
}

// The two lookback families.
enum LookbackStyle {
  // Floating strike: settle against the path extremum (`S_T − min` call,
  // `max − S_T` put). Always finishes at or above zero.
  LOOKBACK_STYLE_FLOATING = 0;
  // Fixed strike: optimal exercise against a fixed `K` (`(max − K)⁺` call,
  // `(K − min)⁺` put).
  LOOKBACK_STYLE_FIXED = 1;
}

// How a lookback's running extremum is monitored.
enum LookbackMonitoring {
  // Continuous monitoring — priced by the exact Conze-Viswanathan / Goldman-
  // Sosin-Gatto closed form. The price is exact (no Monte-Carlo std-error).
  LOOKBACK_MONITORING_CONTINUOUS = 0;
  // Discrete monitoring over a fixed number of observations — priced by Monte-
  // Carlo with the Brownian-bridge extremum correction, reporting a standard
  // error (`PriceResponse.price_std_error`).
  LOOKBACK_MONITORING_DISCRETE = 1;
}

// How the per-leg terminal levels of a correlated multi-asset option combine
// into the option's underlying.
enum BasketKind {
  // Weighted arithmetic basket: the underlying is `Σ_a w_a · S_a(T)`; the
  // payoff is a vanilla call/put on that weighted sum against the strike.
  BASKET_KIND_BASKET = 0;
  // Best-of-N (rainbow max): the underlying is `max_a w_a · S_a(T)`.
  BASKET_KIND_BEST_OF = 1;
  // Worst-of-N (rainbow min): the underlying is `min_a w_a · S_a(T)`.
  BASKET_KIND_WORST_OF = 2;
}

// The early-exercise style of an option: whether the holder may exercise
// continuously up to expiry, or only on a discrete set of permitted dates.
enum ExerciseStyle {
  // American: exercise permitted continuously up to and including expiry. Priced
  // by the projected-SOR free-boundary finite difference (exact, no Monte-Carlo
  // std-error).
  EXERCISE_STYLE_AMERICAN = 0;
  // Bermudan: exercise permitted only on the dates in `AmericanOption.
  // bermudan_dates` (year-fractions in `(0, T]`); expiry is always an exercise
  // opportunity. Priced on the same FD grid (the projection is applied only at
  // the permitted dates). A single date at expiry is exactly European; a dense
  // set approaches American.
  EXERCISE_STYLE_BERMUDAN = 1;
}

// A recognized multi-leg vol strategy template — mirrors the `Strategy`
// instrument leg sets the desk books as a single contract.
enum StrategyKind {
  // Risk reversal: long one wing, short the opposite wing.
  STRATEGY_KIND_RISK_REVERSAL = 0;
  // Strangle: long (or short) both out-of-the-money wings.
  STRATEGY_KIND_STRANGLE = 1;
  // Straddle: a call and a put struck at the same (ATM) strike.
  STRATEGY_KIND_STRADDLE = 2;
  // Seagull: a three-leg collar-with-wing (e.g. long call spread, short put).
  STRATEGY_KIND_SEAGULL = 3;
}

// An FX currency pair `BASE/QUOTE` (market form `CCY1CCY2`), e.g. "EURUSD".
//
// Mirrors `celnet_types::CcyPair`: `base` is the foreign/asset currency (CCY1),
// `quote` is the domestic/numeraire currency (CCY2). Each leg is a 3-letter
// uppercase ISO-4217-style code carried as a UTF-8 string for wire legibility;
// validation back to the compact `Ccy` newtype happens at the codec boundary.
message CcyPair {
  // Foreign / asset currency (CCY1), e.g. "EUR".
  string base = 1;
  // Domestic / numeraire currency (CCY2), e.g. "USD".
  string quote = 2;
}

// The instrument's underlying — the asset-class discriminator that lets the one
// unversioned contract name FX (and, in later waves, metals, digital assets,
// equities and listed futures) without a versioned API. Mirrors
// `celnet_types::Underlying`. Exactly one `ref` arm is set. W1 ships the FX arm
// (the platform's origin asset class); further arms are appended by their
// asset-class wave as additive `oneof` growth — never a placeholder arm, never a
// `schema_version`. `settlement_ccy` is the numeraire / settlement currency code
// (a 3-letter ISO-4217-style string, matching `CcyPair`'s leg encoding); for FX
// it is the pair's quote (domestic) currency and is informational at the codec
// boundary (the FX pricing path derives everything it needs from the pair).
message Underlying {
  // The underlying reference. Exactly one arm is set.
  oneof ref {
    // An FX currency pair (the W1 first-class arm), e.g. EURUSD.
    CcyPair fx = 1;
    // A precious-metal pair (the W2 arm), e.g. XAUUSD — metal as the base/asset
    // leg vs a fiat quote. Projects byte-identically onto the metal-base
    // `CcyPair` the convention/calendar registries key on.
    MetalPair metal = 3;
    // An equity (single-name or index) underlying — the cross-asset equity arm,
    // priced through the generalized cost-of-carry seam (dividend yield as the
    // carry `b`). Not an FX-option underlying.
    EquityRef equity = 4;
    // A commodity underlying — the cross-asset commodity arm, priced through the
    // generalized cost-of-carry seam (storage/convenience yield as the carry
    // `b`). Not an FX-option underlying.
    CommodityRef commodity = 5;
    // A digital-asset (crypto) pair — the cross-asset digital-asset arm. Linear
    // (USD/stablecoin-margined) or inverse (coin-margined) settlement is carried
    // on `Instrument.settlement_style`. Not an FX-option underlying.
    CryptoPair digital_asset = 6;
  }
  // The settlement / numeraire currency (a 3-letter code). For FX this is the
  // pair's quote (domestic) currency; for a metal it is the metal pair's fiat
  // quote leg.
  string settlement_ccy = 2;
}

// A precious-metal pair — mirrors `celnet_types::MetalPair`. The `metal` is the
// base/asset leg; `quote` is the fiat numeraire currency (a 3-letter code,
// matching `CcyPair`'s leg encoding). The codec projects this losslessly to/from
// a metal-base `CcyPair` (`base` = the metal's ISO-4217 asset code), keeping the
// `CcyPair`-keyed registries untouched and the projection byte-identical.
message MetalPair {
  // The precious metal (the base/asset leg).
  Metal metal = 1;
  // The fiat quote (numeraire) currency, e.g. "USD", "EUR", "JPY".
  string quote = 2;
}

// A free-form instrument ticker — the vendor-neutral identifier for an asset
// that is not named by a currency-pair / metal-pair leg structure (an equity, a
// commodity, a digital-asset coin). Mirrors `celnet_types::Symbol`. The `ticker`
// is the trading symbol (an exchange/ISIN-style code carried as a UTF-8 string
// for wire legibility); `venue` is the optional listing venue / exchange MIC (or
// the empty string when the ticker is globally unambiguous). No vendor product
// names appear — this is the purpose-named "instrument symbol", nothing more.
message Symbol {
  // The trading symbol / ticker, e.g. "AAPL", "BRENT", an ISIN. UTF-8.
  string ticker = 1;
  // The listing venue / exchange MIC, e.g. "XNAS"; empty when unambiguous.
  string venue = 2;
}

// An equity (single-name or index) underlying — mirrors
// `celnet_types::EquityRef`. The `symbol` names the listed instrument; `currency`
// is the trading/settlement currency the price is quoted in (a 3-letter code,
// matching `CcyPair`'s leg encoding). The dividend treatment is a carry-layer
// concern (`CostOfCarry`), not encoded here.
message EquityRef {
  // The listed equity symbol (single name or index).
  Symbol symbol = 1;
  // The currency the equity is quoted / settled in (a 3-letter code).
  string currency = 2;
}

// A commodity underlying (a futures-style or spot commodity) — mirrors
// `celnet_types::CommodityRef`. The `symbol` names the commodity / contract;
// `currency` is the quote/settlement currency (a 3-letter code). The
// cost-of-carry (storage/convenience yield) is a carry-layer concern
// (`CostOfCarry`), not encoded here.
message CommodityRef {
  // The commodity / contract symbol, e.g. "BRENT", "XAU-spot" (non-metal-leg).
  Symbol symbol = 1;
  // The currency the commodity is quoted / settled in (a 3-letter code).
  string currency = 2;
}

// A digital-asset (crypto) pair — mirrors `celnet_types::CryptoPair`. The `base`
// is the coin/asset leg (e.g. "BTC", "ETH"); the `quote` is the numeraire it is
// priced against, which may be a fiat currency ("USD") or another coin / a
// stablecoin ("USDT"). Both legs are carried as UTF-8 strings (crypto tickers are
// not constrained to the 3-letter ISO-4217 shape). The linear/inverse settlement
// of a coin-margined contract is carried on `Instrument.settlement_style`, not
// here (it is a contract-mechanics convention, not part of the pair identity).
message CryptoPair {
  // The coin/asset (base) leg, e.g. "BTC", "ETH". UTF-8.
  string base = 1;
  // The numeraire (quote) leg — fiat ("USD") or coin/stablecoin ("USDT").
  string quote = 2;
}

// FX two-rate carry: the continuously-compounded domestic (quote) and foreign
// (base) rates. Mirrors the `celnet_types::Carry::FxRates` arm. The discount
// rate is carried out of band on `MarketContext`/`VanillaInputs`
// (`discount_rate` == `r_dom`); this message carries the foreign rate so the FX
// forward/discount arithmetic is reproduced bit-for-bit.
message FxRates {
  // Continuously-compounded foreign (base) interest rate `r_for`.
  double r_for = 1;
}

// Generalized cost-of-carry: a single net carry `b` in `F = S·e^{b·t}` against
// the out-of-band discount rate `r`. Mirrors the `celnet_types::Carry::
// CostOfCarry` arm (the `r` lives in `discount_rate`). Reserved for the
// non-FX asset-class arms added in later waves.
message CostOfCarry {
  // Net cost-of-carry `b` in `F = S·e^{b·t}`.
  double b = 1;
}

// The carry model an instrument is priced under — the asset-class-appropriate
// way to turn the spot into a forward. Mirrors `celnet_types::Carry` (paired
// with the out-of-band `discount_rate`). Exactly one arm is set; FX uses
// `fx`, where `fx.r_for` is the foreign rate and `discount_rate` is `r_dom`.
message CarryModel {
  // The carry parameterisation. Exactly one arm is set.
  oneof model {
    // FX two-rate carry (the W1 first-class arm).
    FxRates fx = 1;
    // Generalized cost-of-carry (later asset-class arms).
    CostOfCarry generalized = 2;
  }
}

// Carry-tagged rate sensitivities — the asset-class-appropriate rate Greeks.
// Mirrors `celnet_types::RateSensitivities`. FX reports the two rate rhos
// (`rho_dom`, `rho_for`); other asset classes report a discount-rho `∂V/∂r` and
// a carry-rho `∂V/∂b`. Exactly one arm is set.
message RateSensitivities {
  // FX rate rhos: `∂V/∂r_dom`, `∂V/∂r_for`.
  message FxRho {
    // Rho domestic: `∂V/∂r_dom`.
    double rho_dom = 1;
    // Rho foreign: `∂V/∂r_for`.
    double rho_for = 2;
  }
  // Generalized discount/carry rhos: `∂V/∂r`, `∂V/∂b`.
  message CarryRho {
    // Discount rho: `∂V/∂r`.
    double discount_rho = 1;
    // Carry rho: `∂V/∂b` (equity dividend-rho, commodity carry-rho).
    double carry_rho = 2;
  }
  // The rate-sensitivity parameterisation. Exactly one arm is set.
  oneof sensitivities {
    // FX two-rho sensitivities (the W1 first-class arm).
    FxRho fx = 1;
    // Generalized discount/carry sensitivities (later asset-class arms).
    CarryRho carry = 2;
  }
}

// An FX-options tenor — mirrors `celnet_types::Tenor`. Most units are measured
// from the spot date; the short end (ON/TN/SN) is anchored on the trade date,
// and the off-the-ladder cases carry an exchange-defined or explicit date. The
// meaningful payload per unit is documented below: `count` for WEEKS/MONTHS/
// YEARS and the IMM ordinal; `broken_date` for BROKEN_DATE; nothing for the
// short-end units.
message Tenor {
  // The calendar unit the tenor is expressed in.
  enum Unit {
    // Overnight (ON): next good business day after the trade date (~T+1).
    // `count`/`broken_date` ignored.
    UNIT_OVERNIGHT = 0;
    // `count` calendar weeks from spot.
    UNIT_WEEKS = 1;
    // `count` calendar months from spot.
    UNIT_MONTHS = 2;
    // `count` calendar years from spot.
    UNIT_YEARS = 3;
    // Tomorrow-next (TN): the good business day after the ON date. `count`/
    // `broken_date` ignored.
    UNIT_TOM_NEXT = 4;
    // Spot-next (SN): next good business day after spot. `count`/`broken_date`
    // ignored.
    UNIT_SPOT_NEXT = 5;
    // The `count`-th IMM expiry strictly after the trade date (3rd Wednesday of
    // the Mar/Jun/Sep/Dec cycle). `count` is the 1-based ordinal (>= 1);
    // `broken_date` ignored.
    UNIT_IMM = 6;
    // An explicit broken (odd) expiry date carried in `broken_date`. `count`
    // ignored.
    UNIT_BROKEN_DATE = 7;
  }
  // The tenor unit.
  Unit unit = 1;
  // The unit count: the number of WEEKS/MONTHS/YEARS, or the 1-based IMM
  // ordinal. Ignored for the short-end (ON/TN/SN) and BROKEN_DATE units.
  uint32 count = 2;
  // The explicit expiry date for UNIT_BROKEN_DATE (presence-tracked; required
  // for and only meaningful with that unit). A date-valued tenor.
  optional BrokenDate broken_date = 3;
}

// An explicit civil (Gregorian) expiry date for a broken/odd-dated tenor —
// mirrors `celnet_types::BrokenDate`. Validated to a real calendar date on
// resolution; an impossible triple is rejected, never silently clamped.
message BrokenDate {
  // Gregorian year (e.g. 2026).
  int32 year = 1;
  // Month of year, 1 (January) .. 12 (December).
  uint32 month = 2;
  // Day of month, 1 .. 31 (validated against the month on resolution).
  uint32 day = 3;
}

// The smile/surface calibration model a mark or scenario is computed under —
// mirrors `celnet_types::SmileModel`. Vendor- and method-neutral by name
// (guardrail #8); the mathematical provenance of each model lives in the schema
// docs only. The default (`SMILE_MODEL_MARKET_HEDGE`, value 0) preserves the
// current calibration behaviour when a request does not select a model.
enum SmileModel {
  // Market-hedge interpolation off the broker pillars (the FX broker baseline;
  // vanna-volga method). The default.
  SMILE_MODEL_MARKET_HEDGE = 0;
  // Stochastic-volatility smile with arbitrage-free wing density (SABR method).
  SMILE_MODEL_STOCHASTIC_VOL = 1;
  // Single parametric total-variance slice (SVI method).
  SMILE_MODEL_PARAMETRIC = 2;
  // Surface-level parametric family, closed-form arbitrage-free (SSVI method).
  SMILE_MODEL_PARAMETRIC_SURFACE = 3;
  // Extended surface-level parametric family with maturity-dependent
  // correlation, closed-form arbitrage-free (eSSVI method).
  SMILE_MODEL_EXTENDED_SURFACE = 4;
}

// The trade conventions a quote / surface is expressed under. Carrying these
// explicitly on every priced message is a Celnet differentiator: the consumer
// always knows *why* a delta or premium is what it is, never inferring it.
message Conventions {
  // Which delta the convention-specific delta is reported against.
  DeltaConvention delta_convention = 1;
  // The ATM strike convention used for the surface / ATM leg.
  AtmConvention atm_convention = 2;
  // The premium quotation style bids/offers are expressed in.
  PremiumStyle premium_style = 3;
  // The expiry cut (fixing time).
  Cut cut = 4;
  // The day-count basis converting dates to year fractions.
  DayCount day_count = 5;
  // The settlement style (deliverable / non-deliverable).
  Settlement settlement = 6;
}

// The market context an instrument is priced against — spot, vol, and the two
// continuous rates. Mirrors the non-strike inputs to `celnet_types::VanillaInputs`
// hoisted to the instrument level so a multi-leg structure shares one context.
message MarketContext {
  // Spot FX rate (quote per 1 unit of base).
  double spot = 1;
  // Annualized volatility (absolute, e.g. 0.10 = 10 vol).
  double vol = 2;
  // The discount (numeraire) rate `r` for `e^{−r·t}`. For FX this is `r_dom`
  // (the continuously-compounded domestic / quote rate).
  double discount_rate = 3;
  // The carry model. For FX this is `CarryModel.fx` with `fx.r_for` the
  // continuously-compounded foreign (base) rate; the forward/discount arithmetic
  // is reproduced bit-for-bit from `(discount_rate, carry.fx.r_for)`.
  CarryModel carry = 4;
}

// Inputs to the vanilla (Garman-Kohlhagen) model — mirrors
// `celnet_types::VanillaInputs`. Continuous rates; `t` is a vol-time year
// fraction. The forward and discount factors are derived, never sent.
message VanillaInputs {
  // Spot FX rate (quote per 1 unit of base).
  double spot = 1;
  // Strike (quote per 1 unit of base).
  double strike = 2;
  // Annualized volatility (absolute, e.g. 0.10 = 10 vol).
  double vol = 3;
  // Time to expiry in years (vol-time).
  double t = 4;
  // The discount (numeraire) rate `r` for `e^{−r·t}`. For FX this is `r_dom`
  // (the continuously-compounded domestic / quote rate).
  double discount_rate = 5;
  // The carry model. For FX this is `CarryModel.fx` with `fx.r_for` the
  // continuously-compounded foreign (base) rate; the forward and discount
  // factors are derived from `(discount_rate, carry.fx.r_for)`, never sent.
  CarryModel carry = 6;
}

// A trade notional and the currency leg it is denominated in.
message Quantity {
  // The notional amount (always positive; direction is carried by `Side`).
  double notional = 1;
  // True if the notional is in the base/foreign currency (CCY1); false if it
  // is in the quote/domestic currency (CCY2).
  bool base_ccy = 2;
}

// A solve directive: instead of a fixed value, solve a free parameter so the
// structure satisfies a target (typically zero upfront premium).
message Solve {
  // Which free parameter to solve for.
  enum Target {
    // Solve nothing; use the supplied strikes/levels as given.
    TARGET_NONE = 0;
    // Solve the strike so the structure has the target premium.
    TARGET_STRIKE = 1;
    // Solve the premium (report it) for the supplied strike.
    TARGET_PREMIUM = 2;
  }
  // The parameter to solve.
  Target target = 1;
  // The target premium (in `Conventions.premium_style` units) to solve to;
  // typically 0.0 for a zero-cost structure. Ignored when target is NONE.
  double target_premium = 2;
}

// A discrete fixing schedule for path-dependent structures (TARF / accumulator
// / discretely-monitored barriers). Year fractions are on the surface day-count.
message FixingSchedule {
  // The fixing year fractions, ascending, each ≤ the structure's expiry.
  repeated double fixing_years = 1;
  // The notional that accrues at each fixing (usually one leg notional).
  double fixing_notional = 2;
}

// The full FX-options Greek set — mirrors `celnet_types::Greeks` field-for-field.
// All sensitivities are raw (per unit of the underlying quantity).
message Greeks {
  // The flat `rho_dom`/`rho_for` scalars were generalized into the carry-tagged
  // `rate_sensitivities` (field 15); their numbers/names are retired (single
  // unversioned contract — full cutover, never reused).
  reserved 7, 8;
  reserved "rho_dom", "rho_for";
  // Present value (premium) in domestic currency, per 1 unit of base notional.
  double price = 1;
  // Spot delta (premium-unadjusted).
  double delta_spot = 2;
  // Forward delta (premium-unadjusted).
  double delta_forward = 3;
  // Gamma: d2V/dS2.
  double gamma = 4;
  // Vega: dV/dsigma (per 1.0 absolute vol).
  double vega = 5;
  // Theta: dV/dt per year (-dV/dT).
  double theta = 6;
  // The carry-tagged rate sensitivities (FX: rho_dom/rho_for). Replaces the two
  // flat `rho_dom`/`rho_for` scalars (field numbers 7/8, reserved below) so the
  // contract carries the asset-class-appropriate rate Greeks; the FX arm is
  // exactly the former two rhos.
  RateSensitivities rate_sensitivities = 15;
  // Vanna: d2V/dS dsigma.
  double vanna = 9;
  // Volga / vomma: d2V/dsigma2.
  double volga = 10;
  // Charm: d(delta_spot)/dT (delta decay, per year).
  double charm = 11;
  // Speed: d3V/dS3.
  double speed = 12;
  // Zomma: d(gamma)/dsigma.
  double zomma = 13;
  // Color: d(gamma)/dT.
  double color = 14;
}

// A two-way (bid / offer) market in `Conventions.premium_style` units.
message TwoWayPrice {
  // Bid premium (the price the maker buys at).
  double bid = 1;
  // Offer / ask premium (the price the maker sells at).
  double offer = 2;
}

// A short-lived click-to-trade token stamped on a streamed price line so a
// trader can execute *that exact streamed price* without a separate RFQ
// round-trip (the RFS "click on the stream" workflow). The token binds a
// specific (subscription, sequence, side, premium) to a bounded validity
// window; an `Execute` carrying the token within the window books at the
// stamped price, eliminating the price-it-then-re-request race that a separate
// RequestQuote→AcceptQuote round-trip introduces. After `valid_until_nanos` the
// token is dead and an `Execute` is rejected as expired (last-look semantics
// identical to the RFQ `valid_until` deadline).
//
// A streamed `TwoWayPrice` carries two tokens — one to *sell* at the bid and
// one to *buy* at the offer — so a click on either side of the market executes
// exactly that side's stamped premium with no ambiguity.
message TradableToken {
  // The opaque server-minted token authenticating a click-to-trade execution.
  uint64 token = 1;
  // The side this token executes: BUY lifts the offer, SELL hits the bid.
  Side side = 2;
  // The premium this token books at (the bid for a SELL, the offer for a BUY),
  // in the stream's `Conventions.premium_style` units.
  double premium = 3;
  // Token validity deadline, nanoseconds since the Unix epoch (UTC). An
  // `Execute` after this instant is rejected as expired.
  int64 valid_until_nanos = 4;
}

// ===========================================================================
// instrument — the unified `Instrument` model every workflow speaks
// ===========================================================================

// A strike expressed either as an absolute level or as a signed convention
// delta (e.g. 0.25 call, -0.25 put), so a trader can quote "the 25-delta".
message StrikeOrDelta {
  // The strike specification: exactly one is set.
  oneof spec {
    // Absolute strike (quote per 1 unit of base).
    double strike = 1;
    // Signed convention delta, resolved to a strike under `Conventions`.
    double delta = 2;
  }
}

// A vanilla single-leg European FX option.
message Vanilla {
  // Call or put.
  OptionType option_type = 1;
  // Strike, as an absolute level or a convention delta.
  StrikeOrDelta strike = 2;
}

// One leg of a multi-leg strategy.
message Leg {
  // Call or put for this leg.
  OptionType option_type = 1;
  // The leg strike (absolute or delta).
  StrikeOrDelta strike = 2;
  // Buy or sell this leg.
  Side side = 3;
  // The leg ratio relative to the base notional (e.g. 1.0, or 2.0 for a 1x2).
  double ratio = 4;
}

// A recognized multi-leg vol strategy booked as one contract (risk reversal,
// strangle, straddle, seagull). The legs fully define the structure; `kind`
// records the trader's intent / template for display and validation.
message Strategy {
  // The strategy template the legs realize.
  StrategyKind kind = 1;
  // The legs, in book order. A risk reversal has 2; a seagull has 3.
  repeated Leg legs = 2;
}

// A single-barrier knock-in / knock-out option (vanilla payoff, one barrier).
message SingleBarrier {
  // The underlying vanilla payoff (call/put + strike).
  Vanilla vanilla = 1;
  // Knock-in or knock-out.
  BarrierKind kind = 2;
  // Barrier above or below spot at inception.
  BarrierSide side = 3;
  // The barrier level (quote per 1 unit of base).
  double barrier = 4;
  // Rebate paid if the barrier event extinguishes/never activates the option.
  double rebate = 5;
  // Continuous or discrete monitoring.
  MonitoringStyle monitoring = 6;
}

// A second-generation **window knock-out** barrier: a continuously-monitored
// single barrier that is *active only* during the calendar window
// `[window_start, window_end] ⊆ [0, T]` (years), where `T` is the enclosing
// `Instrument.expiry_years`. Outside the window a touch is harmless; inside it
// extinguishes the option. A "front" partial barrier sets `window_start = 0`; a
// "back" partial barrier sets `window_end = T`. This product is priced only
// under `PRICING_MODEL_LOCAL_STOCH_VOL` (the LSV ADI-PDE engine, with the
// counter-based Monte-Carlo engine available as the std-error-carrying
// alternative); it has no closed form, so selecting the default model is an
// `INVALID_ARGUMENT` error.
message WindowBarrier {
  // The underlying terminal vanilla payoff (call/put + strike).
  Vanilla vanilla = 1;
  // The barrier level `H` (quote per 1 unit of base).
  double barrier = 2;
  // `true` if the barrier sits above spot at inception (up-and-out), else
  // down-and-out. (A window barrier is always a knock-out.)
  BarrierSide side = 3;
  // The start of the active window, in years from inception (`>= 0`).
  double window_start = 4;
  // The end of the active window, in years from inception
  // (`window_start < window_end <= expiry_years`).
  double window_end = 5;
  // The number of antithetic Monte-Carlo path pairs when the request is priced
  // on the LSV Monte-Carlo engine; `0` selects the ADI-PDE engine (the exact
  // grid price, no standard error). When non-zero the price is Monte-Carlo and
  // carries a standard error (`PriceResponse.price_std_error` / `Quote`).
  uint32 mc_pairs = 6;
  // The number of Monte-Carlo time steps (ignored when `mc_pairs == 0`); `0`
  // selects a server default.
  uint32 mc_steps = 7;
  // The counter-RNG seed for the Monte-Carlo estimator (identical seeds
  // reproduce results bit-for-bit; ignored when `mc_pairs == 0`).
  uint64 mc_seed = 8;
}

// A double-barrier option bounded by a lower and an upper barrier.
message DoubleBarrier {
  // The underlying vanilla payoff (call/put + strike).
  Vanilla vanilla = 1;
  // Knock-in or knock-out (applied to whichever barrier is touched).
  BarrierKind kind = 2;
  // The lower barrier level.
  double lower_barrier = 3;
  // The upper barrier level.
  double upper_barrier = 4;
  // Rebate paid on the barrier event.
  double rebate = 5;
  // Continuous or discrete monitoring.
  MonitoringStyle monitoring = 6;
}

// A digital (binary) option paying a fixed amount on an in-the-money expiry.
message Digital {
  // Call or put (above-strike vs below-strike payoff).
  OptionType option_type = 1;
  // The strike (quote per 1 unit of base).
  double strike = 2;
  // Cash-or-nothing vs asset-or-nothing.
  DigitalStyle style = 3;
  // The fixed payout amount (in domestic ccy for cash-or-nothing).
  double payout = 4;
}

// A touch structure: one-touch / no-touch / double-no-touch / double-one-touch.
// `upper_barrier` is ignored for the single-barrier (one-/no-touch) kinds.
message Touch {
  // The touch family.
  TouchKind kind = 1;
  // The (lower / sole) barrier level.
  double lower_barrier = 2;
  // The upper barrier level (double structures only).
  double upper_barrier = 3;
  // The rebate paid when the touch condition is satisfied.
  double rebate = 4;
  // Continuous or discrete monitoring.
  MonitoringStyle monitoring = 5;
}

// A variance swap: pays realised variance of the log-returns against a fixed
// fair variance strike. Priced model-free by log-contract static replication of
// the OTM option continuum read off the marked smile; the headline output is the
// fair (annualised) variance strike `K_var` and its realised-vol equivalent
// `√K_var`. The notional/leg side live on the enclosing `Instrument`.
message VarianceSwap {
  // The fixed variance strike the swap trades against, expressed as a
  // volatility (so the variance strike is `strike_vol²`). A fresh request may
  // leave this zero and read the fair strike off the response. Quoted in
  // absolute vol (e.g. 0.10 = 10%).
  double strike_vol = 1;
}

// A volatility swap: pays realised volatility (not variance) against a fixed
// fair vol strike. Priced by the convexity (Jensen) adjustment to the companion
// variance-swap strike, so the fair vol strike is strictly below `√K_var` for
// any non-degenerate smile. The notional/leg side live on the `Instrument`.
message VolatilitySwap {
  // The fixed volatility strike the swap trades against, in absolute vol. A
  // fresh request may leave this zero and read the fair strike off the response.
  double strike_vol = 1;
}

// A fixed-strike arithmetic-average-rate Asian option. The arithmetic average
// of lognormal observations is not lognormal, so this is priced by a fast
// analytic estimator (`method`); the geometric-conditioning estimator is the
// accurate default.
message AsianOption {
  // Call or put on the realised arithmetic average.
  OptionType option_type = 1;
  // The strike `K` (quote per 1 unit of base).
  double strike = 2;
  // How the averaging observations are laid out across the window.
  AveragingStyle averaging = 3;
  // Number of equally-spaced future (not-yet-fixed) observations; required and
  // `≥ 1` for `AVERAGING_STYLE_DISCRETE`, ignored for the continuous style.
  uint32 observations = 4;
  // Analytic estimator to price with (default: geometric-conditioning Curran).
  AsianMethod method = 5;
  // Seasoning of an in-progress average: the realised running arithmetic average
  // of the already-fixed observations. Ignored when `elapsed_weight == 0`.
  double elapsed_avg = 6;
  // Fraction `∈ [0, 1)` of the total average weight already accumulated by the
  // fixed observations (e.g. 3 of 12 monthly fixings done ⇒ 0.25). `0` ⇒ a
  // fresh, not-yet-started average.
  double elapsed_weight = 7;
}

// A forward-start vanilla: the strike is fixed at the reset date `reset` to
// `moneyness · S(reset)` and the option pays the vanilla payoff at expiry.
// Priced by the FX dual-carry forward-start closed form
// `V = e^{−r_f·t₁}·S₀·u(m, T−t₁)` (`u` the unit-spot vanilla over the residual
// maturity). The expiry `T` is the enclosing `Instrument.expiry_years`; the
// reset must satisfy `0 ≤ reset ≤ T`.
message ForwardStart {
  // Call or put.
  OptionType option_type = 1;
  // Strike-reset multiple `m`: at `reset` the strike becomes `m·S(reset)`
  // (`m = 1` is the at-the-money-forward reset).
  double moneyness = 2;
  // Reset (strike-fixing) date `t₁` in years, with `0 ≤ reset ≤ expiry_years`.
  double reset = 3;
}

// A cliquet (ratchet): a strip of consecutive forward-start vanillas over an
// evenly-spaced reset schedule, with optional per-period local floor/cap on each
// leg's option return and an optional global floor/cap on the accumulated
// payoff. The plain (unclamped) ratchet prices in closed form as the exact sum
// of forward-start legs; any local/global clamp switches the pricer to a
// Monte-Carlo estimator that reports `price` plus its standard error
// (`PriceResponse.price_std_error`). The expiry `T` is the enclosing
// `Instrument.expiry_years`.
message Cliquet {
  // Call (`+1`) or put (`−1`) per-period payoff direction.
  OptionType option_type = 1;
  // Per-period strike-reset multiple `m` (applied to every leg).
  double moneyness = 2;
  // Number of evenly-spaced ratchet periods over `[0, expiry_years]`; `≥ 1`.
  uint32 periods = 3;
  // Optional per-period local floor on each clamped period option return.
  // Presence-tracked: an unset floor is unconstrained.
  optional double local_floor = 4;
  // Optional per-period local cap on each clamped period option return.
  // Presence-tracked: an unset cap is unconstrained.
  optional double local_cap = 5;
  // Optional global floor on the accumulated (summed) payoff. Presence-tracked.
  optional double global_floor = 6;
  // Optional global cap on the accumulated (summed) payoff. Presence-tracked.
  optional double global_cap = 7;
  // Number of antithetic Monte-Carlo path pairs for the clamped variant; `0`
  // selects a server default. Ignored for a plain (unclamped) ratchet, which is
  // priced exactly in closed form.
  uint32 mc_pairs = 8;
  // Counter-RNG seed for the clamped Monte-Carlo estimator (identical seeds
  // reproduce results bit-for-bit). Ignored for a plain ratchet.
  uint64 mc_seed = 9;
}

// A quanto option: a vanilla or cash-or-nothing digital whose natural payoff is
// converted into a fixed settlement currency at a fixed rate. Priced by the
// closed-form quanto-drift adjustment `−ρ·σ_S·σ_Z` to the underlying carry
// under the settlement-currency measure; at `correlation = 0` the adjustment
// vanishes and the price collapses to the plain (un-converted) vanilla/digital.
message Quanto {
  // Whether the wrapped payoff is a vanilla or a cash-or-nothing digital.
  QuantoPayoff payoff = 1;
  // Call or put.
  OptionType option_type = 2;
  // The strike `K` (quote per 1 unit of base).
  double strike = 3;
  // Annualised volatility `σ_Z` of the settlement-conversion rate.
  double conversion_vol = 4;
  // Instantaneous correlation `ρ ∈ [−1, 1]` between the underlying spot and the
  // settlement-conversion rate.
  double correlation = 5;
}

// A Target-Redemption Forward (TARF): a strip of periodic FX fixings against a
// strike, accruing a per-fixing gain on the favourable side toward a cumulative
// `target` that **knocks the structure out** once reached, with `leverage`
// gearing on the adverse side. Priced by Monte-Carlo (the terminal law per
// fixing is exact, so the only error is statistical), so the reported `price`
// carries a standard error (`PriceResponse.price_std_error`). The value is the
// **bank's** present value (positive = value to the bank). The expiry `T` is the
// enclosing `Instrument.expiry_years`.
message Tarf {
  // The single payoff direction whose favourable side accrues client gains: a
  // PUT means the client gains when `S_k < strike` (the classic exporter TARF),
  // a CALL when `S_k > strike`.
  OptionType option_type = 1;
  // The strike `K` of every fixing.
  double strike = 2;
  // The cumulative gain target; accumulated client gain at or above it redeems.
  double target = 3;
  // The gearing/leverage multiplier on the adverse (loss) leg (`≥ 0`).
  double leverage = 4;
  // The gap-risk settlement convention of the redeeming fixing.
  TarfRedemption redemption = 5;
  // The fixing schedule. The number of fixings is `fixing_years.len()` (the
  // exotics engine spaces them equally over `[0, expiry_years]`); the per-fixing
  // notional is `fixing_notional`.
  FixingSchedule schedule = 6;
  // The number of antithetic Monte-Carlo path pairs; `0` selects a server
  // default.
  uint32 mc_pairs = 7;
  // The counter-RNG seed (identical seeds reproduce results bit-for-bit).
  uint64 mc_seed = 8;
}

// A pivot Target-Redemption Accumulator: a strip of periodic FX fixings whose
// per-fixing payoff is piecewise-linear with a kink at a `pivot` level DISTINCT
// from the `strike` the intrinsic is measured against. On the favourable side of
// the pivot the client receives the un-geared intrinsic `g·(S_k − strike)`
// (accruing toward the cumulative `target`, which knocks the structure out —
// exactly the TARF redemption mechanic, including the `TarfRedemption` gap-risk
// convention); on the adverse side the leg is geared by `leverage`. Setting
// `pivot == strike` collapses the product exactly to the plain `Tarf`. Priced by
// Monte-Carlo (the terminal law per fixing is exact, so the only error is
// statistical), so the reported `price` carries a standard error
// (`PriceResponse.price_std_error`). The value is the **bank's** present value
// (positive = value to the bank). The expiry `T` is the enclosing
// `Instrument.expiry_years`.
message Pivot {
  // The single payoff direction whose favourable side accrues client gains: a
  // PUT means the client gains when `S_k < strike` (the classic exporter
  // orientation), a CALL when `S_k > strike`.
  OptionType option_type = 1;
  // The target strike `K`: the level the per-fixing intrinsic `S_k − K` is
  // measured against, and the reference for the cumulative gain that accrues
  // toward `target`.
  double strike = 2;
  // The pivot `P`: the kink at which the per-fixing leg switches from the
  // un-geared favourable leg to the `leverage`-geared adverse leg. `P` away
  // from `K` opens a dead band (`P > K`, call-favourable) or an overlap
  // (`P < K`); `P == K` recovers the plain TARF exactly.
  double pivot = 3;
  // The cumulative gain target; accumulated client gain at or above it redeems.
  double target = 4;
  // The gearing/leverage multiplier on the adverse leg (the far side of the
  // pivot; `≥ 0`).
  double leverage = 5;
  // The gap-risk settlement convention of the redeeming fixing (shared with
  // `Tarf` — the identical redemption mechanic).
  TarfRedemption redemption = 6;
  // The fixing schedule. The number of fixings is `fixing_years.len()` (the
  // exotics engine spaces them equally over `[0, expiry_years]`); the per-fixing
  // notional is `fixing_notional`.
  FixingSchedule schedule = 7;
  // The number of antithetic Monte-Carlo path pairs; `0` selects a server
  // default.
  uint32 mc_pairs = 8;
  // The counter-RNG seed (identical seeds reproduce results bit-for-bit).
  uint64 mc_seed = 9;
}

// An accumulator: periodic accumulation at a `pivot` strike with an up-and-out
// knock-out `barrier` (`barrier > pivot`) and `leverage` gearing on the
// below-pivot (loss) leg. Priced by Monte-Carlo, so the reported `price` carries
// a standard error (`PriceResponse.price_std_error`). The value is the
// **client's** present value (positive = value to the client). The expiry `T` is
// the enclosing `Instrument.expiry_years`.
message Accumulator {
  // The pivot strike `K` at which the client accumulates each fixing.
  double pivot = 1;
  // The up-and-out knock-out barrier `B` (`B > pivot`); reaching it terminates
  // the structure.
  double barrier = 2;
  // The gearing/leverage multiplier on the below-pivot (loss) leg (`≥ 0`).
  double leverage = 3;
  // The knock-out monitoring convention (discrete at fixings, or continuous via
  // the Brownian-bridge crossing probability between fixings).
  AccumulatorMonitoring monitoring = 4;
  // The fixing schedule. The number of fixings is `fixing_years.len()` (spaced
  // equally over `[0, expiry_years]`); the per-fixing notional is
  // `fixing_notional`.
  FixingSchedule schedule = 5;
  // The number of antithetic Monte-Carlo path pairs; `0` selects a server
  // default.
  uint32 mc_pairs = 6;
  // The counter-RNG seed (identical seeds reproduce results bit-for-bit).
  uint64 mc_seed = 7;
}

// A lookback option on the running extremum of the path. The continuous-
// monitoring variant prices by exact closed form (no Monte-Carlo std-error); the
// discrete-monitoring variant prices by Monte-Carlo with the Brownian-bridge
// extremum correction and reports a standard error
// (`PriceResponse.price_std_error`). The expiry `T` is the enclosing
// `Instrument.expiry_years`.
message Lookback {
  // Floating- or fixed-strike family.
  LookbackStyle style = 1;
  // Call or put.
  OptionType option_type = 2;
  // Continuous (closed-form) or discrete (Monte-Carlo) monitoring.
  LookbackMonitoring monitoring = 3;
  // The strike `K`, used only by the FIXED-strike family (ignored for FLOATING,
  // whose strike is the path extremum).
  double strike = 4;
  // The number of equally-spaced monitoring observations for the DISCRETE
  // variant; `0` selects a server default. Ignored for CONTINUOUS monitoring.
  uint32 observations = 5;
  // The number of antithetic Monte-Carlo path pairs for the DISCRETE variant;
  // `0` selects a server default. Ignored for CONTINUOUS monitoring.
  uint32 mc_pairs = 6;
  // The counter-RNG seed for the DISCRETE Monte-Carlo estimator (identical seeds
  // reproduce results bit-for-bit). Ignored for CONTINUOUS monitoring.
  uint64 mc_seed = 7;
}

// An American or Bermudan early-exercise vanilla option. Physically-settled FX
// options trade American-style: the holder may exercise at any time up to expiry
// (`EXERCISE_STYLE_AMERICAN`) or only on a discrete set of permitted dates
// (`EXERCISE_STYLE_BERMUDAN`). The expiry `T` is the enclosing
// `Instrument.expiry_years`.
//
// The default engine is the projected-SOR free-boundary Crank-Nicolson finite
// difference (exact to grid tolerance, no Monte-Carlo std-error, the full Greek
// strip by central differences). Setting `lsm_paths > 0` selects the
// Longstaff-Schwartz regression Monte-Carlo engine instead, which carries a
// price standard error on `PriceResponse.price_std_error` (the independent
// cross-check engine; the FD engine is the production workhorse).
//
// Scope: American/Bermudan VANILLA only. American *barrier* options price on the
// same grid and are the documented next increment; they are intentionally not
// offered here rather than half-built.
message AmericanOption {
  // Call or put.
  OptionType option_type = 1;
  // Strike `K` (absolute level, quote per 1 unit of base).
  double strike = 2;
  // Continuous (American) or discrete-date (Bermudan) exercise.
  ExerciseStyle exercise_style = 3;
  // For `EXERCISE_STYLE_BERMUDAN`: the permitted exercise dates as year-fractions
  // in `(0, T]` (each measured from valuation). Out-of-range and duplicate
  // entries are ignored; expiry is always added implicitly. Ignored for
  // `EXERCISE_STYLE_AMERICAN`.
  repeated double bermudan_dates = 4;
  // The number of Longstaff-Schwartz Monte-Carlo paths. `0` selects the
  // finite-difference engine (default, exact); `> 0` selects the LSM engine,
  // which carries a price standard error.
  uint32 lsm_paths = 5;
  // For the LSM engine and an AMERICAN option: the number of equally-spaced
  // exercise opportunities used to discretise continuous exercise; `0` selects a
  // server default. Ignored for the FD engine and for Bermudan (whose explicit
  // dates are the exercise grid).
  uint32 lsm_exercise_dates = 6;
  // The Sobol scramble seed for the LSM engine (identical seeds reproduce results
  // bit-for-bit). Ignored for the FD engine.
  uint64 lsm_seed = 7;
}

// One leg of a correlated multi-asset (basket / best-of / worst-of) option: an
// FX underlying with its own market data and basket weight.
//
// Per-leg market data travels IN the leg (not in the request's single-pair
// `MarketContext`): a multi-asset instrument has N underlyings each with its own
// spot, vol and foreign rate, which the one top-level `MarketContext` cannot
// carry. The shared domestic (numeraire / settlement-currency) rate is taken
// from the request `MarketContext.discount_rate`; the leg's `r_for` is its own.
message BasketLeg {
  // The underlying of this leg (e.g. EURUSD). Identifies the leg for attribution
  // and display; the numerics use the explicit market data below.
  Underlying underlying = 1;
  // The leg weight `w_a` applied to `S_a(T)` in the basket / rainbow
  // aggregation. May be negative (a short basket leg).
  double weight = 2;
  // The leg spot FX level `S_a(0)` (quote per unit base).
  double spot = 3;
  // The leg annualised lognormal volatility `σ_a` (absolute, e.g. 0.10 = 10 vol).
  double vol = 4;
  // The leg continuously-compounded foreign (base) rate `r_f,a`.
  double r_for = 5;
}

// A correlated multi-asset FX option over N currency-pair legs: a weighted
// arithmetic BASKET, or a BEST_OF / WORST_OF (rainbow) on the per-leg weighted
// terminal levels. Priced by a Cholesky-correlated multi-asset geometric-
// Brownian-motion Monte-Carlo over the scrambled-Sobol / Brownian-bridge QMC
// engine, so the reported `price` carries a standard error
// (`PriceResponse.price_std_error`). The expiry `T` is the enclosing
// `Instrument.expiry_years`; the shared domestic (settlement) rate is the
// request `MarketContext.discount_rate`.
//
// Greek scope: multi-asset basket Greeks are a distinct larger increment (a
// per-leg N×{spot,vol} Jacobian plus cross-gammas) and are intentionally NOT
// returned by this product — the price and its standard error are reported and
// the Greek strip is zeroed rather than faked with a single-underlying bump.
// `Instrument.underlying` plays the role of the SETTLEMENT / numeraire pair only
// (the underlyings are the per-leg `BasketLeg.underlying`s).
message BasketOption {
  // The legs (one FX underlying each); at least one. A single weight-1 leg
  // collapses to a vanilla on that leg (used as the degenerate parity oracle).
  repeated BasketLeg legs = 1;
  // The N×N instantaneous correlation matrix in ROW-MAJOR order (length N²):
  // entry `(i,j)` is `correlations[i*N + j]`. Must be symmetric with unit
  // diagonal and positive-definite; a non-SPD matrix is rejected
  // (`INVALID_ARGUMENT`) rather than silently regularised.
  repeated double correlations = 2;
  // Call or put on the aggregated underlying.
  OptionType option_type = 3;
  // The strike `K` on the aggregated underlying.
  double strike = 4;
  // The aggregation kind (basket / best-of / worst-of).
  BasketKind kind = 5;
  // Scrambled-Sobol points per replication (paths per scramble); `0` selects a
  // server default.
  uint32 mc_paths = 6;
  // Independent randomized scrambles (`≥ 2` for a finite standard error); `0`
  // selects a server default.
  uint32 mc_replications = 7;
  // Time steps per path; `0` selects a server default (terminal-only `1` step
  // suffices for these European payoffs).
  uint32 mc_steps = 8;
  // The base scramble seed (identical seeds reproduce results bit-for-bit).
  uint64 mc_seed = 9;
}

// The unified instrument every Celnet workflow speaks. Exactly one variant is
// set. Pricing, RFQ, RFS, and scenario all carry an `Instrument`, so adding a
// product type is a single additive change here.
message Instrument {
  // The underlying the instrument trades (FX is the first-class W1 arm).
  Underlying underlying = 1;
  // The expiry tenor (mutually informative with `expiry_years`).
  Tenor tenor = 2;
  // The expiry as a year fraction on the surface day-count (authoritative for
  // pricing; `tenor` is the trader-facing label).
  double expiry_years = 3;
  // The trade notional and its currency leg.
  Quantity quantity = 4;
  // The top-level side (BUY/SELL, or TWO_WAY to request a two-way market).
  Side side = 5;
  // Optional solve directive (e.g. solve strike for zero premium).
  Solve solve = 6;
  // The booking / pricing model the instrument is priced under. Absent or
  // `PRICING_MODEL_DEFAULT` selects the product's default analytic engine
  // (byte-identical to the contract before this field existed);
  // `PRICING_MODEL_LOCAL_STOCH_VOL` routes the supported products (vanilla,
  // single-barrier knock-out, window-barrier) through the LSV engine. Travels on
  // the instrument so it reaches price/quote/stream/scenario uniformly.
  PricingModel pricing_model = 22;
  // The contract settlement mechanics (linear vs inverse/coin-margined). Absent
  // or `SETTLEMENT_STYLE_LINEAR` selects the ordinary quote-currency-margined
  // linear contract (byte-identical to the contract before this field existed);
  // `SETTLEMENT_STYLE_INVERSE_COIN` selects the coin-margined `1/S_T` digital-
  // asset convention. Travels on the instrument so it reaches
  // price/quote/stream/scenario uniformly, exactly like `pricing_model`.
  SettlementStyle settlement_style = 29;
  // The product payoff: exactly one variant is set.
  oneof product {
    // A vanilla European option.
    Vanilla vanilla = 7;
    // A multi-leg strategy (risk reversal / strangle / straddle / seagull).
    Strategy strategy = 8;
    // A single-barrier knock-in / knock-out option.
    SingleBarrier single_barrier = 9;
    // A double-barrier option.
    DoubleBarrier double_barrier = 10;
    // A digital (binary) option.
    Digital digital = 11;
    // A touch structure (one-/no-/double-no-/double-one-touch).
    Touch touch = 12;
    // A variance swap (fair-variance-strike replication).
    VarianceSwap variance_swap = 13;
    // A volatility swap (convexity-adjusted fair-vol strike).
    VolatilitySwap volatility_swap = 14;
    // A fixed-strike arithmetic-average-rate Asian option.
    AsianOption asian_option = 15;
    // A forward-start vanilla (strike reset at a future date).
    ForwardStart forward_start = 16;
    // A cliquet / ratchet (strip of forward-start legs; plain closed-form or
    // clamped Monte-Carlo).
    Cliquet cliquet = 17;
    // A quanto option (vanilla or digital, settlement-currency converted).
    Quanto quanto = 18;
    // A Target-Redemption Forward (strip of geared fixings with a knock-out
    // target; Monte-Carlo, carries a price standard error).
    Tarf tarf = 19;
    // An accumulator (periodic pivot accumulation with an up-and-out barrier;
    // Monte-Carlo, carries a price standard error).
    Accumulator accumulator = 20;
    // A lookback option (floating/fixed strike; continuous closed-form or
    // discrete Monte-Carlo, the latter carrying a price standard error).
    Lookback lookback = 21;
    // A window knock-out barrier (active only inside a calendar window). Priced
    // only under `PRICING_MODEL_LOCAL_STOCH_VOL`; no closed form.
    WindowBarrier window_barrier = 23;
    // An American / Bermudan early-exercise vanilla. Priced by the projected-SOR
    // free-boundary finite difference (default) or the Longstaff-Schwartz
    // regression Monte-Carlo (when `lsm_paths > 0`, carrying a std-error).
    AmericanOption american = 24;
    // A correlated multi-asset FX option (weighted basket / best-of / worst-of)
    // over N currency-pair legs. Cholesky-correlated multi-asset GBM Monte-Carlo
    // over the scrambled-Sobol / Brownian-bridge engine, carrying a std-error.
    BasketOption basket = 25;
    // An outright forward (deliverable): PV of a discounted cashflow at a
    // contract rate. Linear in spot, closed-form, exact (no std-error). Valid
    // for a deliverable underlying (FX or metal); an NDF underlying is rejected.
    FxForward fx_forward = 26;
    // An FX swap: a near leg + a far leg (two outright forwards, opposite sides).
    // PV is the sum of the two leg PVs. Deliverable underlying only.
    FxSwap fx_swap = 27;
    // A non-deliverable forward (NDF): cash-settled in the convertible
    // (settlement) currency at a named fixing. Valid ONLY for a non-deliverable
    // underlying; an NDF on a deliverable pair is rejected as INVALID_ARGUMENT.
    Ndf ndf = 28;
    // A perpetual (no-expiry) American option. The enclosing `expiry_years`
    // MUST be 0 for this arm (a perpetual has no expiry to encode); a non-zero
    // expiry on a perpetual is rejected as INVALID_ARGUMENT at decode/validity
    // — never silently ignored.
    PerpetualOption perpetual_option = 30;
    // An option on a listed future — any asset class (the `underlying` names
    // the class; `ListedFutureOption.future_symbol` names the contract). The
    // future must outlive the option: `future_expiry_years >= expiry_years > 0`
    // is validity-checked, INVALID_ARGUMENT otherwise.
    ListedFutureOption listed_future_option = 31;
    // A pivot Target-Redemption Accumulator (a TARF generalized with a distinct
    // pivot kink: two-level piecewise-linear fixings with the cumulative-target
    // knock-out; `pivot == strike` collapses exactly to `Tarf`). Monte-Carlo,
    // carries a price standard error.
    Pivot pivot = 32;
  }
}

// An outright forward — mirrors the `celnet-linear` forward leaf. A linear,
// closed-form discounted-cashflow product (NOT an option payoff): its PV is
// `side · notional · discount_df(t) · (forward_rate − contract_rate)` where
// `forward_rate = spot · forward_factor(t)` is produced by the instrument's
// carry. Asset-class-agnostic: a forward on an FX or metal underlying uses the
// identical engine. Exact ⇒ the `PriceResponse.price_std_error` is absent.
message FxForward {
  // The agreed contract (delivery) rate `K` in quote per 1 unit of base/asset.
  double contract_rate = 1;
  // The notional amount (always positive; direction is carried by `side`).
  double notional = 2;
  // The direction taken (BUY = long the base/asset forward; SELL = short).
  Side side = 3;
}

// An FX swap — a near leg and a far leg, each an outright `FxForward`. By market
// convention the two legs trade in opposite directions (`far.side` is the
// opposite of `near.side`); the swap PV is the independent sum of the two leg
// PVs. The instrument's single expiry/tenor anchors the near leg; the far leg's
// settlement is the longer-dated one (carried out of band on the legs' terms).
message FxSwap {
  // The near (shorter-dated) leg.
  FxForward near = 1;
  // The far (longer-dated) leg; by convention the opposite side to `near`.
  FxForward far = 2;
}

// A non-deliverable forward (NDF) — mirrors the `celnet-linear` NDF leaf. The
// risk-neutral PV is identical to a deliverable forward of equal terms
// (`side · notional · discount_df(t) · (forward_rate − contract_rate)`,
// discounted in the convertible/settlement currency); non-deliverability changes
// only the settlement mechanics, not the PV. Valid ONLY for a non-deliverable
// underlying. The `fixing` names the published settlement-rate option; the live
// fixing VALUE is an estate-gated feed, never sourced in-repo (only the identity
// is on the wire).
message Ndf {
  // The agreed contract (forward) rate `K` in settlement-ccy per 1 unit of base.
  double contract_rate = 1;
  // The notional amount (always positive; direction is carried by `side`).
  double notional = 2;
  // The direction taken (BUY = long the base/asset forward; SELL = short).
  Side side = 3;
  // The published settlement-rate option the contract fixes against (identity
  // only — the live fixing value is an estate-gated feed, never in-repo).
  FixingSource fixing = 4;
  // The convertible (settlement) currency the net cash settlement is paid in (a
  // 3-letter code). The PV is discounted at the convertible-leg (settlement-ccy)
  // rate, not the restricted leg's.
  string settlement_ccy = 5;
}

// A perpetual (no-expiry) American option: the holder may exercise at any time,
// with no terminal date — exercise is the only way the contract ends, so the
// product is American by construction and carries no exercise-style field.
// Because there is no expiry to encode, the enclosing `Instrument.expiry_years`
// MUST be 0 for this arm; a non-zero expiry on a perpetual is rejected as
// INVALID_ARGUMENT at decode/validity (`convert::validate_perpetual_terms`) —
// never silently ignored.
message PerpetualOption {
  // Call or put.
  OptionType option_type = 1;
  // Strike `K` (absolute level, quote per 1 unit of base/asset).
  double strike = 2;
  // The notional amount (always positive; direction is carried by the
  // enclosing `Instrument.side`).
  double notional = 3;
}

// An option on a listed future, for any asset class: the enclosing
// `Instrument.underlying` names the asset class and `future_symbol` names the
// specific listed contract the option exercises into. The future must outlive
// the option — `future_expiry_years >= Instrument.expiry_years > 0` is
// validity-checked (`convert::validate_listed_future_terms`), INVALID_ARGUMENT
// otherwise. The `margining` convention decides whether the premium is paid
// upfront (equity-style, discounted) or margined daily (futures-style,
// undiscounted).
message ListedFutureOption {
  // The listed future contract the option exercises into (reuses the
  // vendor-neutral `Symbol`: ticker + listing venue MIC).
  Symbol future_symbol = 1;
  // The FUTURE's own expiry as a year fraction on the surface day-count. Must
  // be >= the option's `Instrument.expiry_years` (the future outlives the
  // option), which in turn must be > 0.
  double future_expiry_years = 2;
  // Call or put on the future.
  OptionType option_type = 3;
  // Strike `K` (absolute level, in the future's quote units).
  double strike = 4;
  // The notional amount (always positive; direction is carried by the
  // enclosing `Instrument.side`).
  double notional = 5;
  // The premium margining convention (equity-style upfront/discounted vs
  // futures-style daily-margined/undiscounted). Meaningful-zero (like
  // `SettlementStyle`): absent/zero is the ordinary equity-style contract.
  Margining margining = 6;
}

// ===========================================================================
// attribution — who's-trading identity keyed onto the quote/trade lifecycle
// ===========================================================================

// The book a quote/trade belongs to and the seat responsible for it. This is
// the identity dimension the risk roll-up keys on (RISK-HIERARCHY: book is a
// cube dimension; SCALE #12: the blotter/Book stop being anonymous). A book is
// owned either by a human trading seat or by an automated pricer; both are
// represented uniformly so attribution and governance treat them the same.
message BookId {
  // The stable book identifier (desk/book key, e.g. "EM-VOL-1").
  string book = 1;
  // The seat that owns the book — a human trader id or an auto-pricer id.
  Owner owner = 2;
}

// The seat responsible for a quote/trade: a human trading seat or an automated
// pricer. Modelled as a oneof so the who's-trading roll-up treats human and
// machine flow uniformly while still distinguishing them for governance.
message Owner {
  // Exactly one is set.
  oneof seat {
    // A human trading seat (a trader/desk-member identifier).
    string trader = 1;
    // An automated pricer (a pricer/strategy identifier) — auto-quoted flow.
    string auto_pricer = 2;
  }
}

// The lifecycle role a quote played: who quoted it, whether it won the trade,
// and who holds the resulting position. Carried on the quote/trade messages so
// the who's-trading dimension is keyable end-to-end (LP-in-competition,
// won/lost, holder) and feeds the risk roll-up. Minimal and presence-tracked:
// a message that does not assert attribution simply omits the record.
message AttributionRecord {
  // The book/seat that quoted this line (priced and showed the market).
  BookId quoted_by = 1;
  // The book/seat that holds the position once the trade books
  // (presence-tracked): absent until a trade is booked, or when it equals
  // `quoted_by`.
  optional BookId held_by = 2;
  // Whether this quote won the trade in competition (presence-tracked): absent
  // ⇒ outcome not yet known / not in competition; true ⇒ this seat won the
  // line; false ⇒ it lost (another LP won).
  optional bool won = 3;
  // The number of liquidity providers in competition for this line
  // (presence-tracked), 1 ⇒ sole quote. Lets the blotter show LP-in-competition.
  optional uint32 lp_count = 4;
}

// ===========================================================================
// quote — the RFQ lifecycle (RequestQuote / AcceptQuote / RejectQuote)
// ===========================================================================

// A request for a tradable quote on an instrument.
//
// `idempotency_key` is a client-supplied unique token (e.g. a UUID): a retry
// after a timeout carrying the same key returns the same `quote_id`, never
// double-requesting. Omit `Instrument.side` (set TWO_WAY) to request a two-way
// market, as FIX `QuoteRequest` does when side is absent.
message QuoteRequest {
  // Client-supplied idempotency token; identical retries are deduplicated.
  string idempotency_key = 1;
  // The instrument to quote.
  Instrument instrument = 2;
  // The trade conventions the quote should be expressed under.
  Conventions conventions = 3;
  // Optional caller correlation id (an opaque client trace/blotter key), echoed
  // verbatim on the resulting `Quote` so a client can join the asynchronous
  // reply to its originating request without depending on the server-assigned
  // `quote_id`. Presence-tracked: absent ⇒ no correlation requested.
  optional uint64 correlation_id = 4;
  // Optional marked-surface version to price against, so the quote is
  // reproducibly tied to a specific surface mark (the version a
  // `MarkSurfaceResponse` assigned). Presence-tracked: absent ⇒ the engine
  // prices against its current live mark. This is a *data* field selecting a
  // surface, NOT an API version (the contract itself is unversioned, rule 9).
  optional uint64 surface_version = 5;
  // The requesting book/seat (presence-tracked): the human or auto-pricer
  // seat the quote is requested on behalf of, so the resulting `Quote` and any
  // booking carry a complete attribution chain. Absent ⇒ unattributed.
  optional AttributionRecord attribution = 6;
  // The session token from AuthService.Login. The server resolves the caller and
  // gates the RFQ under the access posture (Enforce ⇒ an unauthenticated request
  // is refused; Permissive ⇒ the anonymous grant-all caller). Absent ⇒ anonymous.
  // A field selecting WHO, never an API version (rule 9).
  optional string session_token = 7;
  // The entitlement principal the caller asserts (absent ⇒ grant-all under
  // Permissive). Bound to any later accept of the resulting quote.
  optional EntitlementPrincipal principal = 8;
}

// A tradable two-way quote returned for a `QuoteRequest`.
message Quote {
  // Server-assigned stable quote identifier.
  uint64 quote_id = 1;
  // Echo of the originating request's idempotency key.
  string idempotency_key = 2;
  // The two-way bid/offer premium in `conventions.premium_style` units.
  TwoWayPrice price = 3;
  // The full 14-member Greek set for the quoted instrument.
  Greeks greeks = 4;
  // The conventions the quote is expressed under (resolved server-side).
  Conventions conventions = 5;
  // The strike resolved if the request used a delta or a solve directive.
  double resolved_strike = 6;
  // Publication time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 7;
  // Quote validity deadline (last-look window), nanoseconds since the Unix
  // epoch (UTC). An accept after this instant is rejected as expired.
  int64 valid_until_nanos = 8;
  // Echo of the originating `QuoteRequest.correlation_id`, if one was supplied
  // (presence-tracked), so a client joins this reply to its request.
  optional uint64 correlation_id = 9;
  // The marked-surface version this quote was priced against (presence-tracked):
  // the requested `QuoteRequest.surface_version` if one was supplied, else the
  // live mark the engine resolved. A *data* field, not an API version.
  optional uint64 surface_version = 10;
  // Who quoted this line and (once known) who holds/won it (presence-tracked):
  // the attribution chain keying the who's-trading risk roll-up. Absent ⇒
  // unattributed.
  optional AttributionRecord attribution = 11;
  // Monte-Carlo standard error of the quoted premium (presence-tracked): set
  // ONLY for MC-priced products (e.g. a clamped/floored cliquet), absent for
  // closed-form products. Surfaced so every client (gRPC, WS, SDK) discloses the
  // MC uncertainty of the quote and never presents an MC price as exact.
  optional double price_std_error = 12;
}

// One liquidity provider's line in a multi-dealer (RFQ-to-many) response: the
// dealer's identity, its two-way market, and the per-dealer validity / ranking
// metadata the aggregator computed. A `MultiDealerQuote` carries one of these per
// responding dealer; the aggregate `quote_id` keys the request, and `lp_id`
// disambiguates which dealer's price a `QuoteAccept` lifts/hits.
message DealerQuote {
  // The liquidity provider's stable identifier (a dealer/LP key, e.g. "LP-A").
  string lp_id = 1;
  // This dealer's two-way bid/offer premium in the request's
  // `Conventions.premium_style` units.
  TwoWayPrice price = 2;
  // The full Greek set for this dealer's line.
  Greeks greeks = 3;
  // The strike this dealer resolved (if the request used a delta / solve).
  double resolved_strike = 4;
  // This dealer's line validity deadline (last-look), nanoseconds since the Unix
  // epoch (UTC). An accept of this dealer after the instant is rejected.
  int64 valid_until_nanos = 5;
  // The dealer's attribution (who quoted this line), so the multi-dealer ladder
  // keys the who's-trading roll-up (presence-tracked). Absent ⇒ unattributed.
  optional AttributionRecord attribution = 6;
  // Monte-Carlo standard error of this dealer's premium (presence-tracked): set
  // ONLY for MC-priced products, absent for closed-form. Surfaced so a client
  // never presents an MC dealer price as exact.
  optional double price_std_error = 7;
}

// The multi-dealer (RFQ-to-many) response: the competing dealer lines for one
// request, pre-ranked by the aggregator. `dealers` is ordered best-first on the
// requested side (the tightest price leads); `best_bid_lp_id` / `best_offer_lp_id`
// name the touch dealers so a client can lift/hit the best line without re-sorting.
// The aggregate `quote_id` keys the request; a `QuoteAccept` carries the chosen
// `DealerQuote.lp_id` to trade a specific dealer's line.
message MultiDealerQuote {
  // Server-assigned aggregate request identifier (the request, not a single
  // dealer line). A `QuoteAccept` echoes this with the chosen `lp_id`.
  uint64 quote_id = 1;
  // Echo of the originating request's idempotency key.
  string idempotency_key = 2;
  // The competing dealer lines, ordered best-first on the requested side.
  repeated DealerQuote dealers = 3;
  // The `lp_id` of the dealer showing the best (highest) bid (the client sells
  // into it). Empty if no dealer quoted a bid.
  string best_bid_lp_id = 4;
  // The `lp_id` of the dealer showing the best (lowest) offer (the client buys
  // from it). Empty if no dealer quoted an offer.
  string best_offer_lp_id = 5;
  // The conventions the dealer lines are expressed under (resolved server-side).
  Conventions conventions = 6;
  // Publication time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 7;
  // Echo of the originating `QuoteRequest.correlation_id`, if one was supplied
  // (presence-tracked).
  optional uint64 correlation_id = 8;
  // The marked-surface version the dealer lines were priced against
  // (presence-tracked). A *data* field, not an API version.
  optional uint64 surface_version = 9;
}

// A client acceptance of a previously issued `Quote`.
message QuoteAccept {
  // The quote being accepted.
  uint64 quote_id = 1;
  // Echo of the idempotency key, so an accept retry is deduplicated too.
  string idempotency_key = 2;
  // The side the client trades on a two-way quote (BUY = lift the offer,
  // SELL = hit the bid). Ignored for an already one-way quote.
  Side side = 3;
  // The liquidity provider whose dealer line the client is accepting, in a
  // multi-dealer (RFQ-to-many) context: the `DealerQuote.lp_id` of the winning
  // dealer. Empty selects the single-dealer quote keyed solely by `quote_id`
  // (byte-identical to a single-dealer accept). In a `MultiDealerQuote` the
  // `quote_id` is the aggregate request id, so `lp_id` disambiguates which
  // dealer's price is being lifted/hit.
  string lp_id = 4;
  // The session token from AuthService.Login. The server resolves the accepting
  // caller, gates the booking under the access posture, and binds the accept to
  // the principal that requested the quote (a different caller is refused, beyond
  // the idempotency-key match). Absent ⇒ anonymous. Selects WHO, not a version.
  optional string session_token = 5;
  // The entitlement principal the accepting caller asserts (absent ⇒ grant-all
  // under Permissive). Must match the requesting quote's recorded principal.
  optional EntitlementPrincipal principal = 6;
}

// A client rejection of a previously issued `Quote` (declines to trade).
message QuoteReject {
  // The quote being rejected.
  uint64 quote_id = 1;
  // A free-text reason for the audit trail.
  string reason = 2;
  // The session token from AuthService.Login; the server resolves the caller and
  // gates the reject under the access posture. Absent ⇒ anonymous. Selects WHO.
  optional string session_token = 3;
  // The entitlement principal the caller asserts (absent ⇒ grant-all under
  // Permissive).
  optional EntitlementPrincipal principal = 4;
}

// The acknowledgement produced by rejecting a quote. A reject never books a
// trade, so it returns a purpose-typed ack (not an `Execution`): the quote is
// marked declined and can no longer be accepted.
message RejectAck {
  // The quote that was declined.
  uint64 quote_id = 1;
  // Acknowledgement time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 2;
}

// The booking confirmation produced by accepting a quote.
message Execution {
  // Server-assigned execution / booking identifier.
  uint64 execution_id = 1;
  // The quote that was traded.
  uint64 quote_id = 2;
  // The side actually traded.
  Side side = 3;
  // The premium traded (the lifted/hit side of the two-way), in the quote's
  // `conventions.premium_style` units.
  double traded_premium = 4;
  // The traded instrument (echoed for the booking record).
  Instrument instrument = 5;
  // Booking time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
  // The attribution chain for the booked trade (presence-tracked): who quoted
  // and who holds the position, so the booking feeds the who's-trading risk
  // roll-up. Absent ⇒ unattributed.
  optional AttributionRecord attribution = 7;
}

// ===========================================================================
// stream — the RFS bidirectional subscription (snapshot + delta + resync)
// ===========================================================================

// A client-assigned subscription identifier, unique within a client session,
// keying the request-for-stream so the server can route per-subscriber.
message SubscriptionId {
  // The opaque client-unique subscription token.
  uint64 value = 1;
}

// Open a request-for-stream on a specific instrument *within a multiplexed
// session*: one bidirectional `StreamSession` carries many concurrent
// subscriptions, each keyed by its own `SubscriptionId`, so a blotter watching
// hundreds of structures uses a single connection rather than one gRPC stream
// per line. The server replies with a `Snapshot` then a sequence of `Update`
// deltas + `Heartbeat`s for this subscription until it is torn down.
message Subscribe {
  // The client-assigned subscription id this stream is keyed on (unique within
  // the multiplexed session).
  SubscriptionId subscription = 1;
  // The instrument to stream a two-way market for.
  Instrument instrument = 2;
  // The conventions the streamed prices are expressed under.
  Conventions conventions = 3;
  // A client throttle hint: minimum nanoseconds between updates the client
  // wants (the server conflates deltas to honour it). 0 = no throttling.
  uint64 throttle_nanos = 4;
  // Optional caller correlation id, echoed on this subscription's `Snapshot`
  // (presence-tracked): a blotter joins each opened line to the request that
  // opened it without depending on the `SubscriptionId` alone. Absent ⇒ none.
  optional uint64 correlation_id = 5;
  // Optional marked-surface version to stream against, so the streamed prices
  // are reproducibly tied to a specific surface mark. Presence-tracked: absent
  // ⇒ the engine streams against its current live mark and re-marks roll the
  // stream forward. A *data* field selecting a surface, NOT an API version.
  optional uint64 surface_version = 6;
  // The requesting book/seat for this stream (presence-tracked): the human or
  // auto-pricer seat the subscription is opened on behalf of, echoed on the
  // line's `Snapshot`/`Executed` so click-to-trade fills are attributable.
  // Absent ⇒ unattributed.
  optional AttributionRecord attribution = 7;
}

// Modify a live subscription *in place* within the multiplexed session: change
// the streamed structure (e.g. roll the strike/tenor or switch the two-way
// notional), the conventions, the throttle hint, or the pinned surface version
// without tearing the subscription down and re-opening it. The server answers a
// `Modify` with a fresh `Snapshot` at the next sequence number carrying the new
// terms, so the client rebaselines exactly as it does on `Subscribe`/`Resync`.
message Modify {
  // The live subscription to modify (must already be open in this session).
  SubscriptionId subscription = 1;
  // The new instrument to stream (replaces the prior structure wholesale).
  Instrument instrument = 2;
  // The new conventions the streamed prices are expressed under.
  Conventions conventions = 3;
  // The new client throttle hint (minimum nanoseconds between updates).
  uint64 throttle_nanos = 4;
  // Optional new pinned marked-surface version (presence-tracked): absent ⇒
  // unpin and follow the live mark. A *data* field, not an API version.
  optional uint64 surface_version = 5;
}

// Tear down a previously opened subscription (the rest of the multiplexed
// session's subscriptions are unaffected).
message Unsubscribe {
  // The subscription to close.
  SubscriptionId subscription = 1;
}

// A server-assisted resync: the client detected a sequence gap and asks the
// server to re-deliver a fresh `Snapshot` (with the current sequence) so the
// client can resume from a known-good baseline.
message Resync {
  // The subscription to resynchronize.
  SubscriptionId subscription = 1;
  // The last in-sequence number the client successfully applied. The server
  // replies with a fresh snapshot bearing a sequence ≥ this value.
  uint64 last_sequence = 2;
}

// Liveness/keepalive on a streaming channel, sent both ways.
//
// `sequence` mirrors the per-subscription stream sequence so a missed update is
// detectable across heartbeats; `epoch_nanos` is the send time.
message Heartbeat {
  // The subscription the heartbeat belongs to.
  SubscriptionId subscription = 1;
  // The current per-subscription sequence number.
  uint64 sequence = 2;
  // Send time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 3;
  // Server observability surfaced on the liveness beat (appended; additive). All
  // are honest, real measurements taken off the hot path — the pinned zero-alloc
  // pricing core stays untouched; these are read on the edge/drain side only.
  //
  // The number of price ticks this subscription's fan-out ring CONFLATED (dropped
  // by forward-conflation under back-pressure) since it was opened — the exact
  // skip count from the `celnet-fanout` SPMC ring's `received + skipped ==
  // produced` accounting. A non-decreasing counter; 0 ⇒ the consumer never lagged.
  uint64 conflation_drops = 4;
  // Server-side price-compute latency p50 (median, nanoseconds) over the
  // per-subscription update path, from a drain-side HdrHistogram (3 sig-figs).
  // Zero until the first update is timed.
  uint64 server_price_p50_nanos = 5;
  // Server-side price-compute latency p99 (nanoseconds) — the 99th-percentile
  // tail of the per-subscription update path.
  uint64 server_price_p99_nanos = 6;
  // Server-side price-compute latency p99.9 (nanoseconds) — the 99.9th-percentile
  // tail of the per-subscription update path.
  uint64 server_price_p999_nanos = 7;
  // Provenance echo: the surface version this subscription is pinned to (0 ⇒ live
  // mark, unpinned) — so a consumer can reconcile the heartbeat against the
  // snapshot/update provenance it already holds.
  uint64 surface_version = 8;
  // Provenance echo: the opening `Subscribe.correlation_id` (0 ⇒ none).
  uint64 correlation_id = 9;
}

// The full state of a streamed instrument at a sequence point — the baseline a
// consumer applies whole before consuming deltas.
message Snapshot {
  // The subscription this snapshot answers.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number of this snapshot.
  uint64 sequence = 2;
  // The current two-way market.
  TwoWayPrice price = 3;
  // The full Greek set at this snapshot.
  Greeks greeks = 4;
  // The instrument vol used (absolute) at this snapshot.
  double vol = 5;
  // The conventions the prices are expressed under.
  Conventions conventions = 6;
  // The strike resolved (if the subscription used a delta/solve).
  double resolved_strike = 7;
  // The click-to-trade tokens for this line: one to SELL at the bid and one to
  // BUY at the offer, each bound to (subscription, sequence) and bounded by its
  // own `valid_until_nanos`. A client clicks a side and `Execute`s its token to
  // book exactly the stamped premium. Empty ⇒ the line is indicative-only.
  repeated TradableToken tradable = 8;
  // The marked-surface version these prices were computed against
  // (presence-tracked): the subscription's pinned version, else the live mark
  // the engine resolved. A *data* field, not an API version.
  optional uint64 surface_version = 9;
  // Echo of the opening `Subscribe.correlation_id`, if one was supplied
  // (presence-tracked), so a blotter joins this line to its open request.
  optional uint64 correlation_id = 10;
  // Snapshot time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 11;
  // Echo of the opening `Subscribe.attribution`, if one was supplied
  // (presence-tracked): the book/seat this streamed line is shown to, so the
  // blotter's attribution column has its identity. Absent ⇒ unattributed.
  optional AttributionRecord attribution = 12;
}

// A sequenced delta update on a streamed instrument. Carries the changed
// price/Greeks at the next sequence number; a gap in `sequence` signals loss
// and prompts a `Resync`.
message Update {
  // The subscription this update advances.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number (snapshot seq + n).
  uint64 sequence = 2;
  // The updated two-way market.
  TwoWayPrice price = 3;
  // The updated Greek set.
  Greeks greeks = 4;
  // The updated instrument vol (absolute).
  double vol = 5;
  // The refreshed click-to-trade tokens for this sequence (SELL@bid, BUY@offer):
  // a new sequence mints new tokens and retires the prior ones, so a click
  // always executes the *current* streamed premium. Empty ⇒ indicative-only.
  repeated TradableToken tradable = 6;
  // The marked-surface version these prices were computed against
  // (presence-tracked). A *data* field, not an API version.
  optional uint64 surface_version = 7;
  // Update time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 8;
}

// ===========================================================================
// Fixed-income (linear-rates) live streaming — folded into the SAME multiplexed
// StreamSession (and the SAME `PriceFanout`) the FX/cross-asset price stream
// uses, NOT a parallel FI path. A client opens a rates line with
// `RatesSubscribe` (a `RatesInstrument` priced against a `CurveSet`, the FI
// analogue of `Subscribe`'s instrument + market) and receives a baseline
// `RatesStreamSnapshot` then sequenced `RatesStreamUpdate`s as the curve evolves
// (the same re-price-on-tick model the FX line uses against an evolving spot).
// The streamed line is indicative (PV + first-order risk); click-to-trade for
// rates is booked through the RFQ/desk path, so NO `TradableToken` rides the
// rates stream. Additive (rule 9): new oneof arms + new messages; no existing
// field is touched, so the FX/cross-asset stream stays byte-identical.
// ===========================================================================

// Open a fixed-income streaming line within the multiplexed session, keyed by a
// client-assigned `SubscriptionId` (the SAME id space as the FX price + market
// series streams). The line prices `instrument` against `curve_set`; the server
// emits a baseline `RatesStreamSnapshot` then `RatesStreamUpdate`s as the curve
// deterministically ticks.
message RatesSubscribe {
  // The client-assigned subscription id this rates line is keyed on.
  SubscriptionId subscription = 1;
  // The linear-rates instrument to stream (OIS / IRS / FRA / cash bond).
  RatesInstrument instrument = 2;
  // The calibrated curve set the instrument is priced against — the subscribed
  // baseline curve the deterministic per-curve evolution shifts around.
  CurveSet curve_set = 3;
  // A client throttle hint: minimum nanoseconds between updates the client
  // wants (the server conflates deltas to honour it). 0 = no throttling.
  uint64 throttle_nanos = 4;
  // Optional caller correlation id, echoed on the baseline snapshot
  // (presence-tracked), so a blotter joins the line to its open request.
  optional uint64 correlation_id = 5;
}

// The baseline state of a streamed fixed-income line at a sequence point — the
// priced `RatesPricingResult` a consumer applies whole before consuming deltas.
// Faithful to `PricingService.PriceRates`: the snapshot's `result` at the
// subscribed baseline curve equals `price_rates(instrument, curve_set)` exactly.
message RatesStreamSnapshot {
  // The subscription this snapshot answers.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number of this snapshot (1).
  uint64 sequence = 2;
  // The priced PV + PV01 / DV01 / key-rate ladder at this snapshot.
  RatesPricingResult result = 3;
  // The parallel curve shift (decimal, added to every pillar par rate) applied
  // relative to the subscribed baseline curve — always 0 at the baseline.
  double curve_shift = 4;
  // Echo of the opening `RatesSubscribe.correlation_id`, if one was supplied
  // (presence-tracked). Absent => none.
  optional uint64 correlation_id = 5;
  // Snapshot time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
}

// A sequenced delta on a streamed fixed-income line: the line re-priced at the
// next sequence against the baseline curve shifted by `curve_shift`. A gap in
// `sequence` signals loss and prompts a `Resync`.
message RatesStreamUpdate {
  // The subscription this update advances.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number (snapshot seq + n).
  uint64 sequence = 2;
  // The re-priced PV + first-order risk at this sequence.
  RatesPricingResult result = 3;
  // The parallel curve shift (decimal) applied to the baseline curve for this
  // tick — the deterministic per-curve evolution the fan-out published.
  double curve_shift = 4;
  // Update time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 5;
}

// The server signals a subscription was dropped (e.g. slow consumer lagged the
// per-subscriber buffer, or the engine is draining for a blue-green cutover).
// The client should `Resync` (lag) or re-`Subscribe` after cutover (drain).
message StreamEnd {
  // The subscription that ended.
  SubscriptionId subscription = 1;
  // Why the stream ended.
  enum Reason {
    // The consumer fell behind and was dropped; reconnect via Resync.
    REASON_LAGGED = 0;
    // The engine is draining for a blue-green cutover; re-subscribe after.
    REASON_DRAINING = 1;
    // The client requested teardown (acknowledges an Unsubscribe).
    REASON_UNSUBSCRIBED = 2;
    // The instrument is no longer quotable (e.g. expired).
    REASON_EXPIRED = 3;
  }
  // The reason the stream ended.
  Reason reason = 2;
}

// Click-to-trade off the stream: book *exactly* a streamed price line by
// presenting the `TradableToken` the server stamped on the `Snapshot`/`Update`
// the trader clicked. The token already binds the side and premium, so an
// `Execute` needs no re-pricing round-trip; the server validates the token is
// live (within its `valid_until_nanos`) and books, replying with an `Executed`
// on success or a `StreamReject` if the token is expired/unknown (last-look).
message Execute {
  // The subscription the clicked line belongs to.
  SubscriptionId subscription = 1;
  // The opaque token from the clicked line's `TradableToken` (carries side and
  // premium), authenticating the execution at the stamped price.
  uint64 token = 2;
  // A client idempotency token (e.g. a UUID): an `Execute` retry carrying the
  // same key returns the same `Executed` rather than double-booking.
  string idempotency_key = 3;
  // Optional caller correlation id, echoed on the `Executed`/`StreamReject`
  // (presence-tracked) so a blotter joins the booking to its click.
  optional uint64 correlation_id = 4;
}

// The booking confirmation for a successful click-to-trade `Execute`.
message Executed {
  // The subscription the executed line belonged to.
  SubscriptionId subscription = 1;
  // The token that was presented and booked.
  uint64 token = 2;
  // Server-assigned execution / booking identifier.
  uint64 execution_id = 3;
  // The side actually traded (BUY lifted the offer, SELL hit the bid).
  Side side = 4;
  // The premium booked (the token's stamped premium), in the stream's
  // `Conventions.premium_style` units.
  double traded_premium = 5;
  // Echo of the originating `Execute.correlation_id`, if supplied.
  optional uint64 correlation_id = 6;
  // Booking time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 7;
  // The attribution chain for the click-to-trade fill (presence-tracked):
  // resolved from the subscription's `attribution`, so a streamed fill feeds
  // the who's-trading roll-up identically to an RFQ booking. Absent ⇒
  // unattributed.
  optional AttributionRecord attribution = 8;
}

// The server declines a click-to-trade `Execute` (the token expired, was
// unknown, or had already been consumed). A reject never books a trade.
message StreamReject {
  // The subscription the rejected `Execute` referenced.
  SubscriptionId subscription = 1;
  // The token that was presented and declined.
  uint64 token = 2;
  // Why the execution was declined.
  enum Reason {
    // The token's `valid_until_nanos` had passed when the Execute arrived.
    REASON_EXPIRED = 0;
    // The token did not match any live stamped line for this subscription.
    REASON_UNKNOWN_TOKEN = 1;
    // The token was already consumed by a prior accepted Execute.
    REASON_ALREADY_CONSUMED = 2;
  }
  // The reason the execution was declined.
  Reason reason = 3;
  // Echo of the originating `Execute.correlation_id`, if supplied.
  optional uint64 correlation_id = 4;
  // Reject time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 5;
}

// The client→server message on the multiplexed bidirectional `StreamSession`.
// Exactly one is set. One session carries control + click-to-trade for many
// subscriptions, each addressed by its `SubscriptionId`.
message ClientStreamMessage {
  // The carried client control message.
  oneof message {
    // Open a subscription.
    Subscribe subscribe = 1;
    // Modify a live subscription in place (re-baselines with a fresh Snapshot).
    Modify modify = 2;
    // Close a subscription.
    Unsubscribe unsubscribe = 3;
    // Request a server-assisted resync after a detected gap.
    Resync resync = 4;
    // Click-to-trade: book a streamed line by its stamped token.
    Execute execute = 5;
    // Client liveness heartbeat.
    Heartbeat heartbeat = 6;
    // Open a market-series (time-series of market observables) subscription.
    MarketSeriesSubscribe market_series_subscribe = 7;
    // Close a market-series subscription.
    MarketSeriesUnsubscribe market_series_unsubscribe = 8;
    // Authenticate the session — SHOULD be the first frame on a new session.
    // Pins the caller for all subsequent control + click-to-trade.
    StreamAuth authenticate = 9;
    // Open a fixed-income (linear-rates) streaming line on the SAME session.
    RatesSubscribe rates_subscribe = 10;
    // Open an aggregated-book composite line on the SAME session.
    AggregatedBookSubscribe aggregated_book_subscribe = 11;
    // Close an aggregated-book composite line.
    AggregatedBookUnsubscribe aggregated_book_unsubscribe = 12;
  }
}

// Authenticate a multiplexed stream session. SHOULD be the first frame: the
// server resolves the caller from `session_token` (validated against the live
// SessionRegistry minted by AuthService.Login) and pins the principal for the
// whole session. Under the Enforce posture an unauthenticated session
// (absent/invalid token) is refused control + click-to-trade; under Permissive
// an absent token is the anonymous grant-all caller (legacy back-compat). A
// field selecting WHO, never an API version (ADR-0007).
message StreamAuth {
  // The session token from AuthService.Login. Absent ⇒ anonymous.
  optional string session_token = 1;
  // The entitlement principal to pin for this session (absent ⇒ grant-all under
  // Permissive). Composes with the authenticated session's desk scope.
  optional EntitlementPrincipal principal = 2;
}

// The server→client message on the multiplexed bidirectional `StreamSession`.
// Exactly one is set.
message ServerStreamMessage {
  // The carried server stream message.
  oneof message {
    // The baseline state for a subscription.
    Snapshot snapshot = 1;
    // A sequenced delta advancing a subscription.
    Update update = 2;
    // Server liveness heartbeat.
    Heartbeat heartbeat = 3;
    // A subscription ended (lag/drain/teardown/expiry).
    StreamEnd stream_end = 4;
    // A click-to-trade `Execute` booked successfully.
    Executed executed = 5;
    // A click-to-trade `Execute` was declined (expired/unknown/consumed token).
    StreamReject stream_reject = 6;
    // A market-series snapshot (the recent history) for an opened series.
    MarketSeriesSnapshot market_series_snapshot = 7;
    // A new market-series point appended to an opened series.
    MarketSeriesPoint market_series_point = 8;
    // The baseline state of a streamed fixed-income line.
    RatesStreamSnapshot rates_stream_snapshot = 9;
    // A sequenced delta advancing a streamed fixed-income line.
    RatesStreamUpdate rates_stream_update = 10;
    // The baseline composite state of a subscribed aggregated book.
    AggregatedBookStreamSnapshot aggregated_book_stream_snapshot = 11;
    // A sequenced delta advancing a subscribed aggregated book's composite.
    AggregatedBookStreamUpdate aggregated_book_stream_update = 12;
  }
}

// ===========================================================================
// market-series — streamed time-series of market observables (the TrendMode
// feed). Multiplexed onto the same `StreamSession`: a client opens a series for
// a (pair, observable[, tenor]) and receives a recent-history `Snapshot` then a
// sequence of appended `Point`s. This is the contract the GUI TrendModes
// (ATM_VOL / RR / BF / SPOT / FORWARD) consume; the server implements the feed
// in a later phase.
// ===========================================================================

// Which market observable a series streams. Each is a *labelled, unit-bearing*
// quantity (no abstract index), matching the GUI's TrendMode contract.
enum MarketObservable {
  // At-the-money volatility for the (pair, tenor) — absolute vol (0.10 = 10v).
  MARKET_OBSERVABLE_ATM_VOL = 0;
  // Spot FX rate (quote per 1 base). Requires a tenor-independent series.
  MARKET_OBSERVABLE_SPOT = 1;
  // Risk reversal (call vol minus put vol) at the series' delta wing — vol.
  MARKET_OBSERVABLE_RISK_REVERSAL = 2;
  // Butterfly (broker fly) at the series' delta wing — vol.
  MARKET_OBSERVABLE_BUTTERFLY = 3;
  // Outright forward FX rate for the (pair, tenor) — quote per 1 base.
  MARKET_OBSERVABLE_FORWARD = 4;
}

// Open a market-series subscription within the multiplexed session, keyed by a
// client-assigned `SubscriptionId` (in the same id space as price streams).
message MarketSeriesSubscribe {
  // The client-assigned subscription id this series is keyed on.
  SubscriptionId subscription = 1;
  // The underlying the observable is measured for.
  Underlying underlying = 2;
  // Which observable to stream.
  MarketObservable observable = 3;
  // The pillar tenor for tenor-dependent observables (ATM_VOL/RR/BF/FORWARD).
  // Presence-tracked: required for those; ignored (and should be absent) for
  // the tenor-independent SPOT observable.
  optional Tenor tenor = 4;
  // The signed delta wing for the wing observables (RR/BF), e.g. 0.25 or 0.10.
  // Presence-tracked: required for RR/BF; absent for ATM_VOL/SPOT/FORWARD.
  optional double delta = 5;
  // A client throttle hint: minimum nanoseconds between appended points the
  // client wants (the server conflates to honour it). 0 = no throttling.
  uint64 throttle_nanos = 6;
  // The maximum number of historical points to return in the opening
  // `MarketSeriesSnapshot` (0 ⇒ server default window). Bounds the snapshot.
  uint32 history_limit = 7;
}

// Close a market-series subscription (the rest of the session is unaffected).
message MarketSeriesUnsubscribe {
  // The series subscription to tear down.
  SubscriptionId subscription = 1;
}

// One observed point in a market series: a timestamped value of the observable.
message MarketSeriesPoint {
  // The series subscription this point belongs to.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number (snapshot seq + n).
  uint64 sequence = 2;
  // The observed value, in the observable's natural unit (vol for ATM_VOL/RR/BF;
  // a rate for SPOT/FORWARD).
  double value = 3;
  // Observation time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 4;
}

// The opening baseline for a market series: the recent history (oldest →
// newest) plus the observable's identity, so the GUI can label the trend tile
// (unit + observable) and seed the sparkline before live points arrive.
message MarketSeriesSnapshot {
  // The series subscription this snapshot baselines.
  SubscriptionId subscription = 1;
  // The starting sequence number; subsequent `MarketSeriesPoint`s advance it.
  uint64 sequence = 2;
  // The underlying the observable is measured for (echoed for labelling).
  Underlying underlying = 3;
  // Which observable this series streams (echoed for labelling).
  MarketObservable observable = 4;
  // The recent history (oldest → newest), at most `history_limit` points.
  repeated MarketSeriesPoint points = 5;
  // Snapshot time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
}

// ===========================================================================
// risk — firm-scale hierarchical risk: positions, server-side aggregation over
// the org hierarchy, limits/RAG, and node drill-down. This is the wire face of
// the single-node risk estate (celnet-risk-cube aggregation, celnet-risk-normalize
// common-numeraire conversion, celnet-limits utilization/RAG, celnet-entitlements
// pre-aggregation pruning). Aggregation is OWNED BY THE SERVER — a client never
// loops positions and sums; it asks `AggregateRisk` for the rolled-up node tree.
// ===========================================================================

// An organizational roll-up dimension — mirrors `celnet_risk_cube::DimensionId`
// plus the implicit firm apex. These are ORTHOGONAL axes (a position is at once
// a desk fact, a ccy-pair fact, an entity fact), not one nesting: a group-by
// selects one axis to roll the facts up onto.
enum RiskDimension {
  // The whole firm (the implicit apex every dimension rolls into) — the cube's
  // `firm_aggregate`, not a `group_by` axis. The proto3 zero default.
  RISK_DIMENSION_FIRM = 0;
  // The trader who owns the position.
  RISK_DIMENSION_TRADER = 1;
  // The book the position sits in.
  RISK_DIMENSION_BOOK = 2;
  // The desk the book belongs to (an FRTB regulatory unit).
  RISK_DIMENSION_DESK = 3;
  // The underlying (the asset axis — orthogonal to the org axes). For FX this
  // is the currency pair.
  RISK_DIMENSION_UNDERLYING = 4;
  // The booking location (follow-the-sun / country).
  RISK_DIMENSION_LOCATION = 5;
  // The legal entity (the regulatory-capital unit).
  RISK_DIMENSION_ENTITY = 6;
}

// A position's placement across the independent org dimensions — the foreign-key
// tuple into the cube hierarchies (mirrors `celnet_risk_cube::FactKey`). The
// identifiers are the cube's interned `u32` dimension handles; the server maps a
// trade's wire-level `AttributionRecord` (book/owner strings) onto these handles.
// `desk`/`entity` may be sent as 0 when the server resolves them from the cube's
// `Book -> Desk` / `Location -> Entity` parent pointers.
message OrgKey {
  // Interned handle for the trader who owns the position.
  uint32 trader = 1;
  // Interned handle for the book the position sits in.
  uint32 book = 2;
  // Interned handle for the desk (0 ⇒ resolve from the book's parent pointer).
  uint32 desk = 3;
  // The underlying of the position (the underlying axis — orthogonal to the org
  // axes).
  Underlying underlying = 4;
  // Interned handle for the booking location.
  uint32 location = 5;
  // Interned handle for the legal entity (0 ⇒ resolve from the location's
  // parent pointer).
  uint32 entity = 6;
}

// One open position the cube aggregates: its identity, org placement, attribution
// (who holds/quoted it), pricing inputs, and quoted conventions. Mirrors a
// `celnet_risk_cube::RiskFact` (`position_id` + `OrgKey` + the originating
// `celnet_risk_normalize::PositionRisk` + `surface_version`). The canonical
// convention-free leaf the cube sums is re-derived server-side from these inputs
// (`celnet_risk_normalize::canonicalize`), so the wire carries the raw position,
// never a convention-baked Greek.
message RiskPosition {
  // The position identity (one current fact per id in the cube).
  uint64 position_id = 1;
  // The org placement across the independent dimensions.
  OrgKey org = 2;
  // Option type (call/put on the base currency).
  OptionType option_type = 3;
  // Signed base-currency notional (positive = long the option).
  double notional_base = 4;
  // The pricing inputs the position was marked under (the canonical risk is
  // re-derived from these — exact and convention-free).
  VanillaInputs inputs = 5;
  // The delta convention the position was quoted under (provenance; does not
  // change the canonical spot-unadjusted delta).
  DeltaConvention quoted_delta = 6;
  // The premium style the position was quoted under (provenance; decides whether
  // the quoted delta was premium-adjusted).
  PremiumStyle premium_style = 7;
  // The marked-surface version that produced this fact (live / IPV / historical).
  uint64 surface_version = 8;
  // Who quoted/holds this position (presence-tracked): the attribution chain that
  // keys the who's-trading roll-up. Absent ⇒ unattributed.
  optional AttributionRecord attribution = 9;
}

// A scope filter pinning the position listing / drill to one dimension subtree
// (e.g. desk 99) — the same `(dimension, value)` key space the cube groups by and
// an entitlement scope covers. Absent on a request ⇒ the whole entitled book.
message RiskScope {
  // The dimension this scope pins.
  RiskDimension dimension = 1;
  // The group value on that dimension (`celnet_risk_cube::FactKey::group_value`;
  // for Desk/Entity it is the hierarchy-resolved ancestor's handle). Ignored when
  // `dimension` is FIRM (the firm scope covers everything).
  uint64 value = 2;
}

// One read grant or deny rule for an entitlement principal — a conjunction of
// pinned dimension scopes (mirrors `celnet_entitlements::Rule`). A fact is covered
// iff EVERY scope in the rule covers it; an empty `scopes` covers everything (the
// firm root). A grant admits; a deny is an information barrier (deny wins).
message EntitlementRule {
  // The conjunctive scopes; empty ⇒ covers everything (firm root).
  repeated RiskScope scopes = 1;
}

// Who is looking — the entitlement principal applied as a pre-aggregation pruning
// predicate (mirrors `celnet_entitlements::Principal`). The decision per fact is
// `(grant_all OR some grant covers) AND no deny covers`, evaluated BEFORE roll-up
// so a node total can never leak a subtree the principal cannot see.
//
// The DEFAULT principal is grant-all: `grant_all=true` (the proto3 zero default
// for the bool) with empty rules admits everything, mirroring the GUI's
// `ScopeContext { principal: "grant-all" }` show-all-now posture. A scoped
// principal sets `grant_all=false` and lists `grants` (deny-by-default: no grant
// ⇒ sees nothing). `denies` apply to any principal, grant-all included.
message EntitlementPrincipal {
  // True ⇒ admit every fact regardless of grants (the grant-all default). When
  // false, a fact must match at least one grant. The proto3 zero default (false)
  // is overridden by the client default-principal convention: a request omitting
  // an `EntitlementPrincipal` entirely is treated as grant-all by the server.
  bool grant_all = 1;
  // Read grants — a (scoped) principal sees a fact if ANY grant covers it.
  repeated EntitlementRule grants = 2;
  // Information-barrier denies — a fact covered by ANY deny is cut, even if
  // granted (deny wins). Layered onto a grant-all firm view for Chinese walls.
  repeated EntitlementRule denies = 3;
}

// A spot conversion rate used to express risk in a single reporting numeraire:
// how many units of the numeraire one unit of `ccy` is worth at spot (mirrors a
// `celnet_risk_normalize::SpotResolver` entry). The numeraire's own rate is
// implicitly 1.0 and need not be listed.
message NumeraireRate {
  // The currency this rate converts from (a 3-letter code, e.g. "EUR").
  string ccy = 1;
  // Units of the reporting numeraire per 1 unit of `ccy` at spot (finite, > 0).
  double rate = 2;
}

// The reporting-currency conversion table for an aggregate (mirrors a
// `celnet_risk_normalize::SpotResolver`): the numeraire plus the per-currency
// rates needed to collapse every node's per-ccy exposure legs into one scalar. A
// missing rate fails the request loudly (no silent leg drop).
message ReportingNumeraire {
  // The reporting currency every node measure is expressed in (a 3-letter code).
  string numeraire = 1;
  // Units-of-numeraire-per-unit-ccy at spot, one per currency that appears in the
  // aggregated book (the numeraire itself is implicitly 1.0).
  repeated NumeraireRate rates = 2;
}

// A (tenor x delta) vega pillar coordinate — the bucket key for the vega ladder
// (mirrors `celnet_risk_cube::VegaPillar`). Tenor and delta are quantized to
// integer pillars so buckets net exactly across leaves.
message VegaPillar {
  // The tenor pillar, labelled in calendar days.
  uint32 tenor_days = 1;
  // The signed delta pillar in basis-points of delta (0.25 delta -> 2500).
  int32 delta_bp = 2;
}

// One (tenor x delta) bucket of the additive vega ladder: the netted vega in that
// pillar, in the reporting numeraire (mirrors a `celnet_risk_cube::VegaLadder`
// bucket after numeraire conversion through each leaf's premium currency).
message VegaLadderBucket {
  // The pillar this bucket sums.
  VegaPillar pillar = 1;
  // The netted vega in this pillar (reporting numeraire, per 1.0 absolute vol).
  double vega = 2;
}

// One signed currency leg of a node's netted delta exposure vector (mirrors
// `celnet_risk_normalize::CcyExposure`): the per-currency-node netting result,
// pre-collapse. The base leg (+delta) and the funding leg (-delta*spot) of every
// constituent leaf net here before the vector is collapsed to the numeraire.
message CcyExposureLeg {
  // The currency this leg is denominated in (a 3-letter code).
  string ccy = 1;
  // Signed amount in units of `ccy` (positive = long that currency).
  double amount = 2;
}

// The additive measures of a node, netted and expressed in the reporting
// numeraire (mirrors `celnet_risk_cube::NetGreeks` summed over the node's
// canonical leaves, with the delta/premium/vega numeraire collapse from
// `celnet_risk_normalize::Numeraire`). Additive ⇒ a parent node's measures equal
// the sum of its children's.
message AdditiveRisk {
  // Net base-currency delta amount collapsed to the reporting numeraire (the
  // numeraire-converted total of the per-ccy delta vector).
  double delta_numeraire = 1;
  // The netted per-currency delta exposure vector (legs in their own currencies),
  // so a consumer can hedge leg-by-leg and reconcile to `delta_numeraire`.
  repeated CcyExposureLeg delta_vector = 2;
  // Net gamma (summed canonical gamma; raw, not numeraire-scaled — gamma is a
  // pure second-order sensitivity per the cube's `NetGreeks`).
  double gamma = 3;
  // Net vega in the reporting numeraire, converted through each leaf's PREMIUM
  // currency (the celnet-risk-normalize coupling), per 1.0 absolute vol.
  double vega_numeraire = 4;
  // Net theta (per year, summed canonical).
  double theta = 5;
  // Net vanna (summed canonical, the FX spot x vol cross-Greek).
  double vanna = 6;
  // Net volga (summed canonical, the FX vol-convexity Greek).
  double volga = 7;
  // Net charm (delta decay per year, summed canonical).
  double charm = 8;
  // Net speed (third spot derivative, summed canonical).
  double speed = 9;
  // Net zomma (d gamma / d sigma, summed canonical).
  double zomma = 10;
  // Net color (d gamma / d T, summed canonical).
  double color = 11;
  // Total premium (option PV) in the reporting numeraire.
  double premium_numeraire = 12;
  // Vega bucketed by (tenor x delta) pillar, in the reporting numeraire — the
  // desk's working vega representation, hedged pillar by pillar.
  repeated VegaLadderBucket vega_ladder = 13;
}

// The non-additive measures of a node, RE-DERIVED per node by bump-and-revalue
// over the node's constituent positions (mirrors `celnet_risk_cube::node_var_es`
// and `node_curvature_spot`). These are NOT summed from children — VaR/ES
// diversify and curvature charges short-gamma only. Presence-tracked: a measure
// not evaluated this cycle is absent (never a spurious zero).
message NonAdditiveRisk {
  // Value-at-Risk loss magnitude at `var_alpha` (reporting numeraire), or absent
  // if not evaluated this cycle.
  optional double var = 1;
  // Expected-Shortfall tail-loss magnitude at `var_alpha`, or absent.
  optional double es = 2;
  // The confidence level VaR/ES were evaluated at (e.g. 0.99). Present iff `var`
  // or `es` is present.
  optional double var_alpha = 3;
  // FRTB-SbM spot curvature charge (max(CVR+, CVR-, 0)), or absent. Floors at 0
  // for a long-gamma node; positive only for short gamma.
  optional double curvature_spot = 4;
}

// One node of the rolled-up risk tree: a group along the request's `dimension`,
// its netted additive measures, its re-derived non-additive measures, and the
// count of constituent positions (so a consumer knows the node's depth without
// fetching the leaves — those come from `DrillNode`).
message RiskNode {
  // The dimension this node groups along (echoed for self-describing nodes).
  RiskDimension dimension = 1;
  // The group value along that dimension (`celnet_risk_cube::NodeAggregate::group`;
  // for FIRM it is 0, the apex).
  uint64 group = 2;
  // The additive measures, netted and in the reporting numeraire.
  AdditiveRisk additive = 3;
  // The re-derived non-additive measures (VaR/ES/curvature), presence-tracked.
  NonAdditiveRisk nonadditive = 4;
  // The number of constituent positions that rolled into this node.
  uint32 position_count = 5;
}

// =========================== positions ==============================

// List the open positions the cube aggregates (the desk's book), optionally
// scoped to one dimension subtree and pruned by an entitlement principal. The
// response carries each position with its attribution so the hierarchy keys on
// real attribution.
message ListPositionsRequest {
  // Optional scope pinning the listing to one dimension subtree (absent ⇒ the
  // whole entitled book).
  optional RiskScope scope = 1;
  // The entitlement principal whose admitted facts are listed (absent ⇒ the
  // grant-all default — the show-all-now posture).
  optional EntitlementPrincipal principal = 2;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 3;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the legacy client-asserted-principal
  // path (mode-gated). A secret — never logged.
  optional string session_token = 4;
}

// The positions admitted for the principal under the scope.
message ListPositionsResponse {
  // The open positions (each with its org placement + attribution).
  repeated RiskPosition positions = 1;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 2;
}

// =========================== aggregate ==============================

// Request a hierarchical risk aggregate, computed SERVER-SIDE over the org
// hierarchy. The server prunes the fact stream by `principal` BEFORE rolling up
// (no aggregate leakage), groups by `dimension`, sums the additive measures and
// re-derives the non-additive ones per node, and converts everything into
// `numeraire`. The response is the rolled-up node tree — the client never sums
// positions itself.
message AggregateRiskRequest {
  // The dimension to roll up onto (FIRM ⇒ a single firm-apex node).
  RiskDimension dimension = 1;
  // The reporting numeraire + conversion rates every node measure is expressed in.
  ReportingNumeraire numeraire = 2;
  // The entitlement principal pruning the facts before aggregation (absent ⇒
  // grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional scope narrowing the aggregate to one dimension subtree before the
  // group-by (absent ⇒ the whole entitled book). Composes with the principal.
  optional RiskScope scope = 4;
  // The (tenor x delta) pillars to report bucketed vega for. Empty ⇒ the server
  // derives the live pillar set from the positions' tenors at a default delta
  // pillar; supplying pillars pins the regulatory/internal grid (external data,
  // never compiled in — the celnet-risk-cube `VegaPillarMap` contract).
  repeated VegaPillar vega_pillars = 5;
  // The spot shock steps (relative, multiplicative — e.g. -0.01, 0.0, 0.01) the
  // server bumps-and-revalues over to re-derive VaR/ES per node. Empty ⇒ the
  // non-additive measures are not evaluated (the response's `NonAdditiveRisk` is
  // absent — never a spurious zero).
  repeated double var_spot_shocks = 6;
  // The VaR/ES confidence level (e.g. 0.99). Ignored when `var_spot_shocks` is
  // empty; defaults to 0.99 when shocks are supplied and this is 0.
  double var_alpha = 7;
  // The FRTB-SbM spot curvature risk weight to charge curvature at (external
  // data). 0 ⇒ curvature is not evaluated (absent in the response).
  double curvature_risk_weight = 8;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 9;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the legacy client-asserted-principal
  // path (mode-gated). A secret — never logged.
  optional string session_token = 10;
}

// The rolled-up risk node tree for the requested dimension.
message AggregateRiskResponse {
  // The dimension the aggregate rolled up onto (echoed).
  RiskDimension dimension = 1;
  // The reporting numeraire every node measure is expressed in (echoed code).
  string numeraire = 2;
  // The rolled-up nodes (one per group along `dimension`; a single firm-apex node
  // when `dimension` is FIRM).
  repeated RiskNode nodes = 3;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 4;
}

// =========================== drill ==============================

// Drill into one node: fetch its child sub-nodes at a finer dimension and/or its
// contributing positions, so the Book -> Risk drill can expand a node to its
// constituents. The same entitlement principal prunes the drill (a principal can
// only drill into what it can see).
message DrillRiskRequest {
  // The node to drill into: the dimension + group it was reported at.
  RiskScope node = 1;
  // The finer dimension to break the node's children out by (e.g. drilling a Desk
  // node into its Books). Ignored when `include_children` is false.
  RiskDimension child_dimension = 2;
  // The reporting numeraire + rates the child nodes are expressed in.
  ReportingNumeraire numeraire = 3;
  // The entitlement principal pruning the drill (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 4;
  // The (tenor x delta) pillars for the child nodes' bucketed vega (as in
  // `AggregateRiskRequest`). Empty ⇒ server-derived default grid.
  repeated VegaPillar vega_pillars = 5;
  // Whether to return the child sub-nodes broken out by `child_dimension`.
  bool include_children = 6;
  // Whether to return the node's contributing positions (the drill-down leaves).
  bool include_positions = 7;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 8;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the legacy client-asserted-principal
  // path (mode-gated). A secret — never logged.
  optional string session_token = 9;
}

// The drill result for a node: its child sub-nodes and/or its contributing
// positions.
message DrillRiskResponse {
  // The node that was drilled (echoed scope).
  RiskScope node = 1;
  // The child sub-nodes broken out by the request's `child_dimension` (empty when
  // `include_children` was false).
  repeated RiskNode children = 2;
  // The node's contributing positions (empty when `include_positions` was false)
  // — the leaves a node total reconciles to.
  repeated RiskPosition positions = 3;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 4;
}

// =========================== limits ==============================

// Which exposure a limit constrains — mirrors `celnet_limits::LimitMetric`. The
// pillar/tenor payloads ride on the dedicated fields below, selected by `kind`.
enum LimitMetricKind {
  // Net base-currency delta amount (additive). The proto3 zero default.
  LIMIT_METRIC_KIND_DELTA = 0;
  // Net gamma (additive).
  LIMIT_METRIC_KIND_GAMMA = 1;
  // Net vega per 1.0 absolute vol (additive).
  LIMIT_METRIC_KIND_VEGA = 2;
  // Net vanna (additive).
  LIMIT_METRIC_KIND_VANNA = 3;
  // Net volga (additive).
  LIMIT_METRIC_KIND_VOLGA = 4;
  // Vega in one (tenor x delta) pillar (additive) — `vega_pillar` selects it.
  LIMIT_METRIC_KIND_VEGA_BUCKET = 5;
  // Aggregate vega in one tenor across delta pillars — `tenor_days` selects it.
  LIMIT_METRIC_KIND_TENOR_VEGA = 6;
  // Gross (un-netted) base-currency delta concentration.
  LIMIT_METRIC_KIND_CONCENTRATION_DELTA = 7;
  // Gross (un-netted) vega concentration.
  LIMIT_METRIC_KIND_CONCENTRATION_VEGA = 8;
  // Value-at-Risk loss magnitude (non-additive, re-derived per node).
  LIMIT_METRIC_KIND_VAR = 9;
  // Expected-Shortfall tail-loss magnitude (non-additive).
  LIMIT_METRIC_KIND_EXPECTED_SHORTFALL = 10;
  // Stop-loss realized/scenario loss magnitude.
  LIMIT_METRIC_KIND_STOP_LOSS = 11;
}

// Traffic-light status of a limit's utilization — mirrors
// `celnet_limits::RagStatus`. Ordered by severity (BREACH worst).
enum RagStatus {
  // Below the amber band — comfortable headroom. The proto3 zero default.
  RAG_STATUS_GREEN = 0;
  // At/above the amber band, below red — early warning.
  RAG_STATUS_AMBER = 1;
  // At/above the red band, at/below the cap — pre-breach.
  RAG_STATUS_RED = 2;
  // Over the cap — a breach.
  RAG_STATUS_BREACH = 3;
}

// Whether a limit warns or blocks — mirrors `celnet_limits::Enforcement`.
enum Enforcement {
  // A breach warns but never blocks a trade. The proto3 zero default.
  ENFORCEMENT_SOFT = 0;
  // A breach blocks a pre-trade and escalates post-trade.
  ENFORCEMENT_HARD = 1;
}

// One limit's evaluated utilization at a scope node — mirrors a
// `celnet_limits::LimitCheck` (the limit + its `Utilization` + RAG). This is a
// first-class node measure, computed server-side, not derived at the GUI.
message LimitUtilization {
  // What this limit constrains.
  LimitMetricKind metric = 1;
  // The (tenor x delta) pillar for a VEGA_BUCKET metric (ignored otherwise).
  VegaPillar vega_pillar = 2;
  // The tenor (calendar days) for a TENOR_VEGA metric (ignored otherwise).
  uint32 tenor_days = 3;
  // The cap, as a non-negative magnitude in the metric's native units.
  double cap = 4;
  // The signed exposure measured against the cap (reporting numeraire for the
  // numeraire-converted additive metrics; native loss units for VaR/ES).
  double exposure = 5;
  // |exposure| / cap, in [0, inf).
  double ratio = 6;
  // The RAG classification of `ratio` against the limit's bands.
  RagStatus status = 7;
  // Soft (warn-only) or hard (blocking).
  Enforcement enforcement = 8;
  // Remaining headroom (signed: positive = room left, negative = over the cap).
  double headroom = 9;
}

// Request the limit-tree utilization for one scope node — the limits configured at
// that scope, each with its current utilization/RAG against the node's aggregated
// exposure (mirrors `celnet_limits::post_trade_check` for the scope). The same
// numeraire + non-additive shock inputs as `AggregateRisk` drive the exposures.
message LimitStatusRequest {
  // The scope node to report limits for (e.g. Desk 99, or FIRM).
  RiskScope scope = 1;
  // The reporting numeraire + rates the additive exposures are expressed in.
  ReportingNumeraire numeraire = 2;
  // The entitlement principal pruning the facts before the scope is aggregated
  // (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // The (tenor x delta) pillars for bucketed/tenor-vega limits' exposures (as in
  // `AggregateRiskRequest`). Empty ⇒ server-derived default grid.
  repeated VegaPillar vega_pillars = 4;
  // The spot shock steps the server bumps over to re-derive the non-additive
  // (VaR/ES/stop-loss) limit exposures. Empty ⇒ those limits read 0 (can't
  // spuriously breach), matching `celnet_limits::NonAdditiveExposure::default`.
  repeated double var_spot_shocks = 5;
  // The VaR/ES confidence level (e.g. 0.99); defaults to 0.99 when shocks are
  // supplied and this is 0.
  double var_alpha = 6;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 7;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the legacy client-asserted-principal
  // path (mode-gated). A secret — never logged.
  optional string session_token = 8;
}

// The limit utilizations + worst RAG for a scope node.
message LimitStatusResponse {
  // The scope the limits were evaluated at (echoed).
  RiskScope scope = 1;
  // Every limit configured at the scope, with its current utilization/RAG.
  repeated LimitUtilization limits = 2;
  // The worst RAG status across the scope's limits (GREEN if no limit breaches).
  RagStatus worst = 3;
  // True if any HARD limit at the scope is breached (the post-trade escalation
  // trigger). Soft breaches surface in `limits` but do not set this flag.
  bool hard_breach = 4;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 5;
}

// ===========================================================================
// surface — smile read / broker mark / arbitrage report / scenario risk
// ===========================================================================

// One quoted vol point on the surface, keyed by delta and expiry tenor.
//
// `delta` is the signed convention delta (e.g. 0.25 for a 25-delta call,
// -0.25 for a 25-delta put); `tenor_years` is the year fraction to expiry.
// `vol` is absolute (0.10 = 10 vol).
message SmilePoint {
  // Signed convention delta of the point.
  double delta = 1;
  // Expiry as a year fraction.
  double tenor_years = 2;
  // Absolute volatility at this (delta, tenor).
  double vol = 3;
}

// The broker market-quote set for a single tenor: ATM plus the 25-delta and
// 10-delta risk reversals and butterflies (broker fly), the standard inputs a
// desk marks a smile from.
message BrokerQuoteSet {
  // The tenor (year fraction) this quote set marks.
  double tenor_years = 1;
  // At-the-money volatility (absolute).
  double atm_vol = 2;
  // 25-delta risk reversal (call vol − put vol).
  double rr_25 = 3;
  // 25-delta butterfly (broker fly: wing avg − ATM).
  double bf_25 = 4;
  // 10-delta risk reversal.
  double rr_10 = 5;
  // 10-delta butterfly.
  double bf_10 = 6;
  // Whether the 10Δ wings (`rr_10`/`bf_10`) are present and should be used to
  // calibrate a five-point smile. When false, the set is a three-point mark and
  // the 10Δ fields are ignored — this explicit presence flag (not a float test
  // on `rr_10`/`bf_10`) decides five-point vs three-point, so a genuine but
  // present zero 10Δ wing is honoured.
  bool has_ten_delta = 7;
}

// A request to read the smile for a single (pair, tenor) on the delta axis.
message GetSmileRequest {
  // The pair to read.
  CcyPair pair = 1;
  // The tenor (year fraction) to read.
  double tenor_years = 2;
  // The conventions to express the smile under.
  Conventions conventions = 3;
}

// The arbitrage status of a calibrated smile/surface — the transparency a desk
// wants when marking ("why is this point what it is").
message ArbReport {
  // True if the smile is free of butterfly (vertical) arbitrage.
  bool butterfly_arbitrage_free = 1;
  // True if the surface is free of calendar (horizontal) arbitrage.
  bool calendar_arbitrage_free = 2;
  // The worst negative density observed (0.0 = none); larger magnitude = worse.
  double worst_density = 3;
  // A human-readable note describing any repair applied during calibration. The
  // note still embeds a `model=<label>` token for human eyes, but `smile_model`
  // (field 5) is the AUTHORITATIVE machine-readable provenance — consumers read
  // the calibration family from the typed field, never by parsing this string.
  string note = 4;
  // The calibration family this smile was actually marked under — the typed,
  // authoritative provenance the server stamps on every marked smile. A consumer
  // (GUI / Excel / SDK) reads the family from this enum directly instead of the
  // fragile `model=` regex over `note`. Always present on a server-marked smile
  // (defaults to `SMILE_MODEL_MARKET_HEDGE`, value 0, the baseline family).
  SmileModel smile_model = 5;
}

// The smile for one (pair, tenor): the marked broker quote set, the calibrated
// delta-axis points, and the arbitrage report.
message Smile {
  // The pair the smile belongs to.
  CcyPair pair = 1;
  // The tenor (year fraction).
  double tenor_years = 2;
  // The broker quote set the smile was marked from.
  BrokerQuoteSet broker_quotes = 3;
  // The calibrated delta-axis vol points.
  repeated SmilePoint points = 4;
  // The conventions the smile is expressed under.
  Conventions conventions = 5;
  // The arbitrage status of the calibrated smile.
  ArbReport arbitrage = 6;
  // Calibration time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 7;
}

// A request to mark/recalibrate the surface for a pair from a broker quote set
// across tenors — the intraday re-mark loop.
message MarkSurfaceRequest {
  // The pair to mark.
  CcyPair pair = 1;
  // The broker quote sets, one per marked tenor.
  repeated BrokerQuoteSet broker_quotes = 2;
  // The conventions the broker quotes are expressed under.
  Conventions conventions = 3;
  // The calibration model to mark the surface under (presence-tracked): absent
  // ⇒ the server's default calibration (`SMILE_MODEL_MARKET_HEDGE`). Lets a
  // trader pick the smile family (market-hedge / stochastic-vol / parametric /
  // parametric-surface) per mark without changing the contract.
  optional SmileModel smile_model = 4;
}

// The result of a surface mark: a server-assigned surface version id and the
// per-tenor calibrated smiles with their arbitrage reports.
message MarkSurfaceResponse {
  // The pair that was marked.
  CcyPair pair = 1;
  // A monotonic server-assigned surface version id for this calibration.
  uint64 surface_version = 2;
  // The calibrated per-tenor smiles.
  repeated Smile smiles = 3;
  // Mark time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 4;
}

// A single shock axis in a scenario grid: a swept perturbation applied to a
// risk factor. Shocks may be relative (multiplicative) or absolute (additive).
message ShockAxis {
  // Which risk factor this axis shocks.
  enum Factor {
    // Shock the spot FX rate.
    FACTOR_SPOT = 0;
    // Shock the volatility.
    FACTOR_VOL = 1;
    // Shock the domestic rate.
    FACTOR_RATE_DOM = 2;
    // Shock the foreign rate.
    FACTOR_RATE_FOR = 3;
    // Roll calendar time forward (theta roll): each step is a number of years
    // subtracted from time-to-expiry, holding the market still, so a desk sees
    // the book's value/Greeks decay overnight and over the weekend. Always an
    // absolute (additive) shock to the year fraction; `relative` is ignored.
    FACTOR_TIME = 4;
  }
  // The risk factor swept by this axis.
  Factor factor = 1;
  // True if each step is relative (multiply: 1+step); false if absolute (add).
  bool relative = 2;
  // The swept shock steps (e.g. -0.2, -0.1, 0.0, 0.1, 0.2).
  repeated double steps = 3;
}

// A request for the book-shaped risk decomposition (bucketed vega, cross-gamma,
// theta roll). Attached to a `ScenarioRequest` so a desk gets the shock grid and
// the hedge-shaped risk in one round-trip. Each repeated field is independently
// optional: empty ⇒ that part of the decomposition is not computed.
message RiskBucketRequest {
  // The (tenor, delta) pillars to report bucketed vega for. Each pillar's
  // `vega` field is ignored on the request; the tenor/delta select the bucket.
  repeated VegaBucket vega_pillars = 1;
  // The factor pairs to report cross-gamma for; each pair must name two
  // distinct factors.
  repeated CrossGamma cross_gamma_pairs = 2;
  // The horizons (years rolled forward) to report the theta roll over.
  repeated double roll_horizons_years = 3;
}

// A scenario / what-if request: reprice an instrument across the Cartesian
// product of one or more shock axes, optionally with the book-shaped risk
// decomposition.
message ScenarioRequest {
  // The instrument to reprice under shocks.
  Instrument instrument = 1;
  // The base market context shocks are applied to.
  MarketContext base_market = 2;
  // The conventions to express the repriced Greeks under.
  Conventions conventions = 3;
  // The shock axes; the grid is their Cartesian product.
  repeated ShockAxis axes = 4;
  // The base year fraction to expiry, the anchor a `FACTOR_TIME` theta-roll axis
  // and the `risk_buckets` theta roll decay from. Mirrors `Instrument.expiry_years`
  // and is authoritative for the time-roll arithmetic.
  double expiry_years = 5;
  // Optional book-shaped risk decomposition to compute at the base market
  // (presence-tracked): absent ⇒ only the shock grid is returned.
  optional RiskBucketRequest risk_buckets = 6;
  // The calibration model the scenario reprices the surface under
  // (presence-tracked): absent ⇒ the server's default calibration
  // (`SMILE_MODEL_MARKET_HEDGE`). Mirrors `MarkSurfaceRequest.smile_model` so a
  // what-if can be run on any smile family.
  optional SmileModel smile_model = 7;
}

// One repriced node of a scenario grid.
message ScenarioPoint {
  // The applied shock per axis, in axis order (parallel to `ScenarioRequest.axes`).
  repeated double applied_shocks = 1;
  // The shocked market context this node was priced against.
  MarketContext shocked_market = 2;
  // The full Greek set at this node.
  Greeks greeks = 3;
  // The year fraction to expiry this node was priced at: the base expiry minus
  // any applied `FACTOR_TIME` (theta-roll) shock. Equal to the base expiry on
  // nodes with no time axis. Lets the consumer plot the theta roll explicitly.
  double expiry_years = 4;
}

// Vega bucketed by (tenor, delta-pillar): the book's sensitivity to a 1.0
// absolute-vol move of the single smile pillar at (`tenor_years`, `delta`),
// holding every other pillar still. This is the desk's working representation
// of vega risk — vega is not one number but a grid across the surface the
// trader hedges pillar by pillar (ATM, 25Δ and 10Δ wings per tenor).
message VegaBucket {
  // The pillar tenor (year fraction) this bucket isolates.
  double tenor_years = 1;
  // The signed convention delta-pillar (e.g. 0.50 ATM, ±0.25, ±0.10).
  double delta = 2;
  // dV/dσ for a bump of this pillar alone (per 1.0 absolute vol).
  double vega = 3;
}

// A cross-gamma term: the mixed second-order sensitivity of value to a
// simultaneous move of two distinct risk factors, d²V/(dx_a dx_b) — the
// off-diagonal book risk a single-factor Greek set misses (e.g. spot×vol is the
// book-level vanna aggregate; rate×spot couples the discounting and forward).
message CrossGamma {
  // The first risk factor of the pair.
  ShockAxis.Factor factor_a = 1;
  // The second risk factor of the pair (distinct from `factor_a`).
  ShockAxis.Factor factor_b = 2;
  // The mixed second derivative d²V/(dx_a dx_b).
  double value = 3;
}

// Book-shaped risk: the trader-facing decomposition a desk actually hedges
// against — vega bucketed across the (tenor, delta-pillar) grid, the
// off-diagonal cross-gamma terms, and the theta roll over a horizon — sitting
// alongside the point Greek set rather than replacing it.
message BucketedRisk {
  // Vega across the (tenor, delta-pillar) grid.
  repeated VegaBucket vega_buckets = 1;
  // The off-diagonal cross-gamma terms requested.
  repeated CrossGamma cross_gammas = 2;
  // The theta roll: value (Greeks.price) at each rolled horizon, parallel to
  // `roll_horizons_years`, holding the market still — the overnight/weekend
  // decay of the book. Empty if no roll was requested.
  repeated double theta_roll = 3;
  // The horizons (years rolled forward) the `theta_roll` values correspond to.
  repeated double roll_horizons_years = 4;
}

// The repriced scenario grid, with the book-shaped risk decomposition.
message ScenarioResponse {
  // The repriced grid nodes (Cartesian product of the request axes).
  repeated ScenarioPoint points = 1;
  // The book-shaped risk decomposition (bucketed vega, cross-gamma, theta roll)
  // for the scenario's instrument at its base market. Present when the request
  // asked for it; otherwise its repeated fields are empty.
  BucketedRisk bucketed_risk = 2;
}

// A request to price a single instrument and return its full risk.
message PriceRequest {
  // Opaque client correlation id, echoed in `PriceResponse.request_id`.
  uint64 request_id = 1;
  // The instrument to price.
  Instrument instrument = 2;
  // The market context to price against.
  MarketContext market = 3;
  // The conventions to express the result under.
  Conventions conventions = 4;
  // Optional caller correlation id (an opaque client trace/blotter key), echoed
  // verbatim on the `PriceResponse` so a client can join an asynchronous reply
  // to its originating request independently of the mandatory `request_id`
  // round-trip echo. Presence-tracked: absent ⇒ no correlation requested.
  optional uint64 correlation_id = 5;
  // Optional marked-surface version to price against, so the price is
  // reproducibly tied to a specific surface mark (the version a
  // `MarkSurfaceResponse` assigned). Presence-tracked: absent ⇒ the engine
  // prices against its current live mark. This is a *data* field selecting a
  // surface, NOT an API version (the contract itself is unversioned, rule 9).
  optional uint64 surface_version = 6;
}

// The priced result for a single instrument.
message PriceResponse {
  // Correlates with `PriceRequest.request_id`.
  uint64 request_id = 1;
  // The full 14-member Greek set (price + sensitivities).
  Greeks greeks = 2;
  // The strike resolved (if the request used a delta/solve directive).
  double resolved_strike = 3;
  // The conventions the result is expressed under.
  Conventions conventions = 4;
  // Echo of the originating `PriceRequest.correlation_id`, if one was supplied
  // (presence-tracked), so a client joins this reply to its request.
  optional uint64 correlation_id = 5;
  // The marked-surface version this price was computed against (presence-tracked):
  // the requested `PriceRequest.surface_version` if one was supplied, else the
  // live mark the engine resolved. A *data* field, not an API version.
  optional uint64 surface_version = 6;
  // For a Monte-Carlo-priced product (e.g. a clamped cliquet), the standard
  // error of the mean of the `greeks.price` estimate (presence-tracked; absent
  // for the closed-form products whose price is exact). Reported honestly so a
  // client never mistakes an MC estimate for closed-form precision.
  optional double price_std_error = 7;
}

// ===========================================================================
// services — the gRPC surface over the contract
// ===========================================================================

// One-shot pricing of a single instrument.
service PricingService {
  // Price an instrument and return its full 13-Greek risk.
  rpc Price(PriceRequest) returns (PriceResponse);
  // Price a linear interest-rate instrument against a calibrated curve set and
  // return its PV plus the PV01 / DV01 / key-rate risk ladder (the linear-rates
  // analogue of `Price`; see `RatesPriceRequest`). Like `Price`, the caller
  // supplies the market (the `CurveSet`) explicitly, so this is a calculation
  // RPC needing no live-market read. USD-SOFR OIS is the first instrument arm.
  rpc PriceRates(RatesPriceRequest) returns (RatesPriceResponse);
  // Compute the CVA / DVA / FVA valuation adjustments of a synthetic netting set
  // of vanilla FX options (see `PriceXvaRequest`). Like `PriceRates`, the caller
  // supplies the whole market (the netting set, exposure-model config, and the
  // counterparty/own hazard-rate survival curves) explicitly, so this is a
  // calculation RPC needing no live-market read.
  rpc PriceXva(PriceXvaRequest) returns (PriceXvaResponse);
}

// The RFQ lifecycle: request a quote, then accept or reject it.
service QuoteService {
  // Request a tradable two-way quote for an instrument (idempotent on key).
  rpc RequestQuote(QuoteRequest) returns (Quote);
  // Request competing two-way quotes from many dealers (RFQ-to-many) for one
  // instrument; returns the pre-ranked dealer ladder with the best bid/offer
  // touch dealers named. Idempotent on the request's `idempotency_key`.
  rpc RequestMultiDealerQuote(QuoteRequest) returns (MultiDealerQuote);
  // Request a tradeable two-way quote on a linear-rates (fixed-income) instrument
  // — the fixed-income analogue of `RequestQuote`, bringing request-for-quote
  // parity to the WS/gRPC surface (FI RFQ previously existed only over FIX). The
  // taker supplies the whole market (`curve_set`) and the `instrument`; the maker
  // returns a `RatesQuote` two-way struck around the side-independent fair level
  // (the par rate for an OIS/IRS/FRA, the clean price for a cash bond) plus the
  // full PV / PV01 / DV01 / key-rate risk. Like `PricingService.PriceRates`, the
  // caller supplies the market explicitly, so this is a calculation RPC needing no
  // live-market read (every replica computes the identical quote). The stateful
  // maker-side FI booking flow is `RfqDeskService`; this is the taker's
  // price-discovery two-way (mirroring the FIX venue auto-quote).
  rpc RequestRatesQuote(RatesQuoteRequest) returns (RatesQuote);
  // Accept a quote and book the resulting execution.
  rpc AcceptQuote(QuoteAccept) returns (Execution);
  // Reject a quote (decline to trade); returns a typed acknowledgement, not an
  // execution (a reject never books a trade).
  rpc RejectQuote(QuoteReject) returns (RejectAck);
}

// The multiplexed request-for-stream session: ONE bidirectional channel
// carrying subscribe/modify/unsubscribe/resync/execute/heartbeat from the client
// and snapshot/update/heartbeat/stream-end/executed/stream-reject back, for many
// concurrent subscriptions each keyed by its `SubscriptionId`. A blotter
// watching hundreds of structures uses a single session, not one stream per
// line, and clicks-to-trade execute off the same session via `Execute`.
service StreamService {
  // Open the multiplexed bidirectional `StreamSession` for this client.
  rpc StreamSession(stream ClientStreamMessage) returns (stream ServerStreamMessage);
}

// Firm-scale hierarchical risk, computed SERVER-SIDE. A client (GUI/SDK/Excel)
// never loops positions and sums — it lists positions, asks for a rolled-up
// aggregate over an org dimension, drills a node to its constituents, and reads
// limit utilization, all behind the one contract. Aggregation, common-numeraire
// conversion, non-additive re-derivation, entitlement pruning, and limit RAG are
// all the server's job (celnet-risk-cube / -normalize / -limits / -entitlements).
service RiskService {
  // List the open positions the cube aggregates (scoped + entitlement-pruned),
  // each carrying its attribution so the hierarchy keys on real attribution.
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
  // Roll the entitled facts up over an org dimension into a node tree of netted
  // additive + re-derived non-additive measures in a reporting numeraire.
  rpc AggregateRisk(AggregateRiskRequest) returns (AggregateRiskResponse);
  // Drill one node into its child sub-nodes and/or contributing positions (the
  // Book -> Risk drill), entitlement-pruned.
  rpc DrillRisk(DrillRiskRequest) returns (DrillRiskResponse);
  // Read the limit tree + utilization/RAG status for a scope node, including the
  // hard-breach escalation flag.
  rpc LimitStatus(LimitStatusRequest) returns (LimitStatusResponse);
  // Price a set of linear-rates (fixed-income) positions against one calibrated
  // `CurveSet`, shard the resulting risk facts across the firm fan-out partition,
  // and roll them up into the per-currency net PV / PV01 / DV01 + key-rate-DV01
  // ladder. The linear-rates analogue of `AggregateRisk`: the client submits a
  // book of positions and reads the netted firm rollup — it never prices or sums
  // itself. The fan-in is purely additive and equals the single-node rollup
  // bit-for-bit (`celnet-risk-fleet`); positions travel inline on the request
  // (there is no firm rates position store yet).
  rpc AggregateRatesRisk(AggregateRatesRiskRequest) returns (AggregateRatesRiskResponse);
  // Book one rates position into the firm rates position store (the linear-rates
  // analogue of the options booked book). Assigns a fresh id when `position_id`
  // is 0; upserts otherwise. The store is authoritative for the session and is
  // what `ListRatesPositions` reads and the Book workspace renders.
  rpc BookRatesPosition(BookRatesPositionRequest) returns (BookRatesPositionResponse);
  // List the firm rates positions (scoped + entitlement-pruned), the rates analogue
  // of `ListPositions`. Reads the rates position store the booked flow populates.
  rpc ListRatesPositions(ListRatesPositionsRequest) returns (ListRatesPositionsResponse);
  // Compute one-cube joint options+FI tail risk (the C2c unified risk cube / R-a
  // "true single VaR engine"): full joint bump-and-revalue over aligned
  // (options-shock, rate-shock) scenarios yields the non-additive joint VaR/ES over
  // the union of the vanilla FX option legs and the linear-FI (OIS) legs, plus the
  // FI key-rate DV01 axis and signed parallel DV01. A pure calculation over the
  // inline portfolio + scenario config (like `AggregateRatesRisk`): no store read, no
  // market read, so every replica computes the identical result. Options-only reduces
  // to the options VaR; FI-only to the rate VaR; a mixed book shows the cross-risk-
  // class diversification (the economically-correct joint tail).
  rpc CombinedTailRisk(CombinedTailRiskRequest) returns (CombinedTailRiskResponse);
}

// The surface workflow: read a smile, mark/recalibrate from broker quotes, and
// run scenario / what-if shock grids.
service SurfaceService {
  // Read the calibrated smile for one (pair, tenor) on the delta axis.
  rpc GetSmile(GetSmileRequest) returns (Smile);
  // Mark/recalibrate the surface for a pair from a broker quote set.
  rpc MarkSurface(MarkSurfaceRequest) returns (MarkSurfaceResponse);
  // Reprice an instrument across a spot/vol/rate shock grid.
  rpc Scenario(ScenarioRequest) returns (ScenarioResponse);
  // Read a marked/bootstrapped discount curve on a tenor axis — the fixed-income
  // market-data-query analogue of `GetSmile` (zero rates / discount factors / par
  // pillars). Bootstraps an inline `curve_set` or reads a `MarkCurve`d version.
  rpc GetCurve(GetCurveRequest) returns (GetCurveResponse);
  // Mark/persist a bootstrapped discount curve under a fresh pinned version — the
  // FI analogue of `MarkSurface` (same versioning/pinning seam, so a later
  // `GetCurve` reproduces the exact marked curve).
  rpc MarkCurve(MarkCurveRequest) returns (MarkCurveResponse);
  // Bump-and-reprice curve scenario: a parallel (+ optional per-pillar key-rate)
  // shift of the calibrating par rates → the shifted curve (+ optional repriced PV)
  // — the FI analogue of the vol-surface `Scenario`.
  rpc CurveScenario(CurveScenarioRequest) returns (CurveScenarioResponse);
}

// ===========================================================================
// curve query — the fixed-income market-data query surface (ADR-0021: the
// asset-class-agnostic market-data query seam the FX vol surface already has,
// generalized so fixed income rides it too). Mirrors the `GetSmile` /
// `MarkSurface` / `Scenario` verb shapes on the discount-curve domain.
// ===========================================================================

// A queried point on a discount curve: the continuously-compounded zero rate and
// the discount factor at `tenor_years` (a year fraction measured from the curve
// reference/spot-anchor date). The curve analogue of a `SmilePoint`.
message CurvePoint {
  // The tenor (year fraction from the reference date) this point reports.
  double tenor_years = 1;
  // The continuously-compounded zero rate z(t) = -ln DF(t) / t.
  double zero_rate = 2;
  // The discount factor DF(t) = exp(-z(t)·t).
  double discount_factor = 3;
}

// A calibrating par pillar of a curve resolved to its final-payment year fraction
// (from spot) and its observed par (fair fixed) rate — the curve analogue of a
// `Smile`'s echoed `broker_quotes`.
message CurveParPillar {
  // The resolved final-payment year fraction from spot for this pillar.
  double tenor_years = 1;
  // The observed par (fair fixed) rate as a decimal (0.0405 = 4.05%).
  double par_rate = 2;
}

// A request to read a marked/bootstrapped discount curve on a tenor axis — the
// fixed-income analogue of `GetSmileRequest`. Exactly one curve source: when
// `curve_version` is present the marked curve of that version is read from the
// store (mirroring the pinned-price path); otherwise the inline `curve_set` is
// bootstrapped live.
message GetCurveRequest {
  // The calibrating curve set to bootstrap and read. Required when no
  // `curve_version` is pinned; ignored when a `curve_version` is supplied.
  CurveSet curve_set = 1;
  // The tenors (year fractions from the reference date) to report zero rates /
  // discount factors at.
  repeated double query_tenor_years = 2;
  // Optional pin to a `MarkCurve`d version (presence-tracked): present ⇒ read the
  // marked curve from the store; absent ⇒ bootstrap `curve_set` live. A *data*
  // field selecting a marked curve, never an API version (the contract is
  // unversioned, rule 9). An unknown version is `failed_precondition`.
  optional uint64 curve_version = 3;
}

// The read curve: the currency + reference date, the queried points, the echoed
// calibrating par pillars, and (when pinned) the marked version — the FI analogue
// of `Smile`.
message GetCurveResponse {
  // ISO 4217 currency of the curve (USD for the P0 arm).
  string currency = 1;
  // The curve reference (spot-anchor) date the tenor axis is measured from.
  BrokenDate reference_date = 2;
  // The queried points (zero rate + discount factor per requested tenor).
  repeated CurvePoint points = 3;
  // The calibrating par pillars echoed (resolved tenor + par rate).
  repeated CurveParPillar par_pillars = 4;
  // The marked version this curve was read from (presence-tracked): present when
  // the request pinned a `curve_version`; absent for a live inline bootstrap.
  optional uint64 curve_version = 5;
  // Read time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
}

// A request to mark/persist a bootstrapped discount curve under a fresh pinned
// version — the FI analogue of `MarkSurfaceRequest`. The curve is bootstrapped
// from the calibrating `curve_set` and deposited through the same versioning seam
// `MarkSurface` uses, so a later `GetCurve` pinned to the returned version
// reproduces this exact curve.
message MarkCurveRequest {
  // The calibrating curve set to bootstrap and persist.
  CurveSet curve_set = 1;
}

// The result of a curve mark: a server-assigned curve version id, the resolved par
// pillars, and the bootstrapped points at the pillar tenors — the FI analogue of
// `MarkSurfaceResponse`.
message MarkCurveResponse {
  // ISO 4217 currency of the marked curve.
  string currency = 1;
  // A monotonic server-assigned curve version id for this mark (the same version
  // authority `MarkSurface` stamps; a `GetCurve` pins against it).
  uint64 curve_version = 2;
  // The resolved calibrating par pillars marked.
  repeated CurveParPillar par_pillars = 3;
  // The bootstrapped points (zero rate + discount factor) at the pillar tenors —
  // the self-describing marked curve.
  repeated CurvePoint points = 4;
  // Mark time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 5;
}

// The repriced instrument leg of a curve scenario: the PV before and after the
// shift, the resulting PV change, and the base curve DV01 (PV change per +1bp
// parallel pillar bump) so a consumer can check `pv_change ~= dv01 · shift_bp`.
message CurveScenarioReprice {
  // The instrument PV on the unshifted (base) curve.
  double base_pv = 1;
  // The instrument PV on the shifted curve.
  double shifted_pv = 2;
  // The PV change (`shifted_pv - base_pv`).
  double pv_change = 3;
  // The base curve DV01 (PV change per +1bp parallel bump of every pillar), signed
  // per the instrument `side` — the first-order predictor of `pv_change`.
  double dv01 = 4;
}

// A bump-and-reprice curve scenario — the FI analogue of the vol-surface
// `ScenarioRequest`. Applies a parallel (and optional per-pillar key-rate) shift to
// the calibrating par rates, re-bootstraps, and reports the shifted curve on the
// query axis; if an `instrument` is supplied it is repriced on the base and shifted
// curves so the desk sees the PV impact.
message CurveScenarioRequest {
  // The base calibrating curve set to shift and reprice against.
  CurveSet curve_set = 1;
  // The parallel shift applied to every pillar's par rate, in basis points
  // (e.g. 25.0 = +25bp). Positive raises rates (lowers discount factors).
  double parallel_shift_bp = 2;
  // Optional per-pillar key-rate shifts in basis points, parallel to
  // `curve_set.ois_pillars`. Empty ⇒ parallel-only; otherwise its length must equal
  // the pillar count and each entry is added to the corresponding pillar on top of
  // the parallel shift (the key-rate scenario).
  repeated double key_rate_shift_bp = 3;
  // The tenors (year fractions) to report the shifted curve at.
  repeated double query_tenor_years = 4;
  // Optional instrument to reprice on the base and shifted curves
  // (presence-tracked): absent ⇒ only the shifted curve is returned.
  RatesInstrument instrument = 5;
}

// The shifted curve on the query axis, plus the optional repriced instrument leg —
// the FI analogue of `ScenarioResponse`.
message CurveScenarioResponse {
  // ISO 4217 currency of the curve.
  string currency = 1;
  // The shifted curve points (zero rate + discount factor per requested tenor).
  repeated CurvePoint points = 2;
  // The repriced instrument leg, present when the request carried an `instrument`.
  CurveScenarioReprice reprice = 3;
}

// ===========================================================================
// fix-admin — manage the inbound FIX acceptor connections the edge binds
// ===========================================================================

// The dialect an inbound FIX acceptor speaks. Kind-generic: the spot dialect
// adds a value here in phase 2 without reshaping the API.
enum FixAcceptorKind {
  // The FX-options dialect served by the existing acceptor.
  FIX_ACCEPTOR_KIND_OPTIONS = 0;
  // The fixed-income (linear-rates / OIS) one-shot RFQ dialect: an inbound
  // QuoteRequest(R) with SubscriptionRequestType(263)=0 is priced to a one-shot
  // Quote(S). Standing one up requires the QuoteRespond capability on the
  // FixedIncome asset class (in addition to connection administration).
  FIX_ACCEPTOR_KIND_FIXED_INCOME_QUOTE = 1;
  // The fixed-income (linear-rates / OIS) streaming RFS dialect: an inbound
  // QuoteRequest(R) with SubscriptionRequestType(263)=1 subscribes to a streamed
  // request-for-stream. Standing one up requires the Stream capability on the
  // FixedIncome asset class (in addition to connection administration).
  FIX_ACCEPTOR_KIND_FIXED_INCOME_STREAM = 2;
}

// A managed inbound FIX-acceptor connection: the persisted definition plus its
// live runtime status (read-only `running`/`bound_addr`).
message FixConnectionDesc {
  // Stable identifier (the management key).
  string id = 1;
  // Human-friendly label.
  string name = 2;
  // Which dialect the acceptor speaks.
  FixAcceptorKind kind = 3;
  // The host:port to bind, e.g. `127.0.0.1:9099`.
  string bind_addr = 4;
  // Our venue SenderCompID.
  string sender_comp_id = 5;
  // The expected counterparty SenderCompID (the FSM rejects any other peer).
  string target_comp_id = 6;
  // Whether the acceptor should be (and stay) bound.
  bool enabled = 7;
  // Whether an acceptor is currently listening (runtime status).
  bool running = 8;
  // The actually-bound address when running (resolves an ephemeral `:0`); empty
  // when not running.
  string bound_addr = 9;
  // The owning desk id (`DeskDef::id`). Every managed connection belongs to a
  // desk; a desk-scoped (non-admin) caller sees only connections owned by its
  // desk, while an admin sees all of them. (A legacy pre-ownership config could
  // load with an empty desk, but the admin API no longer creates one.)
  string desk = 10;
}

// The editable fields of a connection (create/update payload). Runtime status
// (`running`/`bound_addr`) is server-owned and not part of the spec.
message FixConnectionSpec {
  // On create: a client-suggested id (a slug of `name` is used when empty). On
  // update: ignored in favour of the request's `id`.
  string id = 1;
  // Human-friendly label shown in the UI.
  string name = 2;
  // Which dialect the acceptor speaks.
  FixAcceptorKind kind = 3;
  // The host:port to bind, e.g. `127.0.0.1:9099`.
  string bind_addr = 4;
  // Our venue SenderCompID.
  string sender_comp_id = 5;
  // The expected counterparty SenderCompID (the FSM rejects any other peer).
  string target_comp_id = 6;
  // Whether the acceptor should be (and stay) bound.
  bool enabled = 7;
  // The owning desk id (`DeskDef::id`). REQUIRED: every connection belongs to a
  // desk — the server rejects a create/update with a blank desk
  // (`invalid_argument`). Desk-scoped (non-admin) callers see only their own
  // desk's connections.
  string desk = 8;
}

// List all managed connections with their live status.
message ListFixConnectionsRequest {
  // The client-asserted entitlement principal (admin-gated; see RiskService).
  optional EntitlementPrincipal principal = 1;
  // Echoed back so a multiplexed client joins reply to request.
  optional uint64 correlation_id = 2;
  // The bearer session token from `AuthService.Login`; the server authenticates
  // the caller from it. Absent ⇒ the legacy principal/mode path. A secret.
  optional string session_token = 3;
}
// The managed connections and their live status.
message ListFixConnectionsResponse {
  // All managed connections with their live status.
  repeated FixConnectionDesc connections = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Define a new connection (binds immediately when enabled).
message CreateFixConnectionRequest {
  // The editable fields of the connection to define.
  FixConnectionSpec spec = 1;
  // The client-asserted entitlement principal (admin-gated).
  optional EntitlementPrincipal principal = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
  // The bearer session token from `AuthService.Login`; the server authenticates
  // the caller from it and requires administrator authority. A secret.
  optional string session_token = 4;
}
// The created connection.
message CreateFixConnectionResponse {
  // The created connection with its server-minted id and live status.
  FixConnectionDesc connection = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing connection's definition (restarts the acceptor).
message UpdateFixConnectionRequest {
  // The id of the connection to replace.
  string id = 1;
  // The new definition (the request `id` is authoritative).
  FixConnectionSpec spec = 2;
  // The client-asserted entitlement principal (admin-gated).
  optional EntitlementPrincipal principal = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
  // The bearer session token from `AuthService.Login`; the server authenticates
  // the caller from it and requires administrator authority. A secret.
  optional string session_token = 5;
}
// The updated connection.
message UpdateFixConnectionResponse {
  // The updated connection with its live status.
  FixConnectionDesc connection = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a connection (stops its acceptor).
message DeleteFixConnectionRequest {
  // The id of the connection to delete.
  string id = 1;
  // The client-asserted entitlement principal (admin-gated).
  optional EntitlementPrincipal principal = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
  // The bearer session token from `AuthService.Login`; the server authenticates
  // the caller from it and requires administrator authority. A secret.
  optional string session_token = 4;
}
// Acknowledges a delete.
message DeleteFixConnectionResponse {
  // Echoed request correlation id.
  optional uint64 correlation_id = 1;
}

// Enable or disable a connection (bind/stop its acceptor).
message SetFixConnectionEnabledRequest {
  // The id of the connection to enable or disable.
  string id = 1;
  // The desired enabled state (true ⇒ bind, false ⇒ stop).
  bool enabled = 2;
  // The client-asserted entitlement principal (admin-gated).
  optional EntitlementPrincipal principal = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
  // The bearer session token from `AuthService.Login`; the server authenticates
  // the caller from it and requires administrator authority. A secret.
  optional string session_token = 5;
}
// The connection with its updated status.
message SetFixConnectionEnabledResponse {
  // The connection with its updated live status.
  FixConnectionDesc connection = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// The travel direction of a captured frame, from the acceptor's vantage.
enum FixMsgDirection {
  // A frame the acceptor RECEIVED from the counterparty (proto3 zero default).
  FIX_MSG_DIRECTION_INBOUND = 0;
  // A frame the acceptor SENT to the counterparty.
  FIX_MSG_DIRECTION_OUTBOUND = 1;
}

// One captured FIX frame on a managed acceptor session (the monitor screen feed).
message FixMessage {
  // Monotonic per-process capture sequence (the client's poll cursor).
  uint64 seq = 1;
  // The managing connection's id this frame was captured on.
  string connection_id = 2;
  // Travel direction from the acceptor's vantage.
  FixMsgDirection direction = 3;
  // The FIX MsgType(35) value, e.g. `R`, `S`, `A`.
  string msg_type = 4;
  // A human label for the MsgType, e.g. `QuoteRequest`.
  string summary = 5;
  // Edge capture timestamp (epoch nanos).
  int64 epoch_nanos = 6;
  // The raw FIX message with SOH rendered as `|`.
  string raw = 7;
}

// Poll the captured session traffic. A cursor `after_seq` of 0 returns the whole
// retained ring buffer; subsequent polls pass back `latest_seq` to tail only new
// frames. `connection_id` (when set) filters to one session.
message ListFixMessagesRequest {
  // Filter to one session (absent ⇒ all captured sessions).
  optional string connection_id = 1;
  // The poll cursor: return frames with a capture sequence above this (0 ⇒ all).
  uint64 after_seq = 2;
  // Max frames in the page (0 ⇒ server default).
  uint32 limit = 3;
  // The client-asserted entitlement principal (admin-gated).
  optional EntitlementPrincipal principal = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
  // The bearer session token from `AuthService.Login`; the server authenticates
  // the caller from it. Absent ⇒ the legacy principal/mode path. A secret.
  optional string session_token = 6;
}
// A cursored page of captured session traffic.
message ListFixMessagesResponse {
  // The captured frames after the cursor (oldest-first).
  repeated FixMessage messages = 1;
  // The highest capture sequence currently assigned (the next poll's `after_seq`).
  uint64 latest_seq = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}

// Manage the inbound FIX acceptor connections the edge binds (admin surface,
// entitlement-gated like RiskService). Definitions persist to disk and auto-load
// on startup; create/update/enable/delete take effect at runtime.
service FixAdminService {
  // List all managed connections with their live status.
  rpc ListConnections(ListFixConnectionsRequest) returns (ListFixConnectionsResponse);
  // Define a new connection (binds immediately when enabled).
  rpc CreateConnection(CreateFixConnectionRequest) returns (CreateFixConnectionResponse);
  // Replace an existing connection's definition (restarts the acceptor).
  rpc UpdateConnection(UpdateFixConnectionRequest) returns (UpdateFixConnectionResponse);
  // Delete a connection (stops its acceptor).
  rpc DeleteConnection(DeleteFixConnectionRequest) returns (DeleteFixConnectionResponse);
  // Enable or disable a connection (bind/stop its acceptor).
  rpc SetEnabled(SetFixConnectionEnabledRequest) returns (SetFixConnectionEnabledResponse);
  // Poll the captured inbound/outbound session traffic for the monitor screen.
  rpc ListMessages(ListFixMessagesRequest) returns (ListFixMessagesResponse);
}

// ===========================================================================
// AuthService — server-enforced sessions + user / desk administration.
//
// Login exchanges an email + password for an opaque bearer `session_token`; every
// other RPC carries that token and the SERVER (not the client) resolves it to an
// authenticated identity. Administrative RPCs additionally require the resolved
// identity to be an admin. Passwords are Argon2id-hashed at rest and NEVER appear
// on the wire in either direction.
// ===========================================================================

// A user's authority level. The proto3 zero default is the LEAST-privileged role
// (TRADER), so a defaulted/forgotten value can never grant administration.
enum UserRole {
  // A desk member: sees their desk's inbound RFQ traffic. The zero default.
  USER_ROLE_TRADER = 0;
  // Full administration: user/desk CRUD, password resets, FIX connections.
  USER_ROLE_ADMIN = 1;
}

// A user account as exposed on the wire. Carries NO password material.
message UserDesc {
  // Stable user id (the admin-API key).
  string id = 1;
  // Login email (unique, case-insensitive).
  string email = 2;
  // Human-friendly display name.
  string display_name = 3;
  // The user's authority level.
  UserRole role = 4;
  // The desks the user belongs to, by `DeskDesc.id`. A user may belong to zero,
  // one, or many desks; a notification routed to any desk in this set reaches the
  // user. Empty ⇒ deskless (sees no desk-routed traffic) unless `all_desks` is set.
  repeated string desk_ids = 5;
  // Whether the account is disabled (retained but cannot log in).
  bool disabled = 6;
  // When true the user belongs to EVERY desk (present and future) and `desk_ids` is
  // ignored — the "all" arm of the membership; false ⇒ the `desk_ids` set applies.
  bool all_desks = 7;
}

// A desk: a named group traders belong to.
message DeskDesc {
  // Stable desk id (the admin-API key).
  string id = 1;
  // Human-friendly desk label.
  string name = 2;
}

// Exchange credentials for a session token.
message LoginRequest {
  // The login email (case-insensitive).
  string email = 1;
  // The plaintext password (checked against the Argon2id hash, never stored).
  string password = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The issued session on success.
message LoginResponse {
  // The opaque bearer token to present on subsequent RPCs.
  string session_token = 1;
  // The authenticated user's profile.
  UserDesc user = 2;
  // Absolute session expiry (epoch nanos); re-login is required past it.
  int64 expires_nanos = 3;
  // The caller's own fully-resolved effective capability set (role bundle ∪
  // grants ∖ denies), enumerated over every action × asset. A client gates its
  // own affordances on this without an admin-only round-trip. Because a
  // capability change revokes the user's sessions, the next login re-derives it.
  repeated CapabilityDesc capabilities = 5;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// Invalidate a session.
message LogoutRequest {
  // The bearer token to invalidate.
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// Logout acknowledgement.
message LogoutResponse {
  // Whether a live session was actually invalidated.
  bool ended = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// List all users (admin only).
message ListUsersRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full user roster.
message ListUsersResponse {
  // Every user account, in creation order.
  repeated UserDesc users = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Create a new user (admin only).
message CreateUserRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The new user's login email (must be unique, case-insensitive).
  string email = 2;
  // The new user's display name.
  string display_name = 3;
  // The new user's authority level.
  UserRole role = 4;
  // The desks to assign, by `DeskDesc.id` (zero, one, or many). Ignored when
  // `all_desks` is set. Every id must name an existing desk.
  repeated string desk_ids = 5;
  // The initial plaintext password (hashed at rest, never stored in the clear).
  string password = 6;
  // Echoed request correlation id.
  optional uint64 correlation_id = 7;
  // When true the user belongs to EVERY desk; `desk_ids` is then ignored.
  bool all_desks = 8;
}
// The created user.
message CreateUserResponse {
  // The newly created account.
  UserDesc user = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Update a user's profile / role / desk / disabled flag (admin only). Password is
// changed only through `ResetPassword`, never here.
message UpdateUserRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user to update.
  string id = 2;
  // The new display name.
  string display_name = 3;
  // The new authority level.
  UserRole role = 4;
  // The new desk membership, by `DeskDesc.id` (zero, one, or many). Ignored when
  // `all_desks` is set. Every id must name an existing desk. Empty + all_desks=false
  // ⇒ the user becomes deskless.
  repeated string desk_ids = 5;
  // The new disabled flag.
  bool disabled = 6;
  // Echoed request correlation id.
  optional uint64 correlation_id = 7;
  // When true the user belongs to EVERY desk; `desk_ids` is then ignored.
  bool all_desks = 8;
}
// The updated user.
message UpdateUserResponse {
  // The user after the update.
  UserDesc user = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a user (admin only).
message DeleteUserRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user to delete.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteUserResponse {
  // Whether a user was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Set a user's password (admin only). The admin may target any user, including
// self, to rotate the seeded default credential.
message ResetPasswordRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user whose password is set.
  string id = 2;
  // The new plaintext password (hashed at rest, never stored in the clear).
  string new_password = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// Reset acknowledgement.
message ResetPasswordResponse {
  // Echoed request correlation id.
  optional uint64 correlation_id = 1;
}

// List all desks (admin only).
message ListDesksRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full desk roster.
message ListDesksResponse {
  // Every desk, in creation order.
  repeated DeskDesc desks = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Create a new desk (admin only).
message CreateDeskRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The new desk's display name.
  string name = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created desk.
message CreateDeskResponse {
  // The newly created desk.
  DeskDesc desk = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Rename a desk (admin only). Only the human-facing display `name` changes; the
// stable `id` is immutable, so a rename never disturbs routing — RFQ/deal
// notification delivery and connection ownership both key on `DeskDesc.id`, never
// on the display name, and user→desk membership (`UserDesc.desk_ids` / `all_desks`) is untouched.
message UpdateDeskRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the desk to rename.
  string id = 2;
  // The new display name (must be unique across desks, case-insensitive).
  string name = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The renamed desk.
message UpdateDeskResponse {
  // The desk after the rename (same `id`, new `name`).
  DeskDesc desk = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a desk (admin only). Members of the deleted desk become unassigned.
message DeleteDeskRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the desk to delete.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteDeskResponse {
  // Whether a desk was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// A named legal entity / account: the display name + short code for a `uint32`
// `RatesPosition.entity` partition key. The position wire stays numeric; this only
// names the key so traders pick a name and the Book/blotter show a name.
message EntityDesc {
  // The `uint32` wire partition key (`RatesPosition.entity`) this entry names.
  uint32 key = 1;
  // Human-friendly legal-entity / account name (unique, case-insensitive).
  string name = 2;
  // Short display code shown in compact cells (unique, case-insensitive).
  string code = 3;
}

// A named netting book: the display name for a `uint32` `RatesPosition.book` key,
// belonging to exactly one entity.
message BookDesc {
  // The `uint32` wire key (`RatesPosition.book`) this entry names.
  uint32 key = 1;
  // Human-friendly book name (unique, case-insensitive).
  string name = 2;
  // The `EntityDesc.key` of the entity this book belongs to.
  uint32 entity_key = 3;
}

// List the named legal entities / accounts (any authenticated caller).
message ListEntitiesRequest {
  // The caller's bearer token (must resolve to a valid session; not admin-gated).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full entity roster.
message ListEntitiesResponse {
  // Every entity, in creation order.
  repeated EntityDesc entities = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Create a named legal entity / account (admin only).
message CreateEntityRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The new entity's display name (must be unique, case-insensitive).
  string name = 2;
  // The new entity's short display code (must be unique, case-insensitive).
  string code = 3;
  // The `uint32` wire key to map. `0` ⇒ the server assigns the lowest free key; a
  // non-zero value pins that key (must be unused).
  uint32 key = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The created entity.
message CreateEntityResponse {
  // The newly created entity (its `key` is the assigned or pinned wire key).
  EntityDesc entity = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Update a named legal entity / account's name/code (admin only). The wire `key` is
// immutable (positions already reference it); identify the entity by `key`.
message UpdateEntityRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The wire key of the entity to update (immutable identity).
  uint32 key = 2;
  // The new display name (must stay unique, case-insensitive).
  string name = 3;
  // The new short display code (must stay unique, case-insensitive).
  string code = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The updated entity.
message UpdateEntityResponse {
  // The entity after the update.
  EntityDesc entity = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a named legal entity / account (admin only). Rejected while any book still
// references it (`failed_precondition`).
message DeleteEntityRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The wire key of the entity to delete.
  uint32 key = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteEntityResponse {
  // Whether an entity was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// List the named netting books (any authenticated caller).
message ListBooksRequest {
  // The caller's bearer token (must resolve to a valid session; not admin-gated).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full book roster.
message ListBooksResponse {
  // Every book, in creation order.
  repeated BookDesc books = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Create a named netting book under an entity (admin only).
message CreateBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The new book's display name (must be unique, case-insensitive).
  string name = 2;
  // The `EntityDesc.key` of the entity this book belongs to (must exist).
  uint32 entity_key = 3;
  // The `uint32` wire key to map. `0` ⇒ the server assigns the lowest free key; a
  // non-zero value pins that key (must be unused).
  uint32 key = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The created book.
message CreateBookResponse {
  // The newly created book (its `key` is the assigned or pinned wire key).
  BookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Update a named netting book's name/entity (admin only). The wire `key` is
// immutable (positions already reference it); identify the book by `key`.
message UpdateBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The wire key of the book to update (immutable identity).
  uint32 key = 2;
  // The new display name (must stay unique, case-insensitive).
  string name = 3;
  // The new owning entity key (must exist).
  uint32 entity_key = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The updated book.
message UpdateBookResponse {
  // The book after the update.
  BookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete a named netting book (admin only).
message DeleteBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The wire key of the book to delete.
  uint32 key = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteBookResponse {
  // Whether a book was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// FI aggregated book — operator-defined multi-LP price consolidation
// (ADR-0022). A named set of inbound liquidity members whose per-instrument
// top-of-book is consolidated into one composite price, managed from the
// Administration surface. Global (not desk-owned): any authenticated user may
// read a book's composite, only an admin may define or edit one. The messages
// mirror the entity/book admin CRUD conventions on this same service (a required
// `session_token`, an optional echoed `correlation_id`).

// The instrument-coverage mode of an aggregated book (mirrors the store
// `config::identity::Scope` discriminant).
enum AggregationScopeMode {
  // Aggregate EVERY instrument any member quotes — the composite tracks the
  // union of the members' live streams with no pre-declared instrument list
  // (proto3 zero default). `instrument_ids` is ignored in this mode.
  AGGREGATION_SCOPE_MODE_ALL_MEMBERS_QUOTE = 0;
  // Aggregate only the explicitly listed `instrument_ids`, each resolving to a
  // canonical reference-data `InstrumentDefDesc.instrument_id`.
  AGGREGATION_SCOPE_MODE_EXPLICIT = 1;
}

// The consolidation-engine tuning of an aggregated book (mirrors the store
// `config::identity::AggregationParams`): the knobs the `celnet-aggregation`
// engine consumes once a book is wired.
message AggregationParamsDesc {
  // Staleness half-life tau in milliseconds: a member quote's contribution decays
  // as 2^{-dt/tau} with age dt. Must be > 0.
  uint64 staleness_tau_ms = 1;
  // Hard maximum quote age in milliseconds: a member quote older than this is
  // fully excluded from the composite.
  uint64 max_quote_age_ms = 2;
  // Whether MAD-based divergence gating drops outlier members before consolidation.
  bool divergence_gating = 3;
  // Minimum surviving member contributors required to publish a composite. Must be >= 1.
  uint32 min_contributors = 4;
  // How many stacked depth levels the composite exposes (1 = top-of-book only).
  uint32 depth_levels = 5;
}

// The unit an outbound-tiering spread magnitude is expressed in (mirrors the
// engine `celnet_tiering::SpreadUnit`). A bond "25 bps" is ambiguous — price bps
// vs duration-consistent yield bps — so the unit is carried explicitly and the
// engine converts each magnitude to a price offset per quote.
enum TieringSpreadUnit {
  // Price basis points: 1 bp = 0.01 price points per 100 face (proto3 zero
  // default; the flat-markup baseline unit that matches the worked example).
  TIERING_SPREAD_UNIT_PRICE_BPS = 0;
  // Yield basis points: converted to a price offset via the bond's DV01
  // (duration-consistent across the curve; requires bond DV01/ModDur).
  TIERING_SPREAD_UNIT_YIELD_BPS = 1;
  // Price points per 100 face — the magnitude IS the price offset.
  TIERING_SPREAD_UNIT_PRICE_POINTS = 2;
  // Percent of the mid — a magnitude of 1.0 is an offset of mid/100.
  TIERING_SPREAD_UNIT_PERCENT = 3;
}

// What the engine does when the upstream composite is stale / the LP quorum is
// lost (mirrors `celnet_tiering::StalePolicy`).
enum TieringStalePolicy {
  // Publish no quote for the line — the safe default (proto3 zero).
  TIERING_STALE_POLICY_SUPPRESS = 0;
  // Keep a market but widen to the guardrail `h_max` with zero skew.
  TIERING_STALE_POLICY_WIDEN_TO_MAX = 1;
}

// Which pluggable tiering strategy a `TieringStrategyDesc` carries (mirrors the
// `celnet_tiering::StrategySpec` variants). Phase 2a ships the two streaming-
// relevant strategies; the remaining four (vol scale, size ladder, toxicity,
// per-client tier) slot in additively as new enum values behind the same seam.
enum TieringStrategyKind {
  // Flat markup: a constant symmetric half-spread `half_spread`, no skew
  // (proto3 zero default). `kappa` / `s_max` are ignored.
  TIERING_STRATEGY_KIND_FLAT_MARKUP = 0;
  // Inventory skew: base `half_spread` plus `clamp(kappa*q, +-s_max)` skew.
  TIERING_STRATEGY_KIND_INVENTORY_SKEW = 1;
  // Scaled Smoothed Spread: a spread SOURCE that damps spread volatility. From the
  // fading-memory smoothed observed spread `S` it sets one absolute output spread
  // `O = min(max_output_spread, core_spread*(1 + f*D/e))` centred on mid (no skew),
  // where `D = |S - expected_spread|` is zeroed inside the `max_divergence`
  // dead-band and `f = spread_scale_factor`. Uses the `smoothing_weight` (..10),
  // `expected_spread`/`max_divergence`/`core_spread`/`max_output_spread` and
  // `spread_scale_factor` fields; `half_spread`/`kappa`/`s_max` are ignored. Use
  // instead of FLAT_MARKUP (it sets the half-spread absolutely).
  TIERING_STRATEGY_KIND_SCALED_SMOOTHED_SPREAD = 2;
}

// One enabled tiering strategy and its parameters (mirrors a
// `celnet_tiering::StrategySpec` variant). Magnitudes are in the parent
// `TieringConfigDesc.unit`. Fields not used by `kind` are ignored (e.g. a
// FLAT_MARKUP strategy ignores `kappa` / `s_max`).
message TieringStrategyDesc {
  // Which strategy this entry configures.
  TieringStrategyKind kind = 1;
  // The (base) half-spread magnitude `H` (FLAT_MARKUP / INVENTORY_SKEW).
  double half_spread = 2;
  // Inventory-skew gain `kappa` (magnitude per unit inventory); INVENTORY_SKEW only.
  double kappa = 3;
  // Inventory-skew strategy-local cap `s_max` (magnitude); INVENTORY_SKEW only.
  double s_max = 4;
  // Scaled-Smoothed-Spread Smoothing Weight `w` in (0, 1] (1 => smoothing off);
  // SCALED_SMOOTHED_SPREAD only. Drives the stateful EWMA on the observed spread.
  double smoothing_weight = 5;
  // Scaled-Smoothed-Spread Expected Spread `e` (> 0), the divergence reference (an
  // absolute price spread); SCALED_SMOOTHED_SPREAD only.
  double expected_spread = 6;
  // Scaled-Smoothed-Spread Max Divergence `d` (>= 0), the dead-band half-width;
  // SCALED_SMOOTHED_SPREAD only.
  double max_divergence = 7;
  // Scaled-Smoothed-Spread Core spread `c` (>= 0), the base output spread at zero
  // widen; SCALED_SMOOTHED_SPREAD only.
  double core_spread = 8;
  // Scaled-Smoothed-Spread Max Output Spread `m` (>= c), the output cap and the
  // indicative fallback width; SCALED_SMOOTHED_SPREAD only.
  double max_output_spread = 9;
  // Scaled-Smoothed-Spread Spread Scale Factor `f` (>= 0), the widening gain on
  // `D/e`; SCALED_SMOOTHED_SPREAD only.
  double spread_scale_factor = 10;
}

// The price-space guardrail bounds (mirrors `celnet_tiering::Guardrails`); all
// four are absolute price offsets (points), independent of the spread unit.
message TieringGuardrailsDesc {
  // Minimum half-spread `h_min >= 0`.
  double h_min = 1;
  // Maximum half-spread `h_max >= h_min` (also the widen-to-max width).
  double h_max = 2;
  // Maximum absolute skew `s_max >= 0`.
  double s_max = 3;
  // Minimum tradeable spread `spread_floor > 0` (`offer - bid >= spread_floor`).
  double spread_floor = 4;
}

// A book's complete outbound-tiering configuration (mirrors
// `celnet_tiering::TieringConfig`). Absent on `AggregatedBookSpec` /
// `AggregatedBookDesc` ⇒ tiering disabled: the book publishes the raw composite
// unchanged (zero behaviour change for a book with no tiering config).
message TieringConfigDesc {
  // The unit every strategy magnitude below is expressed in.
  TieringSpreadUnit unit = 1;
  // The enabled strategies, composed additively in order.
  repeated TieringStrategyDesc strategies = 2;
  // The price-space guardrail bounds clamping the composed result.
  TieringGuardrailsDesc guardrails = 3;
  // What to do on stale/absent upstream inputs.
  TieringStalePolicy stale_policy = 4;
}

// The editable fields of an aggregated book (the create/update payload). The
// server-minted `id` on `AggregatedBookDesc` is not part of the spec except as a
// client-suggested slug on create (mirrors `FixConnectionSpec.id`).
message AggregatedBookSpec {
  // On create: a client-suggested id (a slug of `name` is used when empty). On
  // update: ignored in favour of the request's `id`.
  string id = 1;
  // Human-friendly book label (unique across the store, case-insensitive).
  string name = 2;
  // The inbound liquidity members whose quotes feed the composite, by connection
  // id (transport-agnostic; unique within this book).
  repeated string member_connection_ids = 3;
  // Which instruments the composite is produced for.
  AggregationScopeMode scope_mode = 4;
  // The explicit instrument ids when `scope_mode == EXPLICIT` (each must resolve to
  // an instrument in the reference-data registry); ignored for `ALL_MEMBERS_QUOTE`.
  repeated string instrument_ids = 5;
  // The consolidation-engine tuning applied when the book is wired to the engine.
  AggregationParamsDesc params = 6;
  // Whether the book is active (a disabled book is persisted and editable but stands
  // up no engine and publishes no composite).
  bool enabled = 7;
  // The optional outbound-tiering configuration applied to this book's composite
  // before publish. Absent ⇒ tiering disabled (the raw composite is published
  // unchanged). Additive (rule 9) — an existing book with no tiering block loads
  // and round-trips exactly as before.
  TieringConfigDesc tiering = 8;
}

// A persisted aggregated book (mirrors the store `config::identity::AggregatedBookDef`
// field-for-field).
message AggregatedBookDesc {
  // Stable identifier (the store/API key), minted from `name` on create.
  string id = 1;
  // Human-friendly book label (unique, case-insensitive).
  string name = 2;
  // The inbound liquidity members whose quotes feed the composite, by connection id.
  repeated string member_connection_ids = 3;
  // Which instruments the composite is produced for.
  AggregationScopeMode scope_mode = 4;
  // The explicit instrument ids when `scope_mode == EXPLICIT`; empty otherwise.
  repeated string instrument_ids = 5;
  // The consolidation-engine tuning.
  AggregationParamsDesc params = 6;
  // Whether the book is active.
  bool enabled = 7;
  // The outbound-tiering configuration (absent ⇒ tiering disabled; see
  // `AggregatedBookSpec.tiering`).
  TieringConfigDesc tiering = 8;
}

// List the aggregated books (any authenticated caller — a book is global and its
// composite is readable by any user, so this is NOT admin-only).
message ListAggregatedBooksRequest {
  // The caller's bearer token (must resolve to a valid session; not admin-gated).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The full aggregated-book roster.
message ListAggregatedBooksResponse {
  // Every aggregated book, in creation order.
  repeated AggregatedBookDesc books = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Define a new aggregated book (admin only).
message CreateAggregatedBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The editable fields of the book to define.
  AggregatedBookSpec spec = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created aggregated book.
message CreateAggregatedBookResponse {
  // The created book with its server-minted id.
  AggregatedBookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing aggregated book's definition (admin only). The `id` is
// immutable identity; the spec's own `id` field is ignored.
message UpdateAggregatedBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the book to replace (immutable identity).
  string id = 2;
  // The new definition.
  AggregatedBookSpec spec = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The updated aggregated book.
message UpdateAggregatedBookResponse {
  // The book after the update.
  AggregatedBookDesc book = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete an aggregated book (admin only).
message DeleteAggregatedBookRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the book to delete.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteAggregatedBookResponse {
  // Whether a book was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// LP liquidity ingest — the machine-to-machine feed by which an inbound
// liquidity connection (the `lp-sim` binary today, any FIX/API LP adapter
// tomorrow) pushes its per-instrument two-way top-of-book INTO the server, where
// the enabled `AggregatedBook`s consolidate it (`celnet-aggregation`). This is a
// backend feed, not a client-facing surface: an LP speaks gRPC directly, so this
// path has NO WS mirror / codec. A member is identified by its `lp_name` (the
// consolidation `VenueId`) and matched to the books that list it as a member.
// ===========================================================================

// One inbound LP's two-way top-of-book for a single instrument, at an instant.
// Prices are in the instrument's natural cash units (a clean price per 100 face
// for a Treasury, a rate/yield for a money-market line — the consolidation math is
// unit-agnostic). Sizes are the firm quantity available on each side. A member
// streams a sequence of these (one per instrument it makes a market in, re-sent as
// its quote moves); the server keeps only the latest per `(book, lp_name,
// instrument_id)` and decays it by age against the book's staleness tuning.
message LpQuote {
  // The LP connection name — the consolidation `VenueId` a subscriber attributes
  // the contribution to, and the key matched against a book's member list.
  string lp_name = 1;
  // The canonical server `instrument_id` this quote is for (ADR-0022 decision D —
  // the one identity shared across reference data, the wire and the composite; the
  // Treasury CUSIP for the bundled universe).
  string instrument_id = 2;
  // Bid price (the LP buys the asset here).
  double bid = 3;
  // Offer price (the LP sells the asset here).
  double offer = 4;
  // Firm size available at the bid.
  double bid_size = 5;
  // Firm size available at the offer.
  double offer_size = 6;
  // Observation instant, epoch nanoseconds (UTC) — the valuation clock decays the
  // quote by its age, and drops it past the book's hard max age.
  int64 ts_nanos = 7;
}

// The server's acknowledgement of a completed `LpFeed` stream: how many pushed
// `LpQuote`s were accepted into at least one enabled aggregated book (a quote for
// an instrument no enabled book scopes, or from an unknown member, is received but
// not accepted). Returned once, when the client half-closes the stream.
message LpFeedAck {
  // The number of `LpQuote`s routed into at least one enabled book.
  uint64 accepted = 1;
}

// The backend liquidity-feed ingest. An inbound LP opens a client-streaming
// `LpFeed`, pushes its live two-ways, and half-closes to receive an `LpFeedAck`.
// Machine-to-machine only (no WS mirror): the composite it feeds is what GUI
// subscribers read over `StreamService.StreamSession`.
service LiquidityFeedService {
  // Push a stream of `LpQuote`s into the server's aggregated-book engines.
  rpc LpFeed(stream LpQuote) returns (LpFeedAck);
}

// ===========================================================================
// aggregated-book composite publish — the consolidated price a GUI subscriber
// reads for an aggregated book over the multiplexed `StreamService.StreamSession`
// (the SAME bidi stream the FX/rates lines use). A client opens the line with an
// `AggregatedBookSubscribe` and receives a baseline `AggregatedBookStreamSnapshot`
// then `AggregatedBookStreamUpdate`s as the members' quotes evolve. Additive
// (rule 9): new oneof arms + new messages; no existing field is touched.
// ===========================================================================

// One inbound member's contribution to an instrument's composite: the member's
// own two-way, and whether it was excluded from the consolidated best price
// (aged out past the book's max quote age, or gated as a divergent outlier).
message LpContribution {
  // The contributing LP connection name (the consolidation `VenueId`).
  string lp_name = 1;
  // The member's own bid for this instrument.
  double bid = 2;
  // The member's own offer for this instrument.
  double offer = 3;
  // Whether the member was excluded from the consolidated best bid/offer (stale
  // past the book's max age, or gated as a divergent outlier) — a subscriber greys
  // a contributor that is not currently setting the composite.
  bool stale = 4;
}

// The consolidated composite for one instrument in an aggregated book: the best
// bid/offer + firm size across the fresh members, a confidence measure, and the
// per-member contribution report. Identity fields (`display_name`/`isin`/`cusip`)
// are resolved from the server's instrument reference-data registry, best-effort
// (empty when the `instrument_id` is not in the registry).
message AggregatedInstrument {
  // The canonical server `instrument_id` (the composite line's identity key).
  string instrument_id = 1;
  // Human-friendly label from reference data (empty if unresolved).
  string display_name = 2;
  // ISO 6166 ISIN from reference data (empty if unresolved).
  string isin = 3;
  // CUSIP from reference data (empty if unresolved).
  string cusip = 4;
  // Consolidated best bid — the max fresh member bid.
  double best_bid = 5;
  // Consolidated best offer — the min fresh member offer.
  double best_offer = 6;
  // Firm size stacked at the consolidated best bid.
  double bid_size = 7;
  // Firm size stacked at the consolidated best offer.
  double offer_size = 8;
  // Confidence in the composite, `∈ [0, 1]` (coverage · freshness · agreement).
  double confidence = 9;
  // The per-member contribution / exclusion report, one entry per member that has
  // quoted this instrument (member id order).
  repeated LpContribution contributions = 10;
}

// The full composite state of an aggregated book at a sequence point: the priced
// composite for every in-scope instrument that currently meets the book's quorum.
message AggregatedBookSnapshot {
  // The aggregated-book id this composite is for.
  string book_id = 1;
  // The composite for each in-scope instrument, in `instrument_id` order.
  repeated AggregatedInstrument instruments = 2;
}

// Open an aggregated-book composite line within the multiplexed session, keyed by
// a client-assigned `SubscriptionId` (the SAME id space as the FX price / market
// series / rates lines). The server emits a baseline `AggregatedBookStreamSnapshot`
// then `AggregatedBookStreamUpdate`s as the book's members re-quote.
message AggregatedBookSubscribe {
  // The client-assigned subscription id this composite line is keyed on.
  SubscriptionId subscription = 1;
  // The aggregated-book id to stream the composite of.
  string book_id = 2;
  // A client throttle hint: minimum nanoseconds between updates (the server
  // conflates to honour it). 0 = no throttling.
  uint64 throttle_nanos = 3;
  // Optional caller correlation id, echoed on the baseline snapshot.
  optional uint64 correlation_id = 4;
}

// Close an aggregated-book composite line (the rest of the session is unaffected).
message AggregatedBookUnsubscribe {
  // The composite subscription to tear down.
  SubscriptionId subscription = 1;
}

// The baseline composite state of a subscribed aggregated book at a sequence point
// — the full `AggregatedBookSnapshot` a consumer applies whole before consuming
// deltas.
message AggregatedBookStreamSnapshot {
  // The subscription this snapshot answers.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number of this snapshot (1).
  uint64 sequence = 2;
  // The full composite state at this snapshot.
  AggregatedBookSnapshot book = 3;
  // Echo of the opening `AggregatedBookSubscribe.correlation_id`, if one was
  // supplied (presence-tracked). Absent ⇒ none.
  optional uint64 correlation_id = 4;
  // Snapshot time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 5;
}

// A sequenced delta on a subscribed aggregated book: the full re-consolidated
// composite at the next sequence. A gap in `sequence` signals loss and prompts a
// `Resync`.
message AggregatedBookStreamUpdate {
  // The subscription this update advances.
  SubscriptionId subscription = 1;
  // The monotonic per-subscription sequence number (snapshot seq + n).
  uint64 sequence = 2;
  // The re-consolidated composite at this sequence.
  AggregatedBookSnapshot book = 3;
  // Update time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 4;
}

// ===========================================================================
// instrument reference data — the persisted, admin-managed registry of
// instrument DEFINITIONS (static / reference data) that curve-building and
// pricing later resolve against
// (`docs/CURVES-AND-INSTRUMENT-REFERENCE-DATA-REVIEW.md` §C). Each definition is
// keyed by a stable internal `instrument_id` slug, carries external-identifier
// cross-refs, and exactly one family-specific convention block. This phase is
// the REGISTRY + CRUD only — no curve/pricing rewiring (that is the next,
// separate task). Convention labels reuse the engine vocabularies so the
// registry can never drift from what the engine can resolve: `day_count` is a
// `celnet_rates::AccrualBasis` label (`act_360` / `act_365_fixed` /
// `thirty_360_bond_basis`, plus `act_act` for bonds), `business_day_convention`
// a `celnet_calendar::RollRule` label (`unadjusted` / `following` / `preceding`
// / `modified_following`), each `calendars` entry a `celnet_calendar::CentreId`
// label (e.g. `united_states`, `target2`), and a leg `*_frequency` a
// `celnet_rates::PaymentFrequency` label (`annual` / `semi_annual` /
// `quarterly`). Market quotes are NOT static and are never stored here.
// ===========================================================================

// One external-identifier cross-reference for an instrument: a `(scheme, value)`
// pair, e.g. `(isin, "US912828YL83")`. `scheme` is one of the canonical
// snake_case tokens `isin`, `cusip`, `sedol`, `figi`, `ticker`, `internal`; an
// unknown token is rejected at the boundary, never silently dropped. The
// `(scheme, value)` pair is unique across the whole registry.
message ExternalId {
  // The identifier scheme token (`isin`/`cusip`/`sedol`/`figi`/`ticker`/`internal`).
  string scheme = 1;
  // The identifier value under that scheme (verbatim).
  string value = 2;
}

// Rates — a cash money-market DEPOSIT definition (the conventional front pillar
// of a curve build). The market deposit rate is a quote, not static, so it is
// not carried here.
message DepositDef {
  // The reference overnight/term index token (e.g. `sofr`); required.
  string index = 1;
  // The deposit tenor token (e.g. `ON`, `TN`, `1W`, `1M`, `3M`), or an explicit
  // broken-date maturity expressed as a token; required.
  string tenor = 2;
  // Accrual day-count label (`act_360` typical for USD money market); required.
  string day_count = 3;
  // Business-day convention label (`modified_following` typical); required.
  string business_day_convention = 4;
  // Settlement calendar centre labels (at least one; e.g. `united_states`).
  repeated string calendars = 5;
  // Spot/settlement lag in business days (T+2 typical; T+0 for SOFR-style).
  uint32 spot_lag_days = 6;
}

// Rates — a forward rate agreement (FRA) definition: a single-period `[T1,T2]`
// forward window on a projected float index. The contractual/market FRA rate is
// a quote and is not stored here.
message FraDef {
  // The projected float index token (e.g. `sofr`, `term_sofr_3m`); required.
  string float_index = 1;
  // The window start / fixing tenor token (e.g. `3M`) or broken-date token; required.
  string start_tenor = 2;
  // The window end / maturity tenor token (e.g. `6M`) or broken-date token; required.
  string end_tenor = 3;
  // Accrual day-count label for the `tau` basis (`act_360` typical); required.
  string accrual_day_count = 4;
  // Business-day convention label; required.
  string business_day_convention = 5;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 6;
  // Spot/settlement lag in business days.
  uint32 spot_lag_days = 7;
}

// Rates — a short-term-interest-rate (STIR) futures contract definition. The
// price/futures-rate is a quote and is not stored here; the convexity vol is a
// debias parameter (0 ⇒ no adjustment).
message StirFutureDef {
  // The listed contract code (e.g. `SR3H6`); required.
  string contract_code = 1;
  // The fixing-window start tenor/date token; required.
  string reference_start = 2;
  // The fixing-window end tenor/date token; required.
  string reference_end = 3;
  // Accrual day-count label (`act_360` typical); required.
  string day_count = 4;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 5;
  // The convexity-adjustment volatility (σ) used to debias the futures rate; 0 ⇒
  // no adjustment. Carried with the definition for the future hedge/curve phase.
  double convexity_vol = 6;
  // The contract notional/size in the currency (0 ⇒ unspecified); for the future
  // DV01→hedge-count math. Optional.
  double contract_size = 7;
}

// Rates — a vanilla fixed-vs-float interest-rate swap (IRS) definition with its
// full per-leg convention block. The par/fixed rate is a quote, not stored here.
message VanillaIrsDef {
  // The swap tenor token (e.g. `5Y`) or broken-date maturity token; required.
  string tenor = 1;
  // Fixed-leg payment frequency label (`annual`/`semi_annual`/`quarterly`); required.
  string fixed_frequency = 2;
  // Fixed-leg accrual day-count label (`thirty_360_bond_basis` for USD); required.
  string fixed_day_count = 3;
  // The float-leg projected index token (e.g. `sofr`, `term_sofr_3m`); required.
  string float_index = 4;
  // Float-leg payment frequency label; required.
  string float_frequency = 5;
  // Float-leg accrual day-count label (`act_360` typical); required.
  string float_day_count = 6;
  // Business-day convention label; required.
  string business_day_convention = 7;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 8;
  // Period-generation roll convention token (`eom`/`imm`/`none`); optional, blank ⇒ `none`.
  string roll_convention = 9;
  // Spot/settlement lag in business days.
  uint32 spot_lag_days = 10;
}

// Rates — an overnight-indexed swap (OIS) definition: fixed vs compounded
// overnight float on a single self-discounting curve. The par fixed rate is a
// quote, not stored here.
message OisDef {
  // The swap tenor token (e.g. `2Y`) or broken-date maturity token; required.
  string tenor = 1;
  // The overnight index token (e.g. `sofr`); required.
  string index = 2;
  // Fixed-leg payment frequency label (`annual` typical for USD-SOFR); required.
  string fixed_frequency = 3;
  // Fixed-leg accrual day-count label (`act_360` for USD-SOFR); required.
  string fixed_day_count = 4;
  // Float (compounded-ON) leg accrual day-count label (`act_360`); required.
  string float_day_count = 5;
  // Business-day convention label; required.
  string business_day_convention = 6;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 7;
  // Spot/settlement lag in business days.
  uint32 spot_lag_days = 8;
}

// A cash-bond DEFINITION (no bond pricer yet — this feeds the future bond
// pricing path and the FI deal blotter, `docs/FI-BOND-DEAL-CAPTURE-GAP-ANALYSIS.md`).
// ISIN/CUSIP live in the instrument's `external_ids`; the redemption/face and
// dates live here. `coupon_frequency` is blank for a zero-coupon bond.
message BondDef {
  // The issuer name (or LEI), e.g. `US Treasury`; required.
  string issuer = 1;
  // The annual coupon rate as a decimal (0.05 = 5%); 0 for zeros/FRNs.
  double coupon_rate = 2;
  // The coupon type token (`fixed`/`frn`/`zero`); required.
  string coupon_type = 3;
  // Coupon payment frequency label (`annual`/`semi_annual`/`quarterly`); blank for `zero`.
  string coupon_frequency = 4;
  // Accrual day-count label (`act_act`/`thirty_360_bond_basis`/`act_365_fixed`); required.
  string day_count = 5;
  // The issue date; optional.
  optional BrokenDate issue_date = 6;
  // The dated (interest-accrual-start) date; optional.
  optional BrokenDate dated_date = 7;
  // The first-coupon date (drives a short/long stub); optional.
  optional BrokenDate first_coupon_date = 8;
  // The maturity (final-redemption) date; required.
  BrokenDate maturity_date = 9;
  // The par redemption / face value (e.g. 100); required, strictly positive.
  double redemption = 10;
  // Settlement calendar centre labels (at least one).
  repeated string calendars = 11;
}

// One instrument definition in the reference-data registry: the common header
// (`instrument_id` key, human `name`/`description`, `currency`, external-id
// cross-refs) plus exactly one family-specific convention block.
message InstrumentDefDesc {
  // The stable internal id (a slug); the registry key. Unique across the registry.
  string instrument_id = 1;
  // Human-friendly label for blotters/GUI.
  string name = 2;
  // Optional longer human description.
  string description = 3;
  // ISO 4217 pricing/settlement currency.
  string currency = 4;
  // External-identifier cross-refs (ISIN/CUSIP/SEDOL/FIGI/ticker/internal); each
  // `(scheme, value)` pair is unique across the whole registry.
  repeated ExternalId external_ids = 5;
  // The family-specific convention block: exactly one variant is set.
  oneof definition {
    // A cash money-market deposit.
    DepositDef deposit = 6;
    // A forward rate agreement.
    FraDef fra = 7;
    // A STIR futures contract.
    StirFutureDef stir_future = 8;
    // A vanilla fixed-vs-float IRS.
    VanillaIrsDef vanilla_irs = 9;
    // An overnight-indexed swap.
    OisDef ois = 10;
    // A cash bond.
    BondDef bond = 11;
  }
}

// List the instrument definitions in the registry (any authenticated caller —
// curve-building and pricing read this, so it is NOT admin-only).
message ListInstrumentsRequest {
  // The caller's bearer token (must resolve to an authenticated user).
  string session_token = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}
// The instrument definitions, in creation order.
message ListInstrumentsResponse {
  // Every registered instrument definition.
  repeated InstrumentDefDesc instruments = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Resolve a single instrument definition by its internal id (any authenticated
// caller).
message GetInstrumentRequest {
  // The caller's bearer token (must resolve to an authenticated user).
  string session_token = 1;
  // The internal `instrument_id` to resolve.
  string instrument_id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The resolved instrument definition.
message GetInstrumentResponse {
  // The resolved definition (absent ⇒ no instrument with that id).
  InstrumentDefDesc instrument = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Create an instrument definition (admin only). A blank `instrument_id` is minted
// from the `name`; a provided id must be unique.
message CreateInstrumentRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The definition to create (its `instrument_id` may be blank to auto-mint).
  InstrumentDefDesc instrument = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The created definition (with its minted/validated id).
message CreateInstrumentResponse {
  // The stored definition.
  InstrumentDefDesc instrument = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace an existing instrument definition by its id (admin only).
message UpdateInstrumentRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The definition to store; its `instrument_id` selects the existing record.
  InstrumentDefDesc instrument = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// The updated definition.
message UpdateInstrumentResponse {
  // The stored definition.
  InstrumentDefDesc instrument = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Delete an instrument definition by its id (admin only).
message DeleteInstrumentRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The internal `instrument_id` to delete.
  string instrument_id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// Delete acknowledgement.
message DeleteInstrumentResponse {
  // Whether an instrument was removed.
  bool removed = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// One capability on the wire: an action label crossed with an asset-class label.
// The labels are the entitlement kernel's canonical snake_case tokens (e.g.
// `execute` × `fixed_income`); they round-trip exactly and an unknown token is
// rejected, never silently dropped. This is the admin-overlay encoding — not the
// authorization decision, which the server still makes from the resolved set.
message CapabilityDesc {
  // The action label: one of `view`, `price`, `quote_respond`, `rfq_respond`,
  // `ioi_respond`, `stream`, `execute`, `book`, `administer`.
  string action = 1;
  // The asset-class label: `fx_options` or `fixed_income`.
  string asset = 2;
}

// Read a user's capability overlay and resolved effective set (admin only).
message GetUserCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user whose capabilities are read.
  string id = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// A user's per-user overlay plus the fully-resolved decision surface.
message GetUserCapabilitiesResponse {
  // The per-user grants that widen authority beyond the role bundle.
  repeated CapabilityDesc grants = 1;
  // The per-user denies that narrow it (deny wins over any grant).
  repeated CapabilityDesc denies = 2;
  // The set the access boundary actually admits — role bundle ∪ grants ∖ denies,
  // enumerated over every action × asset. This is what a GUI gates affordances on.
  repeated CapabilityDesc effective = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// Replace a user's capability overlay (admin only). `grants`/`denies` are the full
// new overlay (not a delta); the change persists and revokes the target's live
// sessions so it takes effect on their next request.
message SetUserCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The id of the user whose overlay is replaced.
  string id = 2;
  // The new grants (widen beyond the role bundle).
  repeated CapabilityDesc grants = 3;
  // The new denies (narrow it; deny wins).
  repeated CapabilityDesc denies = 4;
  // Echoed request correlation id.
  optional uint64 correlation_id = 5;
}
// The overlay after the update, plus the resolved effective set (an admin
// read-back: it shows exactly what the change now admits).
message SetUserCapabilitiesResponse {
  // The grants now in effect.
  repeated CapabilityDesc grants = 1;
  // The denies now in effect.
  repeated CapabilityDesc denies = 2;
  // The fully-resolved effective set after the change.
  repeated CapabilityDesc effective = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}

// Read a role's capability bundle — the base authority the role confers before
// any per-user overlay (admin only).
message GetRoleCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The role whose bundle is read.
  UserRole role = 2;
  // Echoed request correlation id.
  optional uint64 correlation_id = 3;
}
// A role's resolved capability bundle.
message GetRoleCapabilitiesResponse {
  // The capabilities the role confers as its base. For ADMIN this is the full
  // action × asset surface (grant-all, immutable); for a non-admin role it is the
  // admin-editable bundle, defaulting to every action but `administer` on both
  // asset classes when none has been stored.
  repeated CapabilityDesc capabilities = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// Replace a role's capability bundle (admin only). `capabilities` is the full new
// bundle (not a delta); the change persists and revokes the live sessions of every
// user holding the role so it takes effect on their next login. The ADMIN role is
// grant-all and immutable — setting it is rejected with `failed_precondition`.
message SetRoleCapabilitiesRequest {
  // The caller's bearer token (must resolve to an admin).
  string session_token = 1;
  // The non-admin role whose bundle is replaced.
  UserRole role = 2;
  // The new base capability bundle for the role.
  repeated CapabilityDesc capabilities = 3;
  // Echoed request correlation id.
  optional uint64 correlation_id = 4;
}
// The role's bundle after the update (an admin read-back).
message SetRoleCapabilitiesResponse {
  // The capabilities now in effect as the role's base.
  repeated CapabilityDesc capabilities = 1;
  // Echoed request correlation id.
  optional uint64 correlation_id = 2;
}

// One calibrating quote for a `BuildCurve` request: a reference-data instrument id
// paired with its observed market quote. The id resolves against the instrument
// registry (the same roster `ListInstruments` serves); the quote is the
// instrument's calibration observable in decimal terms — a deposit/FRA/par-swap
// fixed rate, or a STIR future's `(100 - price) / 100` futures rate per its def.
message InstrumentQuote {
  // The registry instrument id to resolve (e.g. `usd-irs-10y`).
  string instrument_id = 1;
  // The observed calibrating quote as a decimal (0.0405 = 4.05%).
  double quote = 2;
}

// A standalone date-anchored calibration pillar: a synthetic money-market cash
// deposit running from the curve's reference (spot) date to an explicit maturity
// date, quoted as its simple ACT/360 rate. Lets a trader pin the curve to an
// arbitrary date (a turn, an IMM, a central-bank meeting) without a registry
// instrument that happens to mature there. The server resolves it to the same
// closed-form deposit pillar (DF = 1/(1 + r*tau)) the bootstrap already consumes.
message DatePillar {
  // The pillar maturity date the synthetic deposit runs to (after the reference date).
  BrokenDate maturity_date = 1;
  // The observed simple ACT/360 rate to that date as a decimal (0.0415 = 4.15%).
  double quote = 2;
}

// A request to bootstrap a single-currency discount curve from registry-referenced
// instruments. The server resolves each pillar id against the reference-data
// registry, rebuilds its schedule from the reference date, and runs the sequential
// (acyclic) bootstrap. Pillars may arrive in any order — the server orders them by
// resolved maturity. At least one pillar is required.
message BuildCurveRequest {
  // Caller-supplied correlation token, echoed back on the result.
  string request_id = 1;
  // ISO 4217 currency of the curve (the set must be single-currency).
  string currency = 2;
  // The curve reference (spot-anchor / value) date the pillar schedules roll from.
  BrokenDate reference_date = 3;
  // The calibrating instrument quotes; maturity order not required. At least one
  // calibrating pillar (instrument-referenced or date-anchored) must be supplied.
  repeated InstrumentQuote pillars = 4;
  // Session token of the authenticated caller (any authenticated caller may build).
  string session_token = 5;
  // Standalone date-anchored pillars, calibrated alongside the instrument pillars.
  repeated DatePillar date_pillars = 6;
}

// One bootstrapped pillar of a `CalibratedCurve`: the resolved curve coordinate and
// discount factor at one calibrating instrument's maturity.
message CalibratedCurvePoint {
  // The input instrument id this pillar calibrates; empty for a date-anchored pillar.
  string instrument_id = 1;
  // The pillar maturity on the ACT/365F curve year-fraction axis.
  double time_years = 2;
  // The bootstrapped discount factor at `time_years`.
  double discount_factor = 3;
  // The continuously-compounded zero rate at `time_years` (decimal).
  double zero_rate = 4;
  // A display label for the pillar: the date-anchored pillar's `Date YYYY-MM-DD`,
  // or empty for an instrument pillar (the client resolves its name by id).
  string label = 5;
}

// A bootstrapped discount curve: the calibrated pillar points (one per input
// instrument, ordered short to long by maturity) plus the echoed request header.
message CalibratedCurve {
  // Echoed `BuildCurveRequest.request_id`.
  string request_id = 1;
  // ISO 4217 currency of the curve.
  string currency = 2;
  // The curve reference (spot-anchor) date, echoed from the request.
  BrokenDate reference_date = 3;
  // The bootstrapped pillars, ordered short to long by maturity.
  repeated CalibratedCurvePoint points = 4;
}

// Server-enforced authentication + user/desk administration. Login mints a bearer
// token the server validates on every subsequent RPC; administrative RPCs require
// the resolved identity to be an admin. Accounts persist to disk and a default
// admin is seeded on first run.
service AuthService {
  // Exchange email + password for a session token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Invalidate the caller's session token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // List all users (admin only).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Create a user (admin only).
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Update a user's profile/role/desk/disabled flag (admin only).
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Delete a user (admin only).
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Set a user's password (admin only).
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Read a user's capability overlay + resolved effective set (admin only).
  rpc GetUserCapabilities(GetUserCapabilitiesRequest) returns (GetUserCapabilitiesResponse);
  // Replace a user's capability overlay (admin only).
  rpc SetUserCapabilities(SetUserCapabilitiesRequest) returns (SetUserCapabilitiesResponse);
  // Read a role's capability bundle — its base authority (admin only).
  rpc GetRoleCapabilities(GetRoleCapabilitiesRequest) returns (GetRoleCapabilitiesResponse);
  // Replace a non-admin role's capability bundle (admin only).
  rpc SetRoleCapabilities(SetRoleCapabilitiesRequest) returns (SetRoleCapabilitiesResponse);
  // List all desks (admin only).
  rpc ListDesks(ListDesksRequest) returns (ListDesksResponse);
  // Create a desk (admin only).
  rpc CreateDesk(CreateDeskRequest) returns (CreateDeskResponse);
  // Rename a desk's display name (admin only); routing keys on the immutable id.
  rpc UpdateDesk(UpdateDeskRequest) returns (UpdateDeskResponse);
  // Delete a desk (admin only).
  rpc DeleteDesk(DeleteDeskRequest) returns (DeleteDeskResponse);
  // List the named legal entities / accounts (any authenticated caller — the rates
  // booking form reads this to offer named entity choices, so it is NOT admin-only).
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  // Create a named legal entity / account (admin only).
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);
  // Update a named legal entity / account (admin only).
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  // Delete a named legal entity / account (admin only). Rejected while any book
  // still references it.
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);
  // List the named netting books (any authenticated caller — the rates booking form
  // reads this to offer named book choices, so it is NOT admin-only).
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  // Create a named netting book under an entity (admin only).
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
  // Update a named netting book (admin only).
  rpc UpdateBook(UpdateBookRequest) returns (UpdateBookResponse);
  // Delete a named netting book (admin only).
  rpc DeleteBook(DeleteBookRequest) returns (DeleteBookResponse);
  // List the aggregated books (any authenticated caller — a book's composite is
  // global and readable by any user, so this is NOT admin-only).
  rpc ListAggregatedBooks(ListAggregatedBooksRequest) returns (ListAggregatedBooksResponse);
  // Define a new aggregated book (admin only).
  rpc CreateAggregatedBook(CreateAggregatedBookRequest) returns (CreateAggregatedBookResponse);
  // Replace an existing aggregated book's definition (admin only).
  rpc UpdateAggregatedBook(UpdateAggregatedBookRequest) returns (UpdateAggregatedBookResponse);
  // Delete an aggregated book (admin only).
  rpc DeleteAggregatedBook(DeleteAggregatedBookRequest) returns (DeleteAggregatedBookResponse);
  // List the instrument reference-data definitions (any authenticated caller —
  // curve-building and pricing resolve against this, so it is NOT admin-only).
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
  // Resolve one instrument definition by its internal id (any authenticated caller).
  rpc GetInstrument(GetInstrumentRequest) returns (GetInstrumentResponse);
  // Create an instrument definition (admin only).
  rpc CreateInstrument(CreateInstrumentRequest) returns (CreateInstrumentResponse);
  // Replace an instrument definition (admin only).
  rpc UpdateInstrument(UpdateInstrumentRequest) returns (UpdateInstrumentResponse);
  // Delete an instrument definition (admin only).
  rpc DeleteInstrument(DeleteInstrumentRequest) returns (DeleteInstrumentResponse);
  // Bootstrap a single-currency discount curve from registry-referenced instruments.
  rpc BuildCurve(BuildCurveRequest) returns (CalibratedCurve);
}

// ===========================================================================
// rates — linear interest-rate term structure & instruments (fixed income)
// ===========================================================================
//
// The fixed-income linear-rates arm (`docs/fixed-income/FI-ARCHITECTURE.md`),
// backed by the `celnet-rates` engine. A `CurveSet` is the calibrated rates
// market a `RatesInstrument` prices against: for the USD-SOFR P0 it is the single
// self-discounting SOFR OIS curve, defined by its dated par-OIS pillars so the
// server bootstraps it deterministically (sequential, acyclic) and any client
// reproduces byte-identical discount factors. The contract is additive (rule 9):
// new instrument arms and curve kinds extend the oneofs at the next free field
// number, never renumbering, and no arm appears on the wire before it can be
// priced end-to-end (no placeholder arms).

// The maturity point of a curve pillar, measured from the `CurveSet` reference
// (spot-anchor) date. Exactly one arm is set:
//
// * `years`: a regular whole-year tenor (e.g. 1, 2, 5, 10) on the canonical liquid grid; must be >= 1.
// * `months`: a month tenor (e.g. 3, 18, 30) for sub-year or broken (non-integer-year) pillars; must be >= 1.
// * `maturity_date`: an explicit odd-dated ("broken date") maturity — the civil YYYY-MM-DD the final period rolls to (e.g. an IMM or turn date that no whole tenor names).
//
// The server resolves the arm to a roll-adjusted maturity date and rebuilds the
// pillar's USD-SOFR fixed-leg schedule from it, so only the economic locator
// travels on the wire. A whole-year `years = n` and the equivalent dated arm
// resolve to byte-identical schedules.
message PillarTenor {
  // The maturity locator: exactly one arm is set.
  oneof point {
    // A regular whole-year tenor from spot (e.g. 1, 2, 5, 10); must be >= 1.
    uint32 years = 1;
    // A month tenor from spot (e.g. 3, 18, 30) for sub-/broken-year pillars; >= 1.
    uint32 months = 2;
    // An explicit odd-dated ("broken date") maturity the final period rolls to.
    BrokenDate maturity_date = 3;
  }
}

// One calibrating pillar of a self-discounting OIS curve: the observed par (fair
// fixed) rate of the spot-starting USD-SOFR OIS maturing at the given pillar
// point. The pillar's schedule (modified-following US calendar, ACT/360 accrual,
// ACT/365F discount time) is reconstructed server-side from the `CurveSet`
// reference date and this tenor, so only the economic quote travels on the wire.
message OisPillar {
  // Where this pillar matures — a whole-year tenor, a month tenor, or an
  // explicit broken-date maturity. See `PillarTenor`.
  PillarTenor tenor = 1;
  // The observed par (fair fixed) rate as a decimal (0.0405 = 4.05%).
  double par_rate = 2;
}

// A calibrated set of interest-rate curves — the rates market an instrument is
// priced against. For USD-SOFR (the P0 arm) this is exactly one self-discounting
// SOFR curve, carried as its dated par-OIS pillars plus the reference
// (spot-anchor) date; the server bootstraps the discount/forward term structure
// from them. Additive: a multi-curve (basis) generalisation adds further pillar
// sets at the next free field numbers without reshaping this message.
message CurveSet {
  // ISO 4217 currency of the curve (USD for the P0 arm). Carried for forward
  // generalisation; a non-USD curve is rejected until the multi-currency arm
  // ships (never silently mispriced).
  string currency = 1;
  // The curve reference (spot-anchor) civil date the pillar schedules roll from.
  BrokenDate reference_date = 2;
  // The self-discounting OIS pillars, in strictly increasing tenor order. At
  // least one pillar is required; duplicate or out-of-order tenors are rejected.
  repeated OisPillar ois_pillars = 3;
}

// An overnight-indexed swap (OIS) — fixed vs compounded overnight floating, on a
// single self-discounting curve. The schedule is the spot-starting USD-SOFR
// schedule of `tenor_years`, reconstructed server-side from the `CurveSet`
// reference date. `side` is taken from the client's perspective: SIDE_BUY pays
// fixed (payer swap, long the floating leg); SIDE_SELL receives fixed.
message OisInstrument {
  // The swap tenor in whole years from spot (e.g. 2, 5, 10). Must be >= 1.
  uint32 tenor_years = 1;
  // The fixed-leg rate as a decimal (0.041 = 4.10%).
  double fixed_rate = 2;
  // The notional in the curve currency (always positive; direction is `side`).
  double notional = 3;
  // SIDE_BUY = pay fixed (payer); SIDE_SELL = receive fixed. SIDE_TWO_WAY is
  // rejected for an outright price request (use the quote/stream surface for a
  // two-way market).
  Side side = 4;
}

// Coupon / leg payment frequency for a linear-rates product (an IRS leg schedule
// or a bond coupon schedule): the number of coupon periods per year the schedule
// rolls at. proto3 zero default is annual.
enum PaymentFrequency {
  // One coupon per year.
  PAYMENT_FREQUENCY_ANNUAL = 0;
  // Two coupons per year (every 6 months).
  PAYMENT_FREQUENCY_SEMI_ANNUAL = 1;
  // Four coupons per year (every 3 months).
  PAYMENT_FREQUENCY_QUARTERLY = 2;
}

// Accrual day-count basis a linear-rates leg turns an accrual period into a year
// fraction on — the instrument-level superset of `DayCount` that additionally
// carries 30/360 Bond Basis (the standard USD fixed-bond / fixed-swap basis). Kept
// distinct from `DayCount` (the curve/vol time axis, which is never measured
// 30/360). proto3 zero default is ACT/360, the money-market default.
enum AccrualBasis {
  // Actual/360 — USD/EUR money-market accrual (the linear-book default).
  ACCRUAL_BASIS_ACT_360 = 0;
  // Actual/365 fixed.
  ACCRUAL_BASIS_ACT_365_FIXED = 1;
  // 30/360 Bond Basis (ISDA 2006 4.16(f)) — the standard USD fixed-bond/swap basis.
  ACCRUAL_BASIS_THIRTY_360_BOND_BASIS = 2;
}

// A vanilla fixed-vs-float interest-rate swap (IRS) to price: a fixed leg vs a
// projected floating leg on the single self-discounting curve. Both legs are the
// spot-starting schedules of `tenor_years`, reconstructed server-side from the
// `CurveSet` reference date, each at its own payment frequency and accrual basis
// (so the standard "semi-annual fixed vs quarterly float" shape is expressible).
// The PV is `N * (K * A_fixed - F_float)` (receive-fixed); `side` is from the
// client's perspective: SIDE_SELL receives fixed, SIDE_BUY pays fixed.
// SIDE_TWO_WAY is rejected for an outright price.
message VanillaIrsInstrument {
  // The swap tenor in whole years from spot (e.g. 2, 5, 10). Must be >= 1.
  uint32 tenor_years = 1;
  // The fixed-leg rate as a decimal (0.041 = 4.10%).
  double fixed_rate = 2;
  // The notional in the curve currency (always positive; direction is `side`).
  double notional = 3;
  // SIDE_BUY = pay fixed (payer); SIDE_SELL = receive fixed. SIDE_TWO_WAY rejected.
  Side side = 4;
  // Fixed-leg payment frequency (USD market: semi-annual).
  PaymentFrequency fixed_frequency = 5;
  // Fixed-leg accrual day-count (ACT/365F or ACT/360; the market 30/360 fixed leg
  // awaits the shared curve-time day-count extension and is not offered here yet).
  DayCount fixed_day_count = 6;
  // Float-leg payment frequency (USD market: quarterly).
  PaymentFrequency float_frequency = 7;
  // Float-leg accrual day-count (ACT/360 typical for USD).
  DayCount float_day_count = 8;
}

// A forward rate agreement (FRA) to price: a single accrual window on the
// projected float index, from `start_months` to `end_months` after spot (a 3x6
// FRA is start_months = 3, end_months = 6). Both are reconstructed server-side to
// roll-adjusted dates from the `CurveSet` reference date; the contractual accrual
// fraction tau uses `accrual_basis`. The PV is the single-period swaplet
// `N * (K * tau * DF(end) - (DF(start) - DF(end)))` (receive-fixed); `side`:
// SIDE_SELL receives fixed, SIDE_BUY pays fixed. SIDE_TWO_WAY is rejected.
message FraInstrument {
  // The window start (fixing) tenor in months from spot (e.g. 3). Must be < end.
  uint32 start_months = 1;
  // The window end (maturity) tenor in months from spot (e.g. 6). Must be > start.
  uint32 end_months = 2;
  // The contractual fixed rate K as a decimal (0.033 = 3.30%).
  double fixed_rate = 3;
  // The notional in the curve currency (always positive; direction is `side`).
  double notional = 4;
  // SIDE_BUY = pay fixed; SIDE_SELL = receive fixed. SIDE_TWO_WAY rejected.
  Side side = 5;
  // The accrual day-count basis for tau (ACT/360 typical; 30/360 supported).
  AccrualBasis accrual_basis = 6;
}

// A fixed-coupon cash bond to price off the calibrated curve: PV each cashflow at
// the bootstrapped discount curve (dirty price) and report the implied yield-risk
// set. Settlement is the `CurveSet` reference (spot-anchor) date; the coupon
// schedule is the regular month-step dates rolled back from `maturity_date` at
// `coupon_frequency`. `side` is the position direction: SIDE_BUY = long (a bought
// bond, positive PV), SIDE_SELL = short (negative PV). SIDE_TWO_WAY is rejected.
message BondInstrument {
  // The annual coupon rate as a decimal (0.06 = 6%); 0 for a zero-coupon bond.
  double coupon_rate = 1;
  // The coupon payment frequency (also the yield compounding basis).
  PaymentFrequency coupon_frequency = 2;
  // The accrual day-count basis for accrued interest (ACT/365F / ACT/360 / 30/360).
  AccrualBasis day_count = 3;
  // The maturity (final-redemption) date; must be strictly after settlement.
  BrokenDate maturity_date = 4;
  // The par redemption / face value (e.g. 100); required, strictly positive.
  double redemption = 5;
  // SIDE_BUY = long (+PV); SIDE_SELL = short (-PV). SIDE_TWO_WAY rejected.
  Side side = 6;
}

// A linear interest-rate instrument to price: exactly one arm is set. The oneof
// grows additively (FRA, vanilla IRS, tenor/cross-ccy basis, STIR/bond futures)
// as each is backed end-to-end by the rates engine; no arm ships on the wire
// before it can be priced (rule 2 — narrow, never fake).
message RatesInstrument {
  // The instrument arm: exactly one variant is set.
  oneof instrument {
    // An overnight-indexed swap (the USD-SOFR P0 arm).
    OisInstrument ois = 1;
    // A vanilla fixed-vs-float interest-rate swap.
    VanillaIrsInstrument irs = 2;
    // A forward rate agreement.
    FraInstrument fra = 3;
    // A fixed-coupon cash bond priced off the curve.
    BondInstrument bond = 4;
  }
}

// The priced result for a linear-rates instrument: present value plus first-order
// risk. All measures are in the curve currency and already carry the instrument
// `side` sign (a payer and a receiver of the same swap report equal-and-opposite
// PV / PV01 / DV01 / ladder).
message RatesPricingResult {
  // Present value in the curve currency (sign per `side`).
  double pv = 1;
  // The par (fair fixed) rate of the instrument's schedule on the calibrated
  // curve, as a decimal — the breakeven fixed rate, independent of `side`.
  double par_rate = 2;
  // Analytic PV01: the PV change per 1bp move in the instrument's own fixed rate
  // (the fixed-leg annuity in bp), signed per `side`.
  double pv01 = 3;
  // DV01: the PV change for a +1bp parallel bump of every calibrating curve
  // pillar (the curve delta), signed per `side`.
  double dv01 = 4;
  // The key-rate (bucketed) DV01 ladder: one entry per `CurveSet` pillar, in
  // pillar order, each the PV change for a +1bp bump of that pillar alone. Sums
  // to `dv01` to first order (the residual is curve cross-gamma).
  repeated double key_rate_ladder = 5;
  // The executable two-way struck around the indicative fair level (`par_rate`
  // for a swap/FRA, the clean price for a cash bond). Populated ONLY on the
  // streaming path (`RatesStreamSnapshot`/`RatesStreamUpdate`), where the row is
  // a firm dealer market a taker can lift; left at proto3 zero on the one-shot
  // `PriceRates` result, which stays purely indicative. `bid <= fair <= offer`
  // and `bid < offer` whenever a two-way is present. In the same units as the
  // fair level: a decimal rate for OIS/IRS/FRA, a clean price per 100 face for a
  // bond. Half-spread model: see `rates_pricing::stream_spread`.
  double bid = 6;
  // The offer side of the streamed two-way (see `bid`).
  double offer = 7;
  // The available notional (in the instrument's own currency face) firm on the
  // BID side of the streamed market — the size a taker can hit. Positive when a
  // two-way is present, proto3 zero on the indicative one-shot path.
  double bid_size = 8;
  // The available notional firm on the OFFER side of the streamed market — the
  // size a taker can lift (see `bid_size`).
  double offer_size = 9;
}

// Request: price one `RatesInstrument` against one `CurveSet`. The linear-rates
// analogue of `PriceRequest`.
message RatesPriceRequest {
  // Opaque client correlation id, echoed in `RatesPriceResponse.request_id`.
  uint64 request_id = 1;
  // The calibrated curve set to price against.
  CurveSet curve_set = 2;
  // The instrument to price.
  RatesInstrument instrument = 3;
  // Optional caller correlation id, echoed verbatim on the response so a client
  // joins an asynchronous reply to its originating request. Absent => none.
  optional uint64 correlation_id = 4;
}

// Response: the priced rates result.
message RatesPriceResponse {
  // Correlates with `RatesPriceRequest.request_id`.
  uint64 request_id = 1;
  // The PV + PV01 / DV01 / key-rate-ladder result.
  RatesPricingResult result = 2;
  // Echo of the originating `RatesPriceRequest.correlation_id`, if supplied.
  optional uint64 correlation_id = 3;
}

// Request a tradeable two-way RFQ on a linear-rates (fixed-income) instrument —
// the fixed-income analogue of `QuoteRequest` (`QuoteService.RequestRatesQuote`).
// The taker supplies the calibrated `curve_set` and the `instrument` to quote; the
// maker prices the side-independent fair level (the par rate for an OIS/IRS/FRA,
// the clean price for a cash bond — the LANDED `price_rates` / `quote_bond` result)
// and returns a `RatesQuote` two-way struck around it. `notional` is the RFQ size
// the two-way is good for; `side` is the taker's directional intent, and selects
// the sign of the returned risk (a two-way request reports the receive-fixed /
// long magnitude). Additive (rule 9): the taker RFQ envelope over the existing FI
// pricing arm, no reshaping of `RatesInstrument` / `CurveSet`.
message RatesQuoteRequest {
  // Client-supplied idempotency/correlation token, echoed on the `RatesQuote`.
  string idempotency_key = 1;
  // The calibrated curve set the instrument prices against.
  CurveSet curve_set = 2;
  // The instrument to quote (OIS / vanilla IRS / FRA / cash bond).
  RatesInstrument instrument = 3;
  // The RFQ size the two-way is good for (curve currency, strictly positive).
  double notional = 4;
  // The taker's directional intent: SIDE_BUY (pay fixed / long bond), SIDE_SELL
  // (receive fixed / short bond), or SIDE_TWO_WAY to request a two-way market with
  // no firm direction. The returned two-way is always struck around the
  // side-independent fair level; `side` selects the sign of the returned risk (a
  // SIDE_TWO_WAY request reports the receive-fixed / long magnitude).
  Side side = 5;
  // Optional caller correlation id, echoed verbatim on the `RatesQuote`. A *data*
  // field selecting a correlation, never an API version (rule 9). Absent ⇒ none.
  optional uint64 correlation_id = 6;
}

// A tradeable two-way quote for a linear-rates instrument — the fixed-income
// analogue of `Quote`, returned for a `RatesQuoteRequest`. `price` is the two-way
// struck around the fair level: a RATE market (bid/offer around the par rate) for
// an OIS/IRS/FRA, a clean-PRICE market (bid/offer around the clean price per 100
// face) for a cash bond, so `(bid+offer)/2` is the fair level the FI pricing path
// computed (`result.par_rate` for an OIS/IRS/FRA; the clean price for a bond).
message RatesQuote {
  // Server-assigned stable, unguessable quote identifier (minted exactly like
  // `Quote.quote_id`).
  uint64 quote_id = 1;
  // Echo of the originating request's idempotency key.
  string idempotency_key = 2;
  // The two-way bid/offer: a rate market for an OIS/IRS/FRA, a clean-price market
  // for a cash bond. `(bid+offer)/2` is the side-independent fair level.
  TwoWayPrice price = 3;
  // The full linear-rates risk (PV, par rate, PV01, DV01, key-rate ladder) of the
  // quoted position at the requested `side`.
  RatesPricingResult result = 4;
  // The RFQ size the two-way is good for (curve currency), echoed from the request.
  double notional = 5;
  // Publication time, nanoseconds since the Unix epoch (UTC).
  int64 epoch_nanos = 6;
  // Quote validity deadline (last-look window), nanoseconds since the Unix epoch
  // (UTC). An accept after this instant is treated as expired.
  int64 valid_until_nanos = 7;
  // Echo of the originating `RatesQuoteRequest.correlation_id`, if one was supplied
  // (presence-tracked), so a client joins this reply to its request.
  optional uint64 correlation_id = 8;
}

// ===========================================================================
// XVA — valuation adjustments (CVA / DVA / FVA) over a synthetic netting set
// ===========================================================================
//
// Serves the `celnet-xva` engine (standard Basel III / ISDA SA-CVA
// discretization; Gregory, *The xVA Challenge* 2015; Brigo-Morini-Pallavicini
// 2013). Given a netting set of vanilla FX options, an exposure-simulation
// configuration, and the counterparty/own hazard-rate survival curves, the
// server evolves spot under risk-neutral GBM on a uniform exposure grid with
// scrambled-Sobol QMC, reprices and nets the set at each grid date to the
// expected positive/negative exposure profile (EPE/ENE), then aggregates the
// discrete unilateral CVA, symmetric DVA, and funding FVA. Synthetic netting
// sets only — the engine does not model live CSAs / collateral / margin or
// wrong-way risk (its honest boundary), so no collateral terms ride the wire.
// Additive (rule 9): a new `PricingService` RPC; no existing message is touched.

// One vanilla FX option in an XVA netting set (mirrors `celnet_xva::NettedTrade`):
// its option type, strike, expiry, flat pricing vol, and signed notional.
message XvaTrade {
  // Call or put.
  OptionType option_type = 1;
  // Strike (quote per 1 unit of base), > 0.
  double strike = 2;
  // Option expiry in years from valuation (t = 0), > 0.
  double expiry_years = 3;
  // Flat lognormal vol used for this trade's mark, > 0.
  double vol = 4;
  // Signed notional in base units (+ long / - short).
  double notional = 5;
}

// A hazard-rate survival curve (mirrors `celnet_xva::SurvivalCurve`). A flat
// curve `S(t) = exp(-λt)` is carried as an empty `pillar_times` with a single
// `hazard_rates` entry (the flat hazard λ). A piecewise-constant curve carries
// strictly-increasing positive `pillar_times` with an equal-length
// `hazard_rates`, each rate applying on `(pillar[i-1], pillar[i]]` and the last
// rate held flat past the final pillar (the standard market convention).
message XvaSurvivalCurve {
  // Strictly-increasing positive pillar times (years). Empty ⇒ a flat curve.
  repeated double pillar_times = 1;
  // Per-segment hazard rates (decimal, ≥ 0). Equal length to `pillar_times`, or
  // exactly one entry when `pillar_times` is empty (the flat hazard).
  repeated double hazard_rates = 2;
}

// Request: compute the CVA / DVA / FVA of a synthetic netting set. The server
// simulates the expected-exposure profile out to the set's horizon (`paths`
// low-discrepancy paths over `exposure_steps` uniform grid intervals, `seed`
// for bit-reproducible Owen scrambling) then aggregates it against the two
// survival curves, the loss-given-default fractions, and the funding spread.
message PriceXvaRequest {
  // Opaque client correlation id, echoed in `PriceXvaResponse.request_id`.
  uint64 request_id = 1;
  // The netting set: the vanilla FX option trades that net under one master
  // agreement. At least one trade is required.
  repeated XvaTrade trades = 2;
  // Domestic (quote) continuously-compounded rate used to mark the set and
  // discount exposures to present value.
  double r_dom = 3;
  // Foreign (base) continuously-compounded rate used to mark the set.
  double r_for = 4;
  // Initial spot at valuation (t = 0), > 0.
  double spot0 = 5;
  // Exposure-model diffusion volatility for the spot evolution (may differ from
  // each trade's own pricing vol), ≥ 0.
  double sigma = 6;
  // Number of low-discrepancy exposure paths, ≥ 1.
  uint32 paths = 7;
  // Owen-scramble replication seed (bit-reproducible exposure simulation).
  uint64 seed = 8;
  // Number of uniform exposure-grid steps out to the netting-set horizon, ≥ 1.
  uint32 exposure_steps = 9;
  // The counterparty survival curve (drives CVA and the joint-survival funding
  // weight).
  XvaSurvivalCurve counterparty = 10;
  // The own survival curve (drives DVA and the joint-survival funding weight).
  XvaSurvivalCurve own = 11;
  // Counterparty loss-given-default `LGD = 1 - R_cpty`, in [0, 1].
  double lgd_counterparty = 12;
  // Own loss-given-default `LGD = 1 - R_own`, in [0, 1].
  double lgd_own = 13;
  // Funding spread (annualized decimal) charged on the net expected exposure.
  double funding_spread = 14;
  // Optional caller correlation id, echoed verbatim on the response.
  optional uint64 correlation_id = 15;
}

// The computed valuation adjustments (mirrors `celnet_xva::XvaResult`): the three
// adjustments plus the all-in total `CVA - DVA + FVA` a dealer charges over the
// risk-free value.
message XvaResult {
  // Credit valuation adjustment (≥ 0): expected loss from counterparty default.
  double cva = 1;
  // Debit valuation adjustment (≥ 0): expected benefit from own default.
  double dva = 2;
  // Funding valuation adjustment (signed): funding cost (+) or benefit (-) of the
  // uncollateralized net expected exposure.
  double fva = 3;
  // The all-in adjustment `CVA - DVA + FVA` subtracted from the risk-free value.
  double total_adjustment = 4;
}

// Response: the XVA figures for the requested netting set.
message PriceXvaResponse {
  // Correlates with `PriceXvaRequest.request_id`.
  uint64 request_id = 1;
  // The CVA / DVA / FVA result.
  XvaResult result = 2;
  // Echo of the originating `PriceXvaRequest.correlation_id`, if supplied.
  optional uint64 correlation_id = 3;
}

// ===========================================================================
// rates portfolio risk — server-side federated rollup (fixed income)
// ===========================================================================
//
// The linear-rates analogue of the options `RiskService.AggregateRisk` roll-up
// (`docs/fixed-income/FI-ARCHITECTURE.md`; `docs/SCALE-OUT.md` §2/§11). A client
// submits a book of rates positions and reads the netted firm rollup; the server
// prices each position against the supplied `CurveSet`, builds one additive risk
// fact per position keyed on its `(entity, ccy, book)` cell, shards the facts
// across the firm HRW partition map and fans them in. Rates risk is *purely
// additive* (PV/PV01/DV01/key-rate ladder sum over a netting set; the OIS par rate
// is curve-derived and never aggregated), so the fan-in equals the single-node
// rollup bit-for-bit (`celnet-risk-fleet`). Currency is the curve currency, never
// carried per position. Additive (rule 9): new instrument arms ride `RatesInstrument`.

// One rates position to price and net into the firm rates rollup: the linear-rates
// analogue of `RiskPosition`. Carries the position identity, the `(legal-entity,
// book)` cell it nets into, and the instrument economics; the settlement currency
// is taken from the `CurveSet`, not the wire.
message RatesPosition {
  // The position identity (one current fact per id in the rollup).
  uint64 position_id = 1;
  // The legal entity (regulatory-capital unit) the position books into — the
  // primary netting/partition sub-key (`celnet_risk_fleet::RatesFactKey::entity`).
  uint32 entity = 2;
  // The netting book the position sits in (carried for netting/attribution; not a
  // partition key, so a currency's whole cross-book risk stays co-resident).
  uint32 book = 3;
  // The linear-rates instrument to price (the USD-SOFR OIS P0 arm; the oneof grows
  // additively exactly as in `RatesPriceRequest`).
  RatesInstrument instrument = 4;
}

// A scope filter narrowing a rates risk aggregate to one `(entity, book, ccy)`
// subtree before the rollup — the rates-native analogue of `RiskScope`, in the
// `RatesFactKey` `(entity, ccy, book)` key space rather than the options org
// dimensions. Each filter is presence-tracked: an absent field does not constrain.
// A position is included iff every present filter matches it.
message RatesRiskScope {
  // Pin to one legal entity (absent ⇒ all entities).
  optional uint32 entity = 1;
  // Pin to one netting book (absent ⇒ all books).
  optional uint32 book = 2;
  // Pin to one settlement currency, ISO 4217 (absent ⇒ all currencies). Matched
  // against the `CurveSet` currency the positions price under.
  optional string ccy = 3;
}

// Request: price `positions` against `curve_set`, shard, and roll up the firm
// rates risk. The linear-rates analogue of `AggregateRiskRequest`. Positions
// travel inline (the caller submits its own book; there is no firm rates position
// store yet — `docs/fixed-income/FI-ARCHITECTURE.md`).
message AggregateRatesRiskRequest {
  // The calibrated curve set every position is priced against (the rates market).
  CurveSet curve_set = 1;
  // The rates positions to price and net into the firm rollup.
  repeated RatesPosition positions = 2;
  // Optional scope narrowing the rollup to one `(entity, book, ccy)` subtree
  // (absent ⇒ the whole submitted book).
  optional RatesRiskScope scope = 3;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default,
  // mode-gated exactly as `AggregateRisk`).
  optional EntitlementPrincipal principal = 4;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 5;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the legacy client-asserted-principal
  // path (mode-gated). A secret — never logged.
  optional string session_token = 6;
}

// One bucket of a netted key-rate (instrument-Jacobian) DV01 ladder: the DV01
// attributable to a single calibrating-instrument tenor, in settlement-currency PV
// (`celnet_risk_fleet::KeyRateBucket`).
message KeyRateDv01 {
  // The calibrating-instrument tenor in whole years (the ladder's bucket key).
  uint32 tenor_years = 1;
  // The netted DV01 of a +1bp bump of that tenor's quote, in settlement-currency PV.
  double dv01 = 2;
}

// One per-currency node of the firm rates rollup: the netted PV / PV01 / DV01 and
// the tenor-bucketed key-rate ladder for one settlement currency
// (`celnet_risk_fleet::RatesNodeAggregate`). All measures are in `ccy`; currencies
// never cross-net (summing PV across currencies is meaningless).
message RatesRiskNode {
  // The settlement currency this node nets, ISO 4217.
  string ccy = 1;
  // Net present value over the netting set, in `ccy`.
  double net_pv = 2;
  // Net analytic PV01, in `ccy` PV.
  double net_pv01 = 3;
  // Net parallel DV01, in `ccy` PV.
  double net_dv01 = 4;
  // The merged key-rate DV01 ladder, bucketed by tenor and ascending by tenor.
  repeated KeyRateDv01 key_rate_ladder = 5;
}

// Response: the firm rates rollup as one node per settlement currency, ascending by
// currency code (deterministic).
message AggregateRatesRiskResponse {
  // The per-currency rollup nodes, ascending by currency code.
  repeated RatesRiskNode nodes = 1;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 2;
}

// ===========================================================================
// combined tail risk — the C2c unified options+FI joint tail
// (RiskService.CombinedTailRisk)
// ===========================================================================
//
// The wire surface of `celnet_risk_cube::fi::combined_tail_risk` — the R-a "true
// single VaR engine": ONE non-additive cube over a portfolio's vanilla FX option
// legs AND its linear-FI (OIS-swap) legs, by full joint bump-and-revalue over
// aligned (options-shock, rate-shock) scenarios, plus the FI key-rate DV01 axis and
// signed parallel DV01. The whole portfolio + scenario config travels INLINE on the
// request (a pure calculation, like `AggregateRatesRisk` — no store read, no market
// read), so every replica computes the identical result.

// One vanilla FX option leg of the tail-risk portfolio: the raw Garman-Kohlhagen
// inputs plus its quoted conventions — exactly the arguments of
// `celnet_risk_normalize::PositionRisk::fx`. The canonical convention-free risk is
// re-derived server-side from these inputs (never a convention-baked Greek). Carried
// as flat `r_dom`/`r_for` (the FX two-rate carry) rather than the generalized
// `VanillaInputs.carry` oneof, matching the FX joint-tail leaf byte-for-byte.
message TailRiskOptionLeg {
  // The currency pair (BASE/QUOTE).
  CcyPair pair = 1;
  // Option type (call/put on the base currency).
  OptionType option_type = 2;
  // Signed base-currency notional (positive = long the option); per-unit risk is
  // scaled by this.
  double notional_base = 3;
  // Spot FX rate (quote per 1 unit of base).
  double spot = 4;
  // Strike (quote per 1 unit of base).
  double strike = 5;
  // Annualized volatility (absolute, e.g. 0.10 = 10 vol).
  double vol = 6;
  // Time to expiry in years (vol-time).
  double t = 7;
  // The continuously-compounded domestic (numeraire / quote) rate `r_dom`.
  double r_dom = 8;
  // The continuously-compounded foreign (base) rate `r_for`.
  double r_for = 9;
  // The delta convention the leg was quoted under (provenance; the canonical
  // spot-unadjusted delta is unaffected).
  DeltaConvention quoted_delta = 10;
  // The premium style the leg was quoted under (provenance).
  PremiumStyle premium_style = 11;
}

// One accrual period of an OIS fixed leg, in curve year-fraction coordinates
// (mirrors `celnet_rates::FixedPeriod`).
message OisFixedPeriod {
  // Payment time (period end) in curve year-fraction coordinates; strictly
  // increasing across the schedule.
  double pay = 1;
  // Year-fraction accrual for the period (e.g. ACT/360); strictly positive.
  double accrual = 2;
}

// A fixed-vs-OIS swap leg priced off the (shocked) discount curve — mirrors
// `celnet_rates_risk::FiPosition::OisSwap`. Valued by the self-discounting OIS
// identity `N·(K·A − (DF(start) − DF(maturity)))` (the receive-fixed sign, negated
// for pay-fixed).
message OisSwapLeg {
  // The swap effective (start) time in curve year-fraction coordinates.
  double start = 1;
  // The ordered fixed-leg accrual periods (the final period's `pay` is maturity).
  repeated OisFixedPeriod periods = 2;
  // The fixed rate `K` paid/received (decimal, e.g. 0.033).
  double fixed_rate = 3;
  // The swap notional `N` in curve-currency units (positive).
  double notional = 4;
  // True to receive fixed (the raw OIS-PV sign), false to pay fixed (negated).
  bool receive_fixed = 5;
}

// One linear-FI position of the tail-risk portfolio. A oneof mirroring
// `celnet_rates_risk::FiPosition`; the swap arm is wired now (the cash-bond arm
// grows additively — one contract, no versioning).
message TailRiskFiPosition {
  // Exactly one arm is set.
  oneof position {
    // A fixed-vs-OIS swap.
    OisSwapLeg ois_swap = 1;
  }
}

// One dated pillar of the base discount curve the FI legs reprice off — a
// `(time, continuously-compounded zero rate)` knot (mirrors one entry of
// `celnet_rates_risk::RatePillars`). The curve origin `(0, DF=1)` is implicit.
message TailRiskCurvePillar {
  // The pillar time in curve year-fraction coordinates; strictly increasing, > 0.
  double t = 1;
  // The continuously-compounded zero rate at `t`.
  double zero_rate = 2;
}

// One joint cross-risk-class scenario: an options spot/vol/carry shock applied to
// the option legs AND a per-pillar rate shock applied to the FI legs, as ONE market
// state (aligned by scenario index) — mirrors `celnet_risk_cube::JointScenario`.
message JointTailScenario {
  // Relative spot shock (0.01 = +1%): `spot *= 1 + spot_rel`.
  double spot_rel = 1;
  // Absolute vol shock in vol units (0.01 = +1 vol point): `vol += vol_abs`.
  double vol_abs = 2;
  // Absolute discount-rate shock `Δr` (the numeraire rate; `r_dom` for FX).
  double discount_abs = 3;
  // Absolute net-carry shock `Δb` (`r_dom − r_for` for FX).
  double carry_abs = 4;
  // Per-pillar absolute additive zero-rate shifts, aligned with `base_curve` (the
  // `RateShock`). Its length must equal the base-curve pillar count when FI legs are
  // present; ignored (and may be empty) when there are no FI legs.
  repeated double rate_shifts = 5;
}

// A value-at-risk / expected-shortfall pair (mirrors `celnet_risk_cube::VarEs`): the
// alpha-quantile loss and the mean tail loss beyond it.
message VarEs {
  // Value-at-Risk: the `alpha`-quantile loss.
  double var = 1;
  // Expected Shortfall: the mean loss in the tail beyond VaR.
  double es = 2;
}

// One point of the FI signed key-rate DV01 ladder: the signed ΔPV per +1bp up-bump
// of one curve pillar's zero rate (mirrors `celnet_rates_risk::KeyRatePoint`). The
// tenor is a real pillar time (fractional tenors allowed), so it is a `double` —
// unlike the whole-year-bucketed `KeyRateDv01` of the additive rates rollup.
message TailRiskKeyRate {
  // The pillar tenor in years.
  double tenor_years = 1;
  // The signed DV01 at this tenor (a rate rise is a loss ⇒ negative for a long bond
  // / receive-fixed swap).
  double dv01 = 2;
}

// Request: one-cube joint options+FI tail risk over an inline portfolio + scenario
// config. Options-only ⇒ empty `fi_positions` (reduces to the options VaR); FI-only
// ⇒ empty `option_legs` (reduces to the rate VaR); a mixed book shows the joint
// cross-risk-class diversification.
message CombinedTailRiskRequest {
  // The vanilla FX option legs (may be empty for an FI-only request).
  repeated TailRiskOptionLeg option_legs = 1;
  // The linear-FI legs (may be empty for an options-only request).
  repeated TailRiskFiPosition fi_positions = 2;
  // The base discount-curve zero-rate pillars the rate shocks perturb and the FI
  // key-rate ladder is measured off (required, ≥ 1 pillar, strictly increasing in
  // time). Present even for an options-only request (the FI ladder is then all-zero).
  repeated TailRiskCurvePillar base_curve = 3;
  // The aligned joint scenarios (one market state each) reduced to the tail.
  repeated JointTailScenario scenarios = 4;
  // The VaR/ES confidence level (e.g. 0.99). Defaults to 0.99 when 0.
  double alpha = 5;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional uint64 correlation_id = 6;
  // The bearer session token from `AuthService.Login`. When present and valid the
  // server authenticates the caller; absent ⇒ the grant-all default (mode-gated,
  // exactly as `AggregateRatesRisk`). A secret — never logged.
  optional string session_token = 7;
}

// Response: the joint tail plus the FI key-rate axis and signed parallel DV01
// (mirrors `celnet_risk_cube::CombinedTailRisk`).
message CombinedTailRiskResponse {
  // The joint options-spot/vol + FI-rate tail — one non-additive VaR/ES over the union.
  VarEs joint_var_es = 1;
  // The FI per-tenor signed key-rate DV01 ladder, ascending by pillar tenor (empty
  // when there are no FI legs; one point per base-curve pillar otherwise).
  repeated TailRiskKeyRate key_rate = 2;
  // The FI signed parallel DV01 (a rate rise is a loss ⇒ negative for a long bond /
  // receive-fixed swap; 0 when there are no FI legs).
  double fi_parallel_dv01 = 3;
  // Echo of the request's `correlation_id`, if supplied.
  optional uint64 correlation_id = 4;
}

// ===========================================================================
// rates position store — the booked rates Book (fixed income)
// ===========================================================================
//
// The firm rates position store now exists server-side (the inline-only caveat on
// `AggregateRatesRiskRequest` is lifted for booked flow): an accepted desk quote
// (or a direct booking) writes a `RatesPosition`; the Book workspace lists it.
// Mirrors the options `PositionStore` — in-memory, authoritative for the session.

// Request: book one rates position into the firm rates store.
message BookRatesPositionRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The cell + instrument to book. `position_id == 0` ⇒ the server assigns a fresh
  // id (a new booking); a non-zero id upserts (replaces) that position.
  RatesPosition position = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// Response: the booked position with its server-assigned (or echoed) id.
message BookRatesPositionResponse {
  // The booked position; `position_id` is the server-assigned (or echoed) id.
  RatesPosition position = 1;
}

// Request: list the firm rates positions, scoped + entitlement-pruned.
message ListRatesPositionsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Narrow to one `(entity, book, ccy)` subtree (absent ⇒ all booked positions).
  optional RatesRiskScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// Response: the booked rates positions matching the scope + entitlements,
// ascending by `position_id` (deterministic).
message ListRatesPositionsResponse {
  // The booked rates positions matching the scope, ascending by `position_id`.
  repeated RatesPosition positions = 1;
}

// ===========================================================================
// dealer-side quoting — RFQ/IOI desk inbox, deal blotter, notifications (FI)
// ===========================================================================
//
// The MAKER side of the franchise: inbound RFQs and IOIs from counterparties land
// in a desk inbox, the responsible trader is notified, prices, and responds; an
// accepted quote books a deal into the received-deals blotter AND a rates position.
// The taker side (`QuoteService.RequestQuote` → synthetic-LP auto-price) stays as
// is; this is the human-quoted complement. Live counterparty venue connectivity is
// a deploy concern (out of in-repo scope); inbound requests arrive over the one
// current contract via `SubmitDeskRequest` (the client SDK / counterparty
// simulator) — 100% real and test-driven (rule 2). FI-scoped: the instrument is a
// `RatesInstrument` priced against a `CurveSet`; the oneof grows additively.

// What kind of inbound request this is.
enum DeskRequestKind {
  // Default/unset — never a valid request kind on the wire.
  DESK_REQUEST_KIND_UNSPECIFIED = 0;
  // Request-for-quote: a counterparty wants a firm price.
  DESK_REQUEST_KIND_RFQ = 1;
  // Indication-of-interest: a non-firm axe for the desk to work.
  DESK_REQUEST_KIND_IOI = 2;
}

// The lifecycle state of an inbound desk request (one current fact per id).
enum DeskRequestState {
  // Default/unset — never a valid state on the wire.
  DESK_REQUEST_STATE_UNSPECIFIED = 0;
  // Awaiting a desk response.
  DESK_REQUEST_STATE_PENDING = 1;
  // The desk has responded with a price.
  DESK_REQUEST_STATE_QUOTED = 2;
  // The counterparty lifted the quote → a deal booked.
  DESK_REQUEST_STATE_ACCEPTED = 3;
  // The desk declined to quote.
  DESK_REQUEST_STATE_REJECTED = 4;
  // The response deadline elapsed unquoted.
  DESK_REQUEST_STATE_EXPIRED = 5;
  // The counterparty pulled the request.
  DESK_REQUEST_STATE_WITHDRAWN = 6;
}

// The desk's firm response to an RFQ (or a firm level on an IOI): the quoted price
// and how long it stands.
message DeskQuote {
  // The quoted price. For the OIS arm this is the all-in fixed rate as a decimal
  // (0.041 = 4.10%) the desk shows the counterparty.
  double price = 1;
  // The notional the quote is good for (curve currency, positive).
  double notional = 2;
  // How long the quote stands from issue, milliseconds (0 ⇒ indicative only).
  uint32 valid_for_ms = 3;
  // The quoting trader (attribution).
  string trader = 4;
}

// One inbound dealer-side request (RFQ or IOI) as the desk sees it.
message DeskRequest {
  // Server-assigned, stable across the lifecycle.
  string request_id = 1;
  // Whether this is an RFQ (firm price wanted) or an IOI (axe to work).
  DeskRequestKind kind = 2;
  // The counterparty label (the taker). A display/attribution field, not auth.
  string counterparty = 3;
  // The target desk this request routes to (the entitlement + notification scope).
  string desk = 4;
  // The instrument the counterparty wants priced.
  RatesInstrument instrument = 5;
  // The curve set the instrument prices against.
  CurveSet curve_set = 6;
  // The counterparty's side from THEIR perspective: SIDE_BUY ⇒ they pay fixed.
  Side side = 7;
  // The notional requested (curve currency, always positive).
  double notional = 8;
  // Server receipt time (epoch nanos, UTC).
  int64 received_at_nanos = 9;
  // Response deadline (epoch nanos, UTC); past this the request EXPIRES unquoted.
  int64 expires_at_nanos = 10;
  // The current lifecycle state (one current fact per `request_id`).
  DeskRequestState state = 11;
  // The desk's response once quoted (absent while PENDING). Presence-tracked.
  optional DeskQuote quote = 12;
  // Opaque caller correlation id, echoed through the lifecycle. Presence-tracked.
  optional string correlation_id = 13;
}

// A counterparty (taker SDK / simulator) submits an RFQ or IOI to a desk.
message SubmitDeskRequestRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Whether this is an RFQ (firm price wanted) or an IOI (axe to work).
  DeskRequestKind kind = 2;
  // The submitting counterparty label (display/attribution, not auth).
  string counterparty = 3;
  // The desk this request routes to (the entitlement + notification scope).
  string desk = 4;
  // The instrument the counterparty wants priced.
  RatesInstrument instrument = 5;
  // The curve set to price the instrument against.
  CurveSet curve_set = 6;
  // The counterparty's side from THEIR perspective: SIDE_BUY ⇒ they pay fixed.
  Side side = 7;
  // The notional requested (curve currency, always positive).
  double notional = 8;
  // Time-to-live for the desk to respond, milliseconds (0 ⇒ a server default).
  uint32 ttl_ms = 9;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 10;
  // Optional caller correlation id, echoed through the lifecycle. Presence-tracked.
  optional string correlation_id = 11;
}
// Response: the captured request in its PENDING state, with its server id.
message SubmitDeskRequestResponse {
  // The newly captured request (PENDING, with a server-assigned `request_id`).
  DeskRequest request = 1;
}

// The desk declines to quote a request.
message DeskReject {
  // A short human reason shown to the counterparty (e.g. "no axe", "off-the-run").
  string reason = 1;
}

// The desk quotes or rejects a pending request.
message RespondDeskRequestRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The request being responded to.
  string request_id = 2;
  // The response: exactly one of a firm quote or a decline.
  oneof response {
    // Quote the request at a firm level.
    DeskQuote quote = 3;
    // Decline to quote the request.
    DeskReject reject = 4;
  }
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 5;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 6;
}
// Response: the request advanced to QUOTED (or REJECTED).
message RespondDeskRequestResponse {
  // The request in its new state, carrying the desk's quote when QUOTED.
  DeskRequest request = 1;
}

// The counterparty lifts a quoted price → books a `Deal` and a `RatesPosition`.
message AcceptDeskQuoteRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The quoted request being lifted.
  string request_id = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// Response: the booked deal plus the request in its terminal ACCEPTED state.
message AcceptDeskQuoteResponse {
  // The deal booked from the lifted quote.
  Deal deal = 1;
  // The request in its terminal ACCEPTED state.
  DeskRequest request = 2;
}

// A scope filter for the desk inbox.
message DeskRequestScope {
  // Restrict to these states (empty ⇒ all states).
  repeated DeskRequestState states = 1;
  // Restrict to one desk (absent ⇒ all desks the caller is entitled to).
  optional string desk = 2;
}
// Request: read the desk inbox (the pending/terminal RFQ & IOI requests).
message ListDeskRequestsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Optional state/desk filter (absent ⇒ all states across entitled desks).
  optional DeskRequestScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// The desk inbox, newest first (descending `received_at_nanos`), entitlement-pruned.
message ListDeskRequestsResponse {
  // The matching desk requests, newest first.
  repeated DeskRequest requests = 1;
}

// One booked received deal (an accepted desk quote), as the blotter shows it.
message Deal {
  // The server-assigned deal identity.
  string deal_id = 1;
  // The originating `DeskRequest.request_id`.
  string request_id = 2;
  // Whether the originating request was an RFQ or an IOI.
  DeskRequestKind kind = 3;
  // The counterparty label (display/attribution).
  string counterparty = 4;
  // The desk the deal booked under.
  string desk = 5;
  // The dealt instrument.
  RatesInstrument instrument = 6;
  // The curve set the deal priced against.
  CurveSet curve_set = 7;
  // The DESK's side (opposite the counterparty's submitted side).
  Side side = 8;
  // The dealt notional (curve currency, positive).
  double notional = 9;
  // The dealt level — the accepted `DeskQuote.price`.
  double price = 10;
  // Execution time (epoch nanos, UTC).
  int64 executed_at_nanos = 11;
  // The booking trader (attribution).
  string trader = 12;
  // The rates position id this deal booked into the rates store. Presence-tracked.
  optional uint64 position_id = 13;
  // Opaque caller correlation id carried from the request. Presence-tracked.
  optional string correlation_id = 14;
}
// A scope filter for the received-deals blotter.
message DealScope {
  // Restrict to one desk (absent ⇒ all desks the caller is entitled to).
  optional string desk = 1;
}
// Request: read the received-deals blotter.
message ListDealsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // Optional desk filter (absent ⇒ all entitled desks).
  optional DealScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed on the response. Presence-tracked.
  optional string correlation_id = 4;
}
// The received-deals blotter, newest first (descending `executed_at_nanos`).
message ListDealsResponse {
  // The matching booked deals, newest first.
  repeated Deal deals = 1;
}

// ---- Notifications: a dedicated server→client push stream ----
// The desk learns "an RFQ/IOI requires pricing" the instant it lands, without
// polling. A connected client opens ONE notification subscription scoped to the
// desks it watches; the server fans out entitlement-filtered events to every
// matching subscriber. Independent of the price (RFS) stream by operator choice:
// a quiet, low-rate control channel that never shares back-pressure with pricing.
enum NotificationKind {
  // Default/unset — never a valid notification kind on the wire.
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  // A new RFQ landed and needs pricing.
  NOTIFICATION_KIND_RFQ_RECEIVED = 1;
  // A new IOI landed for the desk to work.
  NOTIFICATION_KIND_IOI_RECEIVED = 2;
  // A pending request was withdrawn by the counterparty.
  NOTIFICATION_KIND_REQUEST_WITHDRAWN = 3;
  // A pending request expired before the desk responded.
  NOTIFICATION_KIND_REQUEST_EXPIRED = 4;
  // A desk quote was lifted by the counterparty → a deal booked.
  NOTIFICATION_KIND_QUOTE_ACCEPTED = 5;
  // A desk quote was rejected by the counterparty.
  NOTIFICATION_KIND_QUOTE_REJECTED = 6;
  // An inbound RFQ/RFS could NOT be auto-priced and needs a human — the ONLY
  // alert-worthy kind (the GUI pops a toast). Carries a machine-readable `reason`
  // (see ManualInterventionReason). Distinct from RFQ_RECEIVED, which is a routine
  // routed RFQ the desk prices in the normal flow (quiet, no popup).
  NOTIFICATION_KIND_MANUAL_INTERVENTION_REQUIRED = 7;
}
// Why an inbound RFQ/RFS cannot be auto-priced and must be handled by a trader. The
// machine-readable signal the GUI renders on a manual-intervention alert. Extensible:
// new reasons append with the next number (one unversioned contract — no negotiation).
enum ManualInterventionReason {
  // Default/unset — carried by every non-manual-intervention notification.
  MANUAL_INTERVENTION_REASON_UNSPECIFIED = 0;
  // The requested tenor is not configured for auto-quoting (off the venue's
  // on-the-run set) — the desk must price it by hand.
  MANUAL_INTERVENTION_REASON_UNCONFIGURED_TENOR = 1;
  // A pre-trade credit check against the counterparty failed — a human must clear it.
  MANUAL_INTERVENTION_REASON_CREDIT_RISK_BREAK = 2;
  // The named security/curve symbol is not one the venue prices — unknown instrument.
  MANUAL_INTERVENTION_REASON_UNKNOWN_SECURITY = 3;
  // The pricing engine failed to produce a price for an otherwise-admitted request.
  MANUAL_INTERVENTION_REASON_PRICING_FAILURE = 4;
}
// One pushed notification event the desk surfaces as a toast/inbox item.
message Notification {
  // The server-assigned notification identity (de-dup key on the client).
  string notification_id = 1;
  // What happened (RFQ/IOI received, withdrawn, expired, accepted, rejected).
  NotificationKind kind = 2;
  // When the event occurred (epoch nanos, UTC).
  int64 at_nanos = 3;
  // The request/deal this concerns, for click-through. Presence-tracked.
  optional string request_id = 4;
  // The desk the event is scoped to.
  string desk = 5;
  // The counterparty involved (display/attribution).
  string counterparty = 6;
  // Whether the underlying request was an RFQ or an IOI.
  DeskRequestKind request_kind = 7;
  // A one-line human headline (rendered in the toast/inbox).
  string headline = 8;
  // Optional longer detail line. Presence-tracked.
  optional string detail = 9;
  // Whether this event is alert-worthy: the GUI pops a toast ONLY when true.
  // Manual-intervention events set it true; received/auto-quoted/booked/rejected
  // events are quiet (false) — they still land in the blotter/inbox silently.
  bool alert_worthy = 10;
  // The machine-readable manual-intervention reason. Present ONLY on a
  // MANUAL_INTERVENTION_REQUIRED event (absent otherwise). Presence-tracked.
  optional ManualInterventionReason reason = 11;
}
// The desks a notification subscription covers.
message NotificationScope {
  // The desks to receive notifications for (empty ⇒ all the caller is entitled to).
  repeated string desks = 1;
}
// Open one long-lived notification subscription scoped to `scope`'s desks.
message StreamNotificationsRequest {
  // The bearer session token from `AuthService.Login` (mode-gated like the rest).
  optional string session_token = 1;
  // The desks to subscribe to (absent ⇒ all the caller is entitled to).
  optional NotificationScope scope = 2;
  // The entitlement principal authorising the caller (absent ⇒ grant-all default).
  optional EntitlementPrincipal principal = 3;
  // Optional caller correlation id, echoed by the server. Presence-tracked.
  optional string correlation_id = 4;
}

// The dealer-side quoting desk: inbound RFQ/IOI capture, response, acceptance, and
// the inbox + received-deals reads. Entitlement-pruned exactly like the risk reads.
service RfqDeskService {
  rpc SubmitDeskRequest(SubmitDeskRequestRequest) returns (SubmitDeskRequestResponse);
  rpc RespondDeskRequest(RespondDeskRequestRequest) returns (RespondDeskRequestResponse);
  rpc AcceptDeskQuote(AcceptDeskQuoteRequest) returns (AcceptDeskQuoteResponse);
  rpc ListDeskRequests(ListDeskRequestsRequest) returns (ListDeskRequestsResponse);
  rpc ListDeals(ListDealsRequest) returns (ListDealsResponse);
}

// The dedicated server→client notification push channel (one long-lived stream per
// connected client; entitlement-filtered desk fan-out).
service NotificationService {
  rpc StreamNotifications(StreamNotificationsRequest) returns (stream Notification);
}
