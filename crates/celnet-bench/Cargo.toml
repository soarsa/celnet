[package]
name = "celnet-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet latency & throughput benchmarks — published proof of the microsecond pricing budgets."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
celnet-vanilla.workspace = true
# Risk-path acceleration benches: AAD vs bump-and-revalue (celnet-risk-normalize),
# and GPU-batched vs CPU node-by-node scenario grids (celnet-risk-cube + the
# batched kernel in celnet-gpu). Read-only library deps — the benches construct
# the public APIs, they never modify those crates.
celnet-risk-normalize.workspace = true
celnet-risk-cube.workspace = true
celnet-gpu.workspace = true
# Wire-path (end-to-end) latency-under-load proof: the load harness spins the
# real service edge in-process, drives sustained RFQ + RFS streaming load over
# the loopback gRPC wire, and records the client-observed round-trip in an
# HdrHistogram (coordinated-omission aware). The edge crates below are READ as
# library dependencies — the harness only constructs and dials the public
# `celnet-server` API, it never modifies the edge.
celnet-conventions.workspace = true
celnet-engine.workspace = true
celnet-proto.workspace = true
celnet-server.workspace = true
# Fleet §11 SLO truth-benches (loopback): the federation-overhead arm boots a
# `Distributed{[backend]}` federating edge (`FleetTopology` lives in
# celnet-risk-fleet) and seeds the backend's position book (FactKey org handles
# from celnet-risk-cube, already a dep above). Read-only library dep — the harness
# constructs the public APIs, it never modifies those crates.
celnet-risk-fleet.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tonic.workspace = true
futures-util.workspace = true
hdrhistogram.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# In-core per-option latency truth-gate (`core_load`): pin the measuring thread
# to a core and request the max scheduling QoS/priority so the *measured* tail
# reflects the pricing core's intrinsic cost (~tens of ns) rather than OS jitter
# — that is what lets the absolute ARCHITECTURE §1.2 budgets (p50 ≤ 2µs / p99 ≤
# 10µs / p99.9 ≤ 25µs) be asserted as MEASURED facts. Both are safe-API crates
# (no `unsafe` leaks into this crate; the workspace forbids it).
core_affinity.workspace = true
thread-priority.workspace = true

[dev-dependencies]
divan.workspace = true
# iai-callgrind: the STANDARD jitter-free instruction-count gate. It drives
# `cargo bench` under Valgrind/Callgrind to count retired instructions, cache
# accesses and estimated cycles — a deterministic, machine-independent metric
# that complements the wall-clock §1.2 budgets. It runs on the Linux CI lane
# (Valgrind is Linux/x86_64); benches are NOT nextest targets, so adding this
# dev-dep does not affect `just check` / nextest on macOS. The benchmark binary
# is only *built* (not run) on macOS; building is fine — only *running* needs
# Valgrind, which the Linux CI lane provides.
iai-callgrind.workspace = true

# ---------------------------------------------------------------------------
# In-core micro-benchmarks (divan). These measure the pinned hot core in
# isolation (no wire); the wire-path figure is the `wire_load` binary below.
# ---------------------------------------------------------------------------
[[bench]]
name = "vanilla"
harness = false

[[bench]]
name = "batch"
harness = false

# Risk-path acceleration: reverse-mode AAD vs bump-and-revalue for the full Greek
# block (expect ~O(1) vs O(n)), and the GPU-batched scenario grid vs the CPU
# node-by-node oracle. See docs/RISK-HIERARCHY.md §3.3.
[[bench]]
name = "aad"
harness = false

[[bench]]
name = "scenario"
harness = false

# ---------------------------------------------------------------------------
# End-to-end wire-path latency-under-load harness + the CI bench-regression
# gate. Both are bounded binaries (self-terminating, timeout-friendly): the
# load run drives a fixed request budget under a hard wall-clock cap; the gate
# replays a short run and compares the measured percentiles to a committed
# baseline within tolerance.
# ---------------------------------------------------------------------------
[[bin]]
name = "wire_load"
path = "src/bin/wire_load.rs"

[[bin]]
name = "bench_gate"
path = "src/bin/bench_gate.rs"

# In-core per-option latency truth-gate: measures + asserts the ABSOLUTE
# ARCHITECTURE §1.2 budgets (p50 ≤ 2µs / p99 ≤ 10µs / p99.9 ≤ 25µs) on the real
# `celnet_vanilla::greeks` hot path. Bounded; exits non-zero on any breach.
[[bin]]
name = "core_load"
path = "src/bin/core_load.rs"

# Fleet §11 SLO truth-benches (LOOPBACK / in-process): measures (a) cross-shard
# federation overhead, (b) publish→snapshot lag, (c) conflation correctness under
# a stalled consumer, (d) many-sub fan-out delivery spread — over the REAL fleet
# primitives, with HdrHistogram. Emits a `FleetSloReport` the bench gate compares
# against a committed LOOPBACK baseline for >2× relative regression. NOT a wire-SLO
# claim (the absolute §11 wire-latency SLOs stay deploy-gated; see docs/SCALE-OUT
# §0/§11). Bounded; self-terminating.
[[bin]]
name = "fleet_slo"
path = "src/bin/fleet_slo.rs"

# ---------------------------------------------------------------------------
# iai-callgrind instruction-count gate (jitter-free, deterministic). Runs under
# `cargo bench` on the Linux+Valgrind CI lane; counts retired instructions /
# cache accesses / estimated cycles for price()/greeks()/batch against committed
# baselines. `harness = false` (iai-callgrind supplies its own main()).
# ---------------------------------------------------------------------------
[[bench]]
name = "iai_instructions"
harness = false
