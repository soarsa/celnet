[package]
name = "celnet-journal"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet durable event journal — fsync'd append-only sequence-ordered log + deterministic crash recovery."
publish = false

[lints]
workspace = true

# The journal is deliberately dependency-free in its public build (std fs only +
# a self-contained CRC-32) — it is the lowest-level durable substrate and must add
# no supply-chain surface. Domain types are needed only by the `EventCodec`
# round-trip test, hence dev-only.

[dependencies]

[dev-dependencies]
celnet-types.workspace = true
# Property-based adversarial-bytes test of the crash-recovery parser
# (`Journal::open` + `replay` over an arbitrary on-disk file): the same
# no-panic / heal-or-typed-Err / bounded-alloc contract the nightly cargo-fuzz
# `journal_recover` target asserts, but gated in `just check`.
proptest.workspace = true
