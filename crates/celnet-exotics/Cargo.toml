[package]
name = "celnet-exotics"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Celnet FX exotics — analytic digitals, touches, double-no-touch and single/double barriers with a survival-weighted Vanna-Volga smile overlay."
publish = false

[lints]
workspace = true

[dependencies]
celnet-types.workspace = true
celnet-core.workspace = true
celnet-vanilla.workspace = true
celnet-surface.workspace = true
# Sobol low-discrepancy sequence + Brownian bridge for the Longstaff-Schwartz
# regression Monte-Carlo cross-check of the PSOR finite-difference American /
# Bermudan early-exercise pricer.
celnet-qmc = { path = "../celnet-qmc" }
# Deterministic software trig (sin/cos) for the Box-Muller normal route, on the
# same `rust-lang/libm` path celnet-core's math uses — keeps every transcendental
# bit-identical across platforms (celnet-core re-exports exp/ln/sqrt but not trig).
libm.workspace = true

[dev-dependencies]
celnet-testkit.workspace = true
proptest.workspace = true
