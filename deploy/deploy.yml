---
# Binary release only: sync source -> incremental cargo build -> new release dir
# -> atomic symlink swap -> restart. Assumes the host is already provisioned
# (run site.yml once first). Runs unprivileged.
#
#   ansible-playbook deploy.yml --limit uat
- name: Celnet — binary release
  hosts: "{{ target | default('uat') }}"
  gather_facts: true
  become: false
  pre_tasks:
    # Compute the release id ONCE and freeze it (a vars: lookup re-runs per
    # reference -> mismatched timestamps). Override with -e celnet_release_name=...
    - name: Compute the release name (frozen for the whole run)
      ansible.builtin.set_fact:
        celnet_release_name: >-
          {{ celnet_release_name | default(
               lookup('pipe', 'git -C ' ~ playbook_dir ~ '/.. rev-parse --short HEAD')
               ~ '-' ~ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ')) }}
    # Re-render the on-box control scripts from their templates on EVERY release, before
    # anything runs them. A deploy that never reasserts them lets a hand edit on the box
    # outrank the repository indefinitely: `FIXSIM_ESP="0"` typed on the box to park the
    # ESP leg silently beat `celnet_fixsim_esp_enabled: true` in group_vars through every
    # subsequent deploy, and the bond/corporate ESP stream stayed dark while the repo, the
    # inventory and the operator all read as "enabled". Idempotent — an unchanged template
    # reports `ok`, so only genuine drift shows up as `changed`.
    #
    # Unprivileged: the deploy runs AS `celnet_user`, which already owns these files, so
    # the `owner`/`group` assertions in the task file are a no-op here.
    - name: Re-render the on-box control scripts (defeat hand-edit drift)
      ansible.builtin.import_role:
        name: celnet_provision
        tasks_from: control_scripts
  roles:
    - role: celnet_release
  post_tasks:
    # `celnetctl restart` now owns the SIMULATOR FLEET too: it stops the sims before
    # the server (they are its clients), sweeps any orphan by process image, and
    # relaunches every configured leg once the server is confirmed listening. So this
    # one command leaves no previous generation behind — which is what the separate
    # per-sim restarts below could not guarantee, because each only knew about its own
    # pidfile and a leaked process is precisely one whose pidfile already drifted.
    - name: Restart celnet-server (and the coupled simulator fleet) via celnetctl
      ansible.builtin.command: "{{ celnet_bin_dir }}/celnetctl restart"
      changed_when: true
    # Belt and braces for the decoupled case: when the fleet is deliberately NOT bound
    # to the server lifecycle, a release must still land on freshly restarted sims, so
    # drive simsctl directly. Skipped when the box isn't provisioned yet (no simsctl)
    # or the fleet is switched off for this environment.
    - name: Check the simsctl simulator-fleet control script is installed
      ansible.builtin.stat:
        path: "{{ celnet_bin_dir }}/simsctl"
      register: celnet_simsctl_bin
    - name: (Re)start the simulator fleet via simsctl (LP-SIM + RFQ/RFS/ESP legs)
      ansible.builtin.command: "{{ celnet_bin_dir }}/simsctl restart"
      changed_when: true
      when:
        - celnet_simulators_enabled | default(true) | bool
        - not (celnet_simulators_restart_with_server | default(true) | bool)
        - celnet_simsctl_bin.stat.exists
    # A fleet switched OFF must actively be torn down, not merely left unstarted: a box
    # that used to run sims would otherwise keep the previous generation alive forever.
    - name: Sweep every simulator process when the fleet is disabled
      ansible.builtin.shell: >-
        pkill -TERM -u "$(id -u)" -f 'lp[-_]sim|fix[-_]rfq[-_]client|start-fix-sim\.sh|start-lp-sim\.sh' || true
      changed_when: true
      when: not (celnet_simulators_enabled | default(true) | bool)
    - name: Release summary
      ansible.builtin.debug:
        msg: >-
          Released {{ celnet_release_name }} -> {{ celnet_current_link }}
          (celnet-server restarted;
          simulators {{ 'restarted' if celnet_simulators_enabled | default(true) | bool else 'DISABLED + swept' }})

