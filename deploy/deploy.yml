---
# Binary release only: sync source -> incremental cargo build -> new release dir
# -> atomic symlink swap -> restart. Assumes the host is already provisioned
# (run site.yml once first). Runs unprivileged.
#
#   ansible-playbook deploy.yml --limit uat
- name: Celnet — binary release
  hosts: "{{ target | default('uat') }}"
  gather_facts: true
  become: false
  pre_tasks:
    # Compute the release id ONCE and freeze it (a vars: lookup re-runs per
    # reference -> mismatched timestamps). Override with -e celnet_release_name=...
    - name: Compute the release name (frozen for the whole run)
      ansible.builtin.set_fact:
        celnet_release_name: >-
          {{ celnet_release_name | default(
               lookup('pipe', 'git -C ' ~ playbook_dir ~ '/.. rev-parse --short HEAD')
               ~ '-' ~ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ')) }}
    # Re-render the on-box control scripts from their templates on EVERY release, before
    # anything runs them. A deploy that never reasserts them lets a hand edit on the box
    # outrank the repository indefinitely: `FIXSIM_ESP="0"` typed on the box to park the
    # ESP leg silently beat `celnet_fixsim_esp_enabled: true` in group_vars through every
    # subsequent deploy, and the bond/corporate ESP stream stayed dark while the repo, the
    # inventory and the operator all read as "enabled". Idempotent — an unchanged template
    # reports `ok`, so only genuine drift shows up as `changed`.
    #
    # Unprivileged: the deploy runs AS `celnet_user`, which already owns these files, so
    # the `owner`/`group` assertions in the task file are a no-op here.
    - name: Re-render the on-box control scripts (defeat hand-edit drift)
      ansible.builtin.import_role:
        name: celnet_provision
        tasks_from: control_scripts
  roles:
    - role: celnet_release
  post_tasks:
    - name: Restart celnet-server via celnetctl
      ansible.builtin.command: "{{ celnet_bin_dir }}/celnetctl restart"
      changed_when: true
    # The LP-SIM Treasury feed is a managed service: (re)start it on EVERY deploy so a
    # fresh release always has the sim streaming into the aggregated books (and the
    # daemon reconnects cleanly after the server restart above). Skipped when the box
    # isn't provisioned yet (no lpsimctl) or the sim is disabled.
    - name: Check the lpsimctl LP-SIM control script is installed
      ansible.builtin.stat:
        path: "{{ celnet_bin_dir }}/lpsimctl"
      register: celnet_lpsimctl_bin
    - name: (Re)start the LP-SIM Treasury feed via lpsimctl
      ansible.builtin.command: "{{ celnet_bin_dir }}/lpsimctl restart"
      changed_when: true
      when:
        - celnet_lpsim_enabled | default(true) | bool
        - celnet_lpsimctl_bin.stat.exists
    # The FIX RFQ/RFS client simulator is likewise a managed service: (re)start it on EVERY
    # deploy so a fresh release always has incoming client RFQ/RFS flow driving deals, quotes
    # and positions. Skipped when the box isn't provisioned yet (no fixsimctl) or it's disabled.
    - name: Check the fixsimctl FIX-simulator control script is installed
      ansible.builtin.stat:
        path: "{{ celnet_bin_dir }}/fixsimctl"
      register: celnet_fixsimctl_bin
    # `restart` is safe to call directly now that the pre_task above re-renders fixsimctl
    # from its template on every release: the on-box script is guaranteed to be the one in
    # this repository, so it cannot predate a verb this playbook uses. (It previously used
    # stop||true + start precisely because the on-box copy could be arbitrarily old.)
    - name: (Re)start the FIX RFQ/RFS client simulator via fixsimctl
      ansible.builtin.command: "{{ celnet_bin_dir }}/fixsimctl restart"
      changed_when: true
      when:
        - celnet_fixsim_enabled | default(true) | bool
        - celnet_fixsimctl_bin.stat.exists
    - name: Release summary
      ansible.builtin.debug:
        msg: "Released {{ celnet_release_name }} -> {{ celnet_current_link }} (celnet-server + lp-sim + fix-sim restarted)"

