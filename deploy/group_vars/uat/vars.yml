---
# ============================================================================
# Celnet — UAT environment overrides (plaintext).
# Secrets (sudo/become password) live in the encrypted sibling: vault.yml
# Host: celnet@136.115.32.199  ->  https://app.uat.celnet.uk
# ============================================================================
celnet_deploy_name: uat
# Canonical host users hit (DNS: app.uat.celnet.uk is a CNAME → celnetapp → this host).
celnet_domain: celnetapp.uat.celnet.uk
# Extra DNS names to include in the self-signed cert's SAN so the old CNAME name
# (and any additional aliases) still validate without a browser warning.
celnet_domain_aliases:
  - app.uat.celnet.uk

# UAT keeps the default loopback bind ( only HAProxy is internet-facing ).
celnet_grpc_addr: "127.0.0.1:50051"
celnet_ws_addr:   "127.0.0.1:50061"

# Front the celnet-softek VAR app on https://var.uat.celnet.uk via the same
# :443 edge. var-server binds loopback on a DISTINCT port (8080 collides with
# celnet's nginx GUI) — this MUST match `softek_var_port` in the celnet-softek
# deploy's group_vars, and var.uat.celnet.uk must resolve to this host.
celnet_softek_var_enabled: true
celnet_softek_var_host: var.uat.celnet.uk
celnet_softek_var_port: 8090

# SSL: self-signed certificate generated on the host for app.uat.celnet.co.uk
# at {{ celnet_tls_pem }} on first setup (default; stated explicitly).
celnet_tls_generate_self_signed: true

# --- SSH: key-based authentication ------------------------------------------
# Bootstrap once:  ./scripts/setup-ssh-key.sh celnet@136.115.32.199
celnet_ssh_key: "{{ lookup('env', 'CELNET_SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
ansible_ssh_private_key_file: "{{ celnet_ssh_key }}"
ansible_ssh_common_args: "-o IdentitiesOnly=yes -o BatchMode=yes"

# --- Privilege escalation: sudo password ------------------------------------
# The sudo password is NOT set here. It is provided one of two ways:
#   * encrypted vault  -> group_vars/uat/vault.yml defines `ansible_become_password`
#                         directly (see vault.yml.example / ./scripts/vault-init.sh)
#   * interactive      -> the menu adds `--ask-become-pass` when no vault exists,
#                         so you are prompted for it.
# We deliberately do NOT reference an undefined `vault_*` var here (that hard-fails
# fact-gathering when no vault is present) and do NOT set `ansible_become`
# globally (that would force sudo on unprivileged ops too). Only the provision +
# HAProxy plays in site.yml escalate.
ansible_become_method: sudo
