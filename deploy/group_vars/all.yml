---
# ============================================================================
# Celnet deployment — shared defaults (all environments).
# Override per-environment in group_vars/<group>.yml (e.g. group_vars/uat.yml).
# ============================================================================

# --- Service account & filesystem layout ----------------------------------
celnet_user:  celnet
celnet_group: celnet
celnet_base:  /opt/celnet

# Capistrano-style release layout under {{ celnet_base }}:
#
#   /opt/celnet/
#   ├── releases/<release_name>/bin/{celnet-server,celnet}   immutable per release
#   ├── current -> releases/<release_name>                   atomic symlink swap
#   ├── shared/                                              survives all releases
#   │   ├── config/celnet.env                                runtime env (templated)
#   │   ├── bin/celnetctl                                    start/stop/status script
#   │   ├── logs/                                            celnet-server stdout/err
#   │   ├── run/                                             pidfiles
#   │   └── tls/<domain>.pem                                 HAProxy cert+key
#   └── build/                                               source + cargo target/
#                                                            (persists → incremental)
celnet_releases_dir: "{{ celnet_base }}/releases"
celnet_shared_dir:   "{{ celnet_base }}/shared"
celnet_build_dir:    "{{ celnet_base }}/build"
celnet_current_link: "{{ celnet_base }}/current"
celnet_config_dir:   "{{ celnet_shared_dir }}/config"
celnet_log_dir:      "{{ celnet_shared_dir }}/logs"
celnet_run_dir:      "{{ celnet_shared_dir }}/run"
celnet_bin_dir:      "{{ celnet_shared_dir }}/bin"
celnet_tls_dir:      "{{ celnet_shared_dir }}/tls"

# How many historical releases to keep on disk (older are pruned after a deploy).
celnet_keep_releases: 5

# --- Build ------------------------------------------------------------------
# We build ON the target host (native x86_64-unknown-linux-gnu), so the pinned
# toolchain from rust-toolchain.toml is honoured and no cross-compile is needed.
celnet_bins:
  - celnet-server
  - celnet
# Cargo packages that own those bins (passed as `-p` to a single build).
celnet_build_packages:
  - celnet-server
  - celnet-cli
# rustup is installed per-user; the channel comes from the repo's
# rust-toolchain.toml automatically on first build. Set to override if needed.
celnet_rust_profile: minimal

# --- FIX quote simulator ----------------------------------------------------
# When true, the release builds the celnet-fix RFQ client, ships it as
# <release>/bin/fix-rfq-client, and installs the launcher + `fixsimctl` control
# script. Run it on the host with:  fixsimctl start | once | stop | status | tail
# It dials the managed FIX acceptor (registry "CELER_FXO_CELNET" @127.0.0.1:56001);
# override with celnet_fixsim_host/port/sender/target if the GUI FIX admin changes it.
celnet_fixsim_enabled: true

# --- LP-SIM Treasury liquidity feed -----------------------------------------
# When true, the release builds the celnet-lp-sim `lp-sim` binary, ships it as
# <release>/bin/lp-sim, and installs the launcher + `lpsimctl` control script. Run
# it on the host with:  lpsimctl start | once | stop | status | tail
# LP-SIM loads the bundled US-Treasury universe (embedded in the binary), stands up
# a named `LP-SIM` member panel, and streams the consolidated composite (best
# bid/offer + size + confidence + contributing LP legs) for the selected bonds into
# the named aggregated book, through the real celnet-aggregation engine.
celnet_lpsim_enabled: true
celnet_lpsim_lp_name: "LP-SIM"           # the LP connection name shown as the contributor
celnet_lpsim_book: "ust-composite"       # the aggregated-book id label
celnet_lpsim_members: 4                   # decorrelated LP member connections (>=3 for gating)
celnet_lpsim_interval: 2                  # seconds between composite emissions
celnet_lpsim_instruments: "all"          # all, or a CSV of ISINs/CUSIPs
celnet_lpsim_max_instruments: 12          # cap on instruments streamed (log readability)
celnet_lpsim_seed: 305419896              # reproducibility seed
celnet_lpsim_settlement: "2026-04-16"    # valuation date (YYYY-MM-DD)
celnet_lpsim_include_bills: 0             # 1 = also stream zero-coupon Bills

# --- Runtime environment (templated into shared/config/celnet.env) ----------
# The celnet-server binary reads these. WS mirror gets a FIXED port so HAProxy
# can front it (see crates/celnet-server/src/main.rs : CELNET_WS_ADDR).
celnet_grpc_addr: "127.0.0.1:50051"
celnet_ws_addr:   "127.0.0.1:50061"
celnet_env:
  CELNET_GRPC_ADDR: "{{ celnet_grpc_addr }}"
  CELNET_WS_ADDR:   "{{ celnet_ws_addr }}"
  CELNET_DEPLOY:    "{{ celnet_deploy_name | default('uat') }}"
  CELNET_ACCESS_MODE: "enforce"
  RUST_LOG:         "info"
  # FIX acceptors are NOT configured via this legacy env knob. The server binds its
  # FIX 4.4 acceptors from the MANAGED registry (fix-connections.json, edited in the
  # GUI FIX admin) — on this host that is "celer" (FX/options) at 127.0.0.1:51001 and
  # an FI quote venue at 127.0.0.1:9100. Setting CELNET_FIX_ADDR here binds a SECOND,
  # legacy acceptor that collides with the registry and aborts boot with EADDRINUSE
  # (took the server down 2026-07-01). The quote simulator dials the managed acceptor
  # directly — see deploy/start-fix-sim.sh. Do NOT re-enable CELNET_FIX_ADDR unless the
  # managed registry is empty.
  # Optional integrations — uncomment / set per environment as needed:
  # CELNET_VENDOR_WS:    "wss://vendor.example/feed"
  # CELNET_FLEET_MODE:   ""
  # CELNET_FLEET_BACKENDS: ""

# --- HAProxy edge -----------------------------------------------------------
celnet_haproxy_enabled: true
# Edge listen address: 0.0.0.0 = all IPv4 interfaces (set a specific IP to pin).
celnet_bind_address: "0.0.0.0"
celnet_http_port:  80
celnet_https_port: 443
# The browser/GUI-facing backend is the WebSocket JSON mirror of the contract.
celnet_backend_ws:   "{{ celnet_ws_addr }}"
celnet_backend_grpc: "{{ celnet_grpc_addr }}"
# Front gRPC (HTTP/2) on a second TLS port as well? Off by default (WS is the
# browser path). When true, HAProxy also listens on celnet_grpc_https_port.
celnet_expose_grpc: false
celnet_grpc_https_port: 8443
# TLS: by default we generate a self-signed cert for UAT. Drop a real
# cert+key PEM at {{ celnet_tls_pem }} (or set celnet_tls_generate_self_signed:
# false and provide one) to use a CA-issued certificate.
celnet_tls_generate_self_signed: true
celnet_tls_pem: "{{ celnet_tls_dir }}/{{ celnet_domain }}.pem"

# --- Web app (GUI SPA served by nginx behind HAProxy) -----------------------
# When true, the GUI is built on the host and served at https://<domain>/ ;
# WebSocket-upgrade requests still go to the celnet-server mirror.
celnet_serve_gui: true
celnet_node_major: 20                       # Node.js major (NodeSource) for the Vite build
celnet_nginx_port: 8080                      # loopback port nginx serves the SPA on
# Empty ⇒ the GUI derives a SAME-ORIGIN WS URL at runtime (wss://<page-host>/), so
# the socket always follows the domain that served the SPA (HAProxy fronts both the
# SPA and the WS mirror host-agnostically). Set to an absolute `wss://host/` only to
# pin a cross-origin mirror. See gui/src/data/transportConfig.ts (sameOriginWsUrl).
celnet_web_ws_url: ""                              # baked into the build (VITE_CELNET_WS_URL)
