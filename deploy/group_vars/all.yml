---
# ============================================================================
# Celnet deployment — shared defaults (all environments).
# Override per-environment in group_vars/<group>.yml (e.g. group_vars/uat.yml).
# ============================================================================

# --- Service account & filesystem layout ----------------------------------
celnet_user:  celnet
celnet_group: celnet
celnet_base:  /opt/celnet

# Capistrano-style release layout under {{ celnet_base }}:
#
#   /opt/celnet/
#   ├── releases/<release_name>/bin/{celnet-server,celnet}   immutable per release
#   ├── current -> releases/<release_name>                   atomic symlink swap
#   ├── shared/                                              survives all releases
#   │   ├── config/celnet.env                                runtime env (templated)
#   │   ├── bin/celnetctl                                    start/stop/status script
#   │   ├── logs/                                            celnet-server stdout/err
#   │   ├── run/                                             pidfiles
#   │   └── tls/<domain>.pem                                 HAProxy cert+key
#   └── build/                                               source + cargo target/
#                                                            (persists → incremental)
celnet_releases_dir: "{{ celnet_base }}/releases"
celnet_shared_dir:   "{{ celnet_base }}/shared"
celnet_build_dir:    "{{ celnet_base }}/build"
celnet_current_link: "{{ celnet_base }}/current"
celnet_config_dir:   "{{ celnet_shared_dir }}/config"
celnet_log_dir:      "{{ celnet_shared_dir }}/logs"
celnet_run_dir:      "{{ celnet_shared_dir }}/run"
celnet_bin_dir:      "{{ celnet_shared_dir }}/bin"
celnet_tls_dir:      "{{ celnet_shared_dir }}/tls"

# How many historical releases to keep on disk (older are pruned after a deploy).
# Set to 2 (current + one previous for rollback) to conserve disk on the tight box;
# override per-environment as needed — this is the single knob the prune task reads.
celnet_keep_releases: 2

# --- Build ------------------------------------------------------------------
# We build ON the target host (native x86_64-unknown-linux-gnu), so the pinned
# toolchain from rust-toolchain.toml is honoured and no cross-compile is needed.
celnet_bins:
  - celnet-server
  - celnet
# Cargo packages that own those bins (passed as `-p` to a single build).
celnet_build_packages:
  - celnet-server
  - celnet-cli
# rustup is installed per-user; the channel comes from the repo's
# rust-toolchain.toml automatically on first build. Set to override if needed.
celnet_rust_profile: minimal

# --- Simulator fleet (master switch) ----------------------------------------
# THE simulator deploy configuration. False ⇒ a genuinely sim-free environment:
# no simulator binary is built or shipped, no control script is installed, any
# surviving simulator process is swept on deploy, and nothing is ever started.
# True ⇒ the per-simulator flags below decide which of the four inbound
# connections run:
#
#   LP-SIM   (celnet_lpsim_enabled)           N liquidity providers → LpFeed ingest
#   RFQ leg  (celnet_fixsim_enabled)          one-shot FIX quote requests
#   RFS leg  (celnet_fixsim_stream_port)      FIX request-for-stream subscription
#   ESP leg  (celnet_fixsim_esp_enabled)      FIX Market-Data streaming off refdata
#
# The fleet is bound to the SERVER's lifecycle by default, so `celnetctl restart`
# stops the sims first, sweeps orphans by process image, and relaunches every
# configured leg once the server is listening — no generation is ever left behind.
# Drive the fleet on its own with `simsctl {start|stop|restart|sweep|status}` or
# `celnetctl sims <verb>`.
celnet_simulators_enabled: true
celnet_simulators_restart_with_server: true

# --- FIX quote simulator ----------------------------------------------------
# When true, the release builds the celnet-fix RFQ client, ships it as
# <release>/bin/fix-rfq-client, and installs the launcher + `fixsimctl` control
# script. Run it on the host with:  fixsimctl start | once | stop | status | tail
# It dials the managed FIX acceptor (registry "CELER_FXO_CELNET" @127.0.0.1:56001);
# override with celnet_fixsim_host/port/sender/target if the GUI FIX admin changes it.
celnet_fixsim_enabled: true
# FAST sub-second cadence (ms) for the FIX sim — OVERRIDES the whole-second heartbeat via
# the client's --interval-ms, so a redeploy builds up deals/positions/flow/risk quickly.
# Set to "" to fall back to celnet_fixsim_period (whole seconds). Bounded so it stays
# livelier-but-not-flooding.
celnet_fixsim_period_ms: 3000            # ms between streamed RFQs (slowed 750→3000: less memory pressure on the box)
celnet_fixsim_stream_hold_ms: 3000       # ms RFS/ESP hold per cycle
celnet_fixsim_lift_every: 6              # book a deal every Nth quote (raised 3→6: fewer deals accumulate)
# ESP streaming leg: when enabled AND a fixed-income STREAM acceptor is reachable
# (celnet_fixsim_esp_port, else celnet_fixsim_stream_port), a supervised `--asset esp`
# client downloads the top-N reference-data instruments over gRPC and streams bond RFS on
# them (priced off the aggregated-book composite, tiered by the connection's pricing group),
# randomly lifting some to book LIVE streaming deals.
# ESP streaming taker: ON by default so a deployed box runs BOTH an RFQ taker AND a
# STREAMING taker (subscribes to bond RFS off the aggregated-book composite and lifts →
# books live streaming deals). It has its own FIX session (own SenderCompID + req-id) and
# is backgrounded, so it never fights the RFQ leg; if its stream acceptor is unreachable
# the launcher logs a loud, actionable line and skips it (the RFQ leg keeps running).
# REQUIRES a FixedIncomeStream acceptor registered in the GUI FIX admin at
# celnet_fixsim_stream_port whose accepted counterparty (target_comp_id) equals
# celnet_fixsim_stream_sender — set these to match your registry.
celnet_fixsim_esp_enabled: true
# The fixed-income STREAM (RFS) acceptor the RFS + ESP legs subscribe to. Convention: the
# stream venue sits one port above the FI quote venue (56002). Must be a `fixed_income_stream`
# acceptor in the managed registry; override to match the GUI FIX admin.
celnet_fixsim_stream_port: 56003
celnet_fixsim_stream_sender: "CELER_RATES_STREAM"
celnet_fixsim_grpc_addr: "http://127.0.0.1:50051"  # reference-data + login endpoint
celnet_fixsim_esp_instruments: 8         # top-N most-liquid/relevant instruments to stream (trimmed 15→8)
celnet_fixsim_esp_seed: "0x5EED1234"     # deterministic seed (hex ok — the launcher normalizes 0x… → decimal)
# Service login for the ESP refdata gRPC call (AuthService.Login). The FIX simulator acts
# as a CLIENT counterparty and authenticates as its OWN dedicated, least-privilege account
# — never as `admin@celnet.com`, and never sharing lp-sim's identity, so revoking one
# simulator does not disturb the other. Its only authenticated call (ListInstruments) is
# gated on authentication alone, so an EMPTY capability set suffices.
# See docs/SIMULATOR-SERVICE-IDENTITIES.md.
celnet_fixsim_user: "fix-sim@svc.celnet.local"
# Its OWN 0600 credential file (previously this pointed at lp-sim's, coupling the two).
# Generated per environment by deploy/provision-sim-identities.mjs; never committed.
celnet_fixsim_password_file: "/home/{{ celnet_user | default('celnet') }}/.fixsim_pw"

# --- LP-SIM Treasury liquidity feed -----------------------------------------
# When true, the release builds the celnet-lp-sim `lp-sim` binary, ships it as
# <release>/bin/lp-sim, and installs the launcher + `lpsimctl` control script. Run
# it on the host with:  lpsimctl start | once | stop | status | tail
#
# lpsimctl start launches the 5-LP, BOOK-AWARE daemon against the LOCAL server ingest
# (celnet_lpsim_addr, default the local gRPC edge): it authenticates as the service
# user, polls the enabled aggregated books every celnet_lpsim_book_poll seconds, and
# streams LP-SIM-01..05 two-ways for exactly the bonds each book scopes — starting and
# stopping pricing automatically as a user creates or edits a book. Books with no
# LP-SIM member are ignored. Pass celnet_lpsim_no_book_poll=1 for the broadcast
# fallback (stream the whole universe as the N LPs, no book polling).
celnet_lpsim_enabled: true
celnet_lpsim_lp_name: "LP-SIM"           # base LP connection name → LP-SIM-01..LP-SIM-0N
celnet_lpsim_book: "ust-composite"       # cosmetic book label (book-aware mode discovers books)
celnet_lpsim_members: 4                   # distinct-character LPs (trimmed 5→4 to reduce quote volume)
celnet_lpsim_interval: 5                  # seconds between quote-emission rounds (slowed 2→5)
celnet_lpsim_interval_ms: ""             # sub-second override (ms); "" ⇒ use interval seconds
celnet_lpsim_book_poll: 10                # seconds between aggregated-book polls (book-aware; slowed 5→10)
celnet_lpsim_no_book_poll: 0             # 1 = broadcast fallback (no book polling)
celnet_lpsim_instruments: "all"          # all (book-aware default), or a CSV of ISINs/CUSIPs
celnet_lpsim_max_instruments: 8           # cap on instruments (broadcast/local modes only; trimmed 12→8)
celnet_lpsim_seed: 305419896              # reproducibility seed
celnet_lpsim_settlement: "2026-04-16"    # valuation date (YYYY-MM-DD)
celnet_lpsim_include_bills: 0             # 1 = also stream zero-coupon Bills
celnet_lpsim_no_faults: 0                # 1 = disable occasional injected staleness/outlier
# Service login for the book poll (AuthService.Login). The LP simulator authenticates
# as its OWN dedicated, least-privilege account — NEVER as `admin@celnet.com`. That
# account's effective capability set is EMPTY, which is exactly sufficient: the only
# authenticated call this daemon makes (ListAggregatedBooks) is gated on authentication
# alone, not on any capability. See docs/SIMULATOR-SERVICE-IDENTITIES.md.
celnet_lpsim_user: "lp-sim@svc.celnet.local"
# There is deliberately NO `celnet_lpsim_password` here. This file is committed, so it
# must never carry a credential — not even a dev default, which is what previously let
# a real box fall back to a wrong password and lock the admin account out. The secret is
# GENERATED per environment by deploy/provision-sim-identities.mjs into the 0600 file
# below, and reaches the daemon through its ENVIRONMENT, never through argv.
celnet_lpsim_password_file: "/home/{{ celnet_user | default('celnet') }}/.lpsim_pw"

# --- Runtime environment (templated into shared/config/celnet.env) ----------
# The celnet-server binary reads these. WS mirror gets a FIXED port so HAProxy
# can front it (see crates/celnet-server/src/main.rs : CELNET_WS_ADDR).
celnet_grpc_addr: "127.0.0.1:50051"
celnet_ws_addr:   "127.0.0.1:50061"
celnet_env:
  CELNET_GRPC_ADDR: "{{ celnet_grpc_addr }}"
  CELNET_WS_ADDR:   "{{ celnet_ws_addr }}"
  CELNET_DEPLOY:    "{{ celnet_deploy_name | default('uat') }}"
  CELNET_ACCESS_MODE: "enforce"
  RUST_LOG:         "info"
  # Split log sinks (crates/celnet-observability logging.rs): the server writes
  # daily-rolling orders.log / executions.log / pricing.log / security.log here,
  # right beside celnet-server.out.log, plus a lean combined log on stdout (which
  # celnetctl still captures to celnet-server.out.log). Point at the shared log dir
  # so operators find them next to the existing files. Retention: keep at most
  # CELNET_LOG_MAX_FILES rolled files per sink (logrotate is a belt-and-braces
  # backstop — see roles/celnet_provision logrotate template).
  CELNET_LOG_DIR:   "{{ celnet_log_dir }}"
  CELNET_LOG_MAX_FILES: "14"
  # FIX acceptors are NOT configured via this legacy env knob. The server binds its
  # FIX 4.4 acceptors from the MANAGED registry (fix-connections.json, edited in the
  # GUI FIX admin) — on this host that is "celer" (FX/options) at 127.0.0.1:51001 and
  # an FI quote venue at 127.0.0.1:9100. Setting CELNET_FIX_ADDR here binds a SECOND,
  # legacy acceptor that collides with the registry and aborts boot with EADDRINUSE
  # (took the server down 2026-07-01). The quote simulator dials the managed acceptor
  # directly — see deploy/start-fix-sim.sh. Do NOT re-enable CELNET_FIX_ADDR unless the
  # managed registry is empty.
  # Optional integrations — uncomment / set per environment as needed:
  # CELNET_VENDOR_WS:    "wss://vendor.example/feed"
  # CELNET_FLEET_MODE:   ""
  # CELNET_FLEET_BACKENDS: ""

# --- HAProxy edge -----------------------------------------------------------
celnet_haproxy_enabled: true
# Edge listen address: 0.0.0.0 = all IPv4 interfaces (set a specific IP to pin).
celnet_bind_address: "0.0.0.0"
celnet_http_port:  80
celnet_https_port: 443
# The browser/GUI-facing backend is the WebSocket JSON mirror of the contract.
celnet_backend_ws:   "{{ celnet_ws_addr }}"
celnet_backend_grpc: "{{ celnet_grpc_addr }}"
# Front gRPC (HTTP/2) on a second TLS port as well? Off by default (WS is the
# browser path). When true, HAProxy also listens on celnet_grpc_https_port.
celnet_expose_grpc: false
celnet_grpc_https_port: 8443
# TLS: by default we generate a self-signed cert for UAT. Drop a real
# cert+key PEM at {{ celnet_tls_pem }} (or set celnet_tls_generate_self_signed:
# false and provide one) to use a CA-issued certificate.
celnet_tls_generate_self_signed: true
celnet_tls_pem: "{{ celnet_tls_dir }}/{{ celnet_domain }}.pem"

# --- Web app (GUI SPA served by nginx behind HAProxy) -----------------------
# When true, the GUI is built on the host and served at https://<domain>/ ;
# WebSocket-upgrade requests still go to the celnet-server mirror.
celnet_serve_gui: true
celnet_node_major: 20                       # Node.js major (NodeSource) for the Vite build
celnet_nginx_port: 8080                      # loopback port nginx serves the SPA on
# Empty ⇒ the GUI derives a SAME-ORIGIN WS URL at runtime (wss://<page-host>/), so
# the socket always follows the domain that served the SPA (HAProxy fronts both the
# SPA and the WS mirror host-agnostically). Set to an absolute `wss://host/` only to
# pin a cross-origin mirror. See gui/src/data/transportConfig.ts (sameOriginWsUrl).
celnet_web_ws_url: ""                              # baked into the build (VITE_CELNET_WS_URL)
