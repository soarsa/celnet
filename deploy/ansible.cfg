# Celnet deployment — Ansible configuration.
# All paths are relative to this file, so the menu / playbooks work from `deploy/`.
[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
forks                = 10
timeout              = 30

[ssh_connection]
# Pipelining + persistent control sockets keep the build/deploy loop snappy.
pipelining           = True
ssh_args             = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
