# Celnet inventory.
#
# Groups map to environments. `group_vars/<group>.yml` carries per-environment
# settings (domain, ports, env vars); `group_vars/all.yml` carries shared defaults.
#
# Connection: key-based SSH as the `celnet` service account. The account needs
# passwordless sudo ONLY for the one-time "full setup" (packages, user, HAProxy).
# Binary releases, rollbacks and start/stop run unprivileged ( /opt/celnet is
# owned by `celnet` ).

[uat]
uat-celnet ansible_host=136.114.170.5 ansible_user=celnet

# All Celnet hosts (handy for ad-hoc fact gathering / pings across environments).
[celnet:children]
uat
