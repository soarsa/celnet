---
# Build a release ON the target host and publish it as an immutable release dir
# with an atomic `current` symlink swap. Unprivileged (/opt/celnet is celnet-owned).

- name: Assert a release name is set
  ansible.builtin.assert:
    that: celnet_release_name | length > 0
    fail_msg: "celnet_release_name is empty (it is normally computed by the playbook)."

- name: Sync workspace source to the build dir (rsync; target/ preserved for incremental builds)
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ celnet_build_dir }}/"
    archive: true
    delete: true
    rsync_opts:
      - "--exclude=.git/"
      - "--exclude=target/"          # remote cargo cache persists → incremental
      - "--exclude=.cargo/"          # repo .cargo/config.toml wires sccache (not on host)
      - "--exclude=deploy/"          # the deploy tree is not needed to build
      - "--exclude=gui/node_modules/"
      - "--exclude=gui/dist/"
      - "--exclude=excel/node_modules/"
      # Local-only Playwright/e2e output. Its dirs embed the test title — which
      # contains an em-dash ("Celnet GUI — …") — so the names carry multi-byte
      # UTF-8; under a non-UTF-8 deploy locale the synchronize module fails to
      # decode rsync's itemized output ("returned non UTF-8 data"). None of it is
      # a build input, so excluding it both fixes the deploy and trims the sync.
      - "--exclude=gui/test-results/"
      - "--exclude=gui/playwright-report/"
      - "--exclude=gui/e2e-artifacts/"
      - "--exclude=excel/dist/"
      - "--exclude=.serena/"
      - "--exclude=*.log"
  become: false

# rsync --delete does NOT remove EXCLUDED paths, so a .cargo synced by an earlier
# run would linger and keep wiring sccache. Remove it explicitly; the host builds
# with the default cargo config (no rustc wrapper).
- name: Remove any build-dir .cargo (sccache wrapper config) from prior syncs
  ansible.builtin.file:
    path: "{{ celnet_build_dir }}/.cargo"
    state: absent
  become: false

# Force the PRODUCT crates to rebuild from the freshly-synced source, defeating a
# recurring stale-binary bug: rsync preserves source mtimes, so cargo's incremental
# fingerprint could see "source older than the cached artifact" and SKIP recompiling
# celnet-server — shipping an OLD binary inside a correctly-named release (this is the
# root cause of the recurring "risk not dropping into portfolios" symptom). `cargo clean
# -p <product-crates>` removes ONLY these crates' artifacts (the hundreds of dependency
# crates stay cached, so the build stays fast + within the RAM cap), guaranteeing the
# shipped binary always reflects the synced source.
- name: Force-rebuild the product crates (defeat rsync-mtime incremental staleness)
  ansible.builtin.shell: >-
    source "{{ celnet_base }}/.cargo/env" &&
    cargo clean --release {{ celnet_build_packages | map('regex_replace', '^(.*)$', '-p \1') | join(' ') }}
  args:
    chdir: "{{ celnet_build_dir }}"
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ celnet_base }}/.cargo"
    RUSTUP_HOME: "{{ celnet_base }}/.rustup"
    RUSTC_WRAPPER: ""
  changed_when: true

- name: Build release binaries (cargo build --release, incremental)
  ansible.builtin.shell: >-
    source "{{ celnet_base }}/.cargo/env" &&
    cargo build --release {{ celnet_build_packages | map('regex_replace', '^(.*)$', '-p \1') | join(' ') }}
  args:
    chdir: "{{ celnet_build_dir }}"
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ celnet_base }}/.cargo"
    RUSTUP_HOME: "{{ celnet_base }}/.rustup"
    CARGO_TERM_COLOR: "never"
    RUSTC_WRAPPER: ""        # guard: never use sccache on the host
    # Cap parallel codegen jobs so a full release build fits the swapless UAT box's RAM —
    # an unbounded build OOM-kills the box mid-link (celnet-server is the memory peak).
    # Tune with -e celnet_cargo_build_jobs=N; raise it on a larger host.
    CARGO_BUILD_JOBS: "{{ celnet_cargo_build_jobs | default('2') }}"
  register: celnet_build
  changed_when: true

- name: Create the release bin directory
  ansible.builtin.file:
    path: "{{ celnet_releases_dir }}/{{ celnet_release_name }}/bin"
    state: directory
    mode: "0755"

- name: Install built binaries into the release
  ansible.builtin.copy:
    src: "{{ celnet_build_dir }}/target/release/{{ item }}"
    dest: "{{ celnet_releases_dir }}/{{ celnet_release_name }}/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: "{{ celnet_bins }}"

# --- FIX quote simulator (opt-in via celnet_fixsim_enabled) -----------------
# Build the celnet-fix RFQ client example and ship it into the release bin, plus
# the launcher, so the simulator runs ON the server (the celnet user has no cargo
# at runtime — the build here uses the release toolchain at {{ celnet_base }}/.cargo).
- name: Build the FIX quote-simulator RFQ client (celnet-fix example)
  ansible.builtin.shell: >-
    source "{{ celnet_base }}/.cargo/env" &&
    cargo build --release -p celnet-fix --example fix_rfq_client
  args:
    chdir: "{{ celnet_build_dir }}"
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ celnet_base }}/.cargo"
    RUSTUP_HOME: "{{ celnet_base }}/.rustup"
    RUSTC_WRAPPER: ""
    CARGO_BUILD_JOBS: "{{ celnet_cargo_build_jobs | default('2') }}"
  changed_when: true
  when: celnet_fixsim_enabled | default(true) | bool

- name: Install the FIX quote-simulator RFQ client into the release
  ansible.builtin.copy:
    src: "{{ celnet_build_dir }}/target/release/examples/fix_rfq_client"
    dest: "{{ celnet_releases_dir }}/{{ celnet_release_name }}/bin/fix-rfq-client"
    mode: "0755"
    remote_src: true
  when: celnet_fixsim_enabled | default(true) | bool

- name: Install the FIX quote-simulator launcher (start-fix-sim.sh) into shared bin
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/start-fix-sim.sh"
    dest: "{{ celnet_bin_dir }}/start-fix-sim.sh"
    mode: "0755"
  when: celnet_fixsim_enabled | default(true) | bool

# Build the LP-SIM Treasury liquidity feed binary and ship it into the release bin,
# plus its launcher, so the feed runs ON the server (the celnet user has no cargo at
# runtime — the build here uses the release toolchain at {{ celnet_base }}/.cargo).
# The lp-sim binary embeds the Treasury universe, so no data file is shipped.
- name: Build the LP-SIM Treasury liquidity feed (celnet-lp-sim bin)
  ansible.builtin.shell: >-
    source "{{ celnet_base }}/.cargo/env" &&
    cargo build --release -p celnet-lp-sim --bin lp-sim
  args:
    chdir: "{{ celnet_build_dir }}"
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ celnet_base }}/.cargo"
    RUSTUP_HOME: "{{ celnet_base }}/.rustup"
    RUSTC_WRAPPER: ""
    CARGO_BUILD_JOBS: "{{ celnet_cargo_build_jobs | default('2') }}"
  changed_when: true
  when: celnet_lpsim_enabled | default(true) | bool

- name: Install the LP-SIM feed binary into the release
  ansible.builtin.copy:
    src: "{{ celnet_build_dir }}/target/release/lp-sim"
    dest: "{{ celnet_releases_dir }}/{{ celnet_release_name }}/bin/lp-sim"
    mode: "0755"
    remote_src: true
  when: celnet_lpsim_enabled | default(true) | bool

- name: Install the LP-SIM feed launcher (start-lp-sim.sh) into shared bin
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/start-lp-sim.sh"
    dest: "{{ celnet_bin_dir }}/start-lp-sim.sh"
    mode: "0755"
  when: celnet_lpsim_enabled | default(true) | bool

- name: Write the release VERSION marker
  ansible.builtin.copy:
    dest: "{{ celnet_releases_dir }}/{{ celnet_release_name }}/VERSION"
    mode: "0644"
    content: |
      release={{ celnet_release_name }}
      built_on={{ inventory_hostname }}
      built_at={{ ansible_date_time.iso8601 | default('n/a') }}
      bins={{ celnet_bins | join(',') }}

# --- GUI SPA build (Vite/React) -> releases/<rel>/web -----------------------
- name: Install GUI dependencies (npm ci)
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ celnet_build_dir }}/gui"
  environment:
    npm_config_fund: "false"
    npm_config_audit: "false"
  when: celnet_serve_gui | bool
  changed_when: true

- name: Build the GUI (Vite) with the production WS endpoint baked in
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ celnet_build_dir }}/gui"
  environment:
    VITE_CELNET_WS_URL: "{{ celnet_web_ws_url }}"
  when: celnet_serve_gui | bool
  changed_when: true

- name: Publish the built SPA into the release (releases/<rel>/web)
  ansible.builtin.command: >-
    cp -a {{ celnet_build_dir }}/gui/dist {{ celnet_releases_dir }}/{{ celnet_release_name }}/web
  when: celnet_serve_gui | bool
  changed_when: true

- name: Atomically swap the current symlink to this release
  ansible.builtin.command: >-
    ln -sfn {{ celnet_releases_dir }}/{{ celnet_release_name }} {{ celnet_current_link }}
  changed_when: true

- name: Enumerate releases for pruning (newest first)
  ansible.builtin.find:
    paths: "{{ celnet_releases_dir }}"
    file_type: directory
    recurse: false
  register: celnet_all_releases

- name: Prune old releases (keep newest {{ celnet_keep_releases }})
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  # Sort newest-first, then drop everything past the keep count via Jinja slicing.
  # The just-published release is the newest, so it is always retained.
  loop: >-
    {{ (celnet_all_releases.files
        | sort(attribute='mtime', reverse=true)
        | map(attribute='path') | list)[celnet_keep_releases | int:] }}
  when: celnet_all_releases.files | length > (celnet_keep_releases | int)

# --- Reclaim the cargo build cache (disk hygiene) ---------------------------
# The build dir keeps target/ for incremental builds, but on this disk-tight box
# that cache (GBs) accumulates and has filled the disk. Every artifact needed
# from target/ was already copied into the release above, so after a successful
# publish we drop it. Trade-off: the next deploy is a full (non-incremental)
# rebuild. node_modules is deliberately KEPT (npm ci OOMs on the small box).
# Set celnet_clean_build_cache: false to keep the incremental cache instead.
- name: Reclaim the cargo build cache after publish (celnet_clean_build_cache)
  ansible.builtin.file:
    path: "{{ celnet_build_dir }}/target"
    state: absent
  become: false
  when: celnet_clean_build_cache | default(true) | bool
