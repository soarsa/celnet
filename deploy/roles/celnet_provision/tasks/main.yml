---
# Provision a Celnet host: service account, directory skeleton, build
# prerequisites, the Rust toolchain (rustup), the runtime env file, and the
# celnetctl start/stop control script. Privileged (become: true at play level).

- name: Read existing passwd entries
  ansible.builtin.getent:
    database: passwd

- name: Ensure celnet group exists
  ansible.builtin.group:
    name: "{{ celnet_group }}"
    system: true

# Only CREATE the account when it is missing. When we connect as `celnet`
# itself, the account already exists and its live SSH session means `usermod`
# would fail ("user is currently used by process ..."); skipping avoids that and
# is correct — there is nothing to change. When provisioning as an admin account
# (root/ubuntu/etc.), this creates the celnet service account.
- name: Create celnet service account (only if missing)
  ansible.builtin.user:
    name: "{{ celnet_user }}"
    group: "{{ celnet_group }}"
    home: "{{ celnet_base }}"
    shell: /bin/bash
    system: true
    create_home: false
  when: celnet_user not in ansible_facts.getent_passwd

- name: Install build & runtime prerequisites (apt)
  ansible.builtin.apt:
    name:
      - build-essential      # cc/linker for cc-using crates
      - pkg-config
      - curl                 # rustup installer
      - git
      - rsync                # source push (synchronize)
      - ca-certificates
      - openssl              # self-signed TLS cert generation
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_pkg_mgr == 'apt'

# --- Swap file: absorb the release-build memory peaks so the box stops OOM-dying.
# See celnet_provision/defaults/main.yml for the full rationale. Idempotent: the
# file is created + formatted only when absent, activated only when inactive, and
# persisted in /etc/fstab so a reboot keeps it. mkswap is guarded on "was absent"
# so a re-run never reformats an already-active swap area.
- name: Check for an existing swap file
  ansible.builtin.stat:
    path: "{{ celnet_swap_path }}"
  register: celnet_swap_stat
  when: celnet_swap_enabled | bool

- name: Allocate the swap file ({{ celnet_swap_size_mb }} MB) with dd (hole-free ⇒ swapon-safe)
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ celnet_swap_path }} bs=1M count={{ celnet_swap_size_mb }}"
  when:
    - celnet_swap_enabled | bool
    - not celnet_swap_stat.stat.exists
  changed_when: true

- name: Secure the swap file (root-only 0600)
  ansible.builtin.file:
    path: "{{ celnet_swap_path }}"
    owner: root
    group: root
    mode: "0600"
  when: celnet_swap_enabled | bool

- name: Initialise the swap area (mkswap) on a freshly-created file
  ansible.builtin.command:
    cmd: "mkswap {{ celnet_swap_path }}"
  when:
    - celnet_swap_enabled | bool
    - not celnet_swap_stat.stat.exists
  changed_when: true

- name: Persist the swap file in /etc/fstab (survives reboot / recreation baking)
  ansible.posix.mount:
    path: none
    src: "{{ celnet_swap_path }}"
    fstype: swap
    opts: sw
    state: present
  when: celnet_swap_enabled | bool

- name: List active swap areas
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: celnet_active_swap
  changed_when: false
  when: celnet_swap_enabled | bool

- name: Activate the swap file now (swapon) if inactive
  ansible.builtin.command:
    cmd: "swapon {{ celnet_swap_path }}"
  when:
    - celnet_swap_enabled | bool
    - celnet_swap_path not in (celnet_active_swap.stdout | default(''))
  changed_when: true

- name: Tune vm.swappiness (favour RAM; spill to swap only under real pressure)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ celnet_swappiness | string }}"
    state: present
    sysctl_set: true
    reload: true
  when: celnet_swap_enabled | bool

- name: Check for an existing Node.js
  ansible.builtin.stat:
    path: /usr/bin/node
  register: celnet_node_stat
  when: celnet_serve_gui | bool

- name: Add the NodeSource {{ celnet_node_major }}.x apt repo (for the GUI build)
  ansible.builtin.shell: "curl -fsSL https://deb.nodesource.com/setup_{{ celnet_node_major }}.x | bash -"
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nodesource.list
  when:
    - celnet_serve_gui | bool
    - not celnet_node_stat.stat.exists

- name: Install Node.js (Vite/React build toolchain)
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  when:
    - celnet_serve_gui | bool
    - not celnet_node_stat.stat.exists

- name: Create the /opt/celnet directory skeleton
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ celnet_user }}"
    group: "{{ celnet_group }}"
    mode: "0755"
  loop:
    - "{{ celnet_base }}"
    - "{{ celnet_releases_dir }}"
    - "{{ celnet_shared_dir }}"
    - "{{ celnet_config_dir }}"
    - "{{ celnet_log_dir }}"
    - "{{ celnet_run_dir }}"
    - "{{ celnet_bin_dir }}"
    - "{{ celnet_tls_dir }}"
    - "{{ celnet_build_dir }}"

- name: Check for an existing rustup/cargo install
  ansible.builtin.stat:
    path: "{{ celnet_base }}/.cargo/bin/cargo"
  register: celnet_cargo_stat

- name: Install rustup (per service account; channel comes from rust-toolchain.toml)
  ansible.builtin.shell: >-
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
    sh -s -- -y --no-modify-path --profile {{ celnet_rust_profile }} --default-toolchain none
  args:
    creates: "{{ celnet_base }}/.cargo/bin/cargo"
  become: true
  become_user: "{{ celnet_user }}"
  environment:
    CARGO_HOME: "{{ celnet_base }}/.cargo"
    RUSTUP_HOME: "{{ celnet_base }}/.rustup"
  when: not celnet_cargo_stat.stat.exists

- name: Template the runtime env file
  ansible.builtin.template:
    src: celnet.env.j2
    dest: "{{ celnet_config_dir }}/celnet.env"
    owner: "{{ celnet_user }}"
    group: "{{ celnet_group }}"
    mode: "0640"
  notify: restart celnet-server

- name: Install the logrotate policy for the stdout capture logs
  ansible.builtin.template:
    src: celnet-logrotate.j2
    dest: /etc/logrotate.d/celnet
    owner: root
    group: root
    mode: "0644"

- name: Install the celnetctl start/stop control script
  ansible.builtin.template:
    src: celnetctl.sh.j2
    dest: "{{ celnet_bin_dir }}/celnetctl"
    owner: "{{ celnet_user }}"
    group: "{{ celnet_group }}"
    mode: "0755"

- name: Install the fixsimctl FIX quote-simulator control script
  ansible.builtin.template:
    src: fixsimctl.sh.j2
    dest: "{{ celnet_bin_dir }}/fixsimctl"
    owner: "{{ celnet_user }}"
    group: "{{ celnet_group }}"
    mode: "0755"
  when: celnet_fixsim_enabled | default(true) | bool

- name: Install the lpsimctl LP-SIM Treasury-feed control script
  ansible.builtin.template:
    src: lpsimctl.sh.j2
    dest: "{{ celnet_bin_dir }}/lpsimctl"
    owner: "{{ celnet_user }}"
    group: "{{ celnet_group }}"
    mode: "0755"
  when: celnet_lpsim_enabled | default(true) | bool
