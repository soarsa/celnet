---
# Seconds to wait for a graceful drain on stop before SIGKILL.
celnet_stop_drain_seconds: 35

# --- Restart race controls (the SIGKILL → immediate-rebind AddrInUse race) -----
# `restart` used to run `stop; start` back-to-back. SIGKILL is ASYNCHRONOUS: `kill`
# returns long before the kernel has torn the process down and released its listening
# sockets, so `start` bound a port the corpse still held and died with
# `Os { code: 98, AddrInUse }` — leaving the server DOWN on a routine deploy (observed
# 2026-08-11 15:04, and once before). Three bounded waits close it.

# After SIGKILL, seconds to wait for the process to actually be reaped before declaring
# it stopped. A drain that timed out implies many connections still to tear down.
celnet_kill_wait_seconds: 10

# After stop, seconds to wait for every listening port to be released before starting.
celnet_port_free_wait_seconds: 20

# Bind attempts in `start`. Retries fire ONLY on an address-in-use failure (backing off
# 2s, 4s, 8s); every other startup failure surfaces immediately rather than being masked.
celnet_start_attempts: 4

# Seconds to let a freshly spawned server settle before deciding it started. Must exceed
# the time the process takes to FAIL its bind, or a crash would read as a success.
celnet_start_settle_seconds: 2

# --- Swap file (absorb release-build memory peaks on the small UAT box) --------
# The box builds the release ON the host: celnet-server compiles at opt-level=3 +
# linker-plugin-lto + codegen-units=1, so a single rustc peaks ~1.7 GiB, and the
# concurrent npm ci / Vite build spikes again. On a ~4 GiB box with ZERO swap those
# transient peaks exceed physical RAM → the kernel OOM-killer fires and takes the
# box down (it is then recreated by the cloud health check, which is why the OOM
# logs never survive). A swap file absorbs the peaks at a speed cost instead of a
# death. Set celnet_swap_enabled=false to skip; size/swappiness are tunable.
celnet_swap_enabled: true
celnet_swap_path: /swapfile
celnet_swap_size_mb: 4096          # 4 GiB — covers the celnet-server LTO + Vite peaks
celnet_swappiness: 10              # prefer RAM; spill to swap only under genuine pressure

# --- Simulator fleet (a DEPLOY CONFIGURATION) ---------------------------------
# One master switch over the whole simulator fleet, above the per-simulator
# `celnet_lpsim_enabled` / `celnet_fixsim_enabled` flags. False ⇒ no simulator
# binary is shipped, no control script is installed, and nothing is started: a
# genuinely sim-free environment, which is what a real deployment wants. True ⇒
# the per-simulator flags decide which legs run. Four inbound connections in all:
# LP-SIM (liquidity providers → LpFeed ingest) plus the RFQ, RFS and ESP FIX
# client legs.
celnet_simulators_enabled: true

# Bind the simulator fleet's lifecycle to the SERVER's, so `celnetctl start/stop/
# restart` takes the sims down and brings them back with it. Every simulator is a
# long-lived CLIENT of celnet-server: a restart that leaves them running orphans
# the previous generation (they survive in reconnect loops while a new generation
# is launched on top), and a leaked sim still authenticates and still pushes
# quotes — so it surfaces on the LP Panel as a provider matching nothing the
# operator configured. False decouples them for an operator driving sims by hand.
celnet_simulators_restart_with_server: true

# After signalling the fleet, seconds to wait for the processes to actually be
# reaped. As with the server's own stop, SIGKILL is asynchronous — returning before
# the reap is what lets the next start race a corpse that still holds its session.
celnet_simulators_reap_wait_seconds: 10

# --- Simulator service identities ---------------------------------------------
# The simulators authenticate as their OWN dedicated, least-privilege accounts —
# never as `admin@celnet.com`, and never with a `--password` flag (argv is
# world-readable, so a flag publishes the secret to every local account via `ps`).
#
# Each identity's password is GENERATED per environment by
# `deploy/provision-sim-identities.mjs`, stored in a `0600` file readable only by
# the service account, and Argon2id-hashed at rest in `identity.json` exactly like
# any other user. No secret is ever committed to this repository.
#
# See `docs/SIMULATOR-SERVICE-IDENTITIES.md` for the capability rationale.
celnet_lpsim_user: lp-sim@svc.celnet.local
celnet_fixsim_user: fix-sim@svc.celnet.local
celnet_lpsim_password_file: "/home/{{ celnet_user }}/.lpsim_pw"
celnet_fixsim_password_file: "/home/{{ celnet_user }}/.fixsim_pw"

# Run the provisioner during a play to create/repair the service identities.
# It is IDEMPOTENT: an existing password file is reused (so a re-run never
# invalidates the credential a running daemon already loaded), the password is
# only reset when it no longer authenticates, and the capability lock-down
# converges to the same deny set on every run.
#
# It needs an ADMIN credential, which is deliberately NOT stored in this repo or
# in group_vars: point `celnet_admin_password_file` at a 0600 file placed on the
# box out of band. When that file is absent the provisioning step is SKIPPED with
# a clear message rather than failing the play — a box whose identities are
# already provisioned needs no admin credential to deploy.
celnet_provision_sim_identities: true
celnet_admin_email: admin@celnet.com
celnet_admin_password_file: "/home/{{ celnet_user }}/.celnet_admin_pw"
