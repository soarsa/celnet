---
# Seconds to wait for a graceful drain on stop before SIGKILL.
celnet_stop_drain_seconds: 35

# --- Restart race controls (the SIGKILL → immediate-rebind AddrInUse race) -----
# `restart` used to run `stop; start` back-to-back. SIGKILL is ASYNCHRONOUS: `kill`
# returns long before the kernel has torn the process down and released its listening
# sockets, so `start` bound a port the corpse still held and died with
# `Os { code: 98, AddrInUse }` — leaving the server DOWN on a routine deploy (observed
# 2026-08-11 15:04, and once before). Three bounded waits close it.

# After SIGKILL, seconds to wait for the process to actually be reaped before declaring
# it stopped. A drain that timed out implies many connections still to tear down.
celnet_kill_wait_seconds: 10

# After stop, seconds to wait for every listening port to be released before starting.
celnet_port_free_wait_seconds: 20

# Bind attempts in `start`. Retries fire ONLY on an address-in-use failure (backing off
# 2s, 4s, 8s); every other startup failure surfaces immediately rather than being masked.
celnet_start_attempts: 4

# Seconds to let a freshly spawned server settle before deciding it started. Must exceed
# the time the process takes to FAIL its bind, or a crash would read as a success.
celnet_start_settle_seconds: 2

# --- Swap file (absorb release-build memory peaks on the small UAT box) --------
# The box builds the release ON the host: celnet-server compiles at opt-level=3 +
# linker-plugin-lto + codegen-units=1, so a single rustc peaks ~1.7 GiB, and the
# concurrent npm ci / Vite build spikes again. On a ~4 GiB box with ZERO swap those
# transient peaks exceed physical RAM → the kernel OOM-killer fires and takes the
# box down (it is then recreated by the cloud health check, which is why the OOM
# logs never survive). A swap file absorbs the peaks at a speed cost instead of a
# death. Set celnet_swap_enabled=false to skip; size/swappiness are tunable.
celnet_swap_enabled: true
celnet_swap_path: /swapfile
celnet_swap_size_mb: 4096          # 4 GiB — covers the celnet-server LTO + Vite peaks
celnet_swappiness: 10              # prefer RAM; spill to swap only under genuine pressure
