# Celnet — flat virtual workspace (matklad/rust-analyzer style).
# Crate folders under crates/ are named identically to their crate names.
# Versions and lint policy are pinned centrally here; one committed Cargo.lock.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
authors = ["Celer Technologies"]

[workspace.dependencies]
# Internal crates — registered centrally so parallel "lane" agents never edit this
# file (the sole shared manifest); each agent only touches its own crates/<name>/.
celnet-types = { path = "crates/celnet-types" }
celnet-core = { path = "crates/celnet-core" }
celnet-vanilla = { path = "crates/celnet-vanilla" }
celnet-calendar = { path = "crates/celnet-calendar" }
celnet-conventions = { path = "crates/celnet-conventions" }
celnet-testkit = { path = "crates/celnet-testkit" }
celnet-proto = { path = "crates/celnet-proto" }
celnet-plugin-api = { path = "crates/celnet-plugin-api" }
celnet-surface = { path = "crates/celnet-surface" }
celnet-exotics = { path = "crates/celnet-exotics" }
celnet-gpu = { path = "crates/celnet-gpu" }
celnet-engine = { path = "crates/celnet-engine" }
celnet-integration = { path = "crates/celnet-integration" }
celnet-server = { path = "crates/celnet-server" }
celnet-client = { path = "crates/celnet-client" }
celnet-observability = { path = "crates/celnet-observability" }
celnet-parity = { path = "crates/celnet-parity" }
celnet-plugin-host = { path = "crates/celnet-plugin-host" }
celnet-router = { path = "crates/celnet-router" }
celnet-fix = { path = "crates/celnet-fix" }
celnet-journal = { path = "crates/celnet-journal" }
celnet-risk-normalize = { path = "crates/celnet-risk-normalize" }
celnet-risk-cube = { path = "crates/celnet-risk-cube" }
celnet-entitlements = { path = "crates/celnet-entitlements" }
celnet-limits = { path = "crates/celnet-limits" }
celnet-risk-fleet = { path = "crates/celnet-risk-fleet" }
celnet-fanout = { path = "crates/celnet-fanout" }
celnet-golden = { path = "crates/celnet-golden" }
celnet-qmc = { path = "crates/celnet-qmc" }
celnet-heston = { path = "crates/celnet-heston" }
celnet-replog = { path = "crates/celnet-replog" }
celnet-xva = { path = "crates/celnet-xva" }
celnet-linear = { path = "crates/celnet-linear" }
# External — pinned once, used everywhere (OSS / permissively licensed only)
libm = "0.2"                                   # rust-lang/libm: correctly-rounded, cross-platform-identical transcendentals
serde = { version = "1", features = ["derive"] }
proptest = "1"
time = { version = "0.3", default-features = false, features = ["std", "macros"] } # MIT/Apache-2.0 civil-date arithmetic
prost = "0.13"                                 # Apache-2.0 protobuf runtime (single current contract; no version negotiation)
protox = "0.7"                                 # MIT/Apache-2.0 pure-Rust protobuf compiler (no system protoc needed)
prost-build = "0.13"                           # Apache-2.0 codegen used with protox FileDescriptorSet
divan = "0.1"                                  # MIT/Apache-2.0 micro-benchmark harness (latency/throughput proof)
# GPU lane (vetted: deny advisories+licenses ok)
wgpu = { version = "29", default-features = false, features = ["wgsl"] } # Apache-2.0/MIT cross-platform GPU (Metal/Vulkan/DX12)
bytemuck = { version = "1", features = ["derive"] } # MIT/Apache-2.0 POD casts for GPU buffers
pollster = "0.4"                               # MIT/Apache-2.0 minimal block-on for wgpu async
# Engine hot-path lane (vetted: deny advisories+licenses ok)
rtrb = "0.3"                                   # MIT/Apache-2.0 wait-free SPSC ring buffer
arc-swap = "1"                                 # MIT/Apache-2.0 lock-free read-mostly publication
crossbeam-utils = "0.8"                        # MIT/Apache-2.0 CachePadded (false-sharing guard)
core_affinity = "0.8"                          # MIT/Apache-2.0 core pinning for the hot path
thread-priority = "1"                          # MIT/Apache-2.0 safe cross-platform thread QoS/priority (macOS QOS_CLASS / POSIX sched) for the low-jitter in-core latency measurement
# Integration + edge lanes (vetted: deny advisories+licenses ok)
serde_json = "1"                               # MIT/Apache-2.0 vendor-feed (FMD-style) JSON normalization
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] } # MIT async edge runtime
blake3 = "1"                                   # CC0-1.0/Apache-2.0/Apache-2.0-WITH-LLVM-exception keyed-MAC for unforgeable click-to-trade tokens (control plane, NOT pricing)
getrandom = "0.2"                              # MIT/Apache-2.0/BSD-3-Clause OS CSPRNG for the per-process token-MAC secret seed
tonic = "0.12"                                 # MIT gRPC over the wire contract
tonic-build = "0.12"                           # MIT tonic service codegen (build dep)
tokio-tungstenite = "0.24"                     # MIT WebSocket RFS streaming
futures-util = "0.3"                           # MIT/Apache-2.0 stream combinators
clap = { version = "4", features = ["derive"] } # MIT/Apache-2.0 admin CLI
# Observability lane (vetted: deny advisories+licenses ok) — async edge only, never the hot core
tracing = "0.1"                                # MIT structured tracing facade
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] } # MIT subscriber
hdrhistogram = "7"                             # MIT/Apache-2.0 p50/p99/p99.9 latency (coordinated-omission aware)
iai-callgrind = "0.16"                         # MIT/Apache-2.0 jitter-free instruction-count bench gate (Linux+Valgrind CI lane; dev-dep only)
metrics = "0.24"                               # MIT counters/gauges/histograms facade
# Plugin-host sandbox (vetted: deny advisories+licenses ok) — wasmtime REJECTED for open
# 2026 RUSTSEC advisories; wasmi is the pure-Rust, fuel-metered, advisory-clean replacement.
wasmi = "1"                                    # Apache-2.0/MIT pure-Rust fuel-metered Wasm interpreter (deterministic untrusted sandbox)
wat = "1"                                      # Apache-2.0/MIT WAT->wasm (test fixtures only)

# deny(warnings) is enforced via `just lint` (clippy -D warnings); here we set the
# lint *policy* every crate opts into with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"

# Release profile tuned for the latency-sensitive product; reproducible (codegen-units=1).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
