<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Celnet Custom Functions</title>
    <!-- Office.js: the custom-function runtime host loads this page. -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>
      // Dev bring-up: dial the edge over the trusted wss:// bridge when the runtime
      // page is served over HTTPS (a plain ws:// is blocked as mixed content). The
      // functions runtime (functions/runtime.ts) reads this CELNET_WS_ENDPOINT.
      if (location.protocol === "https:") {
        window.CELNET_WS_ENDPOINT = "wss://" + location.hostname + ":8443";
      }
    </script>
    <script type="module" src="./functions/functions.ts"></script>
  </head>
  <body>
    <!-- The custom-function runtime is headless; this page only boots the module. -->
  </body>
</html>
