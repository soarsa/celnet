# Celnet fuzz harness — a STANDALONE crate, deliberately NOT a member of the
# root workspace (so `cargo build --workspace` and the cross-platform gate stay
# stable-toolchain and never pull in the nightly-only libFuzzer sanitizer
# runtime). It is built and run only by the Linux-nightly fuzz CI job:
#
#     rustup toolchain install nightly
#     cargo install cargo-fuzz
#     cd fuzz && cargo +nightly fuzz run vanilla_inputs -- -max_total_time=120
#
# Targets fall in two families:
#   * `vanilla_inputs` — in-domain adversarial pricing inputs (no panic, finite).
#   * the UNTRUSTED-INPUT byte parsers — the real attack surface: hand-rolled
#     socket/disk decoders fed arbitrary bytes. Their contract is NO panic / no
#     UB / Ok-or-typed-Err (never an unwrap on attacker input), bounded alloc:
#       - `replog_log_entry`    celnet_replog::LogEntry::decode
#       - `replog_snapshot`     celnet_replog Snapshot::decode + BookState::decode + BookUpdate::decode
#       - `replog_wire_message` celnet_replog::Message::decode (the Raft RPC frame)
#       - `journal_recover`     celnet_journal::Journal::open + replay (torn-tail recovery)
#       - `proto_convert`       prost decode of the wire contract + convert.rs TryFrom mapping
#       - `fix_frame_decode`    celnet_fix FrameReader (stream delimiter) + FrameCursor::parse
#                               — the ONLY parser fed bytes by an EXTERNAL counterparty
#
# It depends on the product crates by relative path; it never re-implements any
# product logic.
[package]
name = "celnet-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "LicenseRef-Proprietary"

[package.metadata]
# Marks this as a cargo-fuzz harness package (consumed by `cargo fuzz`).
cargo-fuzz = true

[dependencies]
# Nightly-only libFuzzer bindings; pulled only on the fuzz CI lane.
libfuzzer-sys = "0.4"
# `arbitrary` turns raw fuzzer bytes into structured, in-domain inputs.
arbitrary = { version = "1", features = ["derive"] }
# Correctly-rounded, cross-platform `tanh` for the in-domain input squash.
libm = "0.2"
# Product crates under test — referenced by path, no duplicated logic.
celnet-types = { path = "../crates/celnet-types" }
celnet-vanilla = { path = "../crates/celnet-vanilla" }
# The untrusted-input hand-rolled byte parsers (socket + disk attack surface).
celnet-replog = { path = "../crates/celnet-replog" }
celnet-journal = { path = "../crates/celnet-journal" }
# The wire-contract decode path (prost) + the convert.rs domain mapping.
celnet-proto = { path = "../crates/celnet-proto" }
# The FIX engine — the only parser fed bytes by an EXTERNAL counterparty (LP /
# client FIX sessions over TCP): the async stream delimiter + the frame parser.
celnet-fix = { path = "../crates/celnet-fix" }
# The lock-free SPMC fan-out ring + the deterministic fleet router — fuzzed not
# as byte parsers but as PROPERTY surfaces (operation interleavings / membership
# + key combinations) driving the real code with no re-implementation.
celnet-fanout = { path = "../crates/celnet-fanout" }
celnet-router = { path = "../crates/celnet-router" }
# Same protobuf runtime the contract is generated against (workspace pin 0.13).
prost = "0.13"
# Runtime driving the async-edge FIX stream delimiter (`FrameReader` is
# AsyncRead-based). `io-util` is declared explicitly rather than relied on via
# cross-crate feature unification, matching the celnet-fix manifest's own
# discipline (workspace pin: tokio 1).
tokio = { version = "1", features = ["rt", "io-util"] }

[[bin]]
name = "vanilla_inputs"
path = "fuzz_targets/vanilla_inputs.rs"
test = false
doc = false
bench = false

# --- Untrusted-input decode targets (PC-FUZZ-DECODE) ------------------------
# Each feeds arbitrary adversarial bytes straight into a hand-rolled byte parser
# and asserts the per-target contract: no panic / no UB / Ok-or-typed-Err, never
# an unwrap on attacker input, bounded allocation.

[[bin]]
name = "replog_log_entry"
path = "fuzz_targets/replog_log_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replog_snapshot"
path = "fuzz_targets/replog_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replog_wire_message"
path = "fuzz_targets/replog_wire_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_recover"
path = "fuzz_targets/journal_recover.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_convert"
path = "fuzz_targets/proto_convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fix_frame_decode"
path = "fuzz_targets/fix_frame_decode.rs"
test = false
doc = false
bench = false

# --- Property targets (PC-FUZZ-PROPERTY) ------------------------------------
# Not byte parsers: these fuzz the OPERATIONAL surface — arbitrary publish/recv
# interleavings, and arbitrary membership + key combinations — asserting the
# crate's invariants (conflation conservation; HRW routing determinism + the
# inline-scan-vs-sorted-rank differential).

[[bin]]
name = "fanout_ring"
path = "fuzz_targets/fanout_ring.rs"
test = false
doc = false
bench = false

[[bin]]
name = "router_route"
path = "fuzz_targets/router_route.rs"
test = false
doc = false
bench = false

# Release-with-debug profile: optimized fuzzing throughput, symbols for crashes.
[profile.release]
debug = 1

# Keep `cargo build --workspace` from ever treating this as a member crate.
[workspace]
