# cargo-mutants gate configuration — celnet-risk-cube mutation-testing policy.
#
# Mirrors `.config/mutants.toml` (the celnet-vanilla gate) for the risk-cube
# crate: hierarchical additive roll-up (per-ccy NetGreeks + VegaLadder), the
# non-additive bump-and-revalue / sensitivity-Taylor VaR/ES lens, FRTB-SA
# (SbM/curvature/RRAO/DRC) capital aggregation, the GPU spot x vol scenario grid,
# and the exotic risk-cube aggregation. This is safety-critical capital
# arithmetic: a silently-weakened suite here could let a VaR/ES or FRTB capital
# error ship.
#
# How the gate works
# ------------------
# `cargo mutants -p celnet-risk-cube --config .config/mutants-risk-cube.toml`
# applies a syntactic mutant per operator/comparison/return value and re-runs
# the suite; a MISSED mutant is a test gap. cargo-mutants exits non-zero on ANY
# survivor, so the gate enforces ZERO non-equivalent survivors — a future edit
# that weakens the suite below the kill bar fails the build. See HARDENING.md s2.
#
# Equivalence exclusions
# ----------------------
# `exclude_re` lists ONLY provably semantically-equivalent mutants, each
# justified inline with WHY it cannot change an observable result — never to hide
# a real survivor. This crate's baseline (kill-rate + per-cluster equivalence
# argument) is CI-run via `mutation-gate-numerics` (full local mutation of every
# numerics crate in one session is impractical; recorded in HARDENING.md s2). It
# starts empty: the gate runs strict until the CI baseline identifies a genuinely
# equivalent cluster, at which point each member is added here WITH justification.
exclude_re = [
]
