# cargo-mutants gate configuration — celnet-exotics mutation-testing policy.
#
# Mirrors `.config/mutants.toml` (the celnet-vanilla gate) for the exotics
# pricing crate: digitals/touches/DNT, all-8 barriers, window/Asian, var/vol
# swaps, forward-start/cliquet, TARF/accumulator, quanto, lookback, American,
# plus the PDE (Crank-Nicolson/Rannacher, ADI-HV), Monte-Carlo (Philox), and
# particle engines and the LSV booking model.
#
# How the gate works
# ------------------
# `cargo mutants -p celnet-exotics --config .config/mutants-exotics.toml`
# generates a syntactic mutant for every operator/comparison/return value,
# applies it, and re-runs the suite. A mutant the suite still passes ("MISSED")
# is a test gap; a mutant the suite catches (fail/panic/hang->timeout) is caught.
# cargo-mutants exits non-zero on ANY survivor, so this gate enforces ZERO
# non-equivalent survivors: a future edit that weakens the suite below the kill
# bar fails the build. See docs/HARDENING.md section 2.
#
# Equivalence exclusions
# ----------------------
# `exclude_re` lists ONLY mutants that are provably *semantically equivalent* to
# the original — each justified inline with WHY it cannot change an observable
# result — never to hide a real survivor. The baseline (kill-rate + the
# per-cluster equivalence argument) is recorded in docs/HARDENING.md section 2;
# the canonical baseline for this crate is established by the CI
# `mutation-gate-numerics` job (full local mutation of every numerics crate in
# one session is impractical — this crate's baseline is CI-run).
#
# The exclusion set is populated from the audited baseline runs. Each entry is
# the exact cargo-mutants line (`<file>:<line>:<col>: replace ...`) plus an
# inline justification of the equivalence (a measure-zero float-equality
# boundary, a never-hit watchdog cap, an unobservable iteration-internal of a
# converging root-finder/solver, etc.). It starts empty: the gate runs strict
# (every viable mutant must be caught) until an audited run identifies a
# genuinely-equivalent cluster, at which point each member is added here WITH
# its justification.
#
# MEASURED baseline (W6 lane, aarch64-apple-darwin, cargo-mutants 27.0.0,
# toolchain 1.96.0) — file-scoped waves per the W6-ANALYTICS-RIGOR-PLAN §3.5
# wave table, run as `cargo mutants -p celnet-exotics --file '<file>' --jobs 2
# --config .config/mutants-exotics.toml`; results in docs/HARDENING.md §2 and
# the lane's wave commits. `src/touch.rs` is deliberately NOT yet baselined:
# a concurrent P0 fix owns that file and its wave runs post-merge.
#
# TRIAGE MAP (verification economy, JOINT-EXECUTION-PLAN §5, 2026-06-11)
# ----------------------------------------------------------------------
# Full sweeps re-prove what the frozen-bits/oracle suites kill by construction,
# so the gate scope is triaged per file (ledger: /tmp/mutants-exotics, resumed
# with --iterate, never re-ground):
#
# SWEPT (measured, full file-scoped runs — IN gate scope):
#   leverage.rs              192 caught + 4 timeout-caught + 3 audited equivalents
#                            (the 4 timeouts are `bracket`'s loop-advance mutants
#                            `while hi - lo > 1` -> `>=`/`+`/`%`/`*`: each makes
#                            the bisection non-terminating, so the hang IS the
#                            kill — the honest timeout class per the W6 plan;
#                            they re-run on every --iterate pass by design)
#   stochvol.rs              171 caught, zero missed
#   market_hedge_overlay.rs  124 caught + 2 audited subnormal-boundary equivalents
#   particle.rs              101 caught, zero missed
#
# SAMPLE-VALIDATED (bits/oracle-covered — the pin is the kill mechanism; each
# file's coverage + measured sample is recorded as its exclude_globs rationale
# below): see the exclude_globs block.
#
# NOT BASELINED (excluded with cause): touch.rs — see exclude_globs.
#
# Build/test profile
# ------------------
# Waves run with `--profile mutants` ([profile.mutants] in the root
# Cargo.toml): opt-level 2 with debug-assertions + overflow-checks ON. Rust
# float semantics are optimization-independent (no fast-math, no implicit
# FMA), so the ~120 frozen `to_bits` byte-identity gates hold bit-for-bit
# under the profile — verified by running the full crate suite green under
# `--profile mutants` before the first wave.
profile = "mutants"

exclude_re = [
  # --- market_price_of_hedge_smile: division-guard subnormal boundary ---
  # `rr_vanna.abs() > 1e-300` vs `>=` (and the `bf_volga` twin on line 194):
  # the mutant differs from the original ONLY when the guarded quantity equals
  # the single f64 value 1e-300 EXACTLY. `rr_vanna = call.vanna - put.vanna`
  # (resp. `bf_volga = call.volga + put.volga`) is an f64 add/sub whose result
  # is either 0.0 or at least one ulp of its larger operand, so a result of
  # exactly 1e-300 (~2^-996.5) requires BOTH wing Greeks themselves to have
  # magnitude < ~1e-292 — reached only after phi(d1) has underflowed
  # (|d1| > ~37, strikes astronomically far from the forward), and even in
  # that regime landing on that one bit pattern is a measure-zero
  # float-equality boundary that cannot be constructed through the public API
  # (the operands are internal Black-Scholes Greeks, not caller-supplied).
  # Re-audited 2026-06-10: the prior wave's "timeout" on these two was
  # build-contention noise; a clean re-run reports MISSED, i.e. the suite
  # passes because the mutant is behaviourally identical on every reachable
  # input. Same equivalence class as the vanilla gate's
  # `solver.rs:108:35 > -> >=` subnormal-boundary exclusion.
  "market_hedge_overlay\\.rs:189:41: replace > with >=",
  "market_hedge_overlay\\.rs:194:41: replace > with >=",

  # --- local_var: denominator floor-guard boundary computes the SAME value ---
  # `denom > 1e-8 { wt / denom } else { wt / 1e-8 }` (leverage.rs:150): the
  # `>` -> `>=` mutant differs only when `denom == 1e-8` exactly, and there
  # BOTH branches evaluate to `wt / 1e-8` — bit-identical output on the only
  # input where the branch choice differs. Equivalent by construction (stronger
  # than the usual measure-zero argument: even ON the boundary the result is
  # the same f64).
  "leverage\\.rs:150:27: replace > with >=",

  # --- bracket: hi-sentinel initialisation is bisection-invariant ---
  # `let mut hi = n - 1` -> `n + 1` (and `n / 1` == `n`): the early returns
  # guarantee `x < grid[n-1]` strictly before the loop, so `grid[n-1] <= x` is
  # false and `lo` can never reach `n-1`; hence `mid = (lo+hi)/2 <= n-1` (no
  # out-of-bounds read) and the bisection contracts `hi` below `n` on its first
  # comparison against the true bracket, terminating at the SAME unique
  # `(lo, lo+1, frac)` with `grid[lo] <= x < grid[lo+1]`. The mutated start
  # value acts as a +inf sentinel; every reachable output (incl. NaN x, which
  # falls through both comparisons identically) is bit-identical. Audited
  # 2026-06-11 (the E1 resume's 3 MISSED); the loop-ADVANCE mutants on lines
  # 274-275 are NOT excluded — they hang and are timeout-caught.
  "leverage\\.rs:273:20: replace - with \\+ in bracket",
  "leverage\\.rs:273:20: replace - with / in bracket",
]

# Files NOT in the runnable gate scope, each with its honest coverage record.
# (Glob exclusion is the verification-economy mechanism — JOINT-EXECUTION-PLAN
# §5: where frozen-bits/oracle suites pin a file's arithmetic, the pin IS the
# kill mechanism; it is validated with a measured per-file SAMPLE, recorded
# here, and the file is excluded from the recurring gate rather than re-ground.
# An exclusion is NEVER added over an untriaged survivor.)
exclude_globs = [
  # touch.rs — owned by the concurrent session-B P0 fix (B2); its wave runs
  # post-merge as task A5. Not baselined here to avoid gating another lane's
  # in-flight file. 11 in-module tests + the celnet-golden grid cover it
  # meanwhile.
  "src/touch.rs",
]
