# Celnet CI — the full gate (fmt, clippy -D warnings, nextest, cargo-deny) across
# Linux/macOS/Windows on the pinned stable toolchain (1.96.0) and the MSRV (1.96).
#
# Notes on this workflow:
#   * The toolchain is pinned by `rust-toolchain.toml` to 1.96.0 (= the MSRV), so
#     "stable" and "MSRV" coincide today. We still model them as a matrix so that
#     when the pinned stable is later bumped above the MSRV, the MSRV lane keeps
#     proving 1.96 builds without any workflow surgery — only the matrix values move.
#   * cargo-deny / nextest are installed from prebuilt binaries (taiki-e actions)
#     so CI does not pay a from-source compile on every run.
#   * The GPU/Lavapipe lane (software Vulkan via Mesa llvmpipe) is a separate
#     Linux-only job so the wgpu Vulkan path and the f64 CPU reconciliation are
#     exercised in headless CI where no physical GPU exists.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; cancel superseded runs to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any rustc/cargo warning in addition to clippy's -D warnings.
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform gate: fmt --check, clippy -D warnings, nextest, cargo-deny.
  # Matrix over {ubuntu, macos, windows} x {stable(=1.96.0), msrv(1.96)}.
  # ---------------------------------------------------------------------------
  gate:
    name: gate (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "stable" resolves via rust-toolchain.toml (1.96.0); "1.96" is the explicit
        # MSRV floor. Both are listed so a future stable bump leaves an MSRV lane.
        toolchain: [stable, "1.96"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      # Shared compilation cache keyed on the lock + matrix leg.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
          # Save the cache only from the canonical lane to avoid cross-leg churn.
          save-if: ${{ matrix.toolchain == 'stable' }}

      - name: Install gate binaries (nextest, cargo-deny)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      # fmt check is toolchain-independent; run it once on the stable Linux leg.
      - name: rustfmt --check
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: nextest
        run: cargo nextest run --workspace --all-features

      # Doctests are not executed by nextest; run them explicitly.
      - name: doctests
        run: cargo test --workspace --doc

      # Supply-chain (advisories, bans, licenses, sources). Platform-independent:
      # run it once on the canonical leg to avoid 6x redundant graph resolution.
      - name: cargo-deny
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # GPU / Lavapipe lane (Linux only). Exercises the wgpu Vulkan backend against
  # Mesa's software rasterizer (llvmpipe/lavapipe) so the GPU compute path and
  # its f64 CPU reconciliation run in headless CI with no physical device.
  # Software Vulkan is f32-only; the reconciliation tolerance lives in the test.
  # ---------------------------------------------------------------------------
  gpu-lavapipe:
    name: gpu (linux / lavapipe software vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gpu-lavapipe

      - name: Install Mesa software Vulkan (lavapipe) + Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          # Force the loader to select the llvmpipe/lavapipe software ICD.
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: GPU backend tests (software Vulkan)
        run: cargo nextest run -p celnet-gpu --all-features

  # ---------------------------------------------------------------------------
  # Wire-path latency-under-load regression gate (Linux). Closes the GA gating
  # caveat: the end-to-end wire-path latency is proven under sustained streaming
  # + RFQ load, not merely asserted. `bench_gate` spins the real service edge
  # in-process on an ephemeral loopback port, drives the gate-sized load (RFS
  # streaming subscriptions + concurrent RFQ round-trips), records the
  # client-observed RFQ round-trip in an HdrHistogram, and fails the job if any
  # gated percentile (p50/p99/p99.9/p99.99) regresses beyond the committed
  # baseline (`crates/celnet-bench/baselines/wire_path.json`) tolerance.
  #
  # Built/run with `--release` so the measured numbers reflect the optimized
  # binary (the only meaningful latency baseline). The harness self-terminates
  # (request budget + hard wall-clock cap); the `timeout` step is belt-and-braces
  # so a wedged edge fails the lane fast instead of hanging the pipeline. CI
  # runners are shared, variable-core hosts, so the gate tolerance is generous
  # (+100% = 2x baseline) — it catches a *structural* regression, not jitter.
  bench-gate:
    name: wire-path latency regression gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate

      # Build the gate binary first (outside the timed step) so the timeout
      # bounds only the measured load run, not a cold compile.
      - name: Build bench_gate (release)
        run: cargo build --release -p celnet-bench --bin bench_gate

      - name: Wire-path bench-regression gate
        run: timeout 200 cargo run --release -p celnet-bench --bin bench_gate

  # ---------------------------------------------------------------------------
  # In-core ABSOLUTE §1.2 budget gate (Linux). Runs the low-jitter, pinned,
  # priority-elevated in-core measurement of `celnet_vanilla::greeks` (price +
  # full Greek set) and asserts the absolute `docs/ARCHITECTURE.md` §1.2 ceilings
  # — p50 ≤ 2µs, p99 ≤ 10µs, p99.9 ≤ 25µs — failing the job if any MEASURED
  # percentile exceeds its committed budget number. The op is ~tens of ns, so the
  # budgets pass with hundreds-of-× margin; the measurement (pinning + priority +
  # 10M samples + CO-correction) ensures the measured tail reflects compute, not
  # jitter. Built `--release` (the only meaningful latency baseline); the binary
  # self-terminates on a fixed sample budget, the `timeout` step is belt-and-braces.
  core-load-gate:
    name: in-core §1.2 absolute budget gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: core-load-gate

      - name: Build core_load (release)
        run: cargo build --release -p celnet-bench --bin core_load

      - name: In-core §1.2 absolute budget gate
        run: timeout 200 cargo run --release -p celnet-bench --bin core_load

  # ---------------------------------------------------------------------------
  # iai-callgrind instruction-count gate (Linux + Valgrind). The jitter-free,
  # machine-independent complement to the wall-clock budgets: counts retired
  # instructions / cache accesses / estimated cycles per pricing call under
  # Callgrind, so a code-level regression (an extra branch, a lost inlining, an
  # accidental allocation) is caught the moment it lands. Callgrind is part of
  # Valgrind (Linux/Unix-only — no Windows, no macOS Apple-Silicon), so this is a
  # dedicated Linux lane that installs Valgrind + the iai-callgrind runner and
  # runs the bench via `cargo bench`. Benches are NOT nextest targets, so this
  # never affects the cross-OS `gate` matrix or `just check` on the M4 dev host.
  #
  # This is a real GATE: every benchmark in `benches/iai_instructions.rs`
  # carries soft limits (Ir +5%, EstimatedCycles +10% vs the previous run) and
  # an absolute per-benchmark Ir ceiling (hard limit, checked even on a run
  # with no baseline). On any breach the iai-callgrind runner exits non-zero,
  # `cargo bench` fails, and so does this job — there is no `|| true` and no
  # `continue-on-error` anywhere in this lane.
  #
  # Baseline persistence: iai-callgrind compares against the previous run's
  # output under `target/iai`, so that directory is carried by a DEDICATED
  # actions/cache pair (not rust-cache, whose key churns with Cargo.lock and
  # whose entries are immutable). Restore prefix-matches the newest
  # `iai-baseline-*` entry; save runs only when the job is green and keys on
  # the commit SHA — i.e. the baseline is always "the last green run", a
  # regressing run never advances it, and an INTENDED count change
  # re-baselines automatically on its first green run after merge. GitHub's
  # cache scoping keeps PR-published baselines invisible to other branches.
  # ---------------------------------------------------------------------------
  iai-instructions:
    name: iai instruction-count gate (linux / valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: iai-instructions

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Install iai-callgrind runner
        uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind-runner@0.16.1

      # Rolling instruction-count baseline: prefix-match the newest entry saved
      # by a previous green run (cross-branch entries resolve per GitHub's cache
      # scoping rules), so the soft +5%/+10% limits always have a last-green
      # comparison point. A miss is safe: the hard absolute ceilings still gate
      # the run, and this run then publishes the first baseline.
      - name: Restore instruction-count baseline (last green run)
        uses: actions/cache/restore@v4
        with:
          path: target/iai
          key: iai-baseline-${{ github.sha }}
          restore-keys: |
            iai-baseline-

      - name: Instruction-count bench (celnet-bench / iai_instructions)
        run: timeout 300 cargo bench -p celnet-bench --bench iai_instructions

      # Only reached when the bench step passed (no `if: always()`), so a
      # regressing run can never advance the baseline.
      - name: Save instruction-count baseline (green runs only)
        uses: actions/cache/save@v4
        with:
          path: target/iai
          key: iai-baseline-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Mutation + coverage gate for the vanilla pricing core (Linux). This is the
  # test-suite-QUALITY gate: it proves the suite actually *kills* injected faults
  # in the convention/strike↔delta machinery, not merely that it runs green.
  #
  #   * Mutation: `cargo mutants -p celnet-vanilla` under `.config/mutants.toml`,
  #     which excludes the audited set of semantically-equivalent solver-internal
  #     mutants (each justified in that file + docs/HARDENING.md). cargo-mutants
  #     exits non-zero on ANY *non-equivalent* survivor, so a future edit that
  #     weakens the suite below the kill bar fails this job. The committed
  #     baseline is 429 caught / 2 timeout(=caught) / 0 missed over 434 viable
  #     mutants (the full crate is 469 mutants, 35 audited-equivalent excluded).
  #   * Coverage: `cargo llvm-cov` with `--fail-under-lines 95
  #     --fail-under-regions 95` on the same crate (measured baseline: 97.8% line
  #     / 98.6% region), so a coverage regression also fails the job.
  #
  # Both steps are time-boxed (`timeout`) so a wedged build/test can never hang
  # the pipeline. Kept off the cross-OS `gate` matrix (it is a single-platform
  # quality bar, not a portability check) to avoid 6x redundant mutation runs.
  mutation-coverage-gate:
    name: mutation + coverage gate (linux / celnet-vanilla)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mutation-coverage-gate

      - name: Install gate binaries (nextest, cargo-mutants, cargo-llvm-cov)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants,cargo-llvm-cov

      # Coverage floor first (fast): fail the job below the committed thresholds.
      - name: Coverage gate (celnet-vanilla)
        run: |
          timeout 600 cargo llvm-cov nextest -p celnet-vanilla \
            --fail-under-lines 95 --fail-under-regions 95 --summary-only

      # Surface calibration coverage gate: closes the standing surface-lane
      # backlog (strangle/stochvol/market_hedge), enforced at a committed 90%
      # line/region floor (measured baseline: 96.1% line / 96.4% region — see
      # docs/HARDENING.md §3). A regression below the floor fails the job.
      - name: Coverage gate (celnet-surface)
        run: |
          timeout 600 cargo llvm-cov nextest -p celnet-surface \
            --fail-under-lines 90 --fail-under-regions 90 --summary-only

      # Mutation kill gate: zero non-equivalent survivors (equivalents excluded
      # via .config/mutants.toml). Exits non-zero on any survivor → fails CI.
      - name: Mutation gate (celnet-vanilla)
        run: timeout 1200 cargo mutants -p celnet-vanilla --config .config/mutants.toml


  # ---------------------------------------------------------------------------
  # Mutation kill gate for the OTHER safety-critical numerics crates
  # (PC-MUT-WIDEN). The vanilla gate above is the gold standard; this widens the
  # same enforceable kill-rate contract to the remaining crates that carry
  # safety-critical numerics with no kill-rate floor today:
  #   * celnet-surface  — VV/SABR/SVI/SSVI/eSSVI calibration + arbitrage report
  #                       + strangle solver. The arbitrage.rs module is run to
  #                       GREEN locally (see docs/HARDENING.md §2); the crate-wide
  #                       baseline is established here.
  #   * celnet-exotics  — digitals/barriers/Asian/TARF/… + PDE/MC/particle/LSV.
  #   * celnet-risk-cube — additive roll-up + non-additive VaR/ES + FRTB-SA.
  #   * celnet-xva      — CVA/DVA/FVA + survival curve + netting.
  #
  # Each crate has its own audited equivalence set in
  # `.config/mutants-<crate>.toml` (every exclusion justified inline + in
  # HARDENING.md §2 — never to hide a real survivor). cargo-mutants exits
  # non-zero on ANY non-equivalent survivor, so a future edit that weakens any of
  # these suites below the kill bar fails the job. Each crate runs as its own
  # matrix leg so they parallelise and a failure pinpoints the crate. The
  # numerics crates are large (surface ~2.3k mutants, exotics PDE/MC larger), so
  # this is a single-platform Linux quality bar kept off the cross-OS `gate`
  # matrix to avoid redundant runs, and each leg is generously time-boxed.
  mutation-gate-numerics:
    name: mutation gate (linux / ${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [celnet-surface, celnet-exotics, celnet-risk-cube, celnet-xva, celnet-qmc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mutation-gate-${{ matrix.crate }}

      - name: Install gate binaries (nextest, cargo-mutants)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants

      # Mutation kill gate: zero non-equivalent survivors (equivalents excluded
      # via the per-crate config). Exits non-zero on any survivor → fails CI.
      - name: Mutation gate (${{ matrix.crate }})
        run: |
          crate="${{ matrix.crate }}"
          cfg=".config/mutants-${crate#celnet-}.toml"
          timeout 5400 cargo mutants -p "$crate" --config "$cfg"
  # ---------------------------------------------------------------------------
  # Fuzz lane (Linux only, nightly). The fuzz harness under `fuzz/` is a
  # standalone, non-workspace crate carrying the nightly-only libFuzzer
  # (cargo-fuzz) targets, so it cannot run on the pinned stable gate. This job
  # builds and runs each target time-boxed on nightly so they are exercised in CI
  # — not merely runnable by hand. The run is short (a smoke budget per target) so
  # it does not become a long pole; longer campaigns are run out-of-band.
  #
  # Targets:
  #   * vanilla_inputs     — in-domain pricing inputs (no panic; premium ≥0/finite;
  #                          all Greeks finite).
  #   * the UNTRUSTED-INPUT byte parsers (the real socket/disk attack surface) —
  #     contract: no panic / no UB / Ok-or-typed-Err on arbitrary bytes, bounded
  #     allocation, decode a sound inverse of encode on the accepted path:
  #       replog_log_entry / replog_snapshot / replog_wire_message
  #       journal_recover (torn-tail recovery over a real temp file)
  #       proto_convert   (prost decode of the wire contract + convert.rs TryFrom)
  #
  # NOTE: the same no-panic / typed-Err property is ALSO gated on the pinned stable
  # `just check` lane via `proptest` decode-fuzz integration tests in
  # `celnet-replog/tests/decode_fuzz.rs` and `celnet-journal/tests/decode_fuzz.rs`,
  # so the property holds whether or not this nightly lane runs.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (linux / nightly, time-boxed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-nightly
          # The fuzz crate is outside the root workspace; cache its target dir
          # too (one "<dir> -> <target>" mapping per line).
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Time-boxed smoke run of every target. -max_total_time keeps each lane
      # short and deterministic; a crash (panic / contract break / new coverage
      # stall into UB) fails the job. Working dir is the standalone fuzz crate so
      # its own [workspace] table and nightly profile apply. The pricing target
      # gets a slightly longer budget; the byte-parser targets are pure and very
      # fast (millions of execs/s) so 30s of coverage-guided search is ample.
      - name: Fuzz vanilla_inputs (60s smoke)
        working-directory: fuzz
        run: cargo +nightly fuzz run vanilla_inputs -- -max_total_time=60

      - name: Fuzz replog_log_entry (30s smoke)
        working-directory: fuzz
        run: cargo +nightly fuzz run replog_log_entry -- -max_total_time=30

      - name: Fuzz replog_snapshot (30s smoke)
        working-directory: fuzz
        run: cargo +nightly fuzz run replog_snapshot -- -max_total_time=30

      - name: Fuzz replog_wire_message (30s smoke)
        working-directory: fuzz
        run: cargo +nightly fuzz run replog_wire_message -- -max_total_time=30

      - name: Fuzz journal_recover (30s smoke)
        working-directory: fuzz
        run: cargo +nightly fuzz run journal_recover -- -max_total_time=30

      - name: Fuzz proto_convert (30s smoke)
        working-directory: fuzz
        run: cargo +nightly fuzz run proto_convert -- -max_total_time=30

  # ---------------------------------------------------------------------------
  # SDK runnable-examples gate (Linux). Proves the canonical `cargo run -p
  # celnet-client --example <x>` onboarding affordance actually works end-to-end
  # against a real edge — not just that it compiles. Boots `demo_edge` as a
  # background OS process on a fixed loopback port, then runs each of the three
  # quickstart examples against it; every example exits NON-ZERO on a degenerate /
  # empty priced response, so a real, non-empty priced result is asserted by the
  # exit code. (The same SDK code paths are also gated in-process by the
  # `examples_smoke` integration test in the `gate` job; this lane additionally
  # proves the two-process `demo_edge` → example wiring the docs promise.)
  sdk-examples:
    name: SDK runnable-examples gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: sdk-examples

      # Build the edge + the three examples up front so the timed run steps bound
      # only the workflow, not a cold compile.
      - name: Build demo_edge + SDK examples
        run: |
          cargo build -p celnet-server --example demo_edge
          cargo build -p celnet-client \
            --example quote_and_trade \
            --example stream_blotter \
            --example price_exotic

      - name: Boot demo_edge, run each example, assert priced output
        env:
          CELNET_GRPC_ADDR: 127.0.0.1:50551
          CELNET_WS_ADDR: 127.0.0.1:8081
        run: |
          set -euo pipefail
          ./target/debug/examples/demo_edge > demo_edge.log 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT

          # Wait for the edge to print its ready line (bounded).
          for _ in $(seq 1 60); do
            if grep -q "demo edge ready" demo_edge.log 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q "demo edge ready" demo_edge.log || { echo "edge never came up"; cat demo_edge.log; exit 1; }

          # Each example exits non-zero on an empty / degenerate priced result.
          timeout 60 ./target/debug/examples/quote_and_trade
          timeout 60 ./target/debug/examples/stream_blotter
          timeout 60 ./target/debug/examples/price_exotic

  # ---------------------------------------------------------------------------
  # Client gate — gui/ + excel/ typecheck, unit tests and PRODUCTION builds.
  #
  # Why this exists: until 2026-08-17 this workflow had NO node job at all, so
  # ~139k lines of client source (gui/src 119k + excel/src 21k) were gated only by
  # the local `just t2` recipe. That is what let a hardcoded market snapshot, a
  # seven-week-stale SOFR curve and 14 undefined design tokens accumulate on main
  # unnoticed. These two jobs mirror the node half of `just t2` (justfile §t2).
  #
  # Split in two so the cheap half fails fast: `clients` needs no Rust toolchain,
  # while `clients-e2e` must compile the server because BOTH client e2e suites
  # boot a real `demo_edge` (gui/e2e/demoEdge.ts, excel/e2e/globalSetup.ts).
  # ---------------------------------------------------------------------------
  clients:
    name: client gate (typecheck + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            excel/package-lock.json

      - name: Install deps (lockfile-exact)
        run: |
          npm --prefix gui ci
          npm --prefix excel ci

      # Typecheck app and e2e trees separately: they are three tsconfig projects
      # and `tsc -b` at the root covers only the app + node ones.
      - name: gui — typecheck (app / e2e)
        run: |
          npm --prefix gui run typecheck
          npm --prefix gui run typecheck:e2e

      # A RATCHET, not a soft gate.
      #
      # `typecheck:test` is red on main as of 2026-08-17 with 100 errors across ~35
      # test files — overwhelmingly `noUncheckedIndexedAccess` index accesses
      # (TS2532/TS18048, 30) and fixtures missing fields their type has since gained
      # (TS2741/TS2739/TS2322, 39). The tests themselves all PASS (2,342/2,342): this
      # is type-level debt in TEST code, accumulated precisely because there was no
      # client CI job to catch it.
      #
      # Rather than `continue-on-error` (which lets the number grow unwatched) or
      # blocking outright (which would land the gate red and get it switched off),
      # this asserts the count NEVER EXCEEDS the recorded ceiling. New debt fails the
      # build; paying debt down is free. LOWER THE CEILING as it falls — and delete
      # this step entirely, folding `typecheck:test` into the blocking step above,
      # when it reaches 0.
      - name: gui — typecheck (test tree) — ratchet, must not exceed the ceiling
        run: |
          set -uo pipefail
          CEILING=100
          npm --prefix gui run typecheck:test > tc-test.log 2>&1 || true
          COUNT=$(grep -cE 'error TS[0-9]+' tc-test.log || true)
          echo "gui typecheck:test errors: $COUNT (ceiling $CEILING)"
          if [ "$COUNT" -gt "$CEILING" ]; then
            echo "::error::gui typecheck:test regressed: $COUNT errors > ceiling $CEILING"
            grep -E 'error TS[0-9]+' tc-test.log | head -40
            exit 1
          fi
          if [ "$COUNT" -lt "$CEILING" ]; then
            echo "::notice::gui typecheck:test improved to $COUNT — lower CEILING in ci.yml to $COUNT"
          fi

      - name: excel — typecheck (app / e2e)
        run: |
          npm --prefix excel run typecheck
          npm --prefix excel run typecheck:e2e

      - name: gui — unit tests (vitest)
        run: npm --prefix gui run test

      - name: excel — unit tests (vitest)
        run: npm --prefix excel run test

      # Production builds, not dev servers — the e2e suites serve the built
      # bundle, and a build-only failure (a bad import, a broken asset) is
      # invisible to typecheck and vitest.
      - name: gui — production build
        run: npm --prefix gui run build

      - name: excel — production build
        run: npm --prefix excel run build

  clients-e2e:
    name: client e2e vs a REAL celnet-server (linux)
    runs-on: ubuntu-latest
    # Only worth the Rust compile once the cheap gate is green.
    needs: clients
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: clients-e2e

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            excel/package-lock.json

      - name: Install deps (lockfile-exact)
        run: |
          npm --prefix gui ci
          npm --prefix excel ci

      # Both suites spawn `cargo run -p celnet-server --example demo_edge`
      # themselves. Build it first so the spawn is a warm start and the suites'
      # bounded readiness timeouts are not racing a cold compile.
      - name: Build demo_edge
        run: cargo build -p celnet-server --example demo_edge

      - name: Install Playwright chromium
        run: npx --prefix gui playwright install --with-deps chromium

      # ONLY the `chromium` project. That is the one that boots the real server
      # (playwright.config.ts sets testIgnore: FIDELITY_SPECS on it). The
      # `fidelity` project is deliberately excluded here: it runs mock-only
      # against `?mock`, and its screenshot baselines are all `*-darwin.png`, so
      # it cannot pass on Linux. Fidelity stays a macOS/local gate.
      - name: gui — e2e (real server, chromium project)
        run: npx --prefix gui playwright test --project=chromium
        working-directory: gui

      - name: excel — e2e (real server, corpus conformance)
        run: npm --prefix excel run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: gui/playwright-report/
          retention-days: 7
