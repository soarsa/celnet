# cargo-deny configuration — supply-chain & license gate for mission-critical code.
# Run: just deny   (or: cargo deny check)

[advisories]
version = 2
yanked = "deny"
# Narrowly-scoped, individually-justified advisory triage. This is NOT a blanket
# relaxation: every other advisory (and all yanked crates) still fails the gate.
ignore = [
    # RUSTSEC-2025-0141 — bincode 1.3.3 "unmaintained" (NOT a vulnerability).
    # This is an *informational* advisory: after a doxxing/harassment incident the
    # bincode team ceased development, explicitly stating 1.3.3 is "a complete
    # version that is not in need of any updates." There is no CVE, no memory-
    # safety or correctness defect — only an end-of-maintenance notice.
    # In this workspace bincode appears *solely* as a transitive **dev-dependency**
    # of `iai-callgrind` (the instruction-count bench's runner IPC). It is never in
    # any runtime/shipped artifact, never on a pricing/wire/data path, and never in
    # the hot core. cargo-deny offers no `dev-only` advisory scope, so the
    # narrowest available action is to ignore this one ID with this justification.
    # Re-evaluate when iai-callgrind migrates off bincode (tracked upstream).
    "RUSTSEC-2025-0141",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path (no version) — that is not a
# real wildcard-version risk, so permit it.
allow-wildcard-paths = true
# Disallow known-problematic crates here as the tree grows.
deny = [
    # Hard gate on the wasmtime runtime family. Tier-2 untrusted plugins run on
    # wasmi (pure-Rust, fuel-metered, deterministic); wasmtime was rejected for
    # open 2026 RUSTSEC advisories and is replaced by wasmi (see
    # docs/PLUGIN-HOST-ALT.md). Banning the crates makes reintroducing the
    # runtime fail `cargo deny check`, not merely rely on it being absent.
    { name = "wasmtime" },
    { name = "wasmtime-cli" },
    { name = "wasmtime-cli-flags" },
    { name = "wasmtime-runtime" },
    { name = "wasmtime-environ" },
    { name = "wasmtime-cranelift" },
    { name = "wasmtime-jit" },
    { name = "wasmtime-wasi" },
    { name = "wasmtime-types" },
    { name = "wasmtime-fiber" },
    # Pulley is wasmtime's portable interpreter backend; ban it too so the
    # interpreter-only flavour of wasmtime cannot slip back in either.
    { name = "pulley-interpreter" },
]

[licenses]
version = 2
# Permissive licenses acceptable for a proprietary product that links them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Our own workspace crates are proprietary and never published; don't license-check them.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
