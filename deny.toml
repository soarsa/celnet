# cargo-deny configuration — supply-chain & license gate for mission-critical code.
# Run: just deny   (or: cargo deny check)

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path (no version) — that is not a
# real wildcard-version risk, so permit it.
allow-wildcard-paths = true
# Disallow known-problematic crates here as the tree grows.
deny = []

[licenses]
version = 2
# Permissive licenses acceptable for a proprietary product that links them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Our own workspace crates are proprietary and never published; don't license-check them.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
