# cargo-deny configuration — supply-chain & license gate for mission-critical code.
# Run: just deny   (or: cargo deny check)

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path (no version) — that is not a
# real wildcard-version risk, so permit it.
allow-wildcard-paths = true
# Disallow known-problematic crates here as the tree grows.
deny = [
    # Hard gate on the wasmtime runtime family. Tier-2 untrusted plugins run on
    # wasmi (pure-Rust, fuel-metered, deterministic); wasmtime was rejected for
    # open 2026 RUSTSEC advisories and is replaced by wasmi (see
    # docs/PLUGIN-HOST-ALT.md). Banning the crates makes reintroducing the
    # runtime fail `cargo deny check`, not merely rely on it being absent.
    { name = "wasmtime" },
    { name = "wasmtime-cli" },
    { name = "wasmtime-cli-flags" },
    { name = "wasmtime-runtime" },
    { name = "wasmtime-environ" },
    { name = "wasmtime-cranelift" },
    { name = "wasmtime-jit" },
    { name = "wasmtime-wasi" },
    { name = "wasmtime-types" },
    { name = "wasmtime-fiber" },
    # Pulley is wasmtime's portable interpreter backend; ban it too so the
    # interpreter-only flavour of wasmtime cannot slip back in either.
    { name = "pulley-interpreter" },
]

[licenses]
version = 2
# Permissive licenses acceptable for a proprietary product that links them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Our own workspace crates are proprietary and never published; don't license-check them.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
