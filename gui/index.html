<html lang="en">

    <!-- Celer brand typeface (Anaheim, 400..800) + Space Grotesk (display headings/
         labels, 400;500;600;700) + JetBrains Mono (numerics, 400;500;600). Preconnect
         first so the faces are fetched in parallel; --font-ui/--font-mono fallbacks
         avoid layout shift. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anaheim:wght@400..800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    />
    <title>Celnet — a Celer Technologies product</title>
  </head>
