<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Brand typeface (Anaheim, 400..800) + Space Grotesk (display headings/
         labels, 400;500;600;700) + JetBrains Mono (numerics, 400;500;600). Preconnect
         first so the faces are fetched in parallel; --font-ui/--font-mono fallbacks
         avoid layout shift. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anaheim:wght@400..800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!-- Favicon: the Celnet geometric "C" mark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Cpath fill='%23ff7357' d='M420 120 A 210 210 0 1 0 420 380 L 350 330 A 130 130 0 1 1 350 170 Z'/%3E%3C/svg%3E"
    />
    <title>Celnet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
